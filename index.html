/* css/ease.css */
/* ease.css — "누구나 쓸 수 있게" (2026-11-06 화면 점검)
   글자 크기 · 누르는 곳 크기 · 포커스 · 도움말 · 확인 창 · 오늘 할 일 · 알림 글.
   v2.css 뒤에 불러와서, 같은 이름의 규칙은 여기 것이 이겨요. */

/* ---------- 글자와 배경의 색 차이(대비)를 높여요: 흰 글씨도 4.5 : 1 이상 ---------- */
:root { --v-primary: #0b827c; --v-primary-d: #09706b; }
.v-gate .gate-tag b { color: #a85500; }
.ptag.gabe { color: #9a5000; }
.ptag.sci { color: #006a8c; }
.v-next .tx small, .v-next .tx span { opacity: 1; }
.v-cta span { opacity: 1; }
.v-stack i.high { color: #0d6b40; }
.v-stack i.mid { color: #0a5a55; }
.v-stack i.grow { color: #7a4900; }

/* ---------- 글자 크기: 도움말에서 "크게 / 아주 크게"를 고르면 화면 전체가 커져요 ---------- */
html.v-size-2 { --vz: 1.15; }
html.v-size-3 { --vz: 1.3; }
.v-app { zoom: var(--vz, 1); min-height: calc((100vh - 52px) / var(--vz, 1)); }
body.bare .v-app { min-height: calc(100vh / var(--vz, 1)); }
.v-app:has(.v-kidhost) { zoom: 1; }            /* 아이가 직접 하는 화면은 이미 크게 만들었어요 */
#v-sheet .v-sheet { zoom: var(--vz, 1); }

/* ---------- 누르는 곳은 손가락 크기(44px 이상)로 ---------- */
.v-seg a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; }
.v-subtabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; }
.v-btn.sm { min-height: 44px; }
.v-icon-btn { width: 44px; height: 44px; }
.v-chip { min-height: 52px; }
.v-back { min-height: 44px; }
.v-fold summary, .v-card.v-notes summary { display: flex; align-items: center; min-height: 44px; padding: 0; }
.v-ochip { min-height: 44px; }

/* ---------- 키보드로 움직일 때 어디 있는지 보이게 ---------- */
body.v2 a:focus-visible, body.v2 button:focus-visible, body.v2 select:focus-visible, body.v2 input:focus-visible,
body.v2 textarea:focus-visible, body.v2 summary:focus-visible { outline: 3px solid #1d6fe0; outline-offset: 2px; }

/* ---------- 움직임이 불편한 분께는 움직임을 줄여요 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* 점수 꼬리표(센터 이름 옆 숫자): 기본 <small> 크기(11.7px)보다 크게 */
.v-app small.mon-sc { font-size: 13px; font-weight: 800; opacity: 1; }

/* ---------- 수업 이름표(아트 · 가베 · 파닉스…): 한글로, 13px 이상 ---------- */
.v-app .ptag { height: 26px; padding: 0 10px; font-size: 13px; letter-spacing: 0; }

/* ---------- 녹음 화면 안내 글: 크고 진하게 ---------- */
.v-hint { margin-top: 8px; font-size: 16px; font-weight: 600; color: var(--v-ink); }

/* ---------- 빨간 버튼: 되돌릴 수 없는 일 ---------- */
.v-btn.danger { background: #d92d20; border-color: #d92d20; color: #fff; }
.v-btn.danger:hover { background: #b42318; }

/* ---------- 알림 글(토스트): 크고 오래, 아래 메뉴·버튼을 가리지 않게 ---------- */
body.v2 #toast-root { width: min(92vw, 460px); bottom: 22px; }
body.v2.e-bnav #toast-root { bottom: 92px; }
body.v2.e-bar #toast-root { bottom: 98px; }
body.v2 .toast { font-size: 16px; line-height: 1.5; padding: 14px 18px; border-radius: 18px; max-width: 100%; align-items: flex-start; box-shadow: 0 10px 28px rgba(10, 22, 27, .28); }
body.v2 .toast .ico { flex: none; margin-top: 1px; }

/* ---------- 도움말 버튼 (오른쪽 아래, 늘 보여요) ---------- */
#e-help-root { position: fixed; right: 14px; bottom: 14px; z-index: 45; }
#e-help-root[hidden] { display: none; }
body.e-bnav #e-help-root { bottom: 92px; }
body.e-bar #e-help-root { bottom: 98px; }
.e-help { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 10px; border-radius: 999px; border: 2px solid var(--v-primary); background: #fff; color: var(--v-primary-d); font: inherit; font-size: 16px; font-weight: 800; box-shadow: 0 6px 18px rgba(15, 157, 150, .28); cursor: pointer; }
.e-help b { width: 28px; height: 28px; border-radius: 50%; background: var(--v-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.e-help:active { transform: scale(.97); }
@media print { #e-help-root { display: none; } }

/* 도움말 · 처음 안내 창 안쪽 */
.e-hsteps, .e-guide { display: flex; flex-direction: column; gap: 14px; margin: 16px 0 6px; padding: 0; list-style: none; }
.e-hsteps li, .e-guide li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.6; font-size: 17px; }
.e-hsteps .n, .e-guide .n { flex: none; width: 30px; height: 30px; margin-top: 1px; border-radius: 50%; background: var(--v-primary-bg); color: var(--v-primary-d); font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.e-guide { margin-bottom: 18px; }
.e-guide .tx b { display: block; font-size: 18px; }
.e-guide .tx span { color: var(--v-ink2); font-size: 16px; }
.e-size { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.e-size button { min-height: 52px; border-radius: 14px; border: 2px solid var(--v-line); background: #fff; font: inherit; font-weight: 800; color: var(--v-ink2); cursor: pointer; }
.e-size button:nth-child(1) { font-size: 15px; } .e-size button:nth-child(2) { font-size: 17px; } .e-size button:nth-child(3) { font-size: 20px; }
.e-size button.on { border-color: var(--v-primary); background: var(--v-primary-bg); color: var(--v-primary-d); }

/* ---------- 오늘 할 일: 맨 위 초록 카드, 첫 번째만 진한 버튼 ---------- */
.e-today { margin-top: 16px; padding: 18px 18px 10px; border-radius: 22px; background: var(--v-primary); color: #fff; scroll-margin-top: 70px; }
.e-today .hd small { display: block; font-size: 14px; font-weight: 700; }
.e-today .hd h2 { margin-top: 2px; font-size: 22px; line-height: 1.3; font-weight: 800; letter-spacing: -.02em; }
.e-today ol { margin-top: 10px; }

  ICME.today = function () {
    const d = FORCE_TODAY ? new Date(Number(FORCE_TODAY[1]), Number(FORCE_TODAY[2]) - 1, Number(FORCE_TODAY[3])) : new Date(); d.setHours(0, 0, 0, 0);

  ICME.daysBetween = (a, b) => Math.round((ICME.parse(b) - ICME.parse(a)) / 86400000);
  ICME.dday = function (d) {
    const n = ICME.daysBetween(ICME.today(), d);

  };
  ICME.relDay = function (d) {
    const n = ICME.daysBetween(ICME.today(), d);
    if (n === 0) return '오늘'; if (n === 1) return '내일'; if (n === -1) return '어제';
    return n > 0 ? n + '일 후' : Math.abs(n) + '일 전';
  };

  ICME.monthKo = (d) => (ICME.parse(d).getMonth() + 1) + '월';

  /* ---------- 시간 "HH:MM" ---------- */
  ICME.toMin = (t) => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };

      c2: [{ d: D(-48), by: '정하은 팀장', text: '시설 점검 · 학부모 상담 방식 공유' }],
      c3: [{ d: D(-75), by: '이도현 팀장', text: '수업 참관 · 필수 교육 이수 독려' }],
      c4: [{ d: D(-34), by: '정하은 팀장', text: '아이크미톡 설문 응답 방법 안내 · 센터장 면담' }, { d: D(-96), by: '정하은 팀장', text: '신규 교사 온보딩 지원' }],
      c5: [{ d: D(-12), by: '이도현 팀장', text: '유치원 담임 대상 K-ISEL 결과 활용 안내' }],
      c6: [{ d: D(-9), by: '정하은 팀장', text: '인테리어 점검 · 교구 배치 협의' }]
    };
    const live5 = ['c1', 'c2', 'c3', 'c4', 'c5'];
    const notices = [
      { id: 'n1', title: '11월 하트 시리즈 키트 발송 일정 안내', body: '11월 수업용 키트는 30일(금)에 가맹점별로 발송돼요. 받으시면 상자 안의 구성품 목록과 수량을 확인하고, 모자란 것이 있으면 본사로 알려 주세요. 반마다 정해진 주제의 키트가 들어 있어요.', date: D(-2), must: true, to: live5, by: '본사 운영팀', reads: { c2: D(-1), c3: D(-2), c5: D(-1) } },
      { id: 'n2', title: '교사 필수 교육(영상·개인정보) 이수 기한', body: '새로 들어온 교사는 첫 수업 전에, 기존 교사는 이번 달 말까지 필수 교육 두 과정을 마쳐 주세요. 이수하지 않은 교사는 발음 녹음 기능이 잠겨요. 가맹점별 이수 현황은 본사 교사·교육 화면에서 볼 수 있어요.', date: D(-9), must: true, to: live5, by: '커리큘럼팀', reads: { c1: D(-8), c2: D(-8), c3: D(-7), c5: D(-9) } },
      { id: 'n3', title: '이번 달 집합 교육 신청 안내', body: '이번 달 집합 교육은 선착순으로 받아요. 일정과 남은 자리는 센터장 화면 안내와 본사 교사·교육 화면에서 확인해 주세요.', date: D(-14), must: false, to: live5, by: '본사 운영팀', reads: { c1: D(-13), c2: D(-12), c3: D(-12), c5: D(-13) } }
    ];
    const requests = [
      { id: 'rq0', sid: 'c2s2', kind: 'read', date: D(-9), done: true, doneAt: D(-4) },
      { id: 'rq1', sid: 'c4s5', kind: 'delete', date: D(-8), done: false },
      { id: 'rq2', sid: 'c3s7', kind: 'read', date: D(-2), done: false },
      { id: 'rq3', sid: 'c5s3', kind: 'withdraw', date: D(-5), done: false }
    ];
    students.filter((s) => s.centerId !== 'c1' && s.kisel.st === 'none').forEach((s, i) => {   // 새로 들어와 아직 설문 전인 아이 중 일부는 보호자 동의 대기
      if (i % 2 === 0) { s.consent = { video: 'none', reco: false, analyze: false, agreedAt: null }; s.video = { before: false, after: false }; }
    });
    const access = [];   // 다른 가맹점 아이를 연 기록(노원중계는 비워 둬요): 담당 교사 + 본사
    ['c2', 'c3', 'c4', 'c5'].forEach((cid, ci) => {
      const ks = students.filter((s) => s.centerId === cid);
      [1, 5, 9, 14, 20].forEach((ix, j) => { const s = ks[ix % ks.length]; const k = classes.find((x) => x.id === s.classIds[0]); if (k && k.teacherId) access.push({ sid: s.id, by: k.teacherId, role: 'teacher', date: D(-(1 + ((ci * 5 + j * 3) % 12))) }); });
      [2, 7].forEach((ix, j) => { const s = ks[ix % ks.length]; access.push({ sid: s.id, by: 'hq', role: 'hq', date: D(-(2 + ((ci * 3 + j * 4) % 9))), why: j ? '품질 점검' : '운영 지원' }); });
    });
    access.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

    return {
      version: ICME.SEED_VERSION,
      staff, visits, notices, requests, leavers, events,
      rules: { surveyMin: 60, videoMin: 40, docsMin: 80, trainingMin: 80, visitDays: 60, requestDays: 7, leadHours: 24, hqReason: false },   // 본사가 정하는 알림 기준
      centers, teachers, classes, students, videos, candidates, talent, leads, parentLeads, rounds, hqAlerts,
      monthTheme: {},   // classId -> { vol, by }
      heartOn: { c1: true, c2: true, c3: true, c4: false, c5: true, c6: false },
      settings: { c1: { autoInvite: true, autoTraining: true, docRemind: true, logRemind: true, kiselAuto: true, notice3d: true, weekly: true } },
      enrolled: {},     // teacherId -> { sessionId: true }
      swaps: [{ id: 'sw1', classId: 'k14', date: D(9), reason: '개인 사정', status: '대체 교사 모집 중', applicants: [] }],
      parent: { consentOpen: false, activity: {}, quizDone: {} },
      logs: [],
      obs: [],          // 교사 관찰 칩 기록 { sid, date, chip, by }
      access,           // 아이 데이터 열람 기록 { sid, by(교사 id 또는 'hq'), role, date, why? } — 사람·아이·날짜당 한 번
      courseProgress: {}
    };
  };
})();

</script>
<script>/* js/core/store.js */
/* store.js — 데모 DB(localStorage 보존) + 조회 함수(ICME.q) */
(function () {
  'use strict';
  const ICME = window.ICME;
  const KEY_DB = 'icme_demo_db';
  const KEY_UI = 'icme_demo_ui';

  const store = (ICME.store = { db: null, ui: null });

  function safeGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경은 무시 */ } }

  store.init = function () {
    const saved = safeGet(KEY_DB);
    store.db = saved && saved.version === ICME.SEED_VERSION ? saved : ICME.seed();
    const ui = safeGet(KEY_UI) || {};
    store.ui = Object.assign({ cid: 'c1', tid: null, childId: 's1', hqCenter: 'c1' }, ui);
    if (!store.ui.tid || !store.db.teachers.find((t) => t.id === store.ui.tid)) store.ui.tid = ICME.q.defaultTeacher();
    /* 시연·캡처용: 주소에 ?tid=t2 (교사) ?child=s2 (자녀)를 붙이면 그 사람으로 시작합니다 */
    try { const sp = new URLSearchParams(location.search); if (sp.get('tid') && store.db.teachers.find((t) => t.id === sp.get('tid'))) store.ui.tid = sp.get('tid'); if (sp.get('child') && store.db.students.find((s) => s.id === sp.get('child'))) store.ui.childId = sp.get('child'); } catch (e) { /* noop */ }
    store.save();
  };
  store.save = function () { safeSet(KEY_DB, store.db); safeSet(KEY_UI, store.ui); };
  store.reset = function () { try { localStorage.removeItem(KEY_DB); localStorage.removeItem(KEY_UI); } catch (e) { /* noop */ } store.db = ICME.seed(); store.ui = { cid: 'c1', tid: null, childId: 's1', hqCenter: 'c1' }; store.ui.tid = ICME.q.defaultTeacher(); store.save(); };
  store.mutate = function (fn) { fn(store.db, store.ui); store.save(); };

  /* =====================================================================
     조회 함수
     ===================================================================== */
  const q = (ICME.q = {});
  const db = () => store.db;
  const T = () => ICME.today();

  q.center = (id) => db().centers.find((c) => c.id === id);
  q.teacher = (id) => db().teachers.find((t) => t.id === id);
  q.klass = (id) => db().classes.find((k) => k.id === id);
  q.student = (id) => db().students.find((s) => s.id === id);
  q.teachersOf = (cid, opt) => db().teachers.filter((t) => t.centerId === cid && (!opt || !opt.active || ['재직', '온보딩'].includes(t.status)));
  q.classesOf = (cid) => db().classes.filter((k) => k.centerId === cid);
  q.studentsOf = (cid) => db().students.filter((s) => s.centerId === cid);
  q.classesOfTeacher = (tid) => db().classes.filter((k) => k.teacherId === tid);
  q.studentsOfClass = (kid) => db().students.filter((s) => s.classIds.includes(kid));
  q.dow = () => { const d = T().getDay(); return d === 0 ? 1 : d; };
  q.lessonsOn = (tid, dow) => q.classesOfTeacher(tid).filter((k) => k.day === dow).sort((a, b) => a.start.localeCompare(b.start));
  q.defaultTeacher = () => {
    const d = q.dow();
    const order = ['t2', 't4', 't3', 't1'];
    const hit = order.find((id) => db().classes.some((k) => k.teacherId === id && k.day === d));
    return hit || 't1';
  };

  /* ---------- 시수 ---------- */
  q.teacherMinutes = (tid) => ICME.sum(q.classesOfTeacher(tid), (k) => k.min);
  q.teacherHours = (tid) => ICME.round1(q.teacherMinutes(tid) / 60);

  /* ---------- 충돌 ---------- */
  q.overlap = (a, b) => a.day === b.day && ICME.toMin(a.start) < ICME.toMin(b.start) + b.min && ICME.toMin(b.start) < ICME.toMin(a.start) + a.min;
  q.conflicts = (tid, k) => db().classes.filter((x) => x.teacherId === tid && x.id !== k.id && q.overlap(x, k));
  q.allConflicts = (cid) => {
    const out = [];
    const cls = q.classesOf(cid).filter((k) => k.teacherId);
    for (let i = 0; i < cls.length; i++) for (let j = i + 1; j < cls.length; j++) if (cls[i].teacherId === cls[j].teacherId && q.overlap(cls[i], cls[j])) out.push([cls[i], cls[j]]);
    return out;
  };

  /* ---------- 인증/교육/서류 상태 ---------- */
  q.certState = (t, key) => {
    const p = t.programs && t.programs[key];
    if (!p || p.status === '미이수') return { state: 'none', label: '미이수', tone: 'gray' };
    if (p.status === '교육중') return { state: 'prog', label: '교육 중', tone: 'blue' };
    if (p.expires) {
      const n = ICME.daysBetween(T(), p.expires);
      if (n < 0) return { state: 'expired', label: '만료', tone: 'red', days: n };
      if (n <= 60) return { state: 'expiring', label: '만료 ' + ICME.dday(p.expires), tone: 'amber', days: n };
    }
    return { state: 'ok', label: '인증', tone: 'green' };
  };
  q.certified = (t, key) => ['ok', 'expiring'].includes(q.certState(t, key).state);
  const PROG_COURSE = { T05: 'ART', T06: 'GABE', T07: 'SCI', T08: 'CREPOP' };
  q.courseState = (t, cid) => {
    const c = ICME.training.byId[cid];
    if (cid === 'T09' && !db().heartOn[t.centerId]) return 'na';
    if (PROG_COURSE[cid]) { const s = q.certState(t, PROG_COURSE[cid]).state; return s === 'none' ? 'todo' : s === 'prog' ? 'prog' : s === 'expired' ? 'late' : 'done'; }
    const x = (t.courses || {})[cid];
    if (!x) return c && c.req === '권장' ? 'opt' : 'todo';
    return x.s;
  };
  q.requiredCourses = (t) => ['T01', 'T02', 'T04'].concat(db().heartOn[t.centerId] ? ['T09'] : []);
  q.trainingRate = (t) => { const req = q.requiredCourses(t); return req.length ? req.filter((c) => q.courseState(t, c) === 'done').length / req.length : 1; };
  q.docState = (t, key) => {
    const d = (t.docs || {})[key]; const dt = ICME.training.docTypes.find((x) => x.key === key);
    if (!d || d.s === 'missing') return { state: 'missing', label: '미제출', tone: 'red' };
    if (d.s === 'submitted') return { state: 'submitted', label: '검토 필요', tone: 'amber' };
    if (dt && dt.expires && d.exp) {
      const n = ICME.daysBetween(T(), d.exp);
      if (n < 0) return { state: 'expired', label: '만료', tone: 'red', days: n };
      if (n <= 60) return { state: 'expiring', label: '만료 ' + ICME.dday(d.exp), tone: 'amber', days: n };
    }
    return { state: 'ok', label: '확인됨', tone: 'green' };
  };
  q.docSummary = (t) => {
    const keys = ICME.training.docTypes.map((d) => d.key);
    const states = keys.map((k) => q.docState(t, k).state);
    return { ok: states.filter((s) => s === 'ok').length, total: keys.length, missing: states.filter((s) => s === 'missing').length, submitted: states.filter((s) => s === 'submitted').length, expiring: states.filter((s) => s === 'expiring').length, expired: states.filter((s) => s === 'expired').length };
  };
  q.docsOkRate = (t) => { const s = q.docSummary(t); return s.ok / s.total; };

  /* 교사 알림(예외 우선) */
  q.teacherAlerts = (t) => {
    const out = [];
    const ds = q.docSummary(t);
    if (t.status === '휴직') return [{ level: 'low', text: '휴직 중 (' + ICME.dateFull(t.leave.from) + ' ~ ' + ICME.dateFull(t.leave.to) + ') · 담당 반 대체 필요', tab: 'schedule' }];
    if (ds.missing) out.push({ level: t.status === '온보딩' ? 'mid' : 'high', text: '서류 ' + ds.missing + '건 미제출', tab: 'docs' });
    if (ds.expired) out.push({ level: 'high', text: '서류 ' + ds.expired + '건 만료', tab: 'docs' });
    if (ds.submitted) out.push({ level: 'low', text: '제출 서류 ' + ds.submitted + '건 검토 필요', tab: 'docs' });
    if (ds.expiring) out.push({ level: 'mid', text: '건강진단 확인 ' + ICME.dday(t.docs.health.exp) + ' 만료', tab: 'docs' });
    ICME.programs.keys.forEach((k) => { const c = q.certState(t, k); if (c.state === 'expiring') out.push({ level: 'mid', text: ICME.programs.byKey[k].short + ' 인증 ' + ICME.dday(t.programs[k].expires) + ' 만료', tab: 'training' }); if (c.state === 'expired') out.push({ level: 'high', text: ICME.programs.byKey[k].short + ' 인증 만료', tab: 'training' }); });
    const req = q.requiredCourses(t).filter((c) => q.courseState(t, c) !== 'done');
    if (req.length) out.push({ level: t.status === '온보딩' ? 'mid' : 'mid', text: '필수 교육 ' + req.length + '개 미이수 (' + req.join('·') + ')', tab: 'training' });
    if (t.metrics) {
      if (t.metrics.log < 0.7) out.push({ level: 'mid', text: '수업 일지 제출률 ' + Math.round(t.metrics.log * 100) + '%', tab: 'perf' });
      if (t.metrics.video < 0.5) out.push({ level: 'low', text: '촬영 완료율 ' + Math.round(t.metrics.video * 100) + '%', tab: 'perf' });
    }
    return out;
  };
  q.teacherTone = (t) => {
    const a = q.teacherAlerts(t);
    if (a.some((x) => x.level === 'high')) return 'red';
    if (a.some((x) => x.level === 'mid')) return 'amber';
    return 'green';
  };
  q.canFilm = (t) => q.courseState(t, 'T04') === 'done' && !['expired', 'missing'].includes(q.docState(t, 'criminal').state);

  /* ---------- K-ISEL 집계 ---------- */
  /* 반·센터 평균은 "아이 + 부모 종합 점수"(부모 설문이 없으면 아이 점수)로 계산합니다 */
  q.areaMeans = (students) => {
    const profs = students.filter((s) => s.survey).map((s) => ICME.scoring.profile(s));
    return [0, 1, 2, 3, 4].map((i) => ICME.round1(ICME.avg(profs.map((p) => p.combined[i]).filter((v) => v != null))));
  };
  q.areaPrevMeans = (students) => {
    const withA = students.filter((s) => s.survey && s.survey.prev);
    return [0, 1, 2, 3, 4].map((i) => ICME.round1(ICME.avg(withA, (s) => s.survey.prev.combined[i])));
  };
  q.classAreas = (k) => q.areaMeans(q.studentsOfClass(k.id));
  q.lowestArea = (areas) => { let m = 0; areas.forEach((v, i) => { if (v < areas[m]) m = i; }); return m + 1; };
  q.recommend = (k) => { const a = q.classAreas(k); const w = q.lowestArea(a); const area = ICME.kisel.areas[w - 1]; return { area, vol: area.vol, means: a }; };
  q.themeFor = (k) => db().monthTheme[k.id] || { vol: q.recommend(k).vol, by: 'auto' };
  q.volOf = (id) => ICME.materials.volumes.find((v) => v.id === id);
  q.studentLow = (s) => { const p = ICME.scoring.profile(s); return p.lowest[0] ? p.lowest[0].area : ICME.kisel.areas[q.lowestArea(s.kisel.areas) - 1]; };
  q.studentMin = (s) => { const p = ICME.scoring.profile(s); return p.lowest[0] ? p.lowest[0].combined : Math.min.apply(null, s.kisel.areas); };

  /* ---------- 센터 통계 · 건강 점수 ---------- */
  q.stats = (c) => {
    const st = q.studentsOf(c.id);
    if (c.stats && !st.length) {   // 개설 준비 중이거나 아이 정보가 아직 없는 가맹점은 입력된 값을 써요. 아이 정보가 있으면 아래에서 데이터로 계산해요
      const tn = q.teachersOf(c.id, { active: true }).length;
      return Object.assign({ teachers: tn }, c.stats);
    }
    const th = q.teachersOf(c.id, { active: true });
    const done = st.filter((s) => s.kisel.st === 'done').length;
    const elig = st.filter((s) => s.consent.video !== 'none');
    const after = elig.filter((s) => s.video.after).length;
    const docs = th.length ? ICME.avg(th, (t) => q.docsOkRate(t)) : 0;
    const tr = th.length ? ICME.avg(th, (t) => q.trainingRate(t)) : 0;
    const logs = th.filter((t) => t.metrics);
    return { students: st.length, kisel: st.length ? done / st.length : 0, video: elig.length ? after / elig.length : 0, docs, training: tr, log: logs.length ? ICME.avg(logs, (t) => t.metrics.log) : 0, teachers: th.length };
  };
  q.health = (c) => { const s = q.stats(c); return c.status === '개설준비' ? null : Math.round(100 * (0.35 * s.kisel + 0.25 * s.video + 0.2 * s.docs + 0.2 * s.training)); };
  q.healthTone = (n) => (n == null ? 'gray' : n >= 75 ? 'green' : n >= 55 ? 'amber' : 'red');
  q.healthLabel = (n) => (n == null ? '준비 중' : n >= 75 ? '양호' : n >= 55 ? '관찰' : '주의');

  /* ---------- 전체 영역 평균(HQ) — 모든 가맹점 아이들의 종합 점수 평균 ---------- */
  q.hqAreaMeans = () => q.areaMeans(db().students);

  /* ---------- 월 주제 분포(c1) ---------- */
  q.themeDist = (cid) => {
    const m = { v1: 0, v2: 0, v3: 0, v4: 0, v5: 0 };
    q.classesOf(cid).filter((k) => k.program === 'ART').forEach((k) => { m[q.themeFor(k).vol]++; });
    return m;
  };
})();

</script>
<script>/* js/core/scoring.js */
/* scoring.js — 아이·부모 설문 점수 계산(근거 포함), 신뢰도, 변화, 발음 전후 비교 */
(function () {
  'use strict';
  const ICME = window.ICME; const S = (ICME.scoring = {});
  const r1 = (n) => Math.round(n * 10) / 10;
  const mean = (a) => (a && a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  const P = () => ICME.survey.params;

  S.c5 = (v) => 1 + ((v - 1) * 4) / 3;                       /* 아이 4점 척도 → 1~5점 환산 */
  S.weights = (age) => { const w = P().weights.find((x) => age <= x.maxAge) || P().weights[1]; return { c: w.c, p: w.p }; };

  /* ---------- 영역별 점수 ---------- */
  S.area = function (s, i) {
    const sv = s.survey || {};
    const cItems = sv.child && sv.child.items ? sv.child.items[i] : null;
    const pItems = sv.parent && sv.parent.done && sv.parent.items ? sv.parent.items[i] : null;
    const c = cItems ? { score: r1(mean(cItems.map(S.c5))), n: cItems.length, items: cItems } : null;

  };

    else {
      if (!sv.child.fresh) { score -= K.childStale; reasons.push({ tone: 'amber', t: '아이 응답이 지난 점검(' + ICME.prevMonthNo() + '월) 기준이에요 — 이번 달 응답 대기' }); }

  /* 대본 줄 → 단어 목록 (빈칸 ___ 은 아이가 고른 말이라 점수에서 제외) */

    const v = ICME.materials.byId[volId];
    return v.video.lines.map((l) => l.en.replace(/[!.,?]/g, ' ').split(/\s+/).filter((w) => w && w.indexOf('_') < 0));
  };

  S.pronGen = function (pair) {
    if (pair.pron) return pair.pron;
    const rnd = ICME.rng(ICME.hash('pron' + pair.id));
    const mk = (base, quality) => {
      const d = { acc: base + (rnd() * 8 - 4), flu: base - 6 + (rnd() * 8 - 4), comp: Math.min(98, base + 8 + (rnd() * 8 - 4)), pros: base - 8 + (rnd() * 8 - 4) };

    const bw = words(before); const aw = bw.map((ln) => ln.map((x) => ({ w: x.w, s: Math.max(15, Math.min(99, Math.round(x.s + gain + (rnd() * 8 - 3)))) })));
    const snd = (SOUNDS[pair.vol] || SOUNDS.v1).map((x) => ({ p: x[0], ex: x[1], b: Math.round(before.acc - 6 + rnd() * 14), a: 0 }));
    snd.forEach((x) => (x.a = Math.min(99, Math.round(x.b + gain + (rnd() * 8 - 2)))));
    return {
      before: Object.assign({ overall: S.pronOverall(before), words: bw, conf: 'good', sec: pair.before ? pair.before.sec : 28 }, before),
      after: Object.assign({ overall: S.pronOverall(after), words: aw, conf: rnd() < 0.1 ? 'poor' : 'good', sec: pair.after ? pair.after.sec : 30 }, after),
      sounds: snd

  };

  S.pron = function (pair) {
    const p = S.pronGen(pair); const dB = p.before; const dA = p.after;
    const delta = dA.overall - dB.overall;
    const poor = dB.conf === 'poor' || dA.conf === 'poor';
    const ch = poor ? { key: 'unclear', label: '비교하기 어려워요 (녹음 상태)', tone: 'gray' } : PW().change.find((c) => delta >= c.min);
    const dims = PW().dims.map((d) => ({ key: d.key, label: d.label, hint: d.hint, b: dB[d.key], a: dA[d.key], d: dA[d.key] - dB[d.key] }));
    return { before: dB, after: dA, sounds: p.sounds, delta, change: ch, dims };
  };
})();

      teach: {
        grow: ['기다리는 시간은 짧게(10초)부터 시작해 점점 늘려요. 기다리는 동안 할 수 있는 일(숫자 세기, 노래)을 알려 줘요. (L1)', '신호등 막대를 손에 쥐고 기다리면 "기다림"이 눈에 보여서 쉬워져요. (L1)', '"Please / Thank you / Sorry / Excuse me"는 상황 카드를 뽑아 짧게 연습해요. (L2)'],
        mid: ['느린 친구와 짝이 되어 "I will wait for you."를 쓰는 역할놀이를 해요. (L3)', '우리 반 약속을 아이들이 직접 정하게 해요. (L4)', '고운 말을 쓰면 바로 구체적으로 칭찬해요. "고마워요라고 해서 친구가 웃었네." (L2)'],
        high: ['"약속 지킴이" 역할로 줄 안내를 맡겨요. (L1)', '친구를 기다려 주는 상황을 스스로 찾아 말하게 해요. (L3)', '약속 무지개에서 새 약속을 제안해 보게 해요. (L4)']
      },
      child: [['조금만 기다려 줘.', 'Please wait.'], ['기다려 줘서 고마워.', 'Thank you for waiting.'], ['내가 기다려 줄게.', 'I will wait for you.']],
      need: { grow: '이번 달은 짧은 시간부터 차례를 기다리는 연습을 하고 있어요.', mid: '이번 달은 고운 말을 상황에 맞게 쓰는 연습을 해요.', high: '이번 달은 약속을 지키도록 돕는 역할에 도전해요.' },
      home: '기다릴 일이 생기면(식사 준비, 승강기) "하나, 둘, 셋 세면서 기다려 볼까?"를 해 보시고, 기다린 뒤에는 꼭 "기다려 줘서 고마워"라고 말해 주세요.',
      avoid: ['"빨리 해", "왜 이렇게 못 기다려?"', '기다림을 벌처럼 느끼게 하는 말'],
      chips: ['기다렸어요', '고운 말을 썼어요', '약속을 지키려고 했어요']
    }
  };

  const FLAG = {
    parentHigh: (a) => ({ tone: 'amber', title: '집에서는 괜찮다고 보시지만 아이는 자신 없어 해요 · ' + a.area.short, text: '센터에서 작은 성공을 먼저 만들어 주세요. 학부모께는 "집에서는 어떤 상황에서 잘하나요?"를 구체적으로 여쭤 기대 수준을 맞춰요.' }),
    childHigh: (a) => ({ tone: 'amber', title: '아이는 잘한다고 답했지만 집에서는 어려워 보인다고 해요 · ' + a.area.short, text: '학부모께 상황(언제·누구와)을 구체적으로 여쭙고, 수업에서도 같은 장면을 짚어 보세요. 아이의 응답이 틀렸다는 뜻은 아니에요.' }),
    helped: { tone: 'info', title: '응답할 때 어른이 도와줬다고 표시됐어요', text: '다음 점검은 아이가 혼자 눌러 보도록 안내해 주세요. 이번 점수는 참고로만 보세요.' },
    stale: { tone: 'amber', title: '아이 응답이 지난 점검(' + ICME.prevMonthNo() + '월) 기준이에요', text: '이번 달 응답을 마치면 점수가 새로 계산돼요. 그동안은 수업 관찰을 함께 참고하세요.' },
    parentMissing: { tone: 'amber', title: '부모 설문이 아직이에요 — 임시 점수예요', text: '설문 알림을 다시 보내거나 상담 때 요청해 주세요. 집에서의 모습이 더해지면 점수가 더 정확해져요.' },
    quick: { tone: 'amber', title: '아이 응답이 매우 빨랐어요', text: '결과를 확정하기 전에 수업 관찰과 함께 확인해 주세요.' },
    age5: { tone: 'info', title: '5세는 짧게, 보여 주면서', text: '활동을 5분 단위로 나누고 시범을 먼저 보여 주세요. 말보다 몸짓·카드 응답을 충분히 인정해 주세요.' }
  };

  /* 본사가 고친 문구(db.coach)가 있으면 기본 문구 위에 덮어서 읽어요. 수준별 문구는 수준마다, 나머지는 영역 단위로 바뀌어요. */
  function get(no) {
    const base = AREA[no]; const o = ICME.store && ICME.store.db && ICME.store.db.coach ? ICME.store.db.coach[no] : null;
    if (!o) return base;
    return Object.assign({}, base, o, { teach: Object.assign({}, base.teach, o.teach || {}), need: Object.assign({}, base.need, o.need || {}) });
  }

  function build(s, teacherName) {
    const prof = ICME.scoring.profile(s);
    const cls = ICME.q.klass(s.classIds[0]);
    const tname = teacherName || (cls && cls.teacherId ? ICME.q.teacher(cls.teacherId).name : '담임');
    const pick = prof.lowest[0];
    const blocks = prof.lowest.filter((a, i) => i === 0 || a.combined < 3.4).map((a) => {
      const d = get(a.area.no); const lv = a.level ? a.level.key : 'mid';
      return { res: a, area: a.area, level: a.level, tips: d.teach[lv], lessons: d.lessons[lv], child: d.child, need: d.need[lv], home: d.home, avoid: d.avoid, chips: d.chips, vol: ICME.materials.volumes[a.area.no - 1] };
    });
    const strong = prof.strongest[0];
    const up = prof.areas.filter((a) => a.change === 'up').sort((x, y) => y.delta - x.delta)[0];
    const sv = s.survey || {};
    /* 학부모에게 이렇게 알려요 (순서대로 읽기만 하면 되는 문장) */
    const first = blocks[0];
    const script = [
      { k: '인사', t: '안녕하세요, ' + tname + ' 선생님이에요. ' + s.name + '의 이번 달 마음 이야기를 짧게 말씀드릴게요.' },
      { k: '잘하고 있는 점', t: ICME.josa(s.name, '은/는') + ' "' + strong.area.short + '" 쪽에서 ' + get(strong.area.no).strength + ' 모습이 잘 보여요.' + (up ? ' 지난번보다 "' + up.area.short + '" 영역이 ' + up.delta.toFixed(1) + '점 자랐어요.' : '') },
      { k: '이번 달 함께 키울 점', t: first.need },
      { k: '집에서 해 볼 것 (한 가지만)', t: first.home }
    ];
    if (first.res.gapFlag === 'parentHigh') script.push({ k: '여쭤볼 것', t: '집에서는 ' + first.area.short + ' 쪽이 잘 되는 편이라고 해 주셨어요. 어떤 상황에서 특히 잘하는지 들려주실 수 있을까요? 센터에서 같은 장면을 만들어 볼게요.' });
    if (first.res.gapFlag === 'childHigh') script.push({ k: '여쭤볼 것', t: '집에서는 ' + first.area.short + ' 쪽이 조금 어려워 보인다고 해 주셨어요. 언제, 누구와 있을 때 그런지 알려 주시면 수업에서 함께 살펴볼게요.' });
    if (!sv.parent || !sv.parent.done) script.push({ k: '부탁', t: '부모님 설문(3분)에 답해 주시면 집에서의 모습까지 반영해 더 정확하게 도울 수 있어요.' });
    script.push({ k: '마무리', t: '다음 달에 달라진 모습을 또 나눌게요. 궁금하신 점은 편하게 말씀해 주세요.' });

    /* 근거에서 나온 주의 신호 */
    const flags = [];
    prof.areas.forEach((a) => { if (a.gapFlag === 'parentHigh' || a.gapFlag === 'childHigh') flags.push(FLAG[a.gapFlag](a)); });
    if (!sv.parent || !sv.parent.done) flags.push(FLAG.parentMissing);
    if (sv.child && !sv.child.fresh) flags.push(FLAG.stale);
    if (sv.child && sv.child.helped) flags.push(FLAG.helped);
    if (sv.child && sv.child.mins != null && sv.child.mins < ICME.survey.params.quickMinutes) flags.push(FLAG.quick);
    if (s.age <= 5) flags.push(FLAG.age5);

    /* 센터장과 상의가 필요한 신호 (진단이 아니라 "함께 살펴보자"는 신호) */
    const signals = [];
    const low = prof.lowest[0];
    if (low && low.combined != null && low.combined < 2.6 && (low.delta == null || low.delta <= 0.1)) signals.push('"' + low.area.short + '" 영역이 낮고 지난번과 비슷해요. 2개월 더 지켜본 뒤 센터장·학부모와 상의해요.');
    if (prof.areas.some((a) => a.gap != null && Math.abs(a.gap) >= ICME.survey.params.gapBig)) signals.push('아이와 부모 응답의 차이가 매우 커요. 학부모 상담을 권해요.');
    if (s.risk) signals.push('출석·열람 변화가 있어요 (' + s.risk.join(', ') + '). 안부 연락을 권해요.');

    return { prof, blocks, script, flags, signals, strong, up, teacher: tname, vol: cls && cls.program === 'ART' ? ICME.q.volOf(ICME.q.themeFor(cls).vol) : null };
  }

  ICME.coaching = { AREA, FLAG, build, get };
})();

</script>
<script>/* js/core/charts.js */
/* charts.js — 의존성 없는 SVG 차트 (radar / donut / spark / line) */
(function () {
  'use strict';
  const ICME = window.ICME; const { h, raw } = ICME;
  const ch = (ICME.charts = {});

  /* 레이더: series = [{values:[..5], color, fill:true, dashed:false, label}] */
  ch.radar = function (o) {
    const n = o.labels.length; const size = o.size || 300; const max = o.max || 5; const lv = o.levels || 5;
    const c = size / 2; const R = size / 2 - (o.pad || 54);
    const ang = (i) => (-Math.PI / 2) + (i * 2 * Math.PI) / n;
    const pt = (i, v) => [c + R * (v / max) * Math.cos(ang(i)), c + R * (v / max) * Math.sin(ang(i))];
    let s = '';
    for (let k = 1; k <= lv; k++) {
      const pts = o.labels.map((_, i) => pt(i, (max * k) / lv).join(',')).join(' ');
      s += '<polygon points="' + pts + '" fill="' + (k === lv ? '#f6f9fa' : 'none') + '" stroke="#dde5e8" stroke-width="1"/>';
    }
    o.labels.forEach((_, i) => { const p = pt(i, max); s += '<line x1="' + c + '" y1="' + c + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#e1eaeb"/>'; });
    (o.series || []).forEach((se) => {
      const pts = se.values.map((v, i) => pt(i, v).join(',')).join(' ');
      s += '<polygon points="' + pts + '" fill="' + (se.fill === false ? 'none' : se.color) + '" fill-opacity="' + (se.fill === false ? 0 : 0.16) + '" stroke="' + se.color + '" stroke-width="' + (se.dashed ? 2 : 2.8) + '"' + (se.dashed ? ' stroke-dasharray="5 4"' : '') + ' stroke-linejoin="round"/>';
      if (!se.dashed) se.values.forEach((v, i) => { const p = pt(i, v); s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.2" fill="#fff" stroke="' + se.color + '" stroke-width="2.4"/>'; });
    });
    o.labels.forEach((lb, i) => {
      const a = ang(i); const lx = c + (R + 22) * Math.cos(a); const ly = c + (R + 22) * Math.sin(a);
      const anchor = Math.abs(Math.cos(a)) < 0.2 ? 'middle' : Math.cos(a) > 0 ? 'start' : 'end';
      const col = o.labelColors ? o.labelColors[i] : '#3b4a4f';
      s += '<text x="' + lx + '" y="' + (ly + 4) + '" text-anchor="' + anchor + '" font-size="' + (o.fs || 13) + '" font-weight="700" fill="' + col + '">' + ICME.esc(lb) + '</text>';
      if (o.valueLabels) { const v = o.valueLabels[i]; s += '<text x="' + lx + '" y="' + (ly + 20) + '" text-anchor="' + anchor + '" font-size="12" fill="#6b7b82" font-weight="600">' + ICME.esc(v) + '</text>'; }
    });
    return raw('<svg viewBox="-56 0 ' + (size + 112) + ' ' + size + '" width="100%" style="max-width:' + (size + 112) + 'px;display:block;margin:0 auto" role="img" aria-label="' + ICME.esc(o.aria || '5영역 레이더 차트') + '">' + s + '</svg>');
  };

  /* 도넛 */
  ch.donut = function (o) {
    const size = o.size || 120; const sw = o.stroke || 14; const r = (size - sw) / 2; const c = size / 2; const circ = 2 * Math.PI * r;
    const p = ICME.clamp(o.value, 0, 1);
    return raw('<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img" aria-label="' + ICME.esc(o.aria || '') + '"><circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + (o.track || '#edf2f3') + '" stroke-width="' + sw + '"/><circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + (o.color || '#19a9a4') + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + (circ * p) + ' ' + circ + '" transform="rotate(-90 ' + c + ' ' + c + ')"/><text x="' + c + '" y="' + (c + 1) + '" text-anchor="middle" dominant-baseline="middle" font-size="' + (size * 0.24) + '" font-weight="800" fill="#1b2a2e">' + ICME.esc(o.text != null ? o.text : Math.round(p * 100) + '%') + '</text></svg>');
  };

  /* 스파크라인 */
  ch.spark = function (vals, o) {
    o = o || {}; const w = o.w || 96; const hh = o.h || 28; const min = o.min != null ? o.min : Math.min.apply(null, vals) - 0.1; const max = o.max != null ? o.max : Math.max.apply(null, vals) + 0.1;
    const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 6) + 3, hh - 3 - ((v - min) / (max - min || 1)) * (hh - 6)]);
    const last = pts[pts.length - 1];
    return raw('<svg viewBox="0 0 ' + w + ' ' + hh + '" width="' + w + '" height="' + hh + '"><polyline points="' + pts.map((p) => p.join(',')).join(' ') + '" fill="none" stroke="' + (o.color || '#19a9a4') + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="' + (o.color || '#19a9a4') + '"/></svg>');
  };

  /* 추이선: series=[{values,color,label}], labels */
  ch.line = function (o) {
    const w = o.w || 520; const hh = o.h || 180; const pl = 34; const pr = 14; const pt = 14; const pb = 26;
    const min = o.min != null ? o.min : 0; const max = o.max != null ? o.max : 100;
    const n = o.labels.length; const x = (i) => pl + (i / (n - 1)) * (w - pl - pr); const y = (v) => pt + (1 - (v - min) / (max - min)) * (hh - pt - pb);
    let s = '';
    const ticks = o.ticks || [min, (min + max) / 2, max];
    ticks.forEach((t) => { s += '<line x1="' + pl + '" y1="' + y(t) + '" x2="' + (w - pr) + '" y2="' + y(t) + '" stroke="#e8eff0"/><text x="' + (pl - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="#94a3a9">' + t + '</text>'; });
    o.labels.forEach((l, i) => { s += '<text x="' + x(i) + '" y="' + (hh - 6) + '" text-anchor="middle" font-size="11.5" fill="#6b7b82">' + ICME.esc(l) + '</text>'; });
    o.series.forEach((se) => {
      const pts = se.values.map((v, i) => x(i) + ',' + y(v)).join(' ');
      if (se.area) s += '<polygon points="' + x(0) + ',' + y(min) + ' ' + pts + ' ' + x(n - 1) + ',' + y(min) + '" fill="' + se.color + '" fill-opacity=".1"/>';
      s += '<polyline points="' + pts + '" fill="none" stroke="' + se.color + '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
      se.values.forEach((v, i) => { s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3.6" fill="#fff" stroke="' + se.color + '" stroke-width="2.2"/>'; });
    });
    return raw('<svg viewBox="0 0 ' + w + ' ' + hh + '" width="100%" style="max-width:' + w + 'px" role="img" aria-label="' + ICME.esc(o.aria || '추이 그래프') + '">' + s + '</svg>');
  };

  /* 가로 막대 목록 (HTML) */
  ch.hbars = function (items, o) {
    o = o || {}; const max = o.max || Math.max.apply(null, items.map((i) => i.value)) || 1;
    return h`<div class="col g8">${items.map((it) => h`<div class="row g8"><div style="width:${o.labelW || 84}px" class="small semi ellipsis">${it.label}</div><div class="grow"><div class="bar ${it.tone || ''}"><i style="width:${ICME.clamp((it.value / max) * 100, 0, 100)}%;${it.color ? 'background:' + it.color : ''}"></i></div></div><b class="small tnum" style="width:42px;text-align:right">${it.text != null ? it.text : it.value}</b></div>`)}</div>`;
  };
})();

</script>
<script>/* js/core/ui.js */
/* ui.js — 공통 UI 컴포넌트, 모달/드로어/토스트, 이벤트 위임 */
(function () {
  'use strict';
  const ICME = window.ICME; const { h, raw, esc, icon } = { h: ICME.h, raw: ICME.raw, esc: ICME.esc, icon: ICME.icon };
  const ui = (ICME.ui = {});
  ICME.actions = {};

  /* ---------- 작은 컴포넌트 ---------- */
  ui.badge = (text, tone, ic) => h`<span class="badge b-${tone || 'gray'}">${ic ? icon(ic, 13) : ''}${text}</span>`;
  ui.ptag = (key, off) => { const p = ICME.programs.byKey[key]; return p ? h`<span class="ptag ${p.cls}${off ? ' off' : ''}" title="${p.name}">${p.short}</span>` : ''; };
  ui.avatar = (name, size, extra) => { const c = ICME.avatarColor(name); return h`<span class="avatar ${size || ''}" style="background:${c[0]};color:${c[1]}${extra ? ';' + extra : ''}">${ICME.initials(name)}</span>`; };
  ui.bar = (pct, tone) => h`<div class="bar ${tone || ''}"><i style="width:${ICME.clamp(pct, 0, 100)}%"></i></div>`;
  ui.meter = (pct, tone, text) => h`<div class="meter">${ui.bar(pct, tone)}<b>${text != null ? text : Math.round(pct) + '%'}</b></div>`;
  ui.auto = (text) => h`<span class="auto-badge">${icon('zap', 12)}${text || '자동'}</span>`;
  ui.dot = (tone) => h`<span class="dot ${tone || ''}"></span>`;
  ui.tonePct = (p) => (p >= 0.75 ? 'green' : p >= 0.5 ? 'orange' : 'red');
  ui.pctBar = (p) => ui.meter(p * 100, ui.tonePct(p));

  ui.stat = (o) => h`<div class="card stat"><div class="lbl">${o.icon ? h`<span class="ic ${o.tone || ''}">${icon(o.icon, 16)}</span>` : ''}${o.label}</div><div class="val">${o.value}${o.unit ? h`<small>${o.unit}</small>` : ''}</div>${o.sub ? h`<div class="sub ${o.subTone || ''}">${o.sub}</div>` : ''}</div>`;

  ui.card = (o) => h`<section class="card ${o.cls || ''}">${o.title ? h`<div class="ch"><h2>${o.title}</h2>${o.sub ? h`<span class="sub">${o.sub}</span>` : ''}${o.actions || ''}</div>` : ''}<div class="cb ${o.flush ? 'flush' : ''}" ${o.style ? raw('style="' + esc(o.style) + '"') : ''}>${o.body}</div></section>`;

  ui.pageHead = (o) => h`${o.back ? h`<a class="backlink" href="#${o.back.href}">${icon('chevron-left', 16)}${o.back.label}</a>` : ''}<div class="page-head"><div class="ph-t">${o.eyebrow ? h`<div class="eyebrow">${o.eyebrowIcon ? icon(o.eyebrowIcon, 14) : ''}${o.eyebrow}</div>` : ''}<h1>${o.title}</h1>${o.sub ? h`<p>${o.sub}</p>` : ''}</div><div class="ph-a">${o.actions || ''}</div></div>`;

  ui.tabs = (items, active, base, extraQuery) => h`<nav class="tabs">${items.map((t) => h`<a class="${t.key === active ? 'on' : ''}" href="#${base}?tab=${t.key}${extraQuery || ''}">${t.icon ? icon(t.icon, 16) : ''}${t.label}${t.count != null ? h`<span class="n">${t.count}</span>` : ''}</a>`)}</nav>`;

  ui.empty = (ic, title, text) => h`<div class="empty"><div class="ei">${icon(ic || 'info', 26)}</div><div class="bold">${title}</div>${text ? h`<div class="small mt4">${text}</div>` : ''}</div>`;
  ui.alert = (tone, ic, body) => h`<div class="alert ${tone}">${icon(ic || 'info', 18)}<div>${body}</div></div>`;
  ui.kv = (rows) => h`<dl class="kv">${rows.map((r) => h`<dt>${r[0]}</dt><dd>${r[1]}</dd>`)}</dl>`;
  ui.chips = (items, active, act, key) => h`<div class="chips">${items.map((it) => h`<button class="chip ${it.key === active ? 'on' : ''}" data-act="${act}" data-v="${it.key}">${it.label}</button>`)}</div>`;
  ui.toggle = (name, on, act) => h`<label class="toggle"><input type="checkbox" ${on ? raw('checked') : ''} data-change="${act}" data-name="${name}"><i></i></label>`;
  ui.field = (o) => {
    const id = 'f_' + o.name;
    let ctl;
    if (o.type === 'select') ctl = h`<select class="select" id="${id}" name="${o.name}">${o.options.map((op) => { const v = typeof op === 'string' ? op : op.v; const l = typeof op === 'string' ? op : op.l; return h`<option value="${v}" ${String(o.value) === String(v) ? raw('selected') : ''}>${l}</option>`; })}</select>`;
    else if (o.type === 'textarea') ctl = h`<textarea class="textarea" id="${id}" name="${o.name}" placeholder="${o.placeholder || ''}">${o.value || ''}</textarea>`;
    else ctl = h`<input class="input" id="${id}" name="${o.name}" type="${o.type || 'text'}" value="${o.value == null ? '' : o.value}" placeholder="${o.placeholder || ''}" ${o.required ? raw('required') : ''}>`;
    return h`<div class="field"><label for="${id}">${o.label}${o.required ? h` <span class="req">*</span>` : ''}</label>${ctl}${o.hint ? h`<div class="hint">${o.hint}</div>` : ''}</div>`;
  };
  ui.formData = (root) => { const o = {}; ICME.$$('[name]', root).forEach((el) => { if (el.type === 'checkbox') { if (el.dataset.multi) { (o[el.name] = o[el.name] || []); if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; } else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; } else o[el.name] = el.value; }); return o; };

  /* ---------- 모달 / 드로어 / 토스트 ---------- */
  function root() { return document.getElementById('modal-root'); }
  ui.close = function () { root().innerHTML = ''; document.body.style.overflow = ''; };
  ui.modal = function (o) {
    root().innerHTML = String(h`<div class="overlay" data-act="ui.backdrop"><div class="modal ${o.size || ''}" role="dialog" aria-modal="true" aria-label="${o.title}"><div class="mh"><h2>${o.title}</h2><button class="icon-btn" data-act="ui.close" aria-label="닫기">${icon('x', 18)}</button></div><div class="mb">${o.body}</div>${o.foot ? h`<div class="mf">${o.foot}</div>` : ''}</div></div>`);
    document.body.style.overflow = 'hidden';
    const f = ICME.$('input,select,textarea', root()); if (f && o.focus !== false) f.focus();
  };
  ui.drawer = function (o) {
    root().innerHTML = String(h`<div class="overlay drawer-wrap" data-act="ui.backdrop"><div class="drawer" role="dialog" aria-modal="true" aria-label="${o.title}"><div class="mh"><h2>${o.title}</h2><button class="icon-btn" data-act="ui.close" aria-label="닫기">${icon('x', 18)}</button></div><div class="mb">${o.body}</div>${o.foot ? h`<div class="mf">${o.foot}</div>` : ''}</div></div>`);
    document.body.style.overflow = 'hidden';
  };
  ui.confirm = function (o) {
    ui.modal({ title: o.title, body: h`<p>${o.text}</p>`, foot: h`<button class="btn" data-act="ui.close">취소</button><button class="btn ${o.danger ? 'danger' : 'primary'}" data-act="ui.confirmOk">${o.ok || '확인'}</button>` });
    ui._ok = o.onOk;
  };
  ui.toast = function (msg, tone) {
    const el = document.createElement('div'); el.className = 'toast ' + (tone || 'ok');
    el.innerHTML = String(icon(tone === 'warn' ? 'alert-circle' : 'check-circle', 18)) + '<span>' + esc(msg) + '</span>';
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2600);
  };

  ICME.actions['ui.close'] = () => ui.close();
  ICME.actions['ui.backdrop'] = (el, e) => { if (e.target === el) ui.close(); };
  ICME.actions['ui.confirmOk'] = () => { const f = ui._ok; ui.close(); if (f) f(); };

  /* ---------- 이벤트 위임 ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act === 'ui.backdrop' && e.target !== el) return;
    const fn = ICME.actions[el.dataset.act];
    if (fn) { if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault(); if (ICME.actionGuard && ICME.actionGuard(el.dataset.act)) return; try { fn(el, e); } catch (err) { ICME.fatal(err); } }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]'); if (!el) return;
    const fn = ICME.actions[el.dataset.change]; if (fn) { if (ICME.actionGuard && ICME.actionGuard(el.dataset.change)) return; try { fn(el, e); } catch (err) { ICME.fatal(err); } }
  });
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-input]'); if (!el) return;
    const fn = ICME.actions[el.dataset.input]; if (fn) { if (ICME.actionGuard && ICME.actionGuard(el.dataset.input)) return; try { fn(el, e); } catch (err) { ICME.fatal(err); } }
  });
  document.addEventListener('submit', (e) => {
    const el = e.target.closest('[data-submit]'); if (!el) return;
    e.preventDefault(); const fn = ICME.actions[el.dataset.submit]; if (fn) { if (ICME.actionGuard && ICME.actionGuard(el.dataset.submit)) return; try { fn(el, e); } catch (err) { ICME.fatal(err); } }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && root() && root().firstChild) ui.close(); });

  /* 드래그앤드롭 (칸반) */
  let dragData = null;
  document.addEventListener('dragstart', (e) => { const el = e.target.closest('[data-drag]'); if (!el) return; dragData = el.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragData); } catch (x) { /* noop */ } el.classList.add('dragging'); });
  document.addEventListener('dragend', (e) => { const el = e.target.closest('[data-drag]'); if (el) el.classList.remove('dragging'); ICME.$$('.drop-on').forEach((x) => x.classList.remove('drop-on')); });
  document.addEventListener('dragover', (e) => { const el = e.target.closest('[data-drop]'); if (!el) return; e.preventDefault(); ICME.$$('.drop-on').forEach((x) => x !== el && x.classList.remove('drop-on')); el.classList.add('drop-on'); });
  document.addEventListener('drop', (e) => { const el = e.target.closest('[data-drop]'); if (!el) return; e.preventDefault(); el.classList.remove('drop-on'); const fn = ICME.actions[el.dataset.dropAct]; if (fn && dragData) { try { fn(el, dragData); } catch (err) { ICME.fatal(err); } } dragData = null; });

  /* 오류 표시(개발용) */
  ICME.fatal = function (err) {
    try { console.error(err); } catch (e) { /* noop */ }
    let el = document.querySelector('.fatal'); if (!el) { el = document.createElement('pre'); el.className = 'fatal'; document.body.appendChild(el); }
    el.textContent = 'ERROR: ' + (err && err.stack ? err.stack : err);
  };
  window.addEventListener('error', (e) => ICME.fatal(e.error || e.message));
})();

<script>/* js/core/router.js */
/* router.js — 해시 라우터: #/portal/page/:param?query */
(function () {
  'use strict';
  const ICME = window.ICME;
  const routes = [];
  const R = (ICME.router = {});

  R.add = function (pattern, def) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[a-zA-Z]+/g, (m) => { keys.push(m.slice(1)); return '([^/]+)'; }) + '/?$');
    routes.push({ pattern, re, keys, def });
  };
  R.parse = function () {
    const rawHash = (location.hash || '#/').slice(1) || '/';
    const i = rawHash.indexOf('?');
    const path = i >= 0 ? rawHash.slice(0, i) : rawHash;
    const qs = i >= 0 ? rawHash.slice(i + 1) : '';
    const query = {};
    qs.split('&').filter(Boolean).forEach((kv) => { const p = kv.split('='); query[decodeURIComponent(p[0])] = decodeURIComponent(p.slice(1).join('=') || ''); });
    return { path, query };
  };
  R.match = function (path) {
    for (const r of routes) {
      const m = r.re.exec(path);
      if (m) { const params = {}; r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1]))); return { route: r, params }; }
    }
    return null;
  };
  R.go = (path) => { location.hash = '#' + path; };
  R.start = function () {
    window.addEventListener('hashchange', () => ICME.app.render(true));
    ICME.app.render(true);
  };
  R.href = (path, query) => '#' + path + (query ? '?' + Object.keys(query).map((k) => encodeURIComponent(k) + '=' + encodeURIComponent(query[k])).join('&') : '');
})();

</script>
<script>/* js/art/art.js */
/* art.js — 하트 시리즈 삽화: 캐릭터(다미·하준·소라·지호·푸딩), 소품, 배경, 장면, 단어 픽토그램.
   모두 인라인 SVG(외부 이미지 없음)라서 화면과 인쇄(PDF)에 같은 그림이 나옵니다. */
(function () {
  'use strict';
  const ICME = window.ICME;
  const A = (ICME.art = {});

  const SKIN = { dami: '#ffd9bd', hajun: '#f2c9a3', sora: '#ffe0c8', jiho: '#ebbf98' };

  const BOT = { dami: '#ffb02e', hajun: '#4a78d8', sora: '#ffd54a', jiho: '#3b4b8c' };
  const E = '#3b2a20';
  const BLOCKS = ['#ff8a5b', '#ffb02e', '#3bb8b0', '#7a5af8', '#ee3a8c', '#4cc38a'];
  const EMO_COLOR = { happy: '#ffd84d', sad: '#8ec9ff', angry: '#ff8a7a', scared: '#c9b0ff', surprised: '#ffbe6b', calm: '#9fe0b5', plain: '#ffe0c4', proud: '#ffd84d', neutral: '#ffe0c4' };

  /* ---------- 표정 (머리 중심 50,46 기준) ---------- */
  function expr(emo) {
    const ln = (d, w) => '<path d="' + d + '" stroke="' + E + '" stroke-width="' + (w || 3.2) + '" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    const cheeks = (c, o, r) => '<circle cx="32" cy="58" r="' + (r || 5.5) + '" fill="' + c + '" opacity="' + o + '"/><circle cx="68" cy="58" r="' + (r || 5.5) + '" fill="' + c + '" opacity="' + o + '"/>';

      case 'proud': return cheeks('#ff9fa3', 0.6) + ln('M35 50 Q40 43 45 50') + ln('M55 50 Q60 43 65 50') + ln('M34 38 Q40 34 46 38', 2.6) + ln('M54 38 Q60 34 66 38', 2.6) + '<path d="M38 57 Q50 75 62 57 Z" fill="#7a2b2b"/><path d="M43 66 Q50 71 57 66 Q50 63 43 66Z" fill="#ff8d8d"/>';
      case 'sad': return cheeks('#ffb3b3', 0.4) + dots(50) + ln('M33 44 L45 40', 2.8) + ln('M67 44 L55 40', 2.8) + ln('M42 65 Q50 58 58 65') + '<path d="M33 54 q-3.5 6 0 9 q3.5 -3 0 -9z" fill="#8ed1ff"/>';
      case 'angry': return cheeks('#ff6b5e', 0.5, 6.5) + dots(51) + ln('M32 41 L46 47', 4) + ln('M68 41 L54 47', 4) + ln('M41 65 Q50 57 59 65');
      case 'scared': return '<circle cx="40" cy="49" r="6.5" fill="#fff" stroke="' + E + '" stroke-width="2.2"/><circle cx="60" cy="49" r="6.5" fill="#fff" stroke="' + E + '" stroke-width="2.2"/><circle cx="41" cy="50" r="2.6" fill="' + E + '"/><circle cx="59" cy="50" r="2.6" fill="' + E + '"/>' + ln('M33 38 Q39 34 45 38', 2.6) + ln('M55 38 Q61 34 67 38', 2.6) + ln('M40 65 Q43.5 60 47 65 Q50 69.5 53 65 Q56.5 60 60 65') + '<path d="M80 34 q-4 7 0 9 q4 -2 0 -9z" fill="#8ed1ff"/>';
      case 'surprised': return cheeks('#ffb3b3', 0.4) + '<circle cx="40" cy="48" r="5.6" fill="#fff" stroke="' + E + '" stroke-width="2.2"/><circle cx="60" cy="48" r="5.6" fill="#fff" stroke="' + E + '" stroke-width="2.2"/><circle cx="40" cy="48" r="2.4" fill="' + E + '"/><circle cx="60" cy="48" r="2.4" fill="' + E + '"/>' + ln('M33 36 Q40 30 47 36', 2.8) + ln('M53 36 Q60 30 67 36', 2.8) + '<ellipse cx="50" cy="64" rx="5" ry="7" fill="#7a2b2b"/>';
      case 'calm': return cheeks('#ff9fa3', 0.45) + ln('M35 48 Q40 53 45 48') + ln('M55 48 Q60 53 65 48') + ln('M43 60 Q50 66 57 60');
      default: return dots(49) + ln('M44 62 L56 62');
    }
  }

  /* ---------- 아이 캐릭터 (100×150, 앵커: 하단 중앙) ---------- */
  const ARMS = { stand: [[30, 84, 20, 110], [70, 84, 80, 110]], up: [[30, 82, 12, 52], [70, 82, 88, 52]], wave: [[30, 84, 20, 110], [70, 82, 90, 54]], out: [[30, 84, 8, 98], [70, 84, 92, 98]], hold: [[30, 84, 41, 106], [70, 84, 59, 106]] };
  A.kidInner = function (who, emo, pose) {
    const skin = SKIN[who] || SKIN.dami, hair = HAIR[who] || HAIR.dami, top = TOP[who] || TOP.dami, bot = BOT[who] || BOT.dami;

    let s = '<ellipse cx="50" cy="148" rx="28" ry="4" fill="#000" opacity=".08"/>';
    if (who === 'dami') s += '<circle cx="17" cy="42" r="12" fill="' + hair + '"/><circle cx="83" cy="42" r="12" fill="' + hair + '"/><circle cx="19" cy="54" r="4" fill="#ffb02e"/><circle cx="81" cy="54" r="4" fill="#ffb02e"/>';
    if (who === 'sora') s += '<path d="M15 42 Q13 11 50 11 Q87 11 85 42 L88 100 Q72 108 62 98 L38 98 Q28 108 12 100 Z" fill="' + hair + '"/>';
    if (dress) s += '<rect x="36" y="126" width="9" height="19" rx="4" fill="' + skin + '"/><rect x="55" y="126" width="9" height="19" rx="4" fill="' + skin + '"/>';
    else if (who === 'hajun') s += '<rect x="35" y="108" width="12" height="38" rx="5" fill="' + bot + '"/><rect x="53" y="108" width="12" height="38" rx="5" fill="' + bot + '"/>';
    else s += '<rect x="35" y="108" width="12" height="20" rx="5" fill="' + bot + '"/><rect x="53" y="108" width="12" height="20" rx="5" fill="' + bot + '"/><rect x="36" y="126" width="10" height="19" rx="4" fill="' + skin + '"/><rect x="54" y="126" width="10" height="19" rx="4" fill="' + skin + '"/>';
    s += '<ellipse cx="41" cy="146" rx="9" ry="4.5" fill="#fff" stroke="#c9d6d9"/><ellipse cx="59" cy="146" rx="9" ry="4.5" fill="#fff" stroke="#c9d6d9"/>';
    if (dress) s += '<path d="M26 104 L74 104 L84 130 L16 130 Z" fill="' + bot + '"/>';
    s += '<rect x="28" y="74" width="44" height="40" rx="14" fill="' + top + '"/>';
    (ARMS[pose] || ARMS.stand).forEach((a) => {
      const mx = a[0] + (a[2] - a[0]) * 0.38, my = a[1] + (a[3] - a[1]) * 0.38;
      s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + a[2] + '" y2="' + a[3] + '" stroke="' + skin + '" stroke-width="9" stroke-linecap="round"/>';
      s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + mx + '" y2="' + my + '" stroke="' + top + '" stroke-width="11" stroke-linecap="round"/>';
      s += '<circle cx="' + a[2] + '" cy="' + a[3] + '" r="6" fill="' + skin + '"/>';
    });
    s += '<circle cx="20" cy="48" r="5.5" fill="' + skin + '"/><circle cx="80" cy="48" r="5.5" fill="' + skin + '"/><circle cx="50" cy="46" r="30" fill="' + skin + '"/>';
    if (who === 'dami') s += '<path d="M20 40 Q22 13 50 13 Q78 13 80 40 Q66 29 50 29 Q34 29 20 40 Z" fill="' + hair + '"/>';
    else if (who === 'hajun') s += '<path d="M20 40 Q16 11 50 11 Q84 11 80 40 Q74 25 64 29 L58 17 L50 28 L42 17 L36 29 Q26 25 20 40 Z" fill="' + hair + '"/>';
    else if (who === 'sora') s += '<path d="M19 42 Q22 12 50 12 Q78 12 81 42 Q66 26 50 29 Q34 26 19 42 Z" fill="' + hair + '"/><path d="M66 22 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z" fill="#ffd23f"/>';
    else s += '<path d="M20 40 Q19 12 52 12 Q82 13 80 40 Q64 25 38 31 Q26 33 20 40 Z" fill="' + hair + '"/>';
    s += expr(emo);
    return s;
  };
  A.kid = (who, emo, pose, size) => '<svg viewBox="0 0 100 150" width="' + (size || 100) + '" height="' + ((size || 100) * 1.5) + '">' + A.kidInner(who, emo, pose) + '</svg>';

  /* 둥근 표정 얼굴 (감정 카드용) */
  A.blob = function (emo) { return '<circle cx="50" cy="50" r="40" fill="' + (EMO_COLOR[emo] || EMO_COLOR.plain) + '" stroke="#ffffff" stroke-width="3"/><g transform="translate(0 4)">' + expr(emo === 'plain' ? 'neutral' : emo) + '</g>'; };

  /* ---------- 푸딩 (강아지, 100×110, 앵커 하단 중앙) ---------- */
  A.pupInner = function (emo) {
    let s = '<ellipse cx="50" cy="108" rx="30" ry="3.6" fill="#000" opacity=".08"/>';
    s += '<path d="M80 84 q16 -4 14 -18" stroke="#e7c391" stroke-width="7" fill="none" stroke-linecap="round"/>';
    s += '<rect x="30" y="88" width="13" height="18" rx="6" fill="#f2d3a0"/><rect x="57" y="88" width="13" height="18" rx="6" fill="#f2d3a0"/>';
    s += '<ellipse cx="50" cy="84" rx="32" ry="20" fill="#f6dcb2"/>';
    s += '<ellipse cx="22" cy="54" rx="10" ry="19" fill="#c9904f" transform="rotate(14 22 54)"/><ellipse cx="78" cy="54" rx="10" ry="19" fill="#c9904f" transform="rotate(-14 78 54)"/>';
    s += '<circle cx="50" cy="52" r="28" fill="#f6dcb2"/><ellipse cx="50" cy="63" rx="14" ry="10.5" fill="#fff3dc"/><ellipse cx="50" cy="57" rx="4.6" ry="3.4" fill="#4a3426"/>';
    if (emo === 'sad') s += '<circle cx="39" cy="46" r="3.4" fill="' + E + '"/><circle cx="61" cy="46" r="3.4" fill="' + E + '"/><path d="M44 68 Q50 63 56 68" stroke="' + E + '" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    else s += '<circle cx="39" cy="46" r="3.6" fill="' + E + '"/><circle cx="61" cy="46" r="3.6" fill="' + E + '"/><circle cx="40" cy="45" r="1.1" fill="#fff"/><circle cx="62" cy="45" r="1.1" fill="#fff"/><path d="M44 65 Q50 72 56 65" stroke="' + E + '" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M47 68 Q50 76 53 68Z" fill="#ff8d8d"/>';
    return s;
  };

  /* ---------- 소품 (앵커: 하단 중앙 0,0) ---------- */
  const rect = (x, y, w, h, f, rx, extra) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '" fill="' + f + '" ' + (extra || '') + '/>';
  const circ = (cx, cy, r, f, extra) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + f + '" ' + (extra || '') + '/>';
  const star5 = (cx, cy, r, f, st) => { let p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5; const rr = i % 2 ? r * 0.42 : r; p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1)); } return '<polygon points="' + p.join(' ') + '" fill="' + f + '" stroke="' + (st || 'none') + '" stroke-width="2" stroke-linejoin="round"/>'; };
  const heartP = (cx, cy, s, f) => '<path transform="translate(' + cx + ' ' + cy + ') scale(' + s + ')" d="M0 14 C-22 -2 -14 -20 0 -9 C14 -20 22 -2 0 14Z" fill="' + f + '"/>';

  const PROPS = {
    tower: (o) => {

    thanks: () => bubbleIc(10, 14, 80, 54) + heartP(50, 40, 1.1, '#ff6b8b'),
    highfive: () => hand(30, 92, 1, '#ffd9bd') + hand(70, 92, 1, '#f2c9a3') + star5(50, 16, 10, '#ffd23f', '#f5a300'),
    wait: () => circ(50, 52, 36, '#fff', 'stroke="#ee3a8c" stroke-width="6"') + '<path d="M50 52 V28 M50 52 L66 62" stroke="#27373b" stroke-width="6" stroke-linecap="round"/>' + circ(50, 52, 4, '#27373b'),
    line: () => [0, 1, 2, 3].map((i) => kidAt(['dami', 'hajun', 'sora', 'jiho'][i], 'calm', 'stand', 16 + i * 23, 98, 0.34)).join(''),
    please: () => hand(36, 88, 1, '#ffd9bd') + hand(64, 88, 1, '#f2c9a3'),
    sorry: () => '<g transform="translate(0 10) scale(.8) translate(10 0)">' + A.blob('sad') + '</g>' + bubbleIc(56, 2, 40, 28) + '<text x="76" y="22" text-anchor="middle" font-size="16" font-weight="900" fill="#27373b">!</text>',
    excuse: () => hand(34, 96, 0.95, '#ffd9bd') + bubbleIc(46, 6, 48, 30) + '<text x="70" y="27" text-anchor="middle" font-size="18" font-weight="900" fill="#ee3a8c">…</text>',
    kind: () => '<g transform="scale(2.1) translate(24 22)">' + heartP(0, 0, 1, '#ff8fb1') + '</g>' + hand(24, 98, 0.7, '#ffd9bd') + hand(76, 98, 0.7, '#f2c9a3'),
    slow: () => sm('snail', {}, 48, 84, 1.05),
    rule: () => rect(20, 10, 60, 82, '#fff', 8, 'stroke="#c9d6d9" stroke-width="3"') + [0, 1, 2].map((i) => '<path d="M30 ' + (32 + i * 22) + ' l5 5 l9 -10" stroke="#4cc38a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M52 ' + (34 + i * 22) + ' H70" stroke="#c9d6d9" stroke-width="4" stroke-linecap="round"/>').join(''),
    count: () => [0, 1, 2].map((i) => circ(24 + i * 26, 40, 11, ['#ff8a5b', '#ffb02e', '#3bb8b0'][i]) + '<text x="' + (24 + i * 26) + '" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">' + (i + 1) + '</text>').join('') + '<path d="M16 70 H84" stroke="#c9d6d9" stroke-width="4" stroke-linecap="round"/>',

  A.icon = function (name, size) {
    let inner;

    else if (ICONS[name]) inner = ICONS[name]();
    else inner = star5(50, 50, 36, '#ffd23f', '#f5a300');
    const sv = g(inner);
    return size ? sv.replace('<svg ', '<svg width="' + size + '" height="' + size + '" ') : sv;
  };

  /* 영상 포스터(아이 + 소리 파동) — 실제 영상 대신 쓰는 시안용 그림 */
  A.videoPoster = function (who, emo, bgColor) {
    return '<svg class="poster" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><rect width="200" height="250" fill="' + (bgColor || '#2c4a4f') + '"/><circle cx="100" cy="110" r="120" fill="#fff" opacity=".05"/><g transform="translate(-6 40) scale(1.35)">' + A.kidInner(who, emo, 'stand') + '</g></svg>';
