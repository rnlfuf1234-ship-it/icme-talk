<script>/* js/views/shared.js */
/* shared.js — 여러 포털이 함께 쓰는 화면 부품: 교재 보기, 스토리북, 레이더, 영상 비교 */
(function () {
  'use strict';
  const ICME = window.ICME; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui;
  const S = (ICME.shared = {});
  ICME.vs = { story: {}, vc: null };

  /* ---------- 작은 표시 ---------- */
  S.volBadge = (v) => h`<span class="badge" style="background:${v.tint};color:${v.ink}">${v.no}권 · ${v.titleKo}</span>`;
  S.areaChip = (n) => { const v = ICME.materials.volumes[n - 1]; const a = ICME.kisel.areas[n - 1]; return h`<span class="badge" style="background:${v.tint};color:${v.ink}">${n}단계 · ${a.short}</span>`; };
  S.level = (score) => { const l = ICME.kisel.levelOf(score); return h`<span class="lv ${l.key}">${l.name}</span>`; };
  S.cover = (vol, cls) => raw(ICME.art.cover(vol, { cls: cls || '' }));
  S.scene = (def, alt) => raw(ICME.art.scene(def, { alt }));
  S.word = (w) => h`<div class="word-card">${raw(ICME.art.icon(w.icon))}<b>${w.en}</b><span>${w.ko}</span></div>`;

  /* ---------- 레이더 ---------- */
  S.radar = function (cur, prev, o) {
    o = o || {};
    const labels = ICME.kisel.areas.map((a) => a.no + ' ' + a.short);
    const series = [];
    if (prev) series.push({ values: prev, color: '#94a3a9', dashed: true, fill: false });
    series.push({ values: cur, color: o.color || '#19a9a4' });
    return ICME.charts.radar({ labels, series, size: o.size || 300, valueLabels: o.values === false ? null : cur.map((v) => v.toFixed(1)), labelColors: ICME.kisel.areas.map((a, i) => ICME.materials.volumes[i].ink), aria: o.aria });
  };

  /* ---------- 수업안 1차시 ---------- */
  S.lessonBody = function (vol, L) {
    return h`<div class="col g16">
      <div class="alert tint">${icon('target', 18)}<div><b>이번 시간의 목표</b><br>${L.goal}</div></div>
      <div><h3 class="mb8">수업 흐름 <span class="muted small semi">· 45분</span></h3><div class="lesson-flow">${L.flow.map((f) => h`<div class="lf-row"><div class="lf-min">${f.min}<small>분</small></div><div><div class="bold">${f.step} <span class="muted semi small">· ${f.ko}</span></div><div class="small muted mt4">${f.desc}</div></div></div>`)}</div></div>
      <div class="grid c2"><div><h3 class="mb8">준비물</h3><ul class="kv-list">${L.prep.map((p) => h`<li>${icon('check', 15)}<span>${p}</span></li>`)}</ul></div><div><h3 class="mb8">관찰 포인트 <span class="muted small semi">· 1~2개만 기록</span></h3><ul class="kv-list">${L.observe.map((p) => h`<li>${icon('eye', 15)}<span>${p}</span></li>`)}</ul></div></div>
      <div><h3 class="mb8">수업 대본</h3><div class="script">${L.script.map((s) => h`<div class="ln"><span class="who ${s.who === 'C' ? 'c' : ''}">${s.who === 'T' ? '교사' : '아이'}</span><div><div class="en">${s.en}</div><div class="ko">${s.ko}</div></div></div>`)}</div></div>
      <div><h3 class="mb8">아이 유형별 도움말</h3><div class="grid c3"><div class="card flat pad small"><b>소극적인 아이</b><div class="muted mt4">${L.tips.shy}</div></div><div class="card flat pad small"><b>에너지가 큰 아이</b><div class="muted mt4">${L.tips.active}</div></div><div class="card flat pad small"><b>영어가 처음인 아이</b><div class="muted mt4">${L.tips.beginner}</div></div></div></div>
    </div>`;
  };
  S.lessonDetails = (vol, L, open) => h`<details class="card lesson-d" ${open ? raw('open') : ''}><summary><span class="step-no" style="background:${vol.color}">${L.no}</span><div class="grow"><div class="bold">${L.title} <span class="muted semi">· ${L.titleKo}</span></div><div class="small muted">${L.goal}</div></div>${icon('chevron-down', 18)}</summary><div class="cb">${S.lessonBody(vol, L)}</div></details>`;

  /* ---------- 스토리북 뷰어 ---------- */
  S.storyViewer = function (vol, o) {
    o = o || {};
    const pages = vol.story.pages; const i = ICME.clamp(ICME.vs.story[vol.id] || 0, 0, pages.length - 1); const pg = pages[i];
    return h`<div class="story-view"><div class="story-art">${S.scene(pg.scene, vol.story.title + ' ' + (i + 1) + '쪽')}</div><div class="story-txt"><div class="en">${pg.en}</div><div class="ko">${pg.ko}</div></div><div class="story-nav"><button class="btn sm" data-act="story.prev" data-vol="${vol.id}" ${i === 0 ? raw('disabled') : ''}>${icon('chevron-left', 16)}이전</button><div class="row g8"><div class="dots">${pages.map((_, k) => h`<i class="${k === i ? 'on' : ''}"></i>`)}</div><button class="icon-btn" data-act="story.read" data-vol="${vol.id}" aria-label="소리로 읽어주기" title="소리로 읽어주기 (브라우저 음성)">${icon('volume', 18)}</button></div><button class="btn sm primary" data-act="story.next" data-vol="${vol.id}" ${i === pages.length - 1 ? raw('disabled') : ''}>다음${icon('chevron-right', 16)}</button></div></div>`;
  };
  ICME.actions['story.prev'] = (el) => { const id = el.dataset.vol; ICME.vs.story[id] = Math.max(0, (ICME.vs.story[id] || 0) - 1); ICME.rerender(); };
  ICME.actions['story.next'] = (el) => { const id = el.dataset.vol; const v = q.volOf(id); ICME.vs.story[id] = Math.min(v.story.pages.length - 1, (ICME.vs.story[id] || 0) + 1); ICME.rerender(); };
  ICME.actions['story.read'] = (el) => {
    const v = q.volOf(el.dataset.vol); const pg = v.story.pages[ICME.vs.story[v.id] || 0];
    S.speak(pg.en, 'en-US');
  };
  S.speak = function (text, lang) {
    try { if (!('speechSynthesis' in window)) { ui.toast('이 브라우저는 음성 읽기를 지원하지 않아요', 'warn'); return; } window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang || 'ko-KR'; u.rate = 0.88; window.speechSynthesis.speak(u); } catch (e) { /* 음성 미지원 */ }
  };

  /* ---------- 표/목록 ---------- */
  S.kitCard = (vol) => h`<div class="card"><div class="ch"><h2>${vol.kit.name}</h2><span class="sub">권별 활동 키트 · 가격·구매처 미정</span></div><div class="cb flush mt12"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>구성품</th><th>수량 · 비고</th></tr></thead><tbody>${vol.kit.items.map((it) => h`<tr><td>${it.n}</td><td class="muted">${it.qty || ''}${it.qty && it.note ? ' · ' : ''}${it.note || ''}</td></tr>`)}</tbody></table></div></div><div class="cb">${ui.alert('warn', 'alert-triangle', h`<b>안전 안내</b><ul class="kv-list mt4">${vol.kit.safety.map((s) => h`<li>${icon('check', 14)}<span>${s}</span></li>`)}</ul>`)}</div></div>`;
  S.homeTable = (vol) => h`<div class="card"><div class="cb flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:70px">주차</th><th>Play (놀이)</th><th>Read (읽기)</th><th>Speak (말하기)</th></tr></thead><tbody>${vol.home.map((w) => h`<tr><td><b>${w.w}주</b></td><td>${w.play}</td><td>${w.read}</td><td>${w.speak}</td></tr>`)}</tbody></table></div></div></div>`;
  S.videoScriptCard = (vol) => h`<div class="card"><div class="ch"><h2>촬영 대본 (Before · After 동일)</h2><span class="sub">한 명당 30초</span></div><div class="cb"><div class="script">${vol.video.lines.map((l, i) => h`<div class="ln"><span class="who">${i + 1}</span><div><div class="en">${l.en}</div><div class="ko">${l.ko} <span class="faint">· 동작: ${l.gesture}</span></div></div></div>`)}</div><hr class="sep"><div class="grid c2"><div><div class="bold small mb8">발음 포인트</div><div class="chips">${vol.video.targets.map((t) => h`<span class="chip">${t}</span>`)}</div></div><div><div class="bold small mb8">촬영 팁</div><ul class="kv-list small">${vol.video.tips.map((t) => h`<li>${icon('check', 14)}<span>${t}</span></li>`)}</ul></div></div></div></div>`;
  S.rubricCard = () => h`<div class="card"><div class="ch"><h2>평가 루브릭</h2><span class="sub">교사는 칩을 1~2개만 선택해요 (점수 입력은 선택)</span></div><div class="cb"><div class="grid c5">${ICME.materials.rubric.map((r) => h`<div class="card flat pad"><b>${r.label}</b><div class="small muted mt4">${r.hint}</div></div>`)}</div><div class="bold small mt16 mb8">1탭 코멘트 칩</div><div class="chips">${ICME.materials.chips.map((c) => h`<span class="chip">${c}</span>`)}</div></div></div>`;

  /* ---------- 영상 비교 플레이어 (시안) ---------- */
  S.charFor = (st) => ['dami', 'hajun', 'sora', 'jiho'][ICME.hash(st.fullName) % 4];
  S.videoCompare = function (pair, o) {
    o = o || {}; const vol = q.volOf(pair.vol); const st = q.student(pair.studentId); const who = S.charFor(st);
    const side = (label, cls, emo, info, bg) => h`<div><div class="vid ${o.wide ? 'wide' : ''}">${raw(ICME.art.videoPoster(who, emo, bg))}<span class="tagv ${cls}">${label}</span><div class="cap" data-cap></div><div class="ctrl"><div class="tl"><i data-tl></i></div></div></div><div class="xs muted mt4 center">${info}</div></div>`;
    const hasAfter = !!pair.after;
    return h`<div data-vc="${pair.id}" data-lines="${vol.video.lines.map((l) => l.en).join('|')}"><div class="vid-pair">${side('Before', '', 'neutral', ICME.dateKo(pair.before.date) + ' · ' + pair.before.sec + '초', '#3b4f55')}${hasAfter ? side('After', 'after', 'happy', ICME.dateKo(pair.after.date) + ' · ' + pair.after.sec + '초', '#1f6b68') : h`<div><div class="vid ${o.wide ? 'wide' : ''}" style="display:flex;align-items:center;justify-content:center;background:#e9f0f1"><div class="center" style="padding:10px"><div class="faint">${icon('clock', 28)}</div><div class="bold small mt4">After 촬영 전</div><div class="xs muted mt4">단원이 끝날 때<br>같은 대본으로 촬영해요</div></div></div></div>`}</div><div class="row g8 mt12" style="justify-content:center"><button class="btn primary sm" data-act="vc.toggle" ${hasAfter ? '' : raw('disabled')}>${icon('play', 15)}<span data-vc-label>나란히 재생</span></button><button class="btn sm" data-act="vc.restart">${icon('refresh', 15)}처음부터</button></div></div>`;
  };
  ICME.actions['vc.toggle'] = (el) => {
    const root = el.closest('[data-vc]'); if (!root) return;
    const vc = ICME.vs.vc && ICME.vs.vc.root === root ? ICME.vs.vc : (ICME.vs.vc = { root, t: 0, playing: false, last: 0, dur: 12000 });
    vc.playing = !vc.playing; const lab = ICME.$('[data-vc-label]', root); if (lab) lab.textContent = vc.playing ? '일시정지' : '이어서 재생';
    if (vc.playing) { vc.last = performance.now(); if (vc.t >= 1) vc.t = 0; requestAnimationFrame(function tick(now) { if (!ICME.vs.vc || ICME.vs.vc !== vc || !vc.playing || !document.contains(root)) return; vc.t = Math.min(1, vc.t + (now - vc.last) / vc.dur); vc.last = now; S.vcPaint(vc); if (vc.t >= 1) { vc.playing = false; if (lab) lab.textContent = '다시 재생'; return; } requestAnimationFrame(tick); }); }
  };
  ICME.actions['vc.restart'] = (el) => { const root = el.closest('[data-vc]'); if (!root) return; const vc = ICME.vs.vc && ICME.vs.vc.root === root ? ICME.vs.vc : (ICME.vs.vc = { root, t: 0, playing: false, last: 0, dur: 12000 }); vc.t = 0; vc.playing = false; S.vcPaint(vc); const lab = ICME.$('[data-vc-label]', root); if (lab) lab.textContent = '나란히 재생'; };
  S.vcPaint = function (vc) {
    const lines = (vc.root.dataset.lines || '').split('|'); const idx = Math.min(lines.length - 1, Math.floor(vc.t * lines.length));
    ICME.$$('[data-tl]', vc.root).forEach((e) => (e.style.width = vc.t * 100 + '%'));
    ICME.$$('[data-cap]', vc.root).forEach((e) => (e.textContent = vc.t > 0 ? lines[idx].replace('___', '…') : ''));
  };

  /* 루브릭 전후 막대 */
  S.rubricCompare = function (pair) {
    if (!pair.rubric) return '';
    const box = (n, cls) => h`<div class="bf ${cls}">${[1, 2, 3, 4, 5].map((k) => h`<i class="${k <= n ? 'on' : ''}"></i>`)}</div>`;
    return h`<div>${ICME.materials.rubric.map((r) => { const v = pair.rubric[r.key]; return h`<div class="rub"><b>${r.label}</b><div class="row g8">${box(v[0], '')}${icon('arrow-right', 14)}${box(v[1], 'af')}</div><span class="delta">+${v[1] - v[0]}</span></div>`; })}</div>`;
  };
})();

</script>
<script>/* js/views/center_teachers.js */
/* center_teachers.js — 가맹점 콘솔: 교사 명부 · 교사 상세 · 초대 · 상태 변경 */
(function () {
  'use strict';
  const ICME = window.ICME; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const S = ICME.shared; const R = ICME.router;
  const db = () => ICME.store.db; const CID = 'c1';
  const TU = (ICME.teachersUI = {});
  ICME.vs.tf = { q: '', status: 'all', prog: 'all', view: 'cards' };

  const STATUS_TONE = { 재직: 'green', 온보딩: 'blue', 휴직: 'amber', 퇴사: 'gray' };
  const stateIc = { done: '✓', prog: '▶', todo: '–', late: '!', opt: '·', na: '', expiring: '⏳' };

  /* ---------- 공통 부품 ---------- */
  TU.progTags = (t) => ICME.programs.keys.map((k) => {
    const c = q.certState(t, k); const p = ICME.programs.byKey[k];
    if (c.state === 'ok') return h`<span class="ptag ${p.cls}" title="${p.name} 인증">${p.short}</span>`;
    if (c.state === 'expiring') return h`<span class="ptag ${p.cls}" style="box-shadow:0 0 0 2px var(--orange-400)" title="${p.name} 인증 ${c.label}">${p.short}</span>`;
    if (c.state === 'expired') return h`<span class="ptag" style="background:var(--bad-bg);color:var(--bad)" title="${p.name} 인증 만료">${p.short}</span>`;
    if (c.state === 'prog') return h`<span class="ptag off" title="${p.name} 교육 중">${p.short}…</span>`;
    return h`<span class="ptag off" title="${p.name} 미이수">${p.short}</span>`;
  });
  TU.statusBadge = (t) => ui.badge(t.status, STATUS_TONE[t.status] || 'gray');
  TU.toneDot = (t) => ui.dot({ red: 'bad', amber: 'warn', green: 'ok' }[q.teacherTone(t)]);
  TU.alertChip = (a) => h`<span class="badge ${a.level === 'high' ? 'b-red' : a.level === 'mid' ? 'b-amber' : 'b-blue'}">${a.text}</span>`;

  TU.create = function (f) {
    const today = ICME.ymd(ICME.today());
    const progs = {}; ICME.programs.keys.forEach((k) => (progs[k] = (f.programs || []).includes(k) ? { status: '교육중' } : { status: '미이수' }));
    const docs = {}; ICME.training.docTypes.forEach((d) => (docs[d.key] = { s: 'missing' }));
    const id = ICME.uid('t');
    const t = { id, centerId: f.centerId || CID, name: f.name, role: f.role || '강사', emp: f.emp || '시간제', status: '온보딩', phone: f.phone || '010-0000-0000', email: id + '@example.com', hired: f.start || today, days: [1, 2, 3, 4, 5], programs: progs, courses: { T01: { s: 'todo' }, T02: { s: 'todo' }, T03: { s: 'todo' }, T04: { s: 'todo' }, T09: { s: 'todo' } }, docs, metrics: null, shadow: { done: 0, need: 2 }, feedback: [], notes: f.memo ? [{ d: today, by: '김서윤', text: f.memo }] : [], timeline: [{ d: today, text: '입사 초대 발송 (알림톡 자동)' }] };
    ICME.store.mutate((d) => d.teachers.push(t));
    return t;
  };

  /* ---------- 교사 명부 ---------- */
  R.add('/center/teachers', {
    portal: 'center', title: '교사 명부',
    render() {
      const f = ICME.vs.tf;
      let list = q.teachersOf(CID).filter((t) => t.status !== '퇴사');
      const all = list;
      if (f.q) list = list.filter((t) => t.name.includes(f.q));
      if (f.status !== 'all') list = list.filter((t) => t.status === f.status);
      if (f.prog !== 'all') list = list.filter((t) => q.certified(t, f.prog));
      const cnt = (s) => all.filter((t) => t.status === s).length;
      const need = all.filter((t) => ['red', 'amber'].includes(q.teacherTone(t))).length;
      const card = (t) => {
        const al = q.teacherAlerts(t).slice(0, 2); const ds = q.docSummary(t); const lessons = q.classesOfTeacher(t.id).length;
        return h`<a class="card hover tcard" href="#/center/teachers/${t.id}" style="padding:16px 18px;display:block">
          <div class="row g12">${ui.avatar(t.name, 'lg')}<div class="grow"><div class="row g6"><b style="font-size:16px">${t.name}</b>${TU.toneDot(t)}</div><div class="small muted">${t.role} · ${t.emp} · 입사 ${ICME.dateFull(t.hired).slice(0, 7)}</div></div>${TU.statusBadge(t)}</div>
          <div class="row g4 wrap mt12">${TU.progTags(t)}</div>
          <div class="grid c3 mt12 small"><div><div class="xs muted">주간 수업</div><b>${lessons}회 · ${q.teacherHours(t.id)}h</b></div><div><div class="xs muted">서류</div><b>${ds.ok}/${ds.total}</b></div><div><div class="xs muted">필수 교육</div><b>${Math.round(q.trainingRate(t) * 100)}%</b></div></div>
          <div class="row g4 wrap mt12" style="min-height:24px">${al.length ? al.map(TU.alertChip) : h`<span class="badge b-green">${icon('check', 12)}확인할 것 없음</span>`}</div></a>`;
      };
      const table = h`<div class="card"><div class="cb flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>이름</th><th>상태</th><th>고용</th><th>인증</th><th class="num">주간 수업</th><th>일지</th><th>촬영</th><th>서류</th><th>교육</th></tr></thead><tbody>${list.map((t) => { const ds = q.docSummary(t); return h`<tr class="link" data-act="nav" data-to="/center/teachers/${t.id}"><td><div class="row g8">${ui.avatar(t.name, 'sm')}<div><b>${t.name}</b> ${TU.toneDot(t)}<div class="xs muted">${t.role}</div></div></div></td><td>${TU.statusBadge(t)}</td><td class="small">${t.emp}</td><td><div class="row g4">${TU.progTags(t)}</div></td><td class="num">${q.classesOfTeacher(t.id).length}회</td><td>${t.metrics ? ui.pctBar(t.metrics.log) : '-'}</td><td>${t.metrics ? ui.pctBar(t.metrics.video) : '-'}</td><td>${ds.ok}/${ds.total}</td><td>${Math.round(q.trainingRate(t) * 100)}%</td></tr>`; })}</tbody></table></div></div></div>`;
      return h`${ui.pageHead({ eyebrow: '교사 관리', eyebrowIcon: 'users', title: '교사 명부', sub: '초대 한 번이면 서류 요청 · 필수 교육 배정 · 첫 2주 안내가 자동으로 이어져요. 점주는 빨간·노란 표시만 확인하면 됩니다.', actions: h`<button class="btn primary" data-act="tch.invite">${icon('user-plus', 16)}교사 초대</button>` })}
      <div class="card tint pad mb12"><div class="row g16 wrap"><div class="row g8 bold small" style="color:var(--teal-800)">${icon('zap', 18)}초대하면 자동으로</div><div class="step-line grow" style="min-width:420px"><span class="st done">① 가입 링크 알림톡</span><span class="st done">② 서류 6종 요청</span><span class="st done">③ 필수 교육 배정</span><span class="st done">④ 섀도잉 일정 안내</span></div></div></div>
      <div class="grid c4 mb12">${ui.stat({ icon: 'users', label: '재직', value: cnt('재직'), unit: '명' })}${ui.stat({ icon: 'user-plus', tone: 'blue', label: '온보딩', value: cnt('온보딩'), unit: '명', sub: '서류·교육 진행 중' })}${ui.stat({ icon: 'clock', tone: 'orange', label: '휴직', value: cnt('휴직'), unit: '명', sub: '대체 배정 필요' })}${ui.stat({ icon: 'alert-triangle', tone: 'red', label: '확인 필요', value: need, unit: '명', sub: '서류·교육·지표 예외' })}</div>
      <div class="toolbar"><div class="searchbox">${icon('search', 16)}<input class="input" style="width:230px" placeholder="이름 검색" value="${f.q}" data-input="tch.q"></div>
        <select class="select auto" data-change="tch.status"><option value="all">상태: 전체</option>${['재직', '온보딩', '휴직'].map((s) => h`<option value="${s}" ${f.status === s ? raw('selected') : ''}>${s}</option>`)}</select>
        <select class="select auto" data-change="tch.prog"><option value="all">인증: 전체</option>${ICME.programs.keys.map((k) => h`<option value="${k}" ${f.prog === k ? raw('selected') : ''}>${ICME.programs.byKey[k].short} 인증 보유</option>`)}</select>
        <span class="sp"></span><div class="seg" style="background:var(--ink-100)"><button class="${f.view === 'cards' ? 'on' : ''}" data-act="tch.view" data-v="cards" style="color:${f.view === 'cards' ? 'var(--teal-800)' : 'var(--ink-600)'}">카드</button><button class="${f.view === 'table' ? 'on' : ''}" data-act="tch.view" data-v="table" style="color:${f.view === 'table' ? 'var(--teal-800)' : 'var(--ink-600)'}">표</button></div></div>
      <div id="tch-list">${list.length ? (f.view === 'cards' ? h`<div class="grid c3">${list.map(card)}</div>` : table) : ui.empty('search', '조건에 맞는 교사가 없어요', '필터를 바꿔 보세요')}</div>`;
    }
  });
  ICME.actions['tch.q'] = (el) => { ICME.vs.tf.q = el.value; const box = document.getElementById('tch-list'); const pos = el.selectionStart; ICME.rerender(); const n = ICME.$('[data-input="tch.q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
  ICME.actions['tch.status'] = (el) => { ICME.vs.tf.status = el.value; ICME.rerender(); };
  ICME.actions['tch.prog'] = (el) => { ICME.vs.tf.prog = el.value; ICME.rerender(); };
  ICME.actions['tch.view'] = (el) => { ICME.vs.tf.view = el.dataset.v; ICME.rerender(); };

  /* ---------- 초대 ---------- */
  TU.inviteForm = (pre) => h`<form data-submit="tch.inviteSubmit" id="invite-form">
    <div class="alert tint mb12">${icon('zap', 18)}<div class="small"><b>보내면 자동으로 진행돼요</b><br>알림톡 가입 링크 → 서류 6종 요청 → 필수 교육(T01·T02·T04${db().heartOn[CID] ? '·T09' : ''}) 배정 → 첫 2주 섀도잉 안내</div></div>
    <div class="fgrid">${ui.field({ label: '이름', name: 'name', required: true, value: pre && pre.name || '', placeholder: '예) 김하늘' })}${ui.field({ label: '연락처', name: 'phone', type: 'tel', required: true, value: '010-', placeholder: '010-0000-0000' })}
    ${ui.field({ label: '역할', name: 'role', type: 'select', options: ['강사', '보조교사'] })}${ui.field({ label: '고용 형태', name: 'emp', type: 'select', options: ['시간제', '정규', '프리랜서(위촉)'] })}</div>
    ${ui.field({ label: '시작 예정일', name: 'start', type: 'date', value: ICME.ymd(ICME.addDays(ICME.today(), 7)) })}
    <div class="field"><div class="lab">담당 예정 프로그램 <span class="muted semi">(인증 교육이 자동 배정돼요)</span></div><div class="chips">${ICME.programs.keys.map((k) => h`<label class="chip"><input type="checkbox" name="programs" value="${k}" data-multi="1" style="accent-color:var(--teal-500)">${ICME.programs.byKey[k].name}</label>`)}</div></div>
    ${ui.field({ label: '메모 (선택)', name: 'memo', type: 'textarea', placeholder: '면접 때 확인한 내용 등' })}
    <div class="xs muted">이 정보는 교사 관리 목적으로만 쓰이며, 교사가 가입할 때 개인정보 수집·이용에 동의합니다.</div></form>`;
  ICME.actions['tch.invite'] = (el, ev, pre) => ui.modal({ title: '교사 초대', body: TU.inviteForm(pre), foot: h`<button class="btn" data-act="ui.close">취소</button><button class="btn primary" data-act="tch.inviteGo">${icon('send', 15)}초대 보내기</button>` });
  ICME.actions['tch.inviteGo'] = () => { const form = ICME.$('#invite-form'); if (form.reportValidity && !form.reportValidity()) return; ICME.actions['tch.inviteSubmit'](form); };
  ICME.actions['tch.inviteSubmit'] = (form) => {
    const f = ui.formData(form); if (!f.name || !f.name.trim()) { ui.toast('이름을 입력해 주세요', 'warn'); return; }
    const t = TU.create({ name: f.name.trim(), phone: f.phone, role: f.role, emp: f.emp, start: f.start, programs: f.programs || [], memo: f.memo });
    ui.close(); ui.toast(t.name + ' 선생님께 초대 알림톡을 보냈어요 (데모) · 서류·교육 자동 배정'); R.go('/center/teachers/' + t.id);
  };

  /* ---------- 교사 상세 ---------- */
  const TABS = [{ key: 'overview', label: '개요', icon: 'user' }, { key: 'schedule', label: '수업·시간표', icon: 'calendar' }, { key: 'training', label: '교육·인증', icon: 'award' }, { key: 'docs', label: '서류', icon: 'shield-check' }, { key: 'perf', label: '성과·피드백', icon: 'trending-up' }, { key: 'notes', label: '면담 메모', icon: 'message' }];
  R.add('/center/teachers/:id', {
    portal: 'center', title: '교사 상세',
    render(ctx) {
      const t = q.teacher(ctx.params.id); if (!t) return ui.empty('user', '교사를 찾을 수 없어요');
      const tab = ctx.query.tab || 'overview'; const alerts = q.teacherAlerts(t);
      const tabs = TABS.map((x) => Object.assign({}, x, x.key === 'docs' ? { count: q.docSummary(t).missing + q.docSummary(t).submitted + q.docSummary(t).expiring + q.docSummary(t).expired || null } : x.key === 'training' ? { count: q.requiredCourses(t).filter((c) => q.courseState(t, c) !== 'done').length || null } : {}));
      let body = '';
      if (tab === 'overview') body = overview(t, alerts);
      else if (tab === 'schedule') body = schedule(t);
      else if (tab === 'training') body = training(t);
      else if (tab === 'docs') body = docs(t);
      else if (tab === 'perf') body = perf(t);
      else body = notes(t);
      return h`<a class="backlink" href="#/center/teachers">${icon('chevron-left', 16)}교사 명부</a>
      <div class="card pad mb16"><div class="row g16 wrap"><div class="row g16 grow" style="min-width:320px">${ui.avatar(t.name, 'xl')}<div><div class="row g8 wrap"><h1>${t.name}</h1>${TU.statusBadge(t)}${TU.toneDot(t)}</div><div class="muted mt4">${t.role} · ${t.emp} · 입사 ${ICME.dateFull(t.hired)}</div><div class="row g12 wrap mt8 small muted"><span class="row g4">${icon('phone', 14)}${ICME.maskPhone(t.phone)}</span><span class="row g4">${icon('mail', 14)}${t.email}</span></div><div class="row g4 wrap mt12">${TU.progTags(t)}</div></div></div><div class="row g8 wrap"><button class="btn" data-act="tch.msg" data-id="${t.id}">${icon('message', 16)}메시지</button><button class="btn" data-act="tch.swap" data-id="${t.id}">${icon('swap', 16)}대체 요청</button><button class="btn" data-act="tch.status" data-id="${t.id}">${icon('settings', 16)}상태 변경</button></div></div>
      ${alerts.length ? h`<div class="row g8 wrap mt16" style="padding-top:14px;border-top:1px solid var(--line)"><span class="small bold muted">확인할 것</span>${alerts.map((a) => h`<a href="#/center/teachers/${t.id}?tab=${a.tab}">${TU.alertChip(a)}</a>`)}</div>` : ''}</div>
      ${ui.tabs(tabs, tab, '/center/teachers/' + t.id)}${body}`;
    }
  });

  function overview(t, alerts) {
    const classes = q.classesOfTeacher(t.id);
    const onb = t.status === '온보딩' ? ui.card({ title: '온보딩 체크리스트', sub: '자동으로 체크돼요', body: h`<div class="col g12">${[['서류 제출 ' + q.docSummary(t).ok + '/' + q.docSummary(t).total, q.docSummary(t).ok === q.docSummary(t).total], ['필수 교육 이수 ' + q.requiredCourses(t).filter((c) => q.courseState(t, c) === 'done').length + '/' + q.requiredCourses(t).length, q.trainingRate(t) === 1], ['섀도잉(참관) ' + (t.shadow ? t.shadow.done + '/' + t.shadow.need : '-') + '회', t.shadow && t.shadow.done >= t.shadow.need], ['촬영 스테이션 사용 승인', q.canFilm(t)]].map((r) => h`<div class="row g12"><span class="m-check ${r[1] ? 'on' : ''}">${r[1] ? icon('check', 14) : ''}</span><div class="grow ${r[1] ? 'muted' : 'bold'}">${r[0]}</div></div>`)}</div><div class="alert tint mt16">${icon('zap', 16)}<div class="small">필수 교육(T04)을 마치고 범죄경력 조회 확인이 끝나면 <b>촬영 스테이션이 자동으로 열려요.</b></div></div>` }) : '';
    return h`<div class="grid c-2-1"><div class="col g16">
      ${ui.card({ title: '확인할 것', sub: alerts.length + '건', body: alerts.length ? h`<div class="list" style="margin:-6px -20px -18px">${alerts.map((a) => h`<div class="li link" data-act="nav" data-to="/center/teachers/${t.id}?tab=${a.tab}"><span class="dot ${a.level === 'high' ? 'bad' : a.level === 'mid' ? 'warn' : 'info'}"></span><div class="grow">${a.text}</div><span class="btn xs">처리${icon('chevron-right', 12)}</span></div>`)}</div>` : h`<div class="row g8 muted">${icon('check-circle', 20)}지금 확인할 것이 없어요</div>` })}
      ${onb}
      ${ui.card({ title: '최근 활동', body: h`<div class="timeline">${(t.timeline || []).length ? t.timeline.map((x) => h`<div class="tl-it"><span class="tl-d">${ICME.dateShort(x.d)}</span><span class="tl-dot"></span><span>${x.text}</span></div>`) : h`<div class="muted small">아직 기록이 없어요</div>`}</div>` })}</div>
    <div class="col g16">
      ${ui.card({ title: '기본 정보', body: ui.kv([['역할', t.role], ['고용 형태', t.emp], ['입사일', ICME.dateFull(t.hired)], ['근무 요일', (t.days || []).map((d) => ICME.DOW[d]).join(' · ')], ['담당 반', classes.length + '개 · 주 ' + q.teacherHours(t.id) + '시간']].concat(t.leave ? [['휴직', ICME.dateFull(t.leave.from) + ' ~ ' + ICME.dateFull(t.leave.to) + ' (' + t.leave.reason + ')']] : [])) })}
      ${ui.card({ title: '프로그램 인증', body: h`<div class="col g8">${ICME.programs.keys.map((k) => { const c = q.certState(t, k); const p = ICME.programs.byKey[k]; return h`<div class="row g8"><span class="ptag ${p.cls}">${p.short}</span><div class="grow small">${p.name}</div>${ui.badge(c.label, c.tone)}</div>`; })}</div>` })}
      ${ui.card({ title: '자동 알림 (예정)', body: h`<ul class="kv-list small"><li>${icon('zap', 14)}<span>서류·인증 만료 60일 전, 30일 전 자동 안내</span></li><li>${icon('zap', 14)}<span>수업 일지 미작성 시 다음 날 오전 리마인드</span></li><li>${icon('zap', 14)}<span>필수 교육 미이수 7일 경과 시 점주에게 알림</span></li></ul>` })}</div></div>`;
  }

  function schedule(t) {
    const classes = q.classesOfTeacher(t.id).sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
    const byDay = ICME.groupBy(classes, (k) => k.day);
    const conf = q.allConflicts(CID).filter((p) => p[0].teacherId === t.id);
    return h`<div class="grid c-2-1"><div class="col g16">
      ${ui.card({ title: '담당 수업', sub: classes.length + '개 · 주 ' + q.teacherHours(t.id) + '시간', flush: true, body: classes.length ? h`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>요일 · 시간</th><th>반</th><th>프로그램</th><th class="num">원생</th><th>이달 주제</th></tr></thead><tbody>${classes.map((k) => { const th = q.themeFor(k); const v = q.volOf(th.vol); return h`<tr><td><b>${ICME.DOW[k.day]}</b> ${k.start}~${ICME.endTime(k.start, k.min)}</td><td>${k.name}</td><td>${ui.ptag(k.program)}</td><td class="num">${k.studentIds.length}명</td><td>${k.program === 'ART' ? h`${S.volBadge(v)}` : h`<span class="faint">-</span>`}</td></tr>`; })}</tbody></table></div>` : h`<div class="empty" style="padding:24px">배정된 수업이 없어요</div>` })}
      ${conf.length ? ui.alert('bad', 'alert-triangle', h`시간이 겹치는 수업이 ${conf.length}건 있어요.`) : ''}</div>
    <div class="col g16">${ui.card({ title: '주간 보기', body: h`<div class="mini-grid">${[1, 2, 3, 4, 5, 6].map((d) => h`<div class="d ${byDay[d] ? 'has' : ''}"><b>${ICME.DOW[d]}</b>${byDay[d] ? byDay[d].length + '회' : '-'}</div>`)}</div><div class="small muted mt12">근무 가능 요일: ${(t.days || []).map((d) => ICME.DOW[d]).join(' · ')}</div><a class="btn soft block mt12" href="#/center/schedule?t=${t.id}">${icon('calendar', 16)}시간표에서 보기 · 배정 변경</a>` })}${ui.card({ title: '대체 수업', body: h`<div class="small muted">결강이 생기면 <b>대체 요청</b>을 보내세요. 인증·시간이 맞는 교사에게만 자동으로 전달되고, 먼저 수락한 교사가 배정돼요.</div><button class="btn block mt12" data-act="tch.swap" data-id="${t.id}">${icon('swap', 16)}대체 요청 보내기</button>` })}</div></div>`;
  }

  function training(t) {
    const courses = ICME.training.courses;
    const row = (c) => {
      const s = q.courseState(t, c.id); const x = (t.courses || {})[c.id]; if (s === 'na') return '';
      const prog = s === 'done' ? 100 : s === 'prog' ? (x && x.p != null ? x.p : (c.program ? 50 : 40)) : 0;
      return h`<div class="li"><span class="cell-st ${s}">${stateIc[s]}</span><div class="grow"><div class="t">${c.id} · ${c.title} ${c.req === '필수' ? ui.badge('필수', 'red') : c.req === '권장' ? ui.badge('권장', 'gray') : c.req === '인증' ? ui.badge('인증', 'purple') : ui.badge(c.req, 'purple')}</div><div class="s">${c.kind} · ${c.min >= 60 ? Math.round(c.min / 60 * 10) / 10 + '시간' : c.min + '분'}${c.gate ? ' · ' + c.gate : ''}</div>${s === 'prog' ? h`<div style="max-width:260px;margin-top:6px">${ui.meter(prog, 'blue')}</div>` : ''}</div>${s === 'done' ? ui.badge('이수', 'green') : s === 'prog' ? ui.badge('진행 중', 'blue') : s === 'late' ? ui.badge('만료', 'red') : ui.badge('미이수', 'gray')}</div>`;
    };
    return h`<div class="grid c-3-2"><div class="col g16">${ui.card({ title: '필수·권장 교육', sub: '본사 제공 · 자동 배정', flush: true, body: h`<div class="list">${courses.filter((c) => !c.program || c.program === 'HEART').map(row)}</div>` })}${ui.card({ title: '프로그램 인증', sub: '집합교육 + 시연 평가', flush: true, body: h`<div class="list">${courses.filter((c) => c.program && c.program !== 'HEART').map((c) => { const p = ICME.programs.byKey[c.program]; const cs = q.certState(t, c.program); const pr = t.programs[c.program]; return h`<div class="li"><span class="ptag ${p.cls}">${p.short}</span><div class="grow"><div class="t">${p.name}</div><div class="s">${pr && pr.since ? '인증일 ' + ICME.dateFull(pr.since) + ' · 만료 ' + ICME.dateFull(pr.expires) : cs.state === 'prog' ? '교육 진행 중' : '아직 인증 전'}</div></div>${ui.badge(cs.label, cs.tone)}${['ok', 'none', 'expiring', 'expired'].includes(cs.state) && cs.state !== 'ok' ? h`<button class="btn xs" data-act="train.apply" data-tid="${t.id}" data-prog="${c.program}">교육 신청</button>` : ''}</div>`; })}</div>` })}</div>
    <div class="col g16">${ui.card({ title: '다음 집합교육', body: h`<div class="col g12">${ICME.training.sessions.filter((s) => s.courseId !== 'T09' || db().heartOn[CID]).slice(0, 4).map((s) => { const c = ICME.training.byId[s.courseId]; const en = (db().enrolled[t.id] || {})[s.id]; return h`<div class="card flat pad"><div class="bold small">${s.title}</div><div class="xs muted mt4">${ICME.dateKo(ICME.addDays(ICME.today(), s.offset))} ${s.time}<br>${s.place}</div><div class="row g8 mt8"><span class="xs muted grow">신청 ${s.applied + (en ? 1 : 0)}/${s.cap}명</span>${en ? ui.badge('신청 완료', 'green') : h`<button class="btn xs soft" data-act="train.enroll" data-tid="${t.id}" data-sid="${s.id}">신청</button>`}</div></div>`; })}</div>` })}</div></div>`;
  }
  ICME.actions['train.enroll'] = (el) => { const tid = el.dataset.tid, sid = el.dataset.sid; ICME.store.mutate((d) => { d.enrolled[tid] = d.enrolled[tid] || {}; d.enrolled[tid][sid] = true; }); ui.toast('교육 신청을 접수했어요. 일정 안내는 자동 발송됩니다'); ICME.rerender(); };
  ICME.actions['train.apply'] = (el) => {
    const tid = el.dataset.tid, key = el.dataset.prog; const c = ICME.training.courses.find((x) => x.program === key); const s = ICME.training.sessions.find((x) => x.courseId === c.id);
    if (!s) { ui.toast('열려 있는 교육 일정이 아직 없어요 — 본사 일정이 공개되면 자동 안내돼요', 'warn'); return; }
    ICME.actions['train.enroll']({ dataset: { tid, sid: s.id } });
  };

  function docs(t) {
    const types = ICME.training.docTypes;
    return h`${ui.alert('tint', 'shield-check', h`<b>개인정보 최소화</b> — 신분증·범죄경력 회신서 같은 원본은 시스템에 보관하지 않고, <b>확인 여부와 날짜만</b> 기록합니다. 법정 필수 서류 항목은 관할 교육지원청 안내를 확인해 주세요.`)}
    <div class="card mt16"><div class="cb flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>항목</th><th>상태</th><th>확인일</th><th>유효기간</th><th style="width:230px"></th></tr></thead><tbody>${types.map((d) => { const s = q.docState(t, d.key); const x = (t.docs || {})[d.key] || {}; return h`<tr><td><div class="bold">${d.label} ${d.sensitive ? ui.badge('민감', 'purple') : ''}</div><div class="xs muted">${d.hint}</div></td><td>${ui.badge(s.label, s.tone)}</td><td class="small">${x.d ? ICME.dateFull(x.d) : '-'}</td><td class="small">${x.exp ? ICME.dateFull(x.exp) + ' (' + ICME.dday(x.exp) + ')' : d.expires ? '-' : '해당 없음'}</td><td class="right">${s.state === 'submitted' ? h`<button class="btn xs primary" data-act="doc.confirm" data-tid="${t.id}" data-key="${d.key}">확인 처리</button>` : s.state === 'missing' ? h`<button class="btn xs" data-act="doc.remind" data-tid="${t.id}" data-key="${d.key}">${icon('send', 12)}알림톡 재요청</button>` : s.state === 'expiring' || s.state === 'expired' ? h`<button class="btn xs" data-act="doc.remind" data-tid="${t.id}" data-key="${d.key}">${icon('send', 12)}갱신 요청</button>` : h`<span class="faint small">완료</span>`}</td></tr>`; })}</tbody></table></div></div></div>`;
  }
  ICME.actions['doc.confirm'] = (el) => { const d = ICME.training.docTypes.find((x) => x.key === el.dataset.key); ICME.store.mutate((db0) => { const t = db0.teachers.find((x) => x.id === el.dataset.tid); t.docs[el.dataset.key] = { s: 'ok', d: ICME.ymd(ICME.today()), exp: d.expires ? ICME.ymd(ICME.addDays(ICME.today(), 365)) : undefined }; t.timeline = (t.timeline || []); t.timeline.unshift({ d: ICME.ymd(ICME.today()), text: d.label + ' 확인 처리' }); }); ui.toast(d.label + ' 확인 완료'); ICME.rerender(); };
  ICME.actions['doc.remind'] = (el) => { const d = ICME.training.docTypes.find((x) => x.key === el.dataset.key); ui.toast(d.label + ' — 알림톡을 보냈어요 (데모). 이후 3일마다 자동 재안내됩니다'); };

  function perf(t) {
    const m = t.metrics;
    if (!m) return h`${ui.alert('info', 'info', '신규 교사는 첫 수업 후 30일부터 지표가 쌓여요. 그동안은 온보딩 체크리스트만 확인하면 됩니다.')}`;
    const coach = [];
    if (m.log < 0.7) coach.push(['수업 일지 부담 줄이기', '체크형 일지(1분)를 다시 안내하고, 리마인드를 수업 직후 15분으로 바꿔 보세요.']);
    if (m.video < 0.5) coach.push(['촬영 스테이션 재안내', '한 번에 한 명씩 30초만 찍는 흐름을 함께 연습해 보세요. 촬영 시간을 활동 시간 안에 넣으면 부담이 줄어요.']);
    if (m.sat >= 4.7) coach.push(['좋은 사례 공유', '학부모 만족도가 높아요. 수업 운영 팁을 다른 교사와 나눌 수 있게 제안해 보세요.']);
    if (!coach.length) coach.push(['현재 흐름 유지', '지표가 안정적이에요. 별도 코칭 없이 격려만 해 주세요.']);
    const metric = (lbl, val, sub, tone) => h`<div class="card stat"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub || ''}</div>${tone != null ? ui.bar(tone * 100, ui.tonePct(tone)) : ''}</div>`;
    return h`<div class="alert warn mb16">${icon('alert-circle', 18)}<div class="small"><b>참고 지표입니다.</b> 교사 한 명의 지표는 반 구성·아이 특성에 크게 영향을 받아요. 평가나 보상에 단독으로 쓰지 말고 <b>코칭 대화의 출발점</b>으로 활용하세요. 교사는 자기 지표를 볼 수 있습니다.</div></div>
    <div class="grid c4">${metric('수업 수행률', Math.round(m.lessons * 100) + '%', '지각 ' + m.late + ' · 결강 ' + m.absent, m.lessons)}${metric('일지 제출률', Math.round(m.log * 100) + '%', '최근 30일', m.log)}${metric('촬영 완료율', Math.round(m.video * 100) + '%', '전후 영상', m.video)}${h`<div class="card stat"><div class="lbl">학부모 만족도</div><div class="val">${m.sat.toFixed(1)}<small>/ 5</small></div><div class="sub">6개월 추이</div>${ICME.charts.spark(m.satTrend, { w: 120, h: 30, min: 4, max: 5 })}</div>`}</div>
    <div class="grid c2 mt16">${ui.card({ title: '코칭 제안 (자동)', body: h`<div class="col g12">${coach.map((c) => h`<div class="row g12 top"><span class="ic-circle" style="background:var(--teal-50)">${icon('lightbulb', 18)}</span><div><b>${c[0]}</b><div class="small muted">${c[1]}</div></div></div>`)}</div>` })}${ui.card({ title: '학부모 피드백 (요약)', sub: '익명', body: (t.feedback || []).length ? h`<div class="col g12">${t.feedback.map((f) => h`<div class="row g8 top">${icon('message', 16)}<span class="small">“${f}”</span></div>`)}</div>` : h`<div class="muted small">아직 받은 피드백이 없어요</div>` })}</div>`;
  }

  function notes(t) {
    return h`<div class="grid c-3-2">${ui.card({ title: '1:1 면담 기록', sub: '점주만 볼 수 있어요', body: (t.notes || []).length ? h`<div class="col g12">${t.notes.map((n) => h`<div class="card flat pad"><div class="row g8 small muted">${icon('calendar', 14)}${ICME.dateFull(n.d)} · ${n.by}</div><div class="mt4">${n.text}</div></div>`)}</div>` : h`<div class="muted small">아직 기록이 없어요</div>` })}
    ${ui.card({ title: '기록 추가', body: h`<form data-submit="note.add" data-tid="${t.id}"><div class="field"><textarea class="textarea" name="text" placeholder="면담 내용, 합의한 사항을 짧게 남겨요" style="min-height:120px"></textarea></div><button class="btn primary block" type="submit">${icon('plus', 16)}기록 저장</button><div class="xs muted mt8">교사에게는 공개되지 않으며, 퇴사 후 1년 뒤 자동 삭제돼요(예시).</div></form>` })}</div>`;
  }
  ICME.actions['note.add'] = (form) => { const f = ui.formData(form); if (!f.text || !f.text.trim()) { ui.toast('내용을 입력해 주세요', 'warn'); return; } ICME.store.mutate((d) => { const t = d.teachers.find((x) => x.id === form.dataset.tid); t.notes = t.notes || []; t.notes.unshift({ d: ICME.ymd(ICME.today()), by: '김서윤', text: f.text.trim() }); }); ui.toast('면담 기록을 저장했어요'); ICME.rerender(); };

  /* ---------- 메시지 · 상태 변경 · 대체 요청 ---------- */
  ICME.actions['tch.msg'] = (el) => { const t = q.teacher(el.dataset.id); ui.modal({ title: t.name + ' 선생님께 메시지', body: h`<div class="field"><label>알림톡 · 앱 알림으로 전달돼요</label><textarea class="textarea" id="msg-body" placeholder="예) 이번 주 목요일 수업 시간이 30분 앞당겨졌어요."></textarea></div>`, foot: h`<button class="btn" data-act="ui.close">취소</button><button class="btn primary" data-act="tch.msgSend">보내기</button>` }); };
  ICME.actions['tch.msgSend'] = () => { ui.close(); ui.toast('메시지를 보냈어요 (데모)'); };
  ICME.actions['tch.status'] = (el) => { const t = q.teacher(el.dataset.id); ui.modal({ title: t.name + ' · 상태 변경', body: h`<form id="st-form"><div class="col g8">${['재직', '휴직', '퇴사'].map((s) => h`<label class="sel-card ${t.status === s ? 'on' : ''}"><input type="radio" name="status" value="${s}" ${t.status === s ? raw('checked') : ''} style="accent-color:var(--teal-500)"><div><div class="bold">${s}</div><div class="small muted">${s === '재직' ? '정상 근무' : s === '휴직' ? '담당 반은 대체 배정이 필요해요. 시스템 접근은 일시 정지돼요.' : '모든 접근이 즉시 차단되고, 담당 반은 미배정으로 바뀌어요.'}</div></div></label>`)}</div></form>`, foot: h`<button class="btn" data-act="ui.close">취소</button><button class="btn primary" data-act="tch.statusSave" data-id="${t.id}">저장</button>` }); };
  ICME.actions['tch.statusSave'] = (el) => { const f = ui.formData(ICME.$('#st-form')); const id = el.dataset.id; ICME.store.mutate((d) => { const t = d.teachers.find((x) => x.id === id); const prev = t.status; t.status = f.status; if (f.status === '퇴사') d.classes.forEach((k) => { if (k.teacherId === id) k.teacherId = null; }); if (f.status === '휴직') t.leave = { from: ICME.ymd(ICME.today()), to: ICME.ymd(ICME.addDays(ICME.today(), 90)), reason: '개인 사유' }; t.timeline = t.timeline || []; t.timeline.unshift({ d: ICME.ymd(ICME.today()), text: '상태 변경: ' + prev + ' → ' + f.status }); }); ui.close(); ui.toast('상태를 ' + ICME.josa(f.status, '으로/로') + ' 바꿨어요'); ICME.rerender(); };
  ICME.actions['tch.swap'] = (el) => {
    const t = q.teacher(el.dataset.id); const cls = q.classesOfTeacher(t.id);
    if (!cls.length) { ui.toast('배정된 수업이 없어요', 'warn'); return; }
    ui.modal({ title: '대체 교사 요청', body: h`<form id="swap-form"><div class="field"><label>수업 선택</label><select class="select" name="cid">${cls.map((k) => h`<option value="${k.id}">${ICME.DOW[k.day]} ${k.start} · ${k.name} (${ICME.programs.byKey[k.program].short})</option>`)}</select></div><div class="field"><label>날짜</label><input class="input" type="date" name="date" value="${ICME.ymd(ICME.addDays(ICME.today(), 7))}"></div><div class="alert tint">${icon('zap', 16)}<div class="small">해당 프로그램 인증이 있고 그 시간에 비어 있는 교사에게만 자동으로 전달돼요. 먼저 수락한 교사가 배정됩니다.</div></div></form>`, foot: h`<button class="btn" data-act="ui.close">취소</button><button class="btn primary" data-act="tch.swapGo" data-id="${t.id}">${icon('send', 15)}요청 보내기</button>` });
  };
  ICME.actions['tch.swapGo'] = (el) => { const f = ui.formData(ICME.$('#swap-form')); ICME.store.mutate((d) => d.swaps.push({ id: ICME.uid('sw'), classId: f.cid, date: f.date, reason: '점주 요청', status: '대체 교사 모집 중', applicants: [] })); ui.close(); ui.toast('대체 요청을 보냈어요. 수락되면 알려 드릴게요'); R.go('/center/schedule'); };
})();

</script>
<script>/* js/views/parent.js */
/* parent.js — 학부모 앱(모바일) + 아이 모드: 홈 · 아이 모드 · 성장 리포트 · 전후 영상 · 가정활동 · 동의 설정 */
(function () {
  'use strict';
  const ICME = window.ICME; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const S = ICME.shared; const R = ICME.router; const A = ICME.art;
  const db = () => ICME.store.db;
  /* 아직 점수가 없는 아이(방금 등록한 아이 등)가 골라져 있으면 서윤으로 돌아가요 — 점수가 없으면 이 화면들이 그릴 게 없어요 */
  const kidNow = () => { const s = q.student(ICME.store.ui.childId); return s && ICME.scoring.profile(s).areas.some((a) => a.combined != null) ? s : q.student('s1'); };
  const weekNo = () => Math.min(4, Math.ceil(ICME.today().getDate() / 7));
  const guard = (s) => (s ? s.name : '아이');
  /* 영역 순위는 "아이 + 부모 종합 점수"로 정합니다 (부모 설문이 없으면 아이 점수 = 임시) */
  const myVols = (s) => ICME.scoring.profile(s).areas.filter((a) => a.combined != null).sort((x, y) => x.combined - y.combined).map((a) => ({ area: a.area, score: a.combined, vol: ICME.materials.volumes[a.i], prev: a.prev, res: a }));
  const actKey = (s, vol, w) => s.id + ':' + vol.id + ':' + w;
  ICME.vs.kid = { i: -1, ans: {}, lock: false, helped: false };
  { const km = /[?&]kid=([0-9]+)/.exec(location.search); if (km) { ICME.vs.kid.i = Math.min(Number(km[1]), 5); ICME.vs.kid.ans = { 0: 0, 1: 4, 2: 0, 3: 4 }; } } /* 캡처용: ?kid=N 이면 N번째 문항 화면에서 시작 */

  const childSwitch = (s) => h`<div class="child-switch">${[q.student('s1'), q.student('s2')].map((c) => h`<button class="${c.id === s.id ? 'on' : ''}" data-act="demo.childBtn" data-id="${c.id}">${raw('<span style="width:30px;height:30px;border-radius:50%;overflow:hidden;display:inline-block;background:var(--teal-50)"><svg viewBox="14 -6 72 84" width="30" height="30">' + A.kidInner(S.charFor(c), 'happy', 'stand') + '</svg></span>')}${c.name} · ${c.age}세</button>`)}</div>`;
  ICME.actions['demo.childBtn'] = (el) => { ICME.store.ui.childId = el.dataset.id; ICME.store.save(); ICME.rerender(); };

  /* =========================================================== 홈 */
  R.add('/parent/home', {
    portal: 'parent', title: '홈',
    render() {
      const s = kidNow(); const cls = q.klass(s.classIds[0]); const mv = myVols(s)[0]; const w = weekNo(); const ak = actKey(s, mv.vol, w); const act = (db().parent.activity || {})[ak] || {};
      const pair = db().videos.find((p) => p.studentId === s.id && p.after);
      const ks = s.kisel; const pdone = !!(s.survey.parent && s.survey.parent.done);
      return h`<div class="m-pad">${childSwitch(s)}<div class="m-hello"><div class="d">${ICME.dateKo(ICME.today())}</div><h1>${s.name} 어머니, 안녕하세요</h1></div>
        <div class="m-card heart"><div class="row g8 mb8"><span class="badge b-purple">10월 마음 점검</span>${ks.st === 'done' && pdone ? ui.badge('모두 완료', 'green', 'check') : ui.badge((ks.st === 'done' ? 1 : 0) + (pdone ? 1 : 0) + '/2 완료', 'orange')}</div>
          <div class="bold" style="font-size:17px;line-height:1.4">${s.name}의 마음, 아이와 부모님이 함께 알려 주세요</div><div class="small muted mt4">아이의 응답에 집에서의 모습이 더해지면 점수가 더 정확해져요.</div>
          <div class="task-list mt12"><div class="task"><span class="m-check ${ks.st === 'done' ? 'on' : ''}">${ks.st === 'done' ? icon('check', 14) : ''}</span><div class="grow"><b class="small">① 아이와 함께 마음 이야기</b><div class="xs muted">${ks.st === 'done' ? '응답 완료' : ks.st === 'progress' ? ks.answered + '/20 진행 중 · 이어서 할 수 있어요' : '그림 카드로 5~8분 · 정답 없음'}</div></div><a class="m-btn sm ${ks.st === 'done' ? 'line' : 'heart'}" style="width:auto" href="#/parent/kisel/${s.id}">${ks.st === 'done' ? '다시(데모)' : ks.st === 'progress' ? '이어서' : '시작'}</a></div>
            <div class="task"><span class="m-check ${pdone ? 'on' : ''}">${pdone ? icon('check', 14) : ''}</span><div class="grow"><b class="small">② 부모 설문 (3분)</b><div class="xs muted">${pdone ? '제출 완료 · ' + ICME.dateShort(s.survey.parent.date) : '20문항 · 집에서의 모습을 알려 주세요'}</div></div><a class="m-btn sm ${pdone ? 'line' : 'heart'}" style="width:auto" href="#/parent/survey">${pdone ? '다시' : '하기'}</a></div></div></div>
        ${ks.st === 'done' ? h`<a class="m-card" href="#/parent/report"><div class="row g12"><span class="ic-circle" style="background:var(--teal-50)">${icon('bar-chart', 20)}</span><div class="grow"><div class="bold">새 리포트가 도착했어요</div><div class="small muted">${s.name}의 10월 마음 성장 리포트</div></div>${icon('chevron-right', 18)}</div></a>` : ''}

        ${p.after ? h`${ev.comment ? h`<div class="m-card tint"><div class="row g12 top">${ui.avatar('이하린', 'sm')}<div><div class="small bold">선생님 코멘트</div><div class="small mt4">“${ev.comment}”</div></div></div><div class="chips mt12">${(ev.chips || []).map((c) => h`<span class="badge b-teal">${c}</span>`)}</div></div>` : ''}${p.rubric ? h`<div class="m-card"><div class="bold mb8">이렇게 달라졌어요</div>${S.rubricCompare(p)}</div>` : ''}` : h`<div class="m-card warm small">${icon('clock', 16)} After 영상은 단원이 끝나는 ${ICME.dateKo(ICME.addDays(ICME.today(), 24))} 즈음 촬영해요. 같은 대본으로 찍어야 변화를 정확히 볼 수 있어요.</div>`}
        <div class="m-card"><div class="bold mb8">촬영 대본</div><div class="script">${v.video.lines.map((l, i) => h`<div class="ln"><span class="who">${i + 1}</span><div><div class="en">${l.en}</div><div class="ko">${l.ko}</div></div></div>`)}</div></div>
        <div class="alert tint small">${icon('lock', 16)}<div>이 영상은 플랫폼 안에서 우리 가족에게만 공유돼요. 보관 기간(예시 1년)이 지나면 자동 삭제돼요.</div></div>
        <button class="m-btn line" data-act="vid.del">${icon('trash', 16)}이 영상 삭제 요청</button></div>`;
    }
  });
  ICME.actions['vid.del'] = () => ui.confirm({ title: '영상 삭제를 요청할까요?', text: '요청하면 센터 점주에게 전달되고, 확인 후 영구 삭제돼요. 전후 비교는 더 이상 볼 수 없어요.', ok: '삭제 요청', danger: true, onOk: () => ui.toast('삭제 요청을 접수했어요. 처리되면 알려 드릴게요') });

  /* =========================================================== 가정 활동 */
  R.add('/parent/activity', {
    portal: 'parent', title: '가정활동',
    render() {
      const s = kidNow(); const vs = myVols(s); const mv = vs[0].vol; const w = Math.min(4, Number((R.parse().query || {}).w) || weekNo());
      const key = actKey(s, mv, w); const act = (db().parent.activity || {})[key] || {}; const done = ['play', 'read', 'speak'].filter((k) => act[k]).length;
      const wk = mv.home[w - 1];
      return h`<div class="m-pad">${childSwitch(s)}<div class="m-hello"><h1>가정 활동</h1><div class="d">하루 5분, 아이와 함께</div></div>
        <div class="m-card heart"><div class="row g12">${raw('<div style="width:84px;flex:none;border-radius:14px;overflow:hidden;aspect-ratio:4/3">' + A.cover(mv) + '</div>')}<div class="grow"><div class="bold">${mv.title}</div><div class="small muted">${mv.titleKo} · ${mv.bigIdeaKo}</div></div></div></div>
        <div class="m-tabs">${[1, 2, 3, 4].map((n) => h`<a class="${n === w ? 'on' : ''}" href="#/parent/activity?w=${n}">${n}주차</a>`)}</div>
        <div class="m-card"><div class="row between mb8"><b>${w}주차 활동</b><span class="stars-row">${[1, 2, 3].map((n) => icon('star', 18, n <= done ? '' : 'off'))}</span></div>${[['play', 'Play · 놀이', wk.play, 'sparkles'], ['read', 'Read · 읽기', wk.read, 'book'], ['speak', 'Speak · 말하기', wk.speak, 'mic']].map((r) => h`<div class="row g12" style="padding:10px 0;border-bottom:1px solid var(--ink-100)" data-act="act.toggle" data-key="${key}" data-k="${r[0]}"><span class="m-check ${act[r[0]] ? 'on' : ''}">${act[r[0]] ? icon('check', 14) : ''}</span><div class="grow"><div class="bold small">${r[1]}</div><div class="small ${act[r[0]] ? 'muted' : ''}">${r[2]}</div></div>${icon(r[3], 18)}</div>`)}${done === 3 ? h`<div class="alert ok mt12 small">${icon('check-circle', 16)}<div><b>이번 주 활동을 다 했어요!</b> 아이를 꼭 안아 주세요.</div></div>` : ''}</div>
        <div class="m-sec"><h2>스토리북 읽기</h2></div>${S.storyViewer(mv)}
        <div class="m-sec"><h2>이번 달 단어 8개</h2></div><div class="word-grid" style="grid-template-columns:repeat(2,1fr)">${mv.words.map(S.word)}</div></div>`;
    }
  });

  /* =========================================================== 동의 · 설정 */
  R.add('/parent/consent', {
    portal: 'parent', title: '설정',
    render() {
      const s = kidNow(); const c = s.consent; const rec = c.video !== 'none'; const share = c.video === 'share' || c.video === 'promo'; const promo = c.video === 'promo';
      const row = (name, on, t, d, dis) => h`<div class="row g12" style="padding:12px 0;border-bottom:1px solid var(--ink-100)"><div class="grow"><div class="bold small">${t}</div><div class="xs muted">${d}</div></div><label class="toggle"><input type="checkbox" ${on ? raw('checked') : ''} ${dis ? raw('disabled') : ''} data-change="con.set" data-name="${name}"><i></i></label></div>`;
      return h`<div class="m-pad">${childSwitch(s)}<div class="m-hello"><h1>동의 · 설정</h1><div class="d">언제든지 바꾸거나 철회할 수 있어요</div></div>
        <div class="m-card"><div class="bold">영상 동의 <span class="xs muted semi">· 3단계로 나눠서 받아요</span></div>${row('rec', rec, '1. 수업 기록용 촬영', '전후 비교를 위해 센터에서 촬영해요. 센터 기기로만 촬영합니다.')}${row('share', share, '2. 우리 가족에게 공유', '촬영한 영상을 앱에서 볼 수 있어요. 개인 메신저로는 보내지 않아요.', !rec)}${row('promo', promo, '3. 홍보에 사용', '센터·본사 홍보물에 사용해도 좋아요. 기본은 꺼짐이에요.', !share)}</div>
        <div class="m-card"><div class="bold">맞춤 추천 안내 <span class="xs muted semi">· 선택</span></div>${row('reco', c.reco, 'K-ISEL 결과로 키트 추천 받기', '리포트 안에서만 보여드려요. 알림톡으로는 보내지 않아요.')}</div>
        <div class="m-card"><div class="bold mb8">내 정보 관리</div><div class="col g8"><button class="m-btn line sm" style="width:100%" data-act="con.req" data-t="열람">${icon('eye', 16)}개인정보 열람 요청</button><button class="m-btn line sm" style="width:100%" data-act="con.req" data-t="영상 삭제">${icon('trash', 16)}영상 모두 삭제 요청</button><button class="m-btn line sm" style="width:100%" data-act="con.req" data-t="동의 철회">${icon('x', 16)}전체 동의 철회</button></div></div>
        <div class="alert tint small">${icon('shield-check', 16)}<div>만 14세 미만 아이의 정보는 <b>보호자(법정대리인)의 동의</b>를 받아 처리해요. 본사가 통계·문항 개선에 데이터를 쓰는 경우는 동의서에 따로 안내돼요.</div></div></div>`;
    }
  });
  ICME.actions['con.set'] = (el) => {
    const s = kidNow(); const n = el.dataset.name; const on = el.checked;
    ICME.store.mutate((d) => { const x = d.students.find((y) => y.id === s.id); const c = x.consent; if (n === 'reco') c.reco = on; else { let rec = c.video !== 'none', share = c.video === 'share' || c.video === 'promo', promo = c.video === 'promo'; if (n === 'rec') { rec = on; if (!on) { share = false; promo = false; } } if (n === 'share') { share = on; if (!on) promo = false; } if (n === 'promo') promo = on; c.video = !rec ? 'none' : promo ? 'promo' : share ? 'share' : 'record'; } });
    ui.toast('설정을 저장했어요'); ICME.rerender();
  };
  ICME.actions['con.req'] = (el) => ui.toast(el.dataset.t + ' 요청을 접수했어요. 영업일 기준 며칠 내 처리돼요');
})();

</script>
<script>/* js/views/insight.js */
/* insight.js — 근거 있는 점수 · 아이별 지도 가이드 · 발음 전후 비교 (화면 부품과 본사 분석 화면) */
(function () {
  'use strict';
  const ICME = window.ICME; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const S = ICME.shared; const R = ICME.router; const SC = ICME.scoring;
  const db = () => ICME.store.db;
  const I = (ICME.insight = {});
  const f1 = (n) => (n == null ? '-' : Number(n).toFixed(1));
  const sign = (n) => (n > 0 ? '+' + n : String(n));

  /* =========================================================== 점수 부품 */
  I.confBadge = (conf) => h`<span class="badge b-${conf.tone === 'green' ? 'green' : conf.tone === 'amber' ? 'amber' : 'red'}">${icon('shield-check', 13)}점수 신뢰도 ${conf.level}</span>`;
  I.gapNote = (a) => (a.gapFlag === 'parentHigh' ? h`<span class="badge b-amber sm">집에서는 더 잘해요</span>` : a.gapFlag === 'childHigh' ? h`<span class="badge b-amber sm">아이가 더 높게 답했어요</span>` : '');
  I.changeBadge = (a) => (a.change === 'up' ? h`<span class="badge b-green sm">▲ ${sign(a.delta)}</span>` : a.change === 'down' ? h`<span class="badge b-red sm">▼ ${a.delta}</span>` : a.change === 'same' ? h`<span class="badge b-gray sm">비슷해요</span>` : '');

  /* 영역별 아이·부모·종합 막대 (주황=아이, 청록=부모, 보라 윤곽=종합) */
  I.areaBars = (prof, opt) => {
    opt = opt || {};
    return h`<div class="col g12">${prof.areas.map((a) => h`<div class="ev-row" data-act="ev.show" data-sid="${opt.sid}" data-i="${a.i}" role="button" tabindex="0">
      <div class="row g8 ev-head"><span class="step-no" style="background:${ICME.materials.volumes[a.i].color}">${a.area.no}</span><b class="small grow">${a.area.short}</b>${a.level ? S.level(a.combined) : ''}${I.changeBadge(a)}${I.gapNote(a)}</div>
      <div class="ev-bars">
        <div class="ev-b"><i class="c" style="width:${a.child ? a.child.score * 20 : 0}%"></i><span>아이 ${f1(a.child && a.child.score)}</span></div>
        <div class="ev-b"><i class="p" style="width:${a.parent ? a.parent.score * 20 : 0}%"></i><span>${a.parent ? '부모 ' + f1(a.parent.score) : '부모 설문 대기'}</span></div>
        <div class="ev-b tot"><i class="t" style="width:${a.combined ? a.combined * 20 : 0}%"></i><span>종합 ${f1(a.combined)}${a.provisional ? ' (임시)' : ''}</span></div>
      </div></div>`)}</div><div class="legend mt8"><span><i style="background:#ff8a5b"></i>아이 응답</span><span><i style="background:#2fb5ad"></i>부모 설문</span><span><i style="background:#7a5af8"></i>종합 점수</span></div>`;
  };

  /* "왜 이 점수?" 근거 팝업 */
  I.evidence = function (s, i) {
    const a = SC.area(s, i); const items = ICME.kisel.items.filter((x) => x.stage === a.area.no).slice(0, 4); const pitems = ICME.survey.parentItems[i].items; const CA = ICME.survey.childAnswer; const PS = ICME.survey.parentScale;
    const chip = (v, txt) => h`<span class="badge ${v >= 4 ? 'b-green' : v >= 3 ? 'b-teal' : v >= 2 ? 'b-amber' : 'b-red'} sm">${txt}</span>`;
    return h`<div class="col g16">
      <div class="alert tint">${icon('bar-chart', 18)}<div><b>${I.formulaText(a)}</b><div class="small muted mt4">${a.provisional ? '부모 설문이 더해지면 점수가 다시 계산돼요.' : '나이(' + s.age + '세)에 따라 아이·부모 비중을 정했어요. 어릴수록 부모 관찰을 더 반영해요.'}</div></div></div>
      <div><div class="bold small mb8">아이 응답 <span class="muted semi">· ${a.child ? a.child.n + '문항 중 대표 ' + items.length + '문항' : '없음'}</span></div>
        ${a.child ? h`<div class="col g8">${items.map((it, k) => h`<div class="row g8 top"><span class="xs muted" style="width:20px">${k + 1}</span><div class="grow small">${it.text}</div>${chip(a.child.items[k], CA[a.child.items[k]])}</div>`)}<div class="xs muted">나머지 ${a.child.n - items.length}문항 평균 ${f1(SC.c5(ICME.avg(a.child.items.slice(items.length))))}점 (1~5점 환산)</div></div>` : h`<div class="small muted">아직 응답이 없어요</div>`}</div>
      <div><div class="bold small mb8">부모 설문 <span class="muted semi">· ${a.parent ? a.parent.n + '문항' : '대기'}</span></div>
        ${a.parent ? h`<div class="col g8">${pitems.slice(0, a.parent.items.length).map((t, k) => h`<div class="row g8 top"><span class="xs muted" style="width:20px">${k + 1}</span><div class="grow small">${t}</div>${chip(a.parent.items[k] - 1, PS[a.parent.items[k] - 1].t)}</div>`)}</div>` : h`<div class="small muted">부모 설문이 아직 없어요.</div>`}</div>
      ${a.gap != null ? h`<div class="alert ${a.gapFlag === 'none' ? 'ok' : 'warn'}">${icon(a.gapFlag === 'none' ? 'check-circle' : 'alert-circle', 18)}<div class="small"><b>아이와 부모의 차이 ${a.gap > 0 ? '+' : ''}${f1(a.gap)}</b> — ${a.gapFlag === 'none' ? '두 응답이 비슷해요. 점수를 믿고 참고해도 좋아요.' : a.gapFlag === 'parentHigh' ? '부모님이 아이보다 더 잘한다고 보셨어요. 집에서는 편안해서 잘 드러나고, 센터에서는 자신 없어 할 수 있어요.' : '아이가 부모님보다 높게 답했어요. 아이는 괜찮다고 느끼지만 집에서는 어려워 보일 수 있어요.'}</div></div>` : ''}
      ${a.prev != null ? h`<div class="small muted">지난 점검 ${f1(a.prev)} → 이번 ${f1(a.combined)} (${a.change === 'up' ? '뚜렷하게 올랐어요' : a.change === 'down' ? '뚜렷하게 내려갔어요' : '비슷해요'}, 기준 ±${ICME.survey.params.reliableChange}점)</div>` : ''}
    </div>`;
  };
  I.formulaText = (a) => SC.formula(a);
  ICME.actions['ev.show'] = (el) => { const s = q.student(el.dataset.sid); const i = Number(el.dataset.i); const a = SC.area(s, i); ui.modal({ title: s.name + ' · ' + a.area.no + '. ' + a.area.name + ' — 점수의 근거', size: 'wide', body: I.evidence(s, i), foot: h`<button class="btn primary" data-act="ui.close">닫기</button>` }); };

  /* 점수 신뢰도 이유 */
  I.confReasons = (conf) => (conf.reasons.length ? h`<ul class="kv-list small">${conf.reasons.map((r) => h`<li>${icon(r.tone === 'info' ? 'info' : 'alert-circle', 14)}<span>${r.t}</span></li>`)}</ul>` : h`<div class="small muted row g8">${icon('check-circle', 16)}아이·부모 응답이 모두 있고 품질 주의 신호가 없어요.</div>`);

  /* =========================================================== 발음 전후 비교 */
  const TONE = { g: 'wd-g', y: 'wd-y', r: 'wd-r' };
  I.words = (take, label) => h`<div class="pron-take"><span class="pron-lab">${label}</span><div class="col g6">${take.words.map((ln) => h`<div class="wd-line">${ln.map((x) => h`<span class="wd ${TONE[SC.wordTone(x.s)]}" title="${x.w} ${x.s}점">${x.w}</span>`)}</div>`)}</div></div>`;
  I.wave = function (take, seed, tone) {
    const rnd = ICME.rng(ICME.hash(seed)); const n = 64; let bars = '';
    const flat = [].concat.apply([], take.words); const per = n / Math.max(1, flat.length);
    for (let k = 0; k < n; k++) {
      const wi = Math.min(flat.length - 1, Math.floor(k / per)); const sc = flat[wi].s; const amp = (0.25 + (sc / 100) * 0.55) * (0.55 + rnd() * 0.45);
      const hh = Math.max(3, amp * 44); const col = sc >= 80 ? '#1e9e5a' : sc >= 60 ? '#e8a100' : '#d93f45';
      bars += '<rect x="' + (k * 6 + 1) + '" y="' + (25 - hh / 2) + '" width="4" height="' + hh + '" rx="2" fill="' + col + '" opacity=".85"/>';
    }
    return raw('<svg viewBox="0 0 ' + n * 6 + ' 50" width="100%" height="50" preserveAspectRatio="none" aria-hidden="true">' + bars + '</svg>');
  };
  I.pronCompare = function (pair, opt) {
    opt = opt || {}; const p = SC.pron(pair); const D = p.delta;
    const dimRow = (d) => h`<div class="pron-dim"><span class="small semi">${d.label}</span><div class="pd-bars"><div class="pd-b"><i style="width:${d.b}%;background:#94a3a9"></i></div><div class="pd-b"><i style="width:${d.a}%;background:#19a9a4"></i></div></div><span class="pd-n"><span class="muted">${d.b}</span> → <b>${d.a}</b></span><span class="pd-d ${d.d > 0 ? 'up' : d.d < 0 ? 'down' : ''}">${d.d > 0 ? '+' : ''}${d.d}</span></div>`;
    return h`<div class="pron">
      <div class="pron-head"><div class="pron-ov"><div class="xs muted semi">Before</div><div class="big muted">${p.before.overall}</div></div><div class="pron-arrow">${icon('arrow-right', 22)}</div><div class="pron-ov"><div class="xs muted semi">After</div><div class="big">${p.after.overall}</div></div>
        <div class="pron-delta"><div class="d ${D > 0 ? 'up' : D < 0 ? 'down' : ''}">${D > 0 ? '+' : ''}${D}점</div><span class="badge b-${p.change.tone}">${p.change.label}</span></div></div>
      ${opt.compact ? '' : h`<div class="pron-dims">${p.dims.map(dimRow)}<div class="legend mt8"><span><i style="background:#94a3a9"></i>Before</span><span><i style="background:#19a9a4"></i>After</span></div></div>`}
      <div class="pron-words"><div class="bold small mb8">단어별로 보면 <span class="muted semi">· 색 = 좋아요(초록) · 조금만 더(노랑) · 연습해요(빨강)</span></div>${I.words(p.before, 'Before')}${I.words(p.after, 'After')}</div>
      ${opt.compact ? '' : h`<div class="pron-wave"><div class="pw"><span class="pron-lab">Before</span>${I.wave(p.before, pair.id + 'b')}</div><div class="pw"><span class="pron-lab">After</span>${I.wave(p.after, pair.id + 'a')}</div></div>
      <div class="pron-sounds"><div class="bold small mb8">이번 단원 목표 소리</div>${p.sounds.map((x) => h`<div class="pron-dim"><span class="small semi">${x.p} <span class="muted">${x.ex}</span></span><div class="pd-bars"><div class="pd-b"><i style="width:${x.b}%;background:#94a3a9"></i></div><div class="pd-b"><i style="width:${x.a}%;background:#7a5af8"></i></div></div><span class="pd-n"><span class="muted">${x.b}</span> → <b>${x.a}</b></span><span class="pd-d up">+${x.a - x.b}</span></div>`)}</div>`}
      <div class="alert info small mt12">${icon('info', 16)}<div><b>어떻게 계산해요?</b> 같은 대본을 수업 전후에 녹음해 소리 정확도·이어 말하기·끝까지 말하기·억양을 0~100점으로 계산해요(음성 분석 연동 예정, 지금은 시안 데이터). 아이 말소리는 어른보다 분석 오차가 커서 <b>같은 아이의 전후 변화</b>만 비교하고, 선생님 평가와 함께 보여드려요.</div></div>
    </div>`;
  };

  /* =========================================================== 아이 프로필 (교사·점주 공통) */
  I.kidHeader = function (s) {
    const cls = q.klass(s.classIds[0]); const prof = SC.profile(s); const vol = cls && cls.program === 'ART' ? q.volOf(q.themeFor(cls).vol) : null;
    return h`<div class="card pad"><div class="row g12 wrap">${ui.avatar(s.name, 'lg')}<div class="grow"><div class="row g8 wrap"><b style="font-size:19px">${s.fullName}</b><span class="badge b-gray">${s.age}세</span>${I.confBadge(prof.conf)}${prof.provisional ? ui.badge('임시 점수', 'amber') : ui.badge('점수 확정', 'green')}</div><div class="small muted mt4">${cls.name} · ${ICME.programs.byKey[cls.program].short}${vol ? ' · 이달의 주제 ' + vol.no + '권 ' + vol.titleKo : ''}</div></div>
      <div class="row g8 wrap">${s.consent.video === 'none' ? ui.badge('영상 동의 없음', 'gray', 'lock') : ui.badge({ share: '영상 공유 동의', record: '수업 기록만', promo: '홍보 포함' }[s.consent.video], 'teal', 'video')}${s.risk ? ui.badge('출석·열람 주의', 'red') : ''}</div></div></div>`;
  };
  I.kidProfile = function (s) {
    const prof = SC.profile(s);
    return h`<div class="grid c-1-2"><div class="col g16">${ui.card({ title: '5영역 프로필', sub: '종합 점수 · 점선은 지난 점검', body: h`<div class="radar-wrap">${S.radar(prof.combined.map((v) => v || 0), prof.prev, { size: 250 })}</div>` })}
      ${ui.card({ title: '점수 신뢰도', sub: prof.conf.score + '점 만점 100', body: h`${I.confReasons(prof.conf)}<div class="xs muted mt8">신뢰도가 낮으면 점수보다 수업 관찰을 더 믿어 주세요.</div>` })}</div>
      ${ui.card({ title: '영역별 점수와 근거', sub: '영역을 누르면 "왜 이 점수인지" 문항 단위로 볼 수 있어요', body: I.areaBars(prof, { sid: s.id }) })}</div>`;
  };

  /* 지도 가이드: 어떻게 가르치고 · 아이에게 어떻게 말하고 · 학부모에게 어떻게 알릴까 */
  I.kidGuide = function (s, ctxName) {
    const g = ICME.coaching.build(s, ctxName); const obs = db().obs.filter((o) => o.sid === s.id);
    const tipCard = (b, idx) => ui.card({ title: (idx === 0 ? '이번 달 중점 · ' : '함께 살펴볼 영역 · ') + b.area.no + '. ' + b.area.name, sub: b.level.name + ' · 관련 수업 ' + b.lessons, cls: idx ? '' : '',
      body: h`<div class="grid c2"><div><div class="bold small mb8">${icon('book-open', 15)} 이렇게 가르쳐요 <span class="muted semi">· ${b.vol.no}권 ${b.vol.titleKo}</span></div><ol class="guide-list">${b.tips.map((t) => h`<li>${t}</li>`)}</ol></div>
        <div><div class="bold small mb8">${icon('message', 15)} 아이에게 이렇게 말해요</div><div class="col g8">${b.child.map((c) => h`<div class="say"><div class="ko">${c[0]}</div><div class="en">${c[1]}</div><button class="icon-btn" data-act="say" data-t="${c[1]}" aria-label="영어 듣기" title="영어 듣기">${icon('volume', 15)}</button></div>`)}</div>
          <div class="bold small mt16 mb8" style="color:var(--bad)">${icon('x', 14)} 이런 말은 피해요</div><ul class="kv-list small">${b.avoid.map((t) => h`<li>${icon('x', 13)}<span>${t}</span></li>`)}</ul></div></div>
        <div class="bold small mt16 mb8">${icon('eye', 15)} 수업 중 이것만 기록해요 <span class="muted semi">· 눌러서 기록</span></div><div class="chips">${b.chips.map((c) => { const n = obs.filter((o) => o.chip === c).length; return h`<button class="chip ${n ? 'on' : ''}" data-act="obs.add" data-sid="${s.id}" data-chip="${c}">${c}${n ? h` <b>${n}</b>` : ''}</button>`; })}</div>` });
    return h`<div class="col g16">
      ${g.flags.length ? ui.card({ title: '데이터가 알려 주는 것', sub: '점수의 근거에서 나온 주의 신호', body: h`<div class="col g12">${g.flags.map((f) => h`<div class="alert ${f.tone}">${icon(f.tone === 'info' ? 'info' : 'alert-circle', 18)}<div><b>${f.title}</b><div class="small mt4">${f.text}</div></div></div>`)}</div>` }) : ''}
      ${g.blocks.map(tipCard)}
      ${ui.card({ title: '학부모께 이렇게 알려요', sub: '읽기만 하면 돼요 · 강점 먼저', actions: h`<button class="btn sm" data-act="copy.script" data-sid="${s.id}" data-t="${g.script.map((x) => x.t).join('\n')}">${icon('copy', 14)}문구 복사</button>`, body: h`<div class="col g12">${g.script.map((x, k) => h`<div class="row g12 top"><span class="step-no">${k + 1}</span><div><div class="xs muted semi">${x.k}</div><div>${x.t}</div></div></div>`)}</div>` })}
      ${g.signals.length ? h`<div class="alert warn">${icon('alert-triangle', 18)}<div><b>점주와 함께 살펴볼 신호</b><ul class="kv-list small mt4">${g.signals.map((x) => h`<li>${icon('chevron-right', 13)}<span>${x}</span></li>`)}</ul><div class="xs muted mt8">교사는 진단하지 않아요. 걱정되는 모습이 이어지면 점주와 상의하고, 전문기관 안내가 필요한지는 점주가 판단합니다.</div></div></div>` : ''}
    </div>`;
  };
  ICME.actions['say'] = (el) => S.speak(el.dataset.t, 'en-US');
  /* 복사: 브라우저가 막으면(포커스 없음·file://) 숨은 입력칸으로 한 번 더 시도하고, 그래도 안 되면 솔직히 알려요 */
  ICME.copyText = function (t) {
    const fallback = () => { try { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e) { return false; } };
    return navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).then(() => true, () => fallback()) : Promise.resolve(fallback());
  };
  ICME.actions['copy.script'] = (el) => ICME.copyText(el.dataset.t).then((ok) => (ok ? ui.toast('학부모 안내 문구를 복사했어요') : ui.toast('복사가 막힌 환경이에요. 문구를 직접 선택해 복사해 주세요', 'warn')));
  ICME.actions['obs.add'] = (el) => { ICME.store.mutate((d) => d.obs.push({ sid: el.dataset.sid, date: ICME.ymd(ICME.today()), chip: el.dataset.chip, by: ICME.store.ui.tid })); ui.toast('관찰을 기록했어요'); ICME.rerender(); };

  /* 발음 탭 */
  I.pairOf = (s) => { const real = db().videos.filter((p) => p.studentId === s.id); const done = real.filter((p) => p.after); if (done.length) return done[done.length - 1]; if (s.video && s.video.before && s.video.after && s.consent.video !== 'none') { const k = q.klass(s.classIds[0]); const v = q.volOf(q.themeFor(k).vol); return { id: 'vx_' + s.id, studentId: s.id, vol: v.id, title: v.title, before: { date: ICME.ymd(ICME.addDays(ICME.today(), -30)), sec: 28 }, after: { date: ICME.ymd(ICME.addDays(ICME.today(), -2)), sec: 31 } }; } return null; };
  I.kidPron = function (s) {

    if (s.consent.video === 'none') return ui.alert('tint', 'lock', '영상 동의가 없는 아이라서 촬영과 발음 분석을 하지 않아요.');
    if (!pair) return h`${ui.alert('info', 'clock', h`아직 전후 녹음이 모두 모이지 않았어요. ${s.video && s.video.before ? 'Before는 끝났고, After는 단원이 끝나는 주에 촬영해요.' : '단원 첫 주에 Before를 촬영해 주세요.'}`)}`;
    const v = q.volOf(pair.vol);
    return h`<div class="grid c-1-2"><div class="col g16">${ui.card({ title: '비교한 영상', body: h`<div class="row g8 mb8">${S.volBadge(v)}</div>${S.videoCompare(pair, { wide: false })}` })}</div><div>${ui.card({ title: '발음이 얼마나 좋아졌을까요?', sub: v.title, body: I.pronCompare(pair) })}</div></div>`;
  };

  /* 기록 탭 */
  I.kidLog = function (s, role) {
    const obs = db().obs.filter((o) => o.sid === s.id).slice().reverse();
    const acc = (db().access || []).filter((x) => x.sid === s.id).slice().reverse();
    const who = (x) => (x.by === 'owner' ? '점주(원장)' : ((q.teacher(x.by) || {}).name || '교사') + ' 선생님');
    return h`<div class="col g16">${ui.card({ title: '수업 관찰 기록', sub: obs.length + '건', body: obs.length ? h`<div class="timeline">${obs.map((o) => h`<div class="tl-it"><span class="tl-d">${ICME.dateShort(o.date)}</span><span class="tl-dot"></span><span>${o.chip}</span></div>`)}</div>` : h`<div class="muted small">아직 기록이 없어요. "지도 가이드" 탭의 칩을 누르면 기록돼요.</div>` })}
      ${role === 'center' ? ui.card({ title: '열람 기록', sub: '이 아이의 데이터를 연 사람 · 하루 한 번', body: acc.length ? h`<div class="timeline">${acc.slice(0, 12).map((x) => h`<div class="tl-it"><span class="tl-d">${ICME.dateShort(x.date)}</span><span class="tl-dot"></span><span>${who(x)}</span></div>`)}</div>` : h`<div class="muted small">아직 열람 기록이 없어요.</div>` }) : ui.alert('info', 'lock', '이 화면을 열면 열람 기록이 남고, 점주가 확인할 수 있어요. 담당 반 아이만 볼 수 있어요.')}</div>`;
  };
  /* 열람 기록: 담당 교사·점주가 아이 데이터를 열면 사람·아이·날짜당 한 번 남겨요 */
  I.logView = function (sid, role) {
    const by = role === 'teacher' ? ICME.store.ui.tid : 'owner'; const date = ICME.ymd(ICME.today()); const L = db().access;
    if (!L || !by || !q.student(sid) || L.some((x) => x.sid === sid && x.by === by && x.date === date)) return;
    ICME.store.mutate((d) => d.access.push({ sid, by, role, date }));
  };

  /* =========================================================== 아이 상세 페이지 본문(탭 포함) — 교사 앱·점주 콘솔 공용 */
  I.TABS = [{ key: 'profile', label: '프로필 · 근거', icon: 'bar-chart' }, { key: 'guide', label: '지도 가이드', icon: 'lightbulb' }, { key: 'pron', label: '발음 전후', icon: 'mic' }, { key: 'log', label: '기록', icon: 'clipboard-check' }];
  I.kidBody = function (s, tab, name, role) { return tab === 'guide' ? I.kidGuide(s, name) : tab === 'pron' ? I.kidPron(s) : tab === 'log' ? I.kidLog(s, role) : I.kidProfile(s); };

  /* =========================================================== 본사: 점수 산출 방법 / 효과 분석 */
  I.methodPage = function () {
    const P = ICME.survey.params; const PI = ICME.survey.parentItems;
    return h`<div class="col g16">
      ${ui.card({ title: '점수는 이렇게 만들어져요', sub: '모든 점수는 문항별 응답까지 거슬러 올라가 확인할 수 있어요', body: h`<div class="flow-diagram">${[['1', '아이 응답', '그림 카드 · 영역별 20문항'], ['2', '부모 설문', '관찰 4문항 × 5영역 · 3분'], ['3', '영역 점수', '각각 1~5점으로 환산'], ['4', '종합 점수', '나이별 가중 평균'], ['5', '근거·신뢰도', '차이 · 품질 · 변화 표시']].map((x, i) => h`<div class="fd"><span class="step-no">${x[0]}</span><b>${x[1]}</b><span class="xs muted">${x[2]}</span></div>${i < 4 ? h`<span class="fd-ar">${icon('arrow-right', 18)}</span>` : ''}`)}</div>` })}
      <div class="grid c2">
        ${ui.card({ title: '아이 · 부모 가중치 (나이별)', sub: '시안 · 전문가 검증 필요', flush: true, body: h`<table class="tbl"><thead><tr><th>나이</th><th>아이 응답</th><th>부모 설문</th><th>이유</th></tr></thead><tbody><tr><td>5세 이하</td><td>${P.weights[0].c * 100}%</td><td>${P.weights[0].p * 100}%</td><td class="small muted">자기보고가 아직 불안정해 관찰을 더 반영</td></tr><tr><td>6세</td><td>${P.weights[1].c * 100}%</td><td>${P.weights[1].p * 100}%</td><td class="small muted">균형</td></tr><tr><td>7세 이상</td><td>${P.weights[2].c * 100}%</td><td>${P.weights[2].p * 100}%</td><td class="small muted">자기 인식이 늘어 아이 응답 비중↑</td></tr></tbody></table>` })}
        ${ui.card({ title: '근거 표시 규칙', body: h`<ul class="kv-list small"><li>${icon('check', 14)}<span><b>차이 표시</b> — 아이와 부모 점수 차이가 ${P.gapFlag}점 이상이면 "집과 센터의 모습이 다를 수 있어요"로 표시하고, ${P.gapBig}점 이상이면 학부모 상담을 권해요.</span></li><li>${icon('check', 14)}<span><b>뚜렷한 변화</b> — 지난 점검과 ${P.reliableChange}점 이상 달라야 ▲▼로 표시해요(측정 오차 고려).</span></li><li>${icon('check', 14)}<span><b>임시 점수</b> — 부모 설문이 없으면 아이 점수만으로 계산하고 "임시"를 붙여요.</span></li><li>${icon('check', 14)}<span><b>신뢰도</b> — 부모 설문 없음, 어른이 도와줌, ${P.quickMinutes}분 미만 응답, 같은 답 반복, 이전 점검 기준이면 신뢰도를 낮춰요. 100점에서 시작해 감점하고, ${P.confidence.high}점 이상은 "높음", ${P.confidence.mid}점 이상은 "보통"이에요.</span></li></ul>` })}
      </div>
      ${ui.card({ title: '부모 설문 문항 (샘플 20문항)', sub: '관찰형 · 5점 빈도(전혀 · 드물게 · 가끔 · 자주 · 항상) · 원문 아님', flush: true, body: h`<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:190px">영역</th><th>문항</th></tr></thead><tbody>${PI.map((a) => h`<tr><td><b>${a.area}. ${ICME.kisel.areas[a.area - 1].name}</b><div class="xs muted">${ICME.kisel.areas[a.area - 1].sub}</div></td><td><ol class="guide-list small">${a.items.map((t) => h`<li>${t}</li>`)}</ol></td></tr>`)}</tbody></table></div>` })}
      ${ui.card({ title: '발음 점수 (0~100)', sub: '같은 대본을 수업 전·후에 녹음해 비교', body: h`<div class="grid c2"><div><table class="tbl"><thead><tr><th>항목</th><th>의미</th><th class="num">비중</th></tr></thead><tbody>${ICME.survey.pron.dims.map((d) => h`<tr><td><b>${d.label}</b></td><td class="small muted">${d.hint}</td><td class="num">${d.w * 100}%</td></tr>`)}</tbody></table></div><div><ul class="kv-list small"><li>${icon('check', 14)}<span>${ICME.survey.pron.change.slice(0, 3).map((c) => '<b>' + c.label + '</b> ' + (c.min > -999 ? (c.min >= 0 ? '+' + c.min + '점 이상' : '±3점 이내') : '')).join(' · ').replace(/<\/?b>/g, '')}</span></li><li>${icon('check', 14)}<span>녹음 상태가 나쁘면(소음·너무 짧음) "비교하기 어려워요"로 표시하고 점수 비교에서 빼요.</span></li><li>${icon('check', 14)}<span>아이 목소리는 분석 오차가 커서, 반 평균이 아니라 <b>같은 아이의 전후 변화</b>만 의미 있게 봐요.</span></li><li>${icon('check', 14)}<span>선생님 평가(칩)와 나란히 보여서 한쪽만 믿지 않게 해요.</span></li></ul></div></div>` })}
      <div class="alert warn">${icon('alert-triangle', 18)}<div class="small"><b>검증이 필요해요.</b> 위 문항·가중치·기준값은 시안입니다. 실제 사용 전에 (1) 문항의 신뢰도(내적 일관성·재검사) 확인, (2) 기존 검사도구와의 비교, (3) 연령별 기준값 설정을 아동발달 전문가와 시범 운영(3개 센터·100명 이상 권장)으로 확인해야 해요. 발음 분석은 외부 음성 분석 서비스를 쓸 때 <b>녹음 파일의 제3자 처리·국외 이전 동의</b>가 따로 필요합니다.</div></div>
    </div>`;
  };

  R.add('/hq/insights', {
    portal: 'hq', title: '효과 분석',
    render() {
      const stu = q.studentsOf('c1'); const profs = stu.map((s) => ({ s, p: SC.profile(s) }));
      const both = profs.filter((x) => !x.p.provisional).length; const high = profs.filter((x) => x.p.conf.level === '높음').length;
      const pairs = db().videos.filter((p) => p.after).concat(stu.filter((s) => s.video.after && s.consent.video !== 'none' && !db().videos.find((v) => v.studentId === s.id && v.after)).slice(0, 24).map((s) => ({ id: 'vx_' + s.id, studentId: s.id, vol: q.themeFor(q.klass(s.classIds[0])).vol, before: { date: '', sec: 28 }, after: { date: '', sec: 31 } })));
      const prons = pairs.map((p) => SC.pron(p)); const ok = prons.filter((x) => x.change.key !== 'unclear'); const gain = ICME.avg(ok, (x) => x.delta);
      const dist = [['뚜렷하게 좋아졌어요', 'up2', 'green'], ['조금 좋아졌어요', 'up1', 'teal'], ['비슷해요', 'same', 'gray'], ['다시 들어 봐요', 'down', 'amber'], ['비교하기 어려워요', 'unclear', 'gray']].map((c) => ({ label: c[0], n: prons.filter((x) => x.change.key === c[1]).length, tone: c[2] }));
      const byArea = [0, 1, 2, 3, 4].map((i) => { const ch = profs.filter((x) => x.p.areas[i].delta != null); return { area: ICME.kisel.areas[i], up: ch.filter((x) => x.p.areas[i].change === 'up').length, down: ch.filter((x) => x.p.areas[i].change === 'down').length, n: ch.length, avg: ICME.round1(ICME.avg(ch, (x) => x.p.areas[i].delta)) }; });
      const byVol = ICME.materials.volumes.map((v) => { const pp = prons.filter((x, k) => pairs[k].vol === v.id && x.change.key !== 'unclear'); return { v, n: pp.length, g: pp.length ? ICME.round1(ICME.avg(pp, (x) => x.delta)) : null }; });

<script>/* js/v2/core.js */
/* v2/core.js — 간단판 뼈대: 주소(해시) 이동, 화면 틀, 공통 부품.
   기존 시안(v1)의 데이터·점수 계산·지도 가이드를 그대로 쓰고, 화면만 새로 만들었습니다. */
(function () {
  'use strict';
  const ICME = window.ICME; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui;
  const V = (ICME.v2 = { routes: [], vs: {}, audio: {} });
  V.errors = [];   // 화면 그리기·버튼 동작 중 생긴 오류 기록 (점검용)
  ICME.fatal = function (err) {   // 시안(v1)의 개발용 오류 표시 대신, 사용자에게는 짧은 안내만 보여 줘요
    try { console.error(err); } catch (e) { /* noop */ }
    V.errors.push(String((err && err.stack) || err).slice(0, 300));
    try { ui.toast('문제가 생겼어요. 잠시 뒤에 다시 해 주세요', 'warn'); } catch (e) { /* noop */ }
  };
  document.body.classList.add('v2');
  if (/[?&]bare=1/.test(location.search)) document.body.classList.add('bare');   // 캡처용: 위쪽 시안 바를 숨겨요

  /* ---------- 주소 이동 ---------- */
  V.add = function (pattern, def) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:[a-zA-Z]+/g, (m) => { keys.push(m.slice(1)); return '([^/]+)'; }) + '/?$');
    V.routes.push({ re, keys, def });
  };
  V.parse = function () {
    const hash = (location.hash || '#/').slice(1) || '/'; const i = hash.indexOf('?'); const query = {};
    (i >= 0 ? hash.slice(i + 1) : '').split('&').filter(Boolean).forEach((kv) => { const p = kv.split('='); query[decodeURIComponent(p[0])] = decodeURIComponent(p.slice(1).join('=') || ''); });
    return { path: i >= 0 ? hash.slice(0, i) : hash, query };
  };
  V.match = function (path) {
    for (const r of V.routes) { const m = r.re.exec(path); if (m) { const params = {}; r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1]))); return { def: r.def, params }; } }
    return null;
  };
  V.go = (path) => { location.hash = '#' + path; };

  /* ---------- 지금 사용하는 사람 ---------- */
  /* 교사: 지금 근무 중(재직·온보딩)인 사람만. 휴직·퇴사로 바뀐 사람이 선택돼 있으면 다른 교사로 돌려요 */
  const activeTeacher = (id, cid) => { const t = id && q.teacher(id); return !!t && t.centerId === (cid || 'c1') && ['재직', '온보딩'].includes(t.status); };
  /* 지금 보는 센터 · 사람. 로그인을 켜면(auth.js) 센터장·교사·학부모는 자기 센터에 묶이고 본사는 고른 센터를 봐요. 로그인을 끄면 예전처럼 노원중계예요 */
  V.cid = () => 'c1';
  V.authUser = () => null;   // auth.js가 로그인한 사람으로 바꿔요
  V.tid = () => {
    const u = ICME.store.ui; const cid = V.cid(); const me = V.authUser();
    if (me && me.role === 't') return me.ref;   // 교사 계정은 항상 자기 자신만
    if (activeTeacher(u.v2tid, cid)) return u.v2tid;
    if (cid === 'c1' && activeTeacher('t2', cid)) return 't2';
    const a = q.teachersOf(cid, { active: true })[0]; return a ? a.id : 't2';
  };
  V.kid = () => {
    const me = V.authUser(); const u = ICME.store.ui;
    if (me && me.role === 'p') return q.student(me.ref) || q.student('s1');   // 학부모 계정은 항상 자기 아이만
    const s = q.student(u.childId);
    if (me) { const cid = V.cid(); if (s && s.centerId === cid) return s; const L = q.studentsOf(cid); return L.find((x) => !V.consent.needsAgree(x) && x.kisel.st === 'done' && x.survey && x.survey.parent && x.survey.parent.done) || L[0] || q.student('s1'); }
    return s || q.student('s1');
  };
  /* 보호자 동의: 처음 시작 전 필수 동의(agreedAt이 null이면 아직), 영상·녹음 4단계, 발음 분석(외부 전송) 별도 동의 */
