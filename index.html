      <span class="links">${who}${window.ICME_SHARED ? h`<span class="chip">아이·숫자는 가상 · 점검 결과는 실제 · ${ICME.dateKo(ICME.today())} 기준</span>` : h`<a href="index.html">전체 시안(v1)</a>`}<button data-act="v.reset">초기화</button></span></header>`;
  }
  ICME.actions['v.teacher'] = (el) => { ICME.store.mutate((d, u) => { u.v2tid = el.value; }); V.vs.cls = null; V.render(); };
  ICME.actions['v.child'] = (el) => { ICME.store.ui.childId = el.value; ICME.store.save(); V.vs.kid = null; V.render(); };
  ICME.actions['v.reset'] = () => V.ask({ title: '처음 상태로 돌릴까요?', text: '눌러 본 것과 적은 내용이 모두 지워져요. 가입 신청과 승인한 회원도 처음(예시) 상태로 돌아가요. 글자 크기는 그대로예요.', ok: '처음으로 돌릴게요', danger: true, onOk: () => { ICME.store.reset(); V.vs = {}; V.audio = {}; ui.toast('처음 상태로 돌렸어요'); V.go('/'); V.render(); } });

  /* ---------- 관리 메뉴: 사람마다 4~5개만. 관리할 "대상"이 메뉴예요 ---------- */
  const tabs = (items, on) => h`<nav class="v-seg v-tabs">${items.map((x) => h`<a class="${on === x[0] ? 'on' : ''}" href="#${x[2]}">${x[1]}</a>`)}</nav>`;
  V.aTabs = (on) => tabs([['now', '점검 현황', '/a'], ['teachers', '교사', '/a/teachers'], ['classes', '반·아이', '/a/classes'], ['theme', '이번 달 주제', '/a/theme']], on);
  /* 본사 메뉴: 위쪽 6개. 교육·콘텐츠와 분석은 아래에 한 줄이 더 있어요 */
  const HQ_MENU = [
    ['home', '홈', '/h/home', null],
    ['centers', '가맹점', '/h/centers', [['centers', '가맹점 목록', '/h/centers'], ['monitor', '점검 결과', '/h/monitor']]],
    ['content', '교육·콘텐츠', '/h/teachers', [['teachers', '교사·교육', '/h/teachers'], ['kisel', '문항', '/h'], ['guide', '주제·지도', '/h/guide'], ['kits', '키트·발주', '/h/kits']]],
    ['leads', '문의·가입', '/h/leads', [['leads', '가맹 문의', '/h/leads'], ['accounts', '가입 승인', '/h/accounts']]],

    }

    window.scrollTo(0, prevY); lastPath = path;
    document.title = (blocked ? '볼 수 없어요' : m && m.def.title ? m.def.title : '') + (blocked || (m && m.def.title) ? ' · ' : '') + '아이크미톡 (시안)';
    if (m && m.def.mount && !blocked) { try { m.def.mount(ctx); } catch (err) { ICME.fatal(err); } }

  ICME.rerender = () => V.render();   // 기존 시안의 일부 동작이 쓰는 이름
  V.boot = function () {

    try {   // 캡처·시연용 장면: ?scene=gate (방금 등록돼 보호자 동의 전인 아이로 시작) · ?scene=requests (보호자 요청이 들어와 있는 센터장 화면)
      const sc = new URLSearchParams(location.search).get('scene');

      if (sc === 'requests' && !(ICME.store.db.requests || []).some((r) => !r.done && (q.student(r.sid) || {}).centerId === 'c1')) ICME.store.mutate((d) => { d.requests = (d.requests || []).concat([{ id: 'r1', sid: 's1', kind: 'delete', date: ICME.ymd(ICME.today()), done: false }, { id: 'r2', sid: 's7', kind: 'read', date: ICME.ymd(ICME.today()), done: false }]); });

  V.av = (name, px) => { const c = ICME.avatarColor(name); const n = px || 44; return h`<span class="v-av" style="width:${n}px;height:${n}px;font-size:${Math.round(n * 0.34)}px;background:${c[0]};color:${c[1]}">${ICME.initials(name)}</span>`; };

  V.state = (score) => { const l = V.lv(score); return h`${V.meter(l.n)}<span class="v-st l${l.n}">${l.t}</span>`; };

  /* 아래에서 올라오는 창 */

  };
  V.closeSheet = function () { const r = document.getElementById('v-sheet'); if (r) r.innerHTML = ''; document.body.style.overflow = ''; };
  ICME.actions['v.sheet.close'] = (el, e) => { if (e.target === el || e.target.closest('[data-close]')) V.closeSheet(); };

  /* 소리 파형(장식) — 같은 키면 같은 모양 */
  V.wave = function (seed, color) {
    const rnd = ICME.rng(ICME.hash(seed)); let bars = '';
    for (let k = 0; k < 44; k++) { const hh = 4 + Math.round((0.25 + rnd() * 0.75) * 22 * (0.6 + 0.4 * Math.sin(k / 5))); bars += '<rect x="' + (k * 7 + 1) + '" y="' + (15 - hh / 2) + '" width="4" height="' + hh + '" rx="2" fill="' + color + '"/>'; }
    return raw('<svg viewBox="0 0 308 30" preserveAspectRatio="none" aria-hidden="true">' + bars + '</svg>');
  };
  V.fmt = (sec) => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
})();

<script>/* js/v2/ease.js */
/* v2/ease.js — "누구나 쓸 수 있게" 공통 부품 (2026-11-06 화면 점검에서 나온 보완)

   · 확인 창     : 되돌릴 수 없는 일(지우기 · 보내기 · 처음으로 돌리기)은 누르기 전에 한 번 물어요
   · 오늘 할 일  : 첫 화면 맨 위에 "지금 할 일"을 순서대로 보여 주고, 첫 번째만 진한 버튼으로 눌러요 */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const ui = ICME.ui;
  const E = (V.ease = {});

  /* 영역 색(노랑·주황 등)을 글자로 쓰면 흐려서 안 보여요. 같은 색 계열을 어둡게 만들어 글자에 써요 */
  V.darken = (hex, f) => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#16232a'; const n = parseInt(m[1], 16); const k = 1 - (f == null ? 0.5 : f); return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * k).toString(16).padStart(2, '0')).join(''); };

  /* ---------- 도움말: 화면마다 세 줄 안으로 ---------- */

    [/^\/t$/, '우리반', ['맨 위 초록색 카드의 큰 버튼부터 눌러요. 오늘 할 일이 먼저 나와요.', '다른 반을 보려면 반 이름 버튼을 눌러요.', '아이 이름을 누르면 그 아이 화면이 열려요. 거기도 "다음에 할 일"이 하나만 나와요.']],
    [/^\/t\/kid\//, '아이 화면', ['맨 위 초록색 "다음에 할 일"만 누르면 돼요.', '"지금 모습"은 아이를 평가하는 점수가 아니에요. 영역을 누르면 이유가 나와요.', '맨 아래에서 부모님께 보낼 말을 읽어 보고 "카톡으로 보내기"를 눌러요.']],

    [/^\/[tpah]\/compare\//, '소리 비교', SAME],

    [/^\/a\/teachers$/, '교사', ['선생님 이름을 누르면 서류와 필수 교육을 볼 수 있어요.', '"선생님 초대"로 새 선생님을 더해요.']],
    [/^\/a\/teachers\//, '교사 상세', ['서류를 받았으면 "확인"을 눌러요.', '담당 반은 아래에서 맡기거나 풀어요.']],
    [/^\/a\/classes$/, '반·아이', ['반을 누르면 담당 선생님과 아이를 볼 수 있어요.']],

    [/^\/a\/theme$/, '이번 달 주제', ['반마다 추천 주제가 정해져 있어요. 그대로 두면 돼요.', '바꾸고 싶은 반만 목록에서 골라요.']],
    [/^\/a\/kid\//, '아이 보기', ['점수와 가르치는 법을 볼 수 있어요.', '녹음과 보내기는 선생님 화면에서 해요.']],
    [/^\/h\/home$/, '본사 홈', ['맨 위 "오늘 먼저 할 일"부터 위에서 아래로 해요.', '줄 오른쪽 "센터장에게 안내" 버튼을 누르면 공지 글이 미리 써져요.', '"실제"는 진짜 점검 결과, "예시"는 시연용 숫자예요.']],
    [/^\/h\/centers$/, '가맹점', ['가맹점 이름을 누르면 아이 · 교사 · 반을 볼 수 있어요. 보기만 돼요.', '이름 옆 숫자는 실제 점검 점수예요.']],
    [/^\/h\/centers\//, '가맹점 상세', ['위쪽 탭으로 아이 · 교사 · 반을 옮겨 가요.', '아이를 열면 "열람 기록"이 남아요.']],
    [/^\/h\/monitor$/, '점검 결과', ['위쪽 온도 버튼으로 걸러 보고, 센터 이름을 누르면 먼저 할 일이 나와요.', '비밀번호가 필요하면 담당자에게 물어보세요.']],
    [/^\/h\/monitor\//, '센터 점검', ['"먼저 할 일"부터 보세요.', '시범 센터는 아래 버튼으로 센터장에게 안내를 보낼 수 있어요.']],
    [/^\/h\/notices/, '공지', ['"공지 보내기"로 센터장에게 알려요.', '안 읽은 곳에는 "다시 알리기"를 눌러요.']],
    [/^\/h\/events$/, '행사', ['"행사 등록"으로 교육 · 행사를 알려요.', '센터장 화면에도 날짜가 보여요.']],
    [/^\/h\/leads$/, '가맹 문의', ['문의가 들어오면 단계(신규 → 상담 → 방문 → 계약 → 개설 준비)를 옮겨요.', '24시간 넘게 기다린 문의는 주황색으로 표시돼요.']],
    [/^\/h\/accounts$/, '가입 승인', ['"승인 기다림"에 있는 사람을 눌러 내용을 확인해요.', '승인하면 바로 로그인할 수 있어요. 이름 · 아이디 · 전화번호로 찾을 수 있어요.', '센터장이 "아는 분이에요"로 표시한 신청에는 표시가 붙어요.']],
    [/^\/h\/accounts\//, '가입 신청', ['신청 내용을 보고 "승인하기"나 "반려하기"를 눌러요.', '학부모는 이미 등록된 아이와 연결하거나 새 아이로 등록해요.', '비밀번호를 잊은 분께는 "임시 비밀번호"를 만들어 알려 줘요.']],
    [/^\/h\/teachers$/, '교사·교육', ['가맹점별 필수 교육과 서류 현황이에요.', '"안내 보내기"로 센터장에게 알려요.']],
    [/^\/h(\/s\/.*)?$/, '문항', ['문항은 엑셀(CSV)로 올리거나 하나씩 고쳐요.', '버전을 확정하면 그 뒤부터 아이 설문에 나가요.']],
    [/^\/h\/guide/, '주제·지도', ['영역마다 선생님이 읽는 가르치는 법을 고칠 수 있어요.', '"처음 문구로 되돌리기"로 되돌려요.']],
    [/^\/h\/kits$/, '키트·발주', ['이번 달 반마다 필요한 키트 수량이 계산돼 있어요.', '발주서는 "복사"해서 붙여 넣어요.']],
    [/^\/h\/quality$/, '효과·품질', ['점수가 어떻게 달라졌는지 영역 · 가맹점별로 봐요.', '주황색은 기준에 못 미친 곳이에요.']],
    [/^\/h\/members$/, '원생·수강', ['월 · 분기 · 연 버튼으로 신규와 탈퇴 원생을 바꿔 봐요.', '수강 과목 인기도 아래에 있어요.']],
    [/^\/h\/privacy$/, '개인정보·동의', ['동의 현황과 보호자 요청, 열람 기록을 봐요.', '기다리는 요청은 센터장에게 알려요.']]
  ];
  const DEF = {
    t: ['선생님 화면', ['아래 메뉴로 우리반 · 수업안 · 내 교육을 옮겨 다녀요.', '길을 잃으면 왼쪽 위 "뒤로"를 눌러요.']],
    p: ['보호자 화면', ['길을 잃으면 왼쪽 위 "처음으로"를 눌러요.']],
    a: ['센터장 화면', ['위쪽 메뉴(점검 현황 · 교사 · 반·아이 · 이번 달 주제)로 옮겨 다녀요.', '길을 잃으면 "뒤로"를 눌러요.']],
    h: ['본사 화면', ['위쪽 메뉴로 옮겨 다녀요. 줄이나 이름을 누르면 열려요.', '길을 잃으면 "홈"을 눌러요.']]
  };
  const ASK = { t: '모르는 것은 센터장님께 물어보세요.', p: '모르는 것은 센터 선생님께 물어보세요.', a: '모르는 것은 본사 운영팀에 물어보세요.', h: '시안이라 문의 창구는 아직 없어요.' };
  E.helpFor = function (path, role) {
    for (const r of HELP) if (r[0].test(path)) return { title: r[1], steps: typeof r[2] === 'function' ? r[2]() : r[2], ask: ASK[role] || '' };
    const d = DEF[role] || DEF.t; return { title: d[0], steps: d[1], ask: ASK[role] || '' };
  };
  E.openHelp = function () {
    const w = where(); const hp = E.helpFor(w.path, w.role); const sz = E.size();
    V.sheet(h`<h2 class="v-h2">도움말 · ${hp.title}</h2><p class="v-sub" style="margin-top:2px">이 화면에서는 이렇게 하면 돼요</p>
      <ol class="e-hsteps">${hp.steps.map((t, i) => h`<li><span class="n">${i + 1}</span><span>${t}</span></li>`)}</ol>
      <div class="v-sub-h">글자 크기</div>
      <div class="e-size" role="group" aria-label="글자 크기">${SIZES.map((s) => h`<button class="${sz === s[0] ? 'on' : ''}" aria-pressed="${sz === s[0] ? 'true' : 'false'}" data-act="e.size" data-v="${s[0]}">${s[1]}</button>`)}</div>
      <div class="v-btns" style="margin-top:18px"><button class="v-btn" data-act="e.guide">처음 안내 다시 보기</button><button class="v-btn primary" data-act="v.sheet.close" data-close>닫기</button></div>${V.auth && V.auth.user() ? h`<button class="v-btn ghost" style="margin-top:6px" data-act="auth.menu">내 정보 · 로그아웃</button>` : ''}
      ${hp.ask ? h`<p class="v-note" style="text-align:center">${hp.ask}</p>` : ''}`);
  };
  ICME.actions['e.help'] = () => E.openHelp();

  /* ---------- 처음 안내: 역할마다 처음 한 번, 3가지만 ---------- */
  const GUIDE = {
    t: ['선생님', [['오늘 할 일부터', '우리반 맨 위 초록색 카드의 큰 버튼을 눌러요.'], ['아이 이름을 눌러요', '그 아이의 지금 모습과 가르치는 법이 한 장으로 나와요.'], ['부모님께 알려요', '아이 화면 맨 아래에서 말을 읽어 보고 카톡으로 보내요.']]],
    p: ['보호자님', [['아이와 함께', '그림 카드에 같이 답해요. 5분이면 돼요.'], ['부모님 설문', '집에서의 모습을 1분 동안 골라 주세요.'], ['리포트 보기', '아이의 이번 달 모습과 집에서 해 볼 일이 나와요.']]],
    a: ['센터장님', [['오늘 할 일', '맨 위 목록을 위에서부터 하나씩 해요.'], ['공지 확인', '본사가 보낸 공지는 읽고 "확인했어요"를 눌러요.'], ['알림 보내기', '아직 설문을 안 한 가정에 버튼 하나로 카톡 링크를 보내요.']]],
    h: ['본사 담당자님', [['먼저 할 일', '홈 맨 위 목록이 가장 급한 순서예요.'], ['가맹점 보기', '가맹점 → 점검 결과에서 센터별 실제 점수를 봐요.'], ['센터장에게 안내', '줄 옆 버튼을 누르면 공지 글이 미리 써져서 바로 보낼 수 있어요.']]]
  };
  const GUIDE_AT = { t: /^\/t$/, p: /^\/p(\/center)?$/, a: /^\/a$/, h: /^\/h\/home$/ };
  E.openGuide = function (role) {
    const g = GUIDE[role]; if (!g) return;
    V.sheet(h`<h2 class="v-h2">처음 오셨어요?</h2><p class="v-sub" style="margin-top:2px">${g[0]}은 딱 3가지만 알면 돼요</p>
      <ol class="e-guide">${g[1].map((x, i) => h`<li><span class="n">${i + 1}</span><span class="tx"><b>${x[0]}</b><span>${x[1]}</span></span></li>`)}</ol>
      <button class="v-btn primary" data-act="v.sheet.close" data-close>알겠어요</button>
      <p class="v-note" style="text-align:center">잊어버리면 오른쪽 아래 "도움말"을 눌러 다시 볼 수 있어요.</p>`);
  };
  ICME.actions['e.guide'] = () => { const w = where(); V.closeSheet(); E.openGuide(GUIDE[w.role] ? w.role : 't'); };
  E.resetGuide = () => { ['t', 'p', 'a', 'h'].forEach((r) => set('icme.v2.seen.' + r, '')); };
  function maybeGuide(w) {
    if (E.noGuide || !GUIDE_AT[w.role] || !GUIDE_AT[w.role].test(w.path)) return;
    if (get('icme.v2.seen.' + w.role)) return;
    if (w.role === 'p' && w.path === '/p' && V.consent.needsAgree(V.kid())) return;   // 동의 화면 위에는 겹치지 않아요
    set('icme.v2.seen.' + w.role, '1');
    setTimeout(() => { if (!document.getElementById('v-sheet') || !document.getElementById('v-sheet').innerHTML) E.openGuide(w.role); }, 350);
  }

  /* ---------- 확인 창: 되돌릴 수 없는 일은 한 번 물어요 ---------- */
  E.okFn = null;
  V.ask = function (o) {
    E.okFn = o.onOk || null;
    V.sheet(h`<h2 class="v-h2">${o.title}</h2>${o.text ? h`<p class="v-sub" style="margin-top:6px;line-height:1.65">${o.text}</p>` : ''}
      <div class="v-btns" style="margin-top:18px"><button class="v-btn" data-act="v.sheet.close" data-close>${o.cancel || '아니요'}</button><button class="v-btn ${o.danger ? 'danger' : 'primary'}" data-act="e.askOk">${o.ok || '네'}</button></div>`);
  };
  ICME.actions['e.askOk'] = () => { const f = E.okFn; E.okFn = null; V.closeSheet(); if (typeof f === 'function') f(); };

  /* ---------- 오늘 할 일: 첫 번째만 진한 버튼 ---------- */
  const NUM = ['', '한', '두', '세', '네', '다섯'];
  const dataAttrs = (x) => raw(Object.keys(x.data || {}).map((k) => ' data-' + k + '="' + ICME.esc(x.data[k]) + '"').join(''));
  /* o = { items: [{ t, d, label, href | act + data }], max, title, doneTitle, doneText } */
  V.today = function (o) {
    const items = (o.items || []).slice(0, o.max || 4);
    if (!items.length) return h`<section class="e-today done" id="e-today"><span class="ic">${icon('check-circle', 30)}</span><div class="tx"><b>${o.doneTitle || '오늘 할 일을 모두 마쳤어요'}</b>${o.doneText ? h`<span>${o.doneText}</span>` : ''}</div></section>`;
    const go = (x, i) => (x.href ? h`<a class="v-btn ${i === 0 ? 'primary' : ''}" href="#${x.href}">${x.label}</a>` : h`<button class="v-btn ${i === 0 ? 'primary' : ''}" data-act="${x.act}"${dataAttrs(x)}>${x.label}</button>`);
    const n = items.length;
    return h`<section class="e-today" id="e-today" aria-labelledby="e-today-h"><div class="hd"><small>${o.k || '오늘 할 일'}</small><h2 id="e-today-h">${o.title || (NUM[n] ? NUM[n] + ' 가지만 하면 돼요' : n + '가지만 하면 돼요')}</h2></div>
      <ol>${items.map((x, i) => h`<li class="e-task ${i === 0 ? 'first' : ''}"><span class="n">${i + 1}</span><div class="tx"><b>${x.t}${x.tag ? h` <span class="v-${x.tag}">${x.tag === 'real' ? '실제' : '예시'}</span>` : ''}</b>${x.d ? h`<span>${x.d}</span>` : ''}${x.more ? h`<a class="more" href="#${x.more}">자세히 보기 ›</a>` : ''}</div>${go(x, i)}</li>`)}</ol></section>`;
  };
  ICME.actions['e.jump'] = (el) => { const t = document.getElementById(el.dataset.to); if (t) { try { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { t.scrollIntoView(); } } };

  /* ---------- 알림 글: 길면 오래, 짧으면 짧게. 최대 2개까지만 쌓아요 ---------- */
  ui.toast = function (msg, tone) {
    const root = document.getElementById('toast-root'); if (!root) return;
    while (root.children.length >= 2) root.removeChild(root.firstChild);
    const el = document.createElement('div'); el.className = 'toast ' + (tone || 'ok');
    el.innerHTML = String(icon(tone === 'warn' ? 'alert-circle' : 'check-circle', 22)) + '<span>' + ICME.esc(msg) + '</span>';
    root.appendChild(el);
    const ms = Math.min(7000, 3200 + String(msg).length * 55);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, ms);
  };

  /* ---------- 그릴 때마다: 글자 크기 · 도움말 버튼 · 처음 안내 ---------- */
  function helpRoot() {
    let r = document.getElementById('e-help-root');
    if (!r) { r = document.createElement('div'); r.id = 'e-help-root'; r.innerHTML = '<button class="e-help" data-act="e.help" aria-haspopup="dialog"><b aria-hidden="true">?</b>도움말</button>'; document.body.appendChild(r); }
    return r;
  }
  /* 캡처용 장면(주소 뒤에 붙여요): ?scene=help 도움말 창 · ?scene=guide 처음 안내 · ?scene=ask 확인 창 · ?size=3 아주 크게 */
  const SCENE = (/[?&]scene=([a-z]+)/.exec(location.search) || [])[1]; let sceneDone = false;
  const SZ = (/[?&]size=([123])/.exec(location.search) || [])[1]; if (SZ) set('icme.v2.size', SZ);
  function scene(w) {
    if (sceneDone || !SCENE) return; sceneDone = true;
    if (SCENE === 'help') E.openHelp();

  ICME.actions['auth.pick'] = (el) => {

  ICME.actions['auth.menu'] = () => {
    const u = A.user(); if (!u) return;
    V.sheet(h`<h2 class="v-h2">내 정보</h2>
      <div class="au-who">${V.av(A.short(u).replace(/ (센터장|선생님|보호자)$/, ''), 52)}<div><b>${A.label(u)}</b><small>${NAME[u.role]} 계정 · 아이디 ${u.id}</small></div></div>

  ICME.actions['auth.role'] = (el) => {   // 화면을 다시 그리지 않고 탭만 바꿔서, 써 둔 아이디가 지워지지 않게 해요

    const b = e.target && e.target.closest ? e.target.closest('.au-role') : null; if (!b) return;

    pending: () => '가입 신청은 받았어요. 아직 본사가 확인하는 중이에요. 승인되면 이 아이디로 들어올 수 있어요. 보통 1~2일 걸려요.',
    rejected: (r) => '가입 신청이 반려됐어요.' + (r.reason ? ' 이유: ' + r.reason + '.' : '') + ' 궁금한 점은 센터나 본사에 물어보세요.',
    suspended: () => '이 계정은 잠시 이용이 멈춰 있어요. 센터나 본사에 물어보세요.',
    noref: () => '승인은 됐지만 연결된 아이(선생님) 정보를 찾을 수 없어요. 본사에 알려 주세요.'

  /* 캡처 · 자동 점검용 (이 PC의 v2.html에서만): 주소 뒤에 ?as=아이디 를 붙이면 비밀번호 없이 그 계정으로 들어간 것처럼 열어요.

  setTimeout(() => { if (A.on()) A.restore(); }, 0);
})();

</script>
<script>/* js/v2/members.js */
/* v2/members.js — 회원가입과 본사 승인 (2026-11-12)

   · 가입 화면 #/signup : 누구세요(학부모·선생님·센터장) → 어느 센터 → 내 정보 → 아이디·비밀번호 → 확인·동의 → 신청 완료
     (주소 뒤에 ?c=센터번호&r=p 를 붙이면 센터·종류를 미리 골라 둔 센터별 가입 주소가 돼요)

   · 센터장: 우리 센터 신청을 보고 "아는 분이에요 / 모르는 분이에요"로 표시해요. 최종 승인은 본사가 해요.
   · 로그인(auth.js)은 승인된 회원만 들여보내고, 승인 기다림 · 반려 · 이용 중지는 이유와 함께 알려 줘요.
   ※ 서버가 없는 시안이라 가입 내용은 "이 브라우저"에만 저장돼요. 다른 기기로 바로 전해지지 않아요. 진짜 서비스는 서버·DB가 필요해요(docs/회원가입_승인_설계.md). */

  const A = V.auth; const M = (V.members = {});
  const db = () => ICME.store.db;
  const val = (id) => (document.getElementById(id) || {}).value || '';
  const el$ = (id) => document.getElementById(id);
  const today = () => ICME.ymd(ICME.today());
  const clock = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const norm = (s) => String(s == null ? '' : s).normalize('NFC').replace(/\s+/g, ' ').trim();

  /* 단계 사이를 오가는 동작 */

      if (pw !== pw2) { showErr(fail('비밀번호가 서로 달라요. 한 번 더 확인해 주세요.', 'su-pw2')); return; }
