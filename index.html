  /* ======================================================== 부모 설문 (영역마다 2문항, 5단계) */
  V.add('/p/survey', {
    title: '부모 설문',
    render() {
      const s = V.kid(); let P = V.vs.psv;
      if (V.consent.needsAgree(s)) return h`${V.back('/p', '처음으로')}<div class="v-empty"><b>먼저 동의가 필요해요</b>처음 화면에서 동의하면 설문을 시작할 수 있어요.<a class="v-btn primary" style="margin-top:16px" href="#/p">처음으로</a></div>`;
      if (!P || P.sid !== s.id) {   // 쓰다 만 설문이 있으면 이어서 해요 (앱을 잠깐 나갔다 와도 사라지지 않아요). ?psv=N: 캡처용
        const pm = /[?&]psv=([0-9]+)/.exec(location.search); const dr = (db().psvDraft || {})[s.id];
        P = V.vs.psv = { sid: s.id, i: pm ? Number(pm[1]) : dr ? dr.i : 0, ans: pm ? { 0: { 0: 4, 1: 4 }, 1: { 0: 4, 1: 5 } } : dr ? dr.ans : {}, ask: !pm && !dr && parentDone(s) };
      }
      if (P.ask) {   // 이미 보낸 설문을 실수로 덮어쓰지 않게 한 번 물어요
        return h`${V.back('/p', '처음으로')}<div class="v-head"><h1 class="v-h1">이미 보내 주셨어요</h1><p class="v-sub">${ICME.dateKo(s.survey.parent.date)}에 보내 주셨어요. 다시 하면 새로 고른 답으로 바뀌어요.</p></div><div class="v-btns" style="flex-direction:column"><button class="v-btn primary" data-act="v.psv.again">다시 하기</button><a class="v-btn" href="#/p/report">리포트 보기</a></div>`;
      }
      if (P.i >= 5) {
        return h`<div class="v-empty" style="padding-top:60px"><div style="font-size:54px">🎉</div><b style="font-size:22px;margin-top:8px">고맙습니다!</b>${s.name}의 이번 달 리포트에 부모님 이야기가 더해졌어요.</div>
          <a class="v-btn primary" style="margin-top:18px" href="#/p/report">리포트 보기</a><a class="v-btn ghost" style="margin-top:8px" href="#/p">처음으로</a>`;
      }
      const PI = ICME.survey.parentItems[P.i]; const items = PI.items.slice(0, 2); const area = ICME.kisel.areas[P.i]; const ans = P.ans[P.i] || {}; const all = items.every((_, k) => ans[k]);
      return h`${P.i === 0 ? V.back('/p', '나가기') : h`<a class="v-back" href="#/p/survey" data-act="v.psv.prev">${icon('chevron-left', 18)}이전</a>`}
        <div class="v-prog">${[0, 1, 2, 3, 4].map((i) => h`<i class="${i <= P.i ? 'on' : ''}"></i>`)}</div>
        <div class="v-head"><div class="v-eyebrow">${P.i + 1} / 5</div><h1 class="v-h1">${area.name}</h1><p class="v-sub">최근 한 달, 집에서의 모습을 떠올려 주세요.</p></div>
        ${items.map((t, k) => h`<div class="v-q"><div class="tx">${t}</div><div class="v-scale">${ICME.survey.parentScale.map((o) => h`<button class="${ans[k] === o.v ? 'on' : ''}" data-act="v.psv.ans" data-k="${k}" data-v="${o.v}"><b>${o.v}</b><span>${o.t}</span></button>`)}</div></div>`)}
        <div class="v-bar-bottom">${all ? '' : h`<p class="v-note" style="text-align:center;margin:0 0 8px;font-weight:700">두 질문 모두 골라야 다음으로 갈 수 있어요</p>`}<button class="v-btn primary" data-act="v.psv.next" ${all ? '' : raw('disabled')}>${P.i === 4 ? '보내기' : '다음'}</button></div>`;
    }
  });
  const saveDraft = (P) => ICME.store.mutate((d) => { d.psvDraft = d.psvDraft || {}; d.psvDraft[P.sid] = { i: P.i, ans: P.ans }; });
  ICME.actions['v.psv.again'] = () => { V.vs.psv.ask = false; V.render(); };
  ICME.actions['v.psv.ans'] = (el) => { const P = V.vs.psv; P.ans[P.i] = P.ans[P.i] || {}; P.ans[P.i][el.dataset.k] = Number(el.dataset.v); saveDraft(P); V.render(); };
  ICME.actions['v.psv.prev'] = () => { const P = V.vs.psv; P.i = Math.max(0, P.i - 1); saveDraft(P); V.render(); window.scrollTo(0, 0); };
  ICME.actions['v.psv.next'] = () => {
    const P = V.vs.psv;
    if (P.i === 4) {
      const items = [0, 1, 2, 3, 4].map((a) => [0, 1].map((k) => (P.ans[a] || {})[k] || 3));
      ICME.store.mutate((d) => { const x = d.students.find((y) => y.id === P.sid); x.survey.parent = { done: true, items, date: ICME.ymd(ICME.today()) }; if (d.psvDraft) delete d.psvDraft[P.sid]; });
      ui.toast('보냈어요. 리포트가 새로 만들어졌어요'); P.i += 1;
    } else { P.i += 1; saveDraft(P); }
    V.render(); window.scrollTo(0, 0);
  };

  /* 리포트 "방법 제시" 아래: 그 영역에 어울리는 영어그림책 · 선생님께 알리기 */
  const bookCard = (no) => {
    const bk = ICME.bookFor(no);
    return h`<section class="v-card"><div class="v-eyebrow">함께 읽어요 · 영어그림책</div><div style="display:flex;gap:14px;align-items:flex-start;margin-top:10px"><span class="v-book" aria-hidden="true">${icon('book-open', 30)}</span><div style="flex:1;min-width:0"><h2 class="v-h2" style="font-style:italic">${bk.title}</h2><div class="v-small v-muted" style="margin-top:2px">${bk.author}</div></div></div>
      <p class="v-small" style="margin-top:12px;line-height:1.7">${bk.line}</p><div class="v-sub-h">읽고 이렇게 이야기해 보세요</div><ul class="v-small" style="display:flex;flex-direction:column;gap:6px;margin:4px 0 0 18px;line-height:1.6;list-style:disc">${bk.ask.map((a) => h`<li>${a}</li>`)}</ul>
      <p class="v-note">도서관이나 센터에서 빌려 볼 수 있어요. 구매를 권하는 안내가 아니에요.</p></section>`;
  };
  const notifyCard = (s, t) => {
    const note = (db().parentNotes || []).filter((n) => n.sid === s.id && n.month === month()).slice(-1)[0];
    return h`<section class="v-card"><h2 class="v-h2">선생님께 알리기</h2><p class="v-small v-muted" style="margin-top:4px;line-height:1.6">${t.name} 선생님께 ${month()}월 리포트를 확인했다고 알리고, 궁금한 점을 남길 수 있어요.</p>
      ${note ? h`<div class="v-card soft" style="margin:12px 0 0"><b>${ICME.dateShort(note.date)}에 보냈어요</b><p class="v-small" style="margin-top:4px;white-space:pre-wrap;line-height:1.6">${note.text}</p><span class="v-tag ${note.read ? 'ok' : ''}" style="margin-top:8px">${note.read ? '선생님이 확인했어요' : '선생님이 아직 안 읽었어요'}</span></div>` : ''}
      <label class="v-field" style="margin-top:12px"><span>${note ? '한 번 더 남기기' : '궁금한 점이나 하고 싶은 말'} (선택)</span><textarea id="pn-text" class="v-input" rows="3" maxlength="200" style="padding:12px;min-height:84px" placeholder="예) 집에서도 해 보고 있어요. 어떤 점을 더 신경 쓰면 좋을까요?"></textarea></label>
      <button class="v-btn primary" style="margin-top:12px" data-act="p.notify">${icon('send', 18)}선생님께 알리기</button></section>`;
  };
  ICME.actions['p.notify'] = () => {
    const s = V.kid(); const txt = ((document.getElementById('pn-text') || {}).value || '').trim(); if (txt.length > 200) { ui.toast('200자 이하로 적어 주세요', 'warn'); return; }
    ICME.store.mutate((d) => { d.parentNotes = d.parentNotes || []; d.parentNotes.push({ id: ICME.uid('pn'), sid: s.id, month: month(), text: txt || month() + '월 리포트를 확인했어요', date: ICME.ymd(ICME.today()), read: false }); });
    ui.toast(teacherOf(s).name + ' 선생님께 알렸어요'); V.render();
  };

  /* ======================================================== 리포트 (한 장) */
  V.add('/p/report', {
    title: '리포트',
    render() {
      const s = V.kid();
      if (s.kisel.st !== 'done' || V.consent.needsAgree(s) || !SC.profile(s).areas.some((a) => a.combined != null)) return h`${V.back('/p', '처음으로')}<div class="v-empty"><b>아직 리포트가 없어요</b>아이와 함께 마음 이야기를 마치면 만들어져요.</div>`;
      const prof = SC.profile(s); const t = teacherOf(s); const g = ICME.coaching.build(s, t.name); const b = g.blocks[0]; const ps = V.pronState(s);
      const up = prof.areas.filter((a) => a.change === 'up').sort((x, y) => y.delta - x.delta)[0]; const strong = prof.strongest[0];
      const head = up ? h`${ICME.josa(nick(s), '은/는')} <em>"${up.area.short}"</em>에서<br>지난달보다 쑥 자랐어요` : h`${ICME.josa(nick(s), '은/는')} <em>"${strong.area.short}"</em>${ICME.josa(strong.area.short, '을/를').slice(strong.area.short.length)}<br>잘하고 있어요`;
      const same = up && b && up.i === b.area.no - 1;
      const done = (db().homeDone || {})[s.id]; const pair = ps.st === 'both' ? ps.pair : null; const p = pair ? SC.pron(pair) : null;
      return h`${V.back('/p', '처음으로')}
        <div class="v-head"><div class="v-eyebrow">${month()}월 마음 리포트</div><h1 class="v-h1">${s.name}의 이번 달</h1></div>
        ${prof.provisional ? h`<div class="v-card warm" style="margin-top:0"><b>임시 리포트예요</b><p class="v-small" style="margin-top:4px">지금은 아이 이야기만 담겼어요. 부모 설문(1분)을 하면 더 정확해져요.</p><a class="v-btn sm" style="margin-top:12px" href="#/p/survey">설문하러 가기</a></div>` : ''}
        <div class="v-hero"><div class="big">${head}</div><div style="margin-top:14px">${prof.areas.map((a) => h`<div class="v-area" style="cursor:default;min-height:44px;padding:4px 2px"><span class="dot" style="background:${ICME.kisel.areas[a.i].color}"></span><span class="nm">${a.area.short}</span>${a.combined != null ? V.state(a.combined) : ''}</div>`)}</div></div>
        ${b ? h`<section class="v-card"><div class="v-eyebrow">${same ? '이번 달도 함께 키워요' : '이번 달 함께 키워요'}</div><h2 class="v-h2">${b.area.name}</h2><p class="v-small v-muted" style="margin-top:6px">부족하다는 뜻이 아니라, 지금 가장 잘 자랄 수 있는 시기라는 뜻이에요.</p>
          <div class="v-sub-h">집에서 이렇게 해 주세요</div>
          <div class="v-todo" style="margin-top:8px" data-act="v.home" data-sid="${s.id}"><span class="v-check ${done ? 'on' : ''}">${done ? icon('check', 16) : ''}</span><span class="v-quote">${g.script[3].t}</span></div>
          <p class="v-note">해 보셨으면 눌러 주세요. 선생님께 전해져요.</p></section>` : ''}
        ${b ? bookCard(b.area.no) : ''}
        <section class="v-card"><h2 class="v-h2">영어 발음</h2>${s.consent.video === 'none' ? h`<p class="v-small v-muted" style="margin-top:6px;line-height:1.6">녹음·영상에 동의하지 않아서 발음 비교는 하지 않아요. 바꾸고 싶으면 <a href="#/p/consent" style="color:var(--v-primary-d);font-weight:700">동의·설정</a>에서 바꿀 수 있어요.</p>`
          : p ? h`<p class="v-small v-muted" style="margin:4px 0 12px">같은 문장을 수업 전·후에 읽은 소리를 비교했어요.</p>${V.consent.analyzeOK(s) ? h`<div class="v-score"><div class="n b"><small>Before</small>${p.before.overall}</div><div class="arrow">${icon('arrow-right', 22)}</div><div class="n"><small>After</small>${p.after.overall}</div><div class="gain">${p.delta > 0 ? '+' : ''}${p.delta}<small>${p.change.label}</small></div></div>` : h`<p class="v-small v-muted">점수 계산에 동의하지 않아서 점수 없이 소리만 비교해요.</p>`}
            ${V.consent.shareOK(s) ? h`<a class="v-btn" style="margin-top:16px" href="#/p/compare">${icon('volume', 18)}듣고 비교하기</a>` : h`<p class="v-note">소리는 선생님만 들어요(수업 기록용 동의). 가족도 듣고 싶으시면 <a href="#/p/consent" style="color:var(--v-primary-d);font-weight:700">동의·설정</a>에서 바꿔 주세요.</p>`}`
          : h`<p class="v-small v-muted" style="margin-top:6px">단원이 끝나면 Before와 After를 나란히 들려 드려요.</p>`}</section>
        ${pair && pair.comment ? h`<section class="v-card"><div class="row" style="display:flex;gap:10px;align-items:center;margin-bottom:8px">${V.av(t.name, 36)}<b>${t.name} 선생님 한마디</b></div><p class="v-quote">“${pair.comment}”</p></section>` : ''}
        ${b ? h`<section class="v-card"><div class="v-kit"><div class="v-cover" style="width:72px">${S.cover(b.vol)}</div><div class="grow" style="flex:1"><div class="v-eyebrow">이번 달 가정 키트</div><div class="tt">${b.vol.kit.name}</div><div class="ds">${b.vol.no}권 · ${b.vol.titleKo}</div></div></div><button class="v-btn sm" style="margin-top:12px" data-act="v.kit" data-v="${b.vol.id}">구성품 보기</button></section>` : ''}
        ${notifyCard(s, t)}
        <p class="v-note" style="text-align:center;margin-top:18px">수업을 설계하기 위한 참고예요. 진단이나 평가가 아니에요.</p>`;
    }
  });
  ICME.actions['v.home'] = (el) => { ICME.store.mutate((d) => { d.homeDone = d.homeDone || {}; d.homeDone[el.dataset.sid] = !d.homeDone[el.dataset.sid]; }); V.render(); };
  ICME.actions['v.kit'] = (el) => { const vol = q.volOf(el.dataset.v); V.sheet(h`<h2 class="v-h2">${vol.kit.name}</h2><p class="v-sub" style="margin-bottom:8px">구매는 센터에서 안내해 드려요. (시안)</p><ul class="v-small" style="display:flex;flex-direction:column;gap:8px">${vol.kit.items.map((i) => h`<li>· ${i.n}${i.qty ? h` <span class="v-faint">${i.qty}</span>` : ''}</li>`)}</ul><div class="v-btns"><button class="v-btn primary" data-act="v.sheet.close" data-close>닫기</button></div>`); };

  /* ======================================================== 발음 비교 (학부모) */
  V.add('/p/compare', {
    title: '발음 비교',
    render() {
      const s = V.kid(); const ps = V.pronState(s);
      if (ps.st !== 'both') return h`${V.back('/p/report', '리포트')}<div class="v-empty"><b>아직 비교할 수 없어요</b>단원이 끝나면 Before와 After를 나란히 들려 드려요.</div>`;
      if (!V.consent.shareOK(s)) return h`${V.back('/p/report', '리포트')}<div class="v-empty"><b>가족에게는 공유되지 않아요</b>수업 기록용으로만 동의하셔서 소리는 선생님만 들어요.<a class="v-btn" style="margin-top:16px" href="#/p/consent">동의·설정 바꾸기</a></div>`;
      return h`${V.back('/p/report', '리포트')}<div class="v-head"><h1 class="v-h1">${s.name}의 발음 전·후</h1></div>${V.compareBlocks(s, ps.pair)}
        <p class="v-note" style="text-align:center">같은 아이의 전·후 변화만 비교해요. 점수는 참고용이에요.</p>`;
    }
  });
})();

</script>
<script>/* js/v2/survey.js */
/* v2/survey.js — 아이와 함께 K-ISEL 설문. 본사 문항 은행(bank.js)에 등록된 문항으로 단계별로 나가요.
   · 이번 달 점검 단계 = 그 아이 반의 이달 주제 영역 (진단 → 주제 선정 → 수업 흐름)
   · 문항이 몇 개든(원문이 다 올라오기 전엔 단계마다 4개) 있는 만큼 나가고, 100문항이 채워지면 단계마다 20문항이 돼요
   · 중간에 멈춰도 이어서 하고, 끝나면 그 단계 점수가 아이 프로필에 들어가요 */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const SC = ICME.scoring; const S = ICME.shared; const A = ICME.art;
  const db = () => ICME.store.db;
  const STAGE_BG = ['room', 'class', 'track', 'river', 'park']; const STAGE_WHO = ['dami', 'sora', 'jiho', 'hajun', 'dami'];

  /* 점검 단계 (1~5) = 그 달 키워드의 영역. 학부모가 월을 고르면 그 달 키워드의 설문이 나와요(본사가 월별 키워드를 정해요: js/data/months.js).
     반의 이달 수업 주제(센터장이 아이들 점수를 보고 정하는 것)와는 따로예요. m을 빼면 이번 달이에요 */
  V.stageFor = function (s, m) { return ICME.monthKw(m || (ICME.today().getMonth() + 1)).area; };
  V.kidProg = (s) => { const p = (db().kprog || {})[s.id]; return p && p.stage === V.stageFor(s) ? p : null; };
  /* 문항 하나의 점수(1~4): 척도는 고른 값, 상황 선택은 선택지별 점수(기본 4·2·1) */
  const score4 = (it, v) => (it.type === 'scenario' ? (V.scoresOf(it)[v] || 1) : (it.reverse ? 5 - v : v));
  /* 문항 그림: 발표자료 대표 질문은 준비된 장면, 나머지는 단계별 기본 장면 */
  const sceneFor = (it) => { const st = ICME.kid.steps[it.stage - 1]; return st && it.no === 1 ? st.scene : { bg: STAGE_BG[it.stage - 1], items: [['kid', STAGE_WHO[it.stage - 1], 'calm', 'stand', 205, 252, 1.15]] }; };

  V.vs.kid = null;
  V.add('/p/kid', {
    title: '아이와 함께',
    render() {
      const s = V.kid(); const stage = V.stageFor(s); const items = V.bankItems(stage); const a = ICME.kisel.areas[stage - 1]; const n = items.length; const face = ICME.kid.face;
      if (V.consent.needsAgree(s)) return h`${V.back('/p', '처음으로')}<div class="v-empty"><b>먼저 동의가 필요해요</b>처음 화면에서 보호자가 동의하면 시작할 수 있어요.<a class="v-btn primary" style="margin-top:16px" href="#/p">처음으로</a></div>`;
      let K = V.vs.kid; if (!K || K.sid !== s.id) { const km = /[?&]kid=([0-9]+)/.exec(location.search); K = V.vs.kid = { sid: s.id, i: km ? Math.min(Number(km[1]), n) : -1, lock: false, helped: false, demo: !!km }; }   // ?kid=N: 캡처용
      if (!n) return h`${V.back('/p', '처음으로')}<div class="v-empty"><b>이 단계의 문항이 아직 없어요</b>본사가 문항을 등록하면 시작할 수 있어요.</div>`;
      const P = (K.demo && !V.kidProg(s)) ? { ans: { 1: 0, 2: 3, 3: 4 } } : V.kidProg(s) || { ans: {} };
      let inner;
      if (K.i === -1) {
        const done = items.filter((it) => P.ans[it.no] != null).length;
        inner = h`<div class="kid-top"><a class="kid-btn-ic" href="#/p" data-act="v.kid.exit" aria-label="나가기">${icon('x', 22)}</a><span class="spacer"></span></div>
          <div class="kid-center"><div class="wiggle">${raw('<svg viewBox="0 0 100 150" width="170" height="255">' + A.kidInner(S.charFor(s), 'happy', 'wave') + '</svg>')}</div><h1>안녕, ${s.name}!<br>우리 같이 마음 이야기 해볼까?</h1><p>${done ? h`${done}/${n}문항 했어요.<br>이어서 해 볼까?` : h`정답은 없어요.<br>마음 가는 대로 눌러 줘요!`}</p></div>
          <label class="check" style="font-family:var(--font);justify-content:center;margin-bottom:12px;font-size:14px"><input type="checkbox" data-change="v.kid.helped" ${K.helped ? raw('checked') : ''} style="accent-color:#ffb02e">어른이 옆에서 도와줬어요</label>
          <button class="kid-big" data-act="v.kid.start">${done && done < n ? '이어서 하기!' : '시작하기!'}</button>`;
      } else if (K.i >= n) {
        inner = h`<div class="kid-center"><div class="pop-star">${raw('<svg viewBox="0 0 100 100" width="150" height="150"><path d="M50 6l12 28 30 3-22 20 7 30-27-15-27 15 7-30L8 37l30-3z" fill="#ffd23f" stroke="#f5a300" stroke-width="3" stroke-linejoin="round"/></svg>')}</div><h1>참 잘했어요!</h1><p>${s.name}의 마음 이야기를 들려줘서<br>정말 고마워요.</p></div>
          <button class="kid-big green" data-act="v.kid.done">어른에게 알려주세요</button>`;
      } else {
        const it = items[K.i]; const ans = P.ans[it.no]; const head = ICME.kid.steps[it.stage - 1];
        const opts = it.type === 'scenario' && it.opts && it.opts.length
          ? h`<div class="kid-opts">${it.opts.map((t, i) => { const ic = it.no === 1 && head && head.opts && head.opts[i] ? head.opts[i].ic : null; return h`<button class="kid-opt ${ans === i ? 'on' : ''}" data-act="v.kid.ans" data-v="${i}">${ic ? raw(A.icon(ic, 52)) : h`<span class="v-optno">${i + 1}</span>`}<span>${t}</span></button>`; })}</div>`
          : h`<div class="kid-scale">${ICME.kid.scale.map((o) => h`<button class="${ans === o.v ? 'on' : ''}" data-act="v.kid.ans" data-v="${o.v}">${face(o.e, 54)}<span>${o.t}</span></button>`)}</div>`;
        inner = h`<div class="kid-top"><a class="kid-btn-ic" href="#/p" data-act="v.kid.exit" aria-label="나가기">${icon('x', 22)}</a><div class="kid-prog">${items.map((_, i) => h`<i class="${i <= K.i ? 'on' : ''}"></i>`)}</div><button class="kid-btn-ic" data-act="v.kid.read" aria-label="읽어주기">${icon('volume', 22)}</button></div>
          <div class="kid-scene">${raw(A.scene(sceneFor(it), { alt: '문항 그림' }))}</div>
          <div class="kid-q">${it.text}<small>${a.no}단계 · ${K.i + 1} / ${n} · 정답은 없어요</small></div>${opts}
          ${K.i > 0 ? h`<button class="kid-prev" data-act="v.kid.prev">← 이전 문항</button>` : ''}`;
      }
      return h`<div class="v-kidhost"><div class="kid-wrap">${inner}</div></div>`;
    }
  });
  ICME.actions['v.kid.exit'] = () => { V.vs.kid = null; V.go('/p'); };   // 나가면 진행한 곳까지는 저장돼 있고, 다시 들어오면 "이어서 하기"로 시작해요
  ICME.actions['v.kid.prev'] = () => { const K = V.vs.kid; if (!K || K.lock || K.i <= 0) return; K.i -= 1; V.render(); window.scrollTo(0, 0); };   // 잘못 눌렀을 때 한 문항 앞으로 (다시 답하면 바뀌어요)
  ICME.actions['v.kid.helped'] = (el) => { if (V.vs.kid) V.vs.kid.helped = el.checked; };
  ICME.actions['v.kid.start'] = () => {
    const s = V.kid(); const stage = V.stageFor(s); const items = V.bankItems(stage); const K = V.vs.kid;
    ICME.store.mutate((d) => { d.kprog = d.kprog || {}; const old = d.kprog[s.id]; d.kprog[s.id] = old && old.stage === stage && Object.keys(old.ans).length < items.length ? old : { stage, ans: {}, ms: 0 }; d.kprog[s.id].helped = !!K.helped || !!d.kprog[s.id].helped; d.kprog[s.id].last = Date.now(); });
    const P = V.kidProg(s); const first = items.findIndex((it) => P.ans[it.no] == null); K.i = first < 0 ? 0 : first; K.demo = false; V.render(); window.scrollTo(0, 0);
  };
  ICME.actions['v.kid.read'] = () => {
    const s = V.kid(); const it = V.bankItems(V.stageFor(s))[V.vs.kid.i]; if (!it) return;
    S.speak(it.text + (it.type === 'scenario' && it.opts ? ' ' + it.opts.map((o, i) => (i + 1) + '번, ' + o).join('. ') : ' 아주 맞아요, 조금 맞아요, 잘 모르겠어요, 아니에요 중에 골라 줘요.'), 'ko-KR');
  };
  ICME.actions['v.kid.ans'] = (el) => {
    const K = V.vs.kid; if (K.lock) return; K.lock = true;
    const s = V.kid(); const stage = V.stageFor(s); const it = V.bankItems(stage)[K.i];
    ICME.store.mutate((d) => { d.kprog = d.kprog || {}; const p = d.kprog[s.id] = d.kprog[s.id] && d.kprog[s.id].stage === stage ? d.kprog[s.id] : { stage, ans: {}, ms: 0, last: Date.now() }; const now = Date.now(); p.ms = (p.ms || 0) + Math.min(60000, now - (p.last || now)); p.last = now; p.ans[it.no] = Number(el.dataset.v); });
    V.render();
    setTimeout(() => { K.i++; K.lock = false; V.render(); window.scrollTo(0, 0); }, 700);
  };
  ICME.actions['v.kid.done'] = () => {
    const s = V.kid(); const stage = V.stageFor(s); const items = V.bankItems(stage); const p = V.kidProg(s); const K = V.vs.kid;
    if (p) {
      const vals = items.map((it) => score4(it, p.ans[it.no] == null ? 2 : p.ans[it.no]));
      const mins = ICME.round1((p.ms / 60000) * (20 / items.length));   // 20문항으로 환산한 응답 시간(너무 빠른 응답 표시에 써요)
      ICME.store.mutate((d) => { const x = d.students.find((y) => y.id === s.id); x.survey.child.items = x.survey.child.items || [null, null, null, null, null]; x.survey.child.items[stage - 1] = vals; x.survey.child.fresh = true; x.survey.child.done = true; x.survey.child.helped = !!p.helped; x.survey.child.mins = mins; x.survey.child.date = ICME.ymd(ICME.today()); x.kisel.st = 'done'; x.kisel.answered = 20; delete d.kprog[s.id]; });
    }
    V.vs.kid = null; ui.toast('고마워요! 아이 이야기를 저장했어요'); V.go('/p');
  };
})();

</script>
<script>/* js/v2/admin.js */
/* v2/admin.js — 센터장: 이번 달 점검이 어디까지 됐는지 보고, 아직 안 한 가정에 알림을 보내는 한 화면.
   (교사 채용·시간표·서류 같은 관리 기능은 1차 버전에서 뺐어요. 필요해지면 그때 하나씩 더해요.) */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const SC = ICME.scoring;
  const parentDone = (s) => !!(s.survey && s.survey.parent && s.survey.parent.done);
  const aTabs = (on) => V.aTabs(on);

  /* ======================================================== 이번 달 주제 선정 (진단 → 주제 선정 → 영어미술 수업) */
  V.add('/a/theme', {
    title: '이번 달 주제', wide: true,
    render() {
      const classes = q.classesOf(V.cid()).filter((k) => k.program === 'ART').sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
      const vols = ICME.materials.volumes;
      const row = (k) => {
        const kids = q.studentsOfClass(k.id); const rec = q.recommend(k); const cur = q.themeFor(k); const lowN = kids.filter((s) => { const f = SC.profile(s).lowest[0]; return f && f.area.no === rec.area.no; }).length; const manual = cur.by === 'manual';
        return h`<div class="v-slot"><div class="tx"><div><b>${k.name}</b> <span class="v-faint v-xs">${ICME.DOW[k.day]} ${k.start} · ${kids.length}명</span></div><div class="v-xs v-muted" style="margin-top:4px">추천 · ${ICME.kisel.areas[rec.area.no - 1].name} <span class="v-faint">(${kids.length}명 중 ${lowN}명이 이 영역이 가장 낮아요)</span></div></div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><select class="v-select" data-change="a.theme" data-id="${k.id}" aria-label="${k.name} 이달의 주제">${vols.map((v) => h`<option value="${v.id}" ${v.id === cur.vol ? raw('selected') : ''}>${v.no}권 ${v.titleKo}${v.id === rec.vol ? ' (추천)' : ''}</option>`)}</select>${manual ? h`<span class="v-xs v-faint">직접 정했어요 · <a href="#/a/theme" data-act="a.themeReset" data-id="${k.id}" style="text-decoration:underline">추천으로 되돌리기</a></span>` : h`<span class="v-xs v-faint">추천대로 진행해요</span>`}</div></div>`;
      };
      return h`<div class="v-head"><div class="v-eyebrow">${(q.center(V.cid()) || {}).name}</div><h1 class="v-h1">이번 달 주제</h1><p class="v-sub">반 아이들의 마음 점검 결과에서 가장 낮은 영역이 추천돼요. 그대로 두면 추천대로 수업하고, 바꾸고 싶으면 바꿀 수 있어요.</p></div>${aTabs('theme')}
        <div class="v-list" style="margin-top:14px">${classes.map(row)}</div>
        <p class="v-note">정한 주제는 선생님의 "우리반"에 "이번 달 수업"으로 나타나요.</p>`;
    }
  });
  ICME.actions['a.theme'] = (el) => {
    const k = q.klass(el.dataset.id); const rec = q.recommend(k);
    ICME.store.mutate((d) => { if (el.value === rec.vol) delete d.monthTheme[k.id]; else d.monthTheme[k.id] = { vol: el.value, by: 'manual' }; });
    ui.toast(k.name + ' 주제를 바꿨어요'); V.render();
  };
  ICME.actions['a.themeReset'] = (el) => { ICME.store.mutate((d) => { delete d.monthTheme[el.dataset.id]; }); ui.toast('추천대로 되돌렸어요'); V.render(); };

  V.add('/a', {
    title: '센터장', wide: true,
    render() {
      const kids = q.studentsOf(V.cid()); const total = kids.length; const cDone = kids.filter((s) => s.kisel.st === 'done').length; const pDone = kids.filter(parentDone).length;
      const pend = kids.filter((s) => s.kisel.st !== 'done' || !parentDone(s)); const nudged = (ICME.store.db.nudged || {}); const todo = pend.filter((s) => !nudged[s.id]);
      const cls = (s) => q.klass(s.classIds[0]).name;
      const chip = (ok, label) => (ok ? h`<span class="v-tag ok">완료</span>` : h`<span class="v-tag">${label}</span>`);
      const stat = (label, n, sub) => h`<div class="v-stat"><div class="lb">${label}</div><div class="vl">${n}<small>/ ${total}명</small></div><div class="v-bar"><i style="width:${ICME.pct(n, total)}%"></i></div><div class="v-xs v-muted" style="margin-top:8px">${sub}</div></div>`;
      const reqs = (ICME.store.db.requests || []).filter((r) => !r.done && (q.student(r.sid) || {}).centerId === V.cid()); const KIND = { read: '개인정보 열람 요청', delete: '녹음·영상 삭제 요청', withdraw: '동의 철회 요청' };
      const nCard = h`${V.ownerNotices ? V.ownerNotices(V.cid()) : ''}${V.ownerSignups ? V.ownerSignups(V.cid()) : ''}${V.ownerEvents ? V.ownerEvents(V.cid()) : ''}`; const hasN = String(nCard).trim().length > 0;   // 본사 공지 (hqops.js) · 다가오는 교육·행사 (hqstat.js)
      const t0 = ICME.today(); const nextDay = new Date(t0.getFullYear(), t0.getMonth() + 1, 1);
      const reqCard = reqs.length ? h`<section class="v-card warm" id="o-req" style="margin-top:0;margin-bottom:14px"><h2 class="v-h2">보호자 요청 ${reqs.length}건</h2><div style="margin-top:6px">${reqs.map((r) => { const s = q.student(r.sid); return h`<div class="v-doc"><div class="tx"><b>${s ? s.fullName : '아이'}</b> 보호자 · ${KIND[r.kind]}<small>${ICME.dateShort(r.date)} 접수</small></div><button class="v-btn sm primary" data-act="a.reqDone" data-id="${r.id}">처리 완료</button></div>`; })}</div><p class="v-note">처리 완료를 누르면 보호자에게 알려요. 삭제 요청은 아이의 녹음·영상이 지워져요. 개인정보 요청은 기한 안에 처리해야 해요.</p></section>` : '';
      /* 오늘 할 일: 본사 공지 → 보호자 요청 → 알림 보내기 → 교사 서류·교육 → 담당 없는 반 (급한 순서, 최대 4개) */
      const unreadN = V.ownerUnread ? V.ownerUnread(V.cid()) : 0; const badT = q.teachersOf(V.cid()).filter((x) => x.status !== '퇴사' && q.teacherAlerts(x).some((a) => a.level === 'high')); const freeK = q.classesOf(V.cid()).filter((k) => !k.teacherId);
      const todoItems = []; const signN = V.ownerSignupN ? V.ownerSignupN(V.cid()) : 0;
      if (unreadN) todoItems.push({ t: '본사 공지 ' + unreadN + '개를 확인해 주세요', d: '읽고 "확인했어요"를 누르면 본사에도 전해져요', label: '공지 보기', act: 'e.jump', data: { to: 'o-notice' } });
      if (signN) todoItems.push({ t: '우리 센터 가입 신청 ' + signN + '건을 확인해 주세요', d: '아는 분인지 표시하면 본사가 보고 승인해요', label: '신청 보기', act: 'e.jump', data: { to: 'o-signup' } });
      if (reqs.length) todoItems.push({ t: '보호자 요청 ' + reqs.length + '건을 처리해 주세요', d: '개인정보 요청은 접수 후 10일 안에 처리해야 해요', label: '요청 보기', act: 'e.jump', data: { to: 'o-req' } });
      if (todo.length) todoItems.push({ t: '아직 안 한 ' + todo.length + '가정에 알림을 보내요', d: '카카오 알림톡으로 링크가 가요. 구매 안내는 들어가지 않아요', label: '알림 보내기', act: 'a.nudge', data: { all: 1 } });
      if (badT.length) todoItems.push({ t: '서류·교육 확인이 급한 선생님 ' + badT.length + '명', d: badT.map((x) => x.name).join(' · '), label: '교사 보기', href: '/a/teachers' });
      if (freeK.length) todoItems.push({ t: '담당 선생님이 없는 반 ' + freeK.length + '개', d: freeK.map((k) => k.name).join(' · '), label: '반 보기', href: '/a/classes' });
      const hero = V.today({ k: '오늘 · ' + ICME.dateKo(t0), items: todoItems, max: 4, doneTitle: '오늘 할 일을 모두 마쳤어요', doneText: pend.length ? pend.length + '가정에는 알림을 보냈어요. 3일, 7일 뒤에 자동으로 한 번씩 더 알려요.' : '이번 달 점검이 모두 끝났어요. 수고하셨어요.' });
      return h`<div class="v-head"><div class="v-eyebrow">${(q.center(V.cid()) || {}).name}</div><h1 class="v-h1">${t0.getMonth() + 1}월 마음 점검</h1><p class="v-sub">아이 이야기와 부모 설문이 모두 모이면 선생님 화면과 학부모 리포트가 자동으로 만들어져요.</p></div>${aTabs('now')}${hero}${hasN || reqCard ? h`<div style="margin-top:14px"></div>` : ''}${nCard}${reqCard}
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px">${stat('아이 이야기', cDone, '그림 카드로 5분')}${stat('부모 설문', pDone, '1분 · 10문항')}<div class="v-stat"><div class="lb">아직 안 한 가정</div><div class="vl">${pend.length}<small>가정</small></div><div class="v-xs v-muted" style="margin-top:20px">알림을 보내면 3일 뒤 한 번 더 알려요</div></div></div>
        ${todo.length ? ''
          : pend.length ? h`<div class="v-cta sent"><div><b>${pend.length}가정에 알림을 보냈어요</b><span>그래도 안 하신 가정에는 3일, 7일 뒤에 자동으로 한 번씩 더 알려요.</span></div></div>` : ''}
        <div class="v-grid2" style="margin-top:18px"><section class="v-card" style="margin-top:0;padding:8px 8px 4px"><h2 class="v-h2" style="padding:12px 14px 0">아직 안 한 아이</h2>
          <div class="au-xwrap"><table class="v-tbl"><thead><tr><th>아이</th><th>반</th><th>아이 이야기</th><th>부모 설문</th><th></th></tr></thead><tbody>${pend.slice(0, 12).map((s) => h`<tr><td><b>${s.name}</b> <span class="v-faint v-xs">${s.age}세</span></td><td class="v-muted">${cls(s)}</td><td>${chip(s.kisel.st === 'done', s.kisel.st === 'progress' ? '진행 중' : '대기')}</td><td>${chip(parentDone(s), '대기')}</td><td style="text-align:right">${nudged[s.id] ? h`<span class="v-xs v-faint">보냄</span>` : h`<button class="v-btn sm" data-act="a.nudge" data-sid="${s.id}">알림</button>`}</td></tr>`)}</tbody></table></div>
          ${pend.length > 12 ? h`<p class="v-note" style="padding:6px 14px 12px">그 밖에 ${pend.length - 12}명이 더 있어요. 알림 보내기를 누르면 모두에게 가요.</p>` : ''}</section>
          <section class="v-card" style="margin-top:0"><h2 class="v-h2">자동으로 나가요</h2><ul class="v-small" style="display:flex;flex-direction:column;gap:12px;margin-top:12px"><li><b>다음 점검</b><div class="v-muted">${ICME.dateKo(nextDay)}에 자동 발송 · 3일 전에 먼저 알려 드려요</div></li><li><b>알림 안 한 가정</b><div class="v-muted">3일, 7일 뒤에 자동으로 한 번씩 더 알려요</div></li><li><b>센터장이 하는 일</b><div class="v-muted">일정을 바꾸거나 멈추고 싶을 때만 눌러요</div></li></ul></section></div>
        ${V.monOwnerCard ? h`<div style="margin-top:18px">${V.monOwnerCard(V.cid())}</div>` : ''}`;
    }
  });
  /* 보호자 요청 "처리 완료": 지우기·철회·자료 보내기는 되돌릴 수 없어서 누르기 전에 한 번 물어요 */
  ICME.actions['a.reqDone'] = (el) => {
    const r = (ICME.store.db.requests || []).find((x) => x.id === el.dataset.id); if (!r) return;
    const s0 = q.student(r.sid); const who = s0 ? s0.fullName : '아이';
    const T = { delete: ['녹음·영상을 지울까요?', who + '의 발음 녹음·영상이 모두 지워져요. 지운 뒤에는 되돌릴 수 없어요. 보호자께도 알려요.', '지울게요', true], withdraw: ['동의 철회를 처리할까요?', '녹음이 멈추고, 다시 시작하려면 보호자가 새로 동의해야 해요.', '처리할게요', false], read: ['열람 자료를 보낼까요?', who + '의 정보를 정리해 보호자께 보내요.', '보낼게요', false] }[r.kind] || ['처리할까요?', '', '처리할게요', false];
    V.ask({ title: T[0], text: T[1], ok: T[2], danger: T[3], onOk: () => reqDone(r.id) });
  };
  const reqDone = (id) => {
    const r = (ICME.store.db.requests || []).find((x) => x.id === id); if (!r) return;
    ICME.store.mutate((d) => {
      const rr = d.requests.find((x) => x.id === r.id); rr.done = true; rr.doneAt = ICME.ymd(ICME.today());
      const s = d.students.find((x) => x.id === r.sid); if (!s) return;
      if (r.kind === 'delete') { d.videos = d.videos.filter((v) => v.studentId !== s.id); s.video = { before: false, after: false }; }
      if (r.kind === 'withdraw') s.consent = { video: 'none', reco: false, analyze: false, agreedAt: null };
    });
    if (r.kind === 'delete') { delete V.audio[r.sid + ':before']; delete V.audio[r.sid + ':after']; }
    ui.toast(r.kind === 'delete' ? '녹음·영상을 지우고 보호자께 알렸어요 (시안)' : r.kind === 'withdraw' ? '동의 철회를 처리했어요. 다시 시작하려면 보호자가 새로 동의해야 해요' : '열람 자료를 보호자께 보냈어요 (시안)'); V.render();
  };
  ICME.actions['a.nudge'] = (el) => {
    const kids = q.studentsOf(V.cid()).filter((s) => s.kisel.st !== 'done' || !parentDone(s)); const ids = el.dataset.all ? kids.filter((s) => !(ICME.store.db.nudged || {})[s.id]).map((s) => s.id) : [el.dataset.sid];
    const send = () => { ICME.store.mutate((d) => { d.nudged = d.nudged || {}; ids.forEach((id) => { d.nudged[id] = ICME.ymd(ICME.today()); }); }); ui.toast(ids.length > 1 ? ids.length + '가정에 알림을 보냈어요 (시안)' : '알림을 보냈어요 (시안)'); V.render(); };
    if (ids.length > 1) V.ask({ title: ids.length + '가정에 알림을 보낼까요?', text: '카카오 알림톡으로 설문 링크가 가요. 구매 안내는 들어가지 않아요. 보낸 뒤에는 되돌릴 수 없어요.', ok: '보낼게요', cancel: '아니요', onOk: send });
    else send();   // 한 가정에 보내는 알림은 바로 보내요
  };
})();

</script>
<script>/* js/v2/owner.js */
/* v2/owner.js — 센터장: 교사 관리 · 반·아이 관리.
   원칙: 관리할 "대상"이 메뉴예요(교사, 반·아이). 목록은 "확인할 것"이 있는 사람이 위로, 눌러서 상세, 할 수 있는 일은 버튼으로. */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const TU = ICME.teachersUI;
  const db = () => ICME.store.db; const cname = () => (q.center(V.cid()) || {}).name || ''; const DOW = ICME.DOW; const today = () => ICME.ymd(ICME.today());
  const val = (id) => (document.getElementById(id) || {}).value || '';
  const STATUS_TAG = { 재직: '', 온보딩: 'ok', 휴직: 'watch', 퇴사: '' };
  const CONSENT = { share: '영상 공유 동의', record: '수업 기록만', promo: '홍보 포함 동의', none: '영상 동의 없음' };
  const parentDone = (s) => !!(s.survey && s.survey.parent && s.survey.parent.done);
  /* 프로그램 인증이 있어야 그 프로그램 반을 맡을 수 있어요 (인증 없음·교육 중·만료는 배정 불가) */
  const certOK = (t, k) => !ICME.programs.keys.includes(k.program) || q.certified(t, k.program);
  const certMsg = (t, k) => { const c = q.certState(t, k.program); return t.name + ' 선생님은 ' + ICME.programs.byKey[k.program].short + ' 인증이 ' + (c.state === 'expired' ? '만료됐어요' : c.state === 'prog' ? '교육 중이에요' : '없어요') + '. 인증을 마친 뒤에 배정할 수 있어요.'; };
  /* 이름에서 성을 뺀 부르는 이름: 3글자는 뒤 2글자, 4글자(두 글자 성)는 뒤 2글자, 그 밖에는 그대로 */
  const givenName = (full) => (full.length >= 4 ? full.slice(2) : full.length === 3 ? full.slice(1) : full);
  const phoneOK = (p) => { const x = String(p || '').trim(); return x === '' || x === '010-' || /^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(x); };

  /* ======================================================== 교사 명부 */
  V.add('/a/teachers', {
    title: '교사', wide: true,
    render() {
      const list = q.teachersOf(V.cid()).filter((t) => t.status !== '퇴사').map((t) => ({ t, al: q.teacherAlerts(t) }));
      const hot = (x) => x.al.some((a) => a.level !== 'low');
      list.sort((a, b) => Number(hot(b)) - Number(hot(a)) || a.t.name.localeCompare(b.t.name, 'ko'));
      const need = list.filter(hot).length;
      const row = (x) => { const t = x.t; const top = x.al.find((a) => a.level !== 'low') || x.al[0]; const n = q.classesOfTeacher(t.id).length;
        return h`<a class="v-kid" href="#/a/teachers/${t.id}">${V.av(t.name, 46)}<div class="main"><div class="nm">${t.name}<small>${t.role} · ${t.emp}</small></div><div class="ds">담당 반 ${n}개${n ? ' · 주 ' + q.teacherHours(t.id) + '시간' : ''} · 필수 교육 ${Math.round(q.trainingRate(t) * 100)}%</div></div>${top ? h`<span class="v-tag watch">${top.text}</span>` : h`<span class="v-tag ok">확인할 것 없음</span>`}<span class="v-tag ${STATUS_TAG[t.status]}">${t.status}</span>${icon('chevron-right', 18, 'chev')}</a>`; };
      return h`<div class="v-head"><div class="v-eyebrow">${cname()}</div><h1 class="v-h1">교사</h1><p class="v-sub">초대하면 서류 요청과 필수 교육이 자동으로 배정돼요. 주황색 표시가 있는 교사만 확인하면 돼요.</p></div>${V.aTabs('teachers')}
        <div class="v-bar-top"><span class="v-small v-muted">${list.length}명${need ? ' · 확인할 교사 ' + need + '명' : ''}</span><button class="v-btn primary" data-act="a.invite">${icon('user-plus', 18)}교사 초대</button></div>
        <div class="v-list">${list.map(row)}</div>`;
    }
  });
  ICME.actions['a.invite'] = () => V.sheet(h`<h2 class="v-h2">교사 초대</h2><p class="v-sub">초대하면 가입 링크가 가고, 서류 요청과 필수 교육이 자동으로 배정돼요.</p>
    <label class="v-field"><span>이름</span><input id="i-name" class="v-input" placeholder="홍길동"></label>
    <label class="v-field"><span>연락처</span><input id="i-phone" class="v-input" value="010-"></label>
    <label class="v-field"><span>역할</span><select id="i-role" class="v-input"><option>강사</option><option>보조강사</option></select></label>
    <label class="v-field"><span>고용 형태</span><select id="i-emp" class="v-input"><option>시간제</option><option>정규</option></select></label>
    <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="a.inviteGo">${icon('send', 18)}초대 보내기</button></div>`);
  ICME.actions['a.inviteGo'] = () => {
    const name = val('i-name').trim(); if (!name) { ui.toast('이름을 입력해 주세요', 'warn'); return; } if (name.length > 12) { ui.toast('이름은 12자 이하로 적어 주세요', 'warn'); return; }
    if (!phoneOK(val('i-phone'))) { ui.toast('연락처를 확인해 주세요 (예: 010-1234-5678)', 'warn'); return; }
    const t = TU.create({ name, phone: val('i-phone'), role: val('i-role'), emp: val('i-emp'), programs: [], centerId: V.cid() });
    V.closeSheet(); ui.toast(name + ' 선생님께 초대 알림톡을 보냈어요 (시안) · 서류·교육 자동 배정'); V.go('/a/teachers/' + t.id);
  };

  /* ======================================================== 교사 상세 */
  const COURSE_TAG = { done: ['이수', 'ok'], prog: ['진행 중', ''], todo: ['미이수', 'watch'], late: ['만료', 'watch'], opt: ['권장', ''], na: ['해당 없음', ''] };
  const DOC_TAG = { ok: 'ok', submitted: '', missing: 'watch', expired: 'watch', expiring: 'watch' };
  /* 교사 상세 — 센터장(수정 가능)와 본사(보기만)가 같이 써요. opt = { back: [주소, 이름], canAct, classHref(반 id → 주소), centerId } */
  V.teacherPage = function (t, opt) {
    const canAct = !!opt.canAct; const al = q.teacherAlerts(t); const classes = q.classesOfTeacher(t.id); const free = canAct ? q.classesOf(t.centerId).filter((k) => !k.teacherId) : [];
    const docRow = (d) => { const st = q.docState(t, d.key); const act = canAct && st.state !== 'ok' ? h`<button class="v-btn sm primary" data-act="a.doc" data-tid="${t.id}" data-key="${d.key}">확인 처리</button>${st.state === 'missing' ? h`<button class="v-btn sm" data-act="a.docRemind" data-key="${d.key}">알림</button>` : ''}` : '';
      return h`<div class="v-doc"><div class="tx">${d.label}<small>${d.hint}</small></div><span class="v-tag ${DOC_TAG[st.state]}">${st.label}</span>${act}</div>`; };
    const crs = q.requiredCourses(t).map((id) => { const c = ICME.training.byId[id]; const st = COURSE_TAG[q.courseState(t, id)] || COURSE_TAG.todo; return h`<div class="v-doc"><div class="tx">${c.title}<small>${c.kind} · ${c.min}분${c.gate ? ' · ' + c.gate : ''}</small></div><span class="v-tag ${st[1]}">${st[0]}</span></div>`; });
    const certs = ICME.programs.keys.map((k) => { const c = q.certState(t, k); return h`<span class="v-tag ${c.state === 'ok' ? 'ok' : c.state === 'expiring' || c.state === 'expired' ? 'watch' : ''}">${ICME.programs.byKey[k].short} ${c.label}</span>`; });
    const classTitle = (k) => (opt.classHref ? h`<a href="#${opt.classHref(k.id)}" style="font-weight:700">${k.name}</a>` : h`<b>${k.name}</b>`);
    return h`${V.back(opt.back[0], opt.back[1])}
      <div class="v-head" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${V.av(t.name, 64)}<div style="flex:1;min-width:min(200px,100%)"><h1 class="v-h1">${t.name}</h1><div class="v-sub" style="margin-top:2px">${t.role} · ${t.emp} · 입사 ${ICME.dateFull(t.hired)} · <span class="v-tag ${STATUS_TAG[t.status]}">${t.status}</span></div></div>${canAct ? h`<div style="display:flex;gap:8px"><button class="v-btn sm" data-act="a.status" data-id="${t.id}">상태 변경</button></div>` : ''}</div>
      <div class="v-grid2"><div>
        <section class="v-card" style="margin-top:0"><h2 class="v-h2">확인할 것</h2>${al.length ? h`<ul style="margin-top:10px;display:flex;flex-direction:column;gap:8px">${al.map((a) => h`<li class="v-small"><span class="v-tag ${a.level === 'low' ? '' : 'watch'}" style="margin-right:8px">${a.level === 'high' ? '급해요' : a.level === 'mid' ? '확인' : '참고'}</span>${a.text}</li>`)}</ul>` : h`<p class="v-small v-muted" style="margin-top:8px">지금 확인할 것이 없어요.</p>`}</section>
        <section class="v-card"><h2 class="v-h2">서류 <span class="v-faint v-small" style="font-weight:600">원본은 저장하지 않고 확인 여부만 기록해요</span></h2><div style="margin-top:6px">${ICME.training.docTypes.map(docRow)}</div></section>
      </div><div>
        <section class="v-card" style="margin-top:0"><h2 class="v-h2">담당 반</h2>
          ${classes.length ? h`<div style="margin-top:6px">${classes.map((k) => h`<div class="v-doc"><div class="tx">${classTitle(k)}<small>${DOW[k.day]} ${k.start} · ${k.min}분 · ${q.studentsOfClass(k.id).length}명</small></div>${canAct ? h`<button class="v-btn sm ghost" data-act="a.unassign" data-id="${k.id}">해제</button>` : ''}</div>`)}</div>` : h`<p class="v-small v-muted" style="margin-top:8px">담당 반이 없어요.</p>`}
          ${!canAct ? '' : free.length && t.status !== '휴직' ? h`<div style="display:flex;gap:8px;margin-top:12px"><select id="as-class" class="v-input" aria-label="배정할 반">${free.map((k) => h`<option value="${k.id}">${k.name} · ${DOW[k.day]} ${k.start}${certOK(t, k) ? '' : ' · 인증 필요'}</option>`)}</select><button class="v-btn sm primary" data-act="a.assign" data-id="${t.id}">배정</button></div>` : h`<p class="v-note">배정할 빈 반이 없어요. 다른 반의 담당은 "반·아이"에서 바꿀 수 있어요.</p>`}</section>
        <section class="v-card"><h2 class="v-h2">교육 · 인증</h2><div style="margin-top:6px">${crs}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${certs}</div>${canAct ? h`<button class="v-btn sm" style="margin-top:12px" data-act="a.crsRemind">교육 안내 보내기</button>` : ''}</section>
      </div></div>`;
  };
  V.add('/a/teachers/:id', {
    title: '교사 상세', wide: true,
    render(ctx) {
      const t = q.teacher(ctx.params.id); if (!t || t.centerId !== V.cid()) return h`${V.back('/a/teachers', '교사')}<div class="v-empty"><b>교사를 찾을 수 없어요</b></div>`;
      return V.teacherPage(t, { back: ['/a/teachers', '교사'], canAct: true, classHref: (id) => '/a/classes/' + id });
    }
  });
  ICME.actions['a.doc'] = (el) => {
    const d = ICME.training.docTypes.find((x) => x.key === el.dataset.key);
    ICME.store.mutate((x) => { const t = x.teachers.find((y) => y.id === el.dataset.tid); t.docs[d.key] = { s: 'ok', d: today(), exp: d.expires ? ICME.ymd(ICME.addDays(ICME.today(), 365)) : undefined }; t.timeline = t.timeline || []; t.timeline.unshift({ d: today(), text: d.label + ' 확인 처리' }); });
    ui.toast(d.label + ' — 확인했어요'); V.render();
  };
  ICME.actions['a.docRemind'] = (el) => { const d = ICME.training.docTypes.find((x) => x.key === el.dataset.key); ui.toast(d.label + ' 제출 알림을 보냈어요 (시안) · 3일마다 자동으로 다시 알려요'); };
  ICME.actions['a.crsRemind'] = () => ui.toast('필수 교육 안내를 보냈어요 (시안)');
  ICME.actions['a.status'] = (el) => {
    const t = q.teacher(el.dataset.id); const opt = [['재직', '정상 근무'], ['휴직', '담당 반은 대체 배정이 필요해요. 시스템 접근이 잠시 멈춰요.'], ['퇴사', '모든 접근이 바로 막히고, 담당 반은 "담당 없음"으로 바뀌어요.']];
    V.sheet(h`<h2 class="v-h2">${t.name} · 상태 변경</h2><div class="v-choice">${opt.map((o) => h`<button class="${t.status === o[0] ? 'on' : ''}" data-act="a.statusGo" data-id="${t.id}" data-v="${o[0]}">${o[0]}<small>${o[1]}</small></button>`)}</div><div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button></div>`);
  };
  ICME.actions['a.statusGo'] = (el) => {
    const id = el.dataset.id; const v = el.dataset.v;
    ICME.store.mutate((d) => { const t = d.teachers.find((x) => x.id === id); const prev = t.status; t.status = v; if (v === '퇴사') d.classes.forEach((k) => { if (k.teacherId === id) k.teacherId = null; }); if (v === '휴직') t.leave = { from: today(), to: ICME.ymd(ICME.addDays(ICME.today(), 90)), reason: '개인 사유' }; t.timeline = t.timeline || []; t.timeline.unshift({ d: today(), text: '상태 변경: ' + prev + ' → ' + v }); });
    V.closeSheet(); ui.toast('상태를 ' + ICME.josa(v, '으로/로') + ' 바꿨어요'); V.go(v === '퇴사' ? '/a/teachers' : '/a/teachers/' + id); V.render();
  };
  ICME.actions['a.assign'] = (el) => {
    const t = q.teacher(el.dataset.id); const k = q.klass(val('as-class')); if (!k) return;
    if (!certOK(t, k)) { ui.toast(certMsg(t, k), 'warn'); return; }
    const clash = q.conflicts(t.id, k); if (clash.length) { ui.toast('시간이 겹쳐요: ' + clash[0].name + ' ' + DOW[clash[0].day] + ' ' + clash[0].start, 'warn'); return; }
    ICME.store.mutate((d) => { d.classes.find((x) => x.id === k.id).teacherId = t.id; }); ui.toast(k.name + ' 담당으로 배정했어요'); V.render();
  };
  ICME.actions['a.unassign'] = (el) => {
    const k = q.klass(el.dataset.id);
    V.ask({ title: k.name + ' 담당을 풀까요?', text: '풀면 선생님 화면에서 이 반이 사라져요. 다른 선생님을 맡겨 주세요.', ok: '풀게요', danger: true, onOk: () => { ICME.store.mutate((d) => { d.classes.find((x) => x.id === k.id).teacherId = null; }); ui.toast(k.name + ' 담당을 해제했어요. 다른 교사를 배정해 주세요', 'warn'); V.render(); } });
  };

  /* ======================================================== 반 · 아이 */
  V.add('/a/classes', {
    title: '반·아이', wide: true,
    render() {
      const list = q.classesOf(V.cid()).slice().sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
      const row = (k) => { const t = k.teacherId ? q.teacher(k.teacherId) : null; const n = q.studentsOfClass(k.id).length;
        return h`<a class="v-kid" href="#/a/classes/${k.id}"><span style="min-width:86px;flex:none">${ui.ptag(k.program)}</span><div class="main"><div class="nm">${k.name}<small>${DOW[k.day]} ${k.start} · ${k.min}분</small></div><div class="ds">${t ? '담당 ' + t.name : ''}</div></div>${t ? '' : h`<span class="v-tag watch">담당 없음</span>`}<span class="v-tag">${n}명</span>${icon('chevron-right', 18, 'chev')}</a>`; };
      const all = q.studentsOf(V.cid()).length; const nobody = list.filter((k) => !k.teacherId).length;
      return h`<div class="v-head"><div class="v-eyebrow">${cname()}</div><h1 class="v-h1">반 · 아이</h1><p class="v-sub">반을 눌러 담당 교사를 바꾸고 아이를 옮기거나 추가해요.</p></div>${V.aTabs('classes')}
        <div class="v-bar-top"><span class="v-small v-muted">반 ${list.length}개 · 아이 ${all}명${nobody ? ' · 담당 없는 반 ' + nobody + '개' : ''}</span><button class="v-btn primary" data-act="a.kidNew">${icon('user-plus', 18)}아이 등록</button></div>
        <div class="v-list">${list.map(row)}</div>`;
    }
  });
  V.add('/a/classes/:id', {
    title: '반', wide: true,
    render(ctx) {
      const k = q.klass(ctx.params.id); if (!k) return h`${V.back('/a/classes', '반·아이')}<div class="v-empty"><b>반을 찾을 수 없어요</b></div>`;
      const kids = q.studentsOfClass(k.id).slice().sort((a, b) => a.name.localeCompare(b.name, 'ko')); const teachers = q.teachersOf(V.cid(), { active: true });
      const row = (s) => h`<button class="v-kid" data-act="a.kidEdit" data-id="${s.id}">${V.av(s.name, 44)}<div class="main"><div class="nm">${s.fullName}<small>${s.age}세</small></div><div class="ds">${s.guardian} · ${s.consent.agreedAt === null ? '보호자 동의 전' : CONSENT[s.consent.video]}</div></div>${!(s.survey && s.survey.child && s.survey.child.items) ? h`<span class="v-tag">설문 전</span>` : !parentDone(s) ? h`<span class="v-tag">부모 설문 대기</span>` : h`<span class="v-tag ok">설문 완료</span>`}${icon('chevron-right', 18, 'chev')}</button>`;
      return h`${V.back('/a/classes', '반·아이')}
        <div class="v-head"><div class="v-eyebrow">${ICME.programs.byKey[k.program].ko}</div><h1 class="v-h1">${k.name}</h1><p class="v-sub">${DOW[k.day]} ${k.start} · ${k.min}분 · ${k.age}세 · 아이 ${kids.length}명</p></div>
        <section class="v-card" style="margin-top:0"><h2 class="v-h2">담당 교사</h2><label class="v-field" style="margin-top:8px"><select class="v-input" data-change="a.teach" data-id="${k.id}"><option value="">담당 없음</option>${teachers.map((t) => h`<option value="${t.id}" ${t.id === k.teacherId ? raw('selected') : ''}>${t.name} (${t.role})${certOK(t, k) ? '' : ' · 인증 필요'}</option>`)}</select></label></section>
        <div class="v-bar-top"><h2 class="v-h2">아이들</h2><button class="v-btn sm primary" data-act="a.kidNew" data-class="${k.id}">${icon('plus', 16)}아이 추가</button></div>
        <div class="v-list">${kids.length ? kids.map(row) : h`<div class="v-slot empty"><span class="tx v-faint">아직 아이가 없어요</span></div>`}</div>`;
    }
  });
  ICME.actions['a.teach'] = (el) => {
    const k = q.klass(el.dataset.id); const tid = el.value || null;
    if (tid && k.teacherId !== tid && !certOK(q.teacher(tid), k)) { ui.toast(certMsg(q.teacher(tid), k), 'warn'); V.render(); return; }
    if (tid) { const clash = q.conflicts(tid, k); if (clash.length) { ui.toast('시간이 겹쳐요: ' + clash[0].name + ' ' + DOW[clash[0].day] + ' ' + clash[0].start, 'warn'); V.render(); return; } }
    ICME.store.mutate((d) => { d.classes.find((x) => x.id === k.id).teacherId = tid; }); ui.toast(tid ? q.teacher(tid).name + ' 선생님으로 바꿨어요' : '담당을 비웠어요', tid ? 'ok' : 'warn'); V.render();
  };

  /* 아이 등록 · 수정 */
  const kidForm = (s, classId) => {
    const classes = q.classesOf(V.cid()).slice().sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
    return h`<label class="v-field"><span>이름 (성 포함)</span><input id="k-name" class="v-input" maxlength="12" value="${s ? s.fullName : ''}" placeholder="홍길동"></label>
      <label class="v-field"><span>나이</span><select id="k-age" class="v-input">${[4, 5, 6, 7, 8].map((n) => h`<option value="${n}" ${(s ? s.age : 6) === n ? raw('selected') : ''}>${n}세</option>`)}</select></label>
      <label class="v-field"><span>반</span><select id="k-class" class="v-input">${classes.map((k) => h`<option value="${k.id}" ${(s ? s.classIds[0] : classId) === k.id ? raw('selected') : ''}>${k.name} · ${DOW[k.day]} ${k.start}</option>`)}</select></label>
      <label class="v-field"><span>보호자</span><input id="k-guard" class="v-input" maxlength="20" value="${s ? s.guardian : ''}" placeholder="홍○○ 어머니"></label>
      <label class="v-field"><span>보호자 연락처</span><input id="k-phone" class="v-input" type="tel" inputmode="tel" maxlength="13" value="${s ? s.phone : '010-'}"></label>
      <div class="v-small v-muted" style="margin-top:12px;line-height:1.6">${s ? '영상·녹음 동의: ' + CONSENT[s.consent.video] + (s.consent.agreedAt === null ? ' · 보호자 동의 전' : '') : '영상·녹음 동의는 보호자가 첫 알림 링크에서 직접 해요. 동의하기 전에는 녹음하지 않아요.'}</div>`;
  };
  ICME.actions['a.kidNew'] = (el) => V.sheet(h`<h2 class="v-h2">아이 등록</h2><p class="v-sub">등록하면 보호자에게 설문 링크가 가요.</p>${kidForm(null, el && el.dataset && el.dataset.class)}<div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="a.kidSave">등록</button></div>`);
  ICME.actions['a.kidEdit'] = (el) => {
    const s = q.student(el.dataset.id); const acc = (db().access || []).filter((x) => x.sid === s.id).slice().reverse().slice(0, 5);
    V.sheet(h`<h2 class="v-h2">${s.fullName} · 정보</h2><a class="v-btn" style="margin:10px 0 2px" href="#/a/kid/${s.id}">${icon('bar-chart', 18)}아이 한 장 보기 (점수 · 가르치는 법 · 발음)</a>${kidForm(s)}<div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="a.kidSave" data-id="${s.id}">저장</button></div><button class="v-btn sm" style="margin-top:12px" data-act="a.kidNudge" data-id="${s.id}">${icon('bell', 16)}보호자께 설문 알림 보내기</button>
      <div class="v-sub-h">이 아이의 정보를 연 사람 <span class="v-faint" style="font-weight:600">· 최근 5건</span></div>${acc.length ? h`<ul class="v-small v-muted" style="display:flex;flex-direction:column;gap:4px;margin-top:6px">${acc.map((x) => h`<li>· ${ICME.dateShort(x.date)} ${x.role === 'hq' ? '본사(아이크미)' + (x.why ? ' · ' + x.why : '') : ((q.teacher(x.by) || {}).name || '교사') + ' 선생님'}</li>`)}</ul>` : h`<p class="v-small v-faint" style="margin-top:6px">아직 없어요. 담당 선생님이나 본사가 열면 기록이 남아요.</p>`}`);
  };
  ICME.actions['a.kidNudge'] = () => ui.toast('보호자께 설문 알림을 보냈어요 (시안)');
  /* 센터장도 아이 한 장을 볼 수 있어요 (보기만: 녹음·보내기·관찰 기록 버튼은 선생님 화면에만 있어요) */
  V.add('/a/kid/:id', {
    title: '아이',
    render(ctx) {
      const s = q.student(ctx.params.id); if (!s || s.centerId !== V.cid()) return h`${V.back('/a/classes', '반·아이')}<div class="v-empty"><b>아이를 찾을 수 없어요</b></div>`;
      const k = q.klass(s.classIds[0]); const t = (k && k.teacherId && q.teacher(k.teacherId)) || { name: '담임' };
      return V.kidPage(s, { t, canAct: false, canNudge: true, back: ['/a/classes/' + k.id, k.name], compare: '/a/compare/' + s.id });
    }
  });
  V.add('/a/compare/:id', {
    title: '발음 비교',
    render(ctx) {
      const s = q.student(ctx.params.id); const ps = s ? V.pronState(s) : { st: 'none' };
      if (!s) return h`${V.back('/a/classes', '반·아이')}<div class="v-empty"><b>아이를 찾을 수 없어요</b></div>`;
      if (ps.st !== 'both') return h`${V.back('/a/kid/' + s.id, s.name)}<div class="v-empty"><b>아직 비교할 수 없어요</b>Before와 After 녹음이 모두 있어야 해요.</div>`;
      return h`${V.back('/a/kid/' + s.id, s.name)}<div class="v-head"><h1 class="v-h1">${s.name}의 발음 전·후</h1></div>${V.compareBlocks(s, ps.pair)}<p class="v-note" style="text-align:center">같은 아이의 전·후 변화만 봐요. 점수는 참고용이고 지금은 시안 값이에요.</p>`;
    }
  });
  ICME.actions['a.kidSave'] = (el) => {
    const full = val('k-name').trim(); if (!full) { ui.toast('이름을 입력해 주세요', 'warn'); return; }
    if (full.length > 12) { ui.toast('이름은 12자 이하로 적어 주세요', 'warn'); return; } if (val('k-guard').trim().length > 20) { ui.toast('보호자는 20자 이하로 적어 주세요', 'warn'); return; }
    const f = { full: full.replace(/\s+/g, ' '), age: Number(val('k-age')), cls: val('k-class'), guard: val('k-guard').trim(), phone: val('k-phone').trim() };
    if (!q.klass(f.cls)) { ui.toast('반을 골라 주세요', 'warn'); return; }
    if (!phoneOK(f.phone)) { ui.toast('연락처를 확인해 주세요 (예: 010-1234-5678)', 'warn'); return; }
    let gotoClass = f.cls;
    ICME.store.mutate((d) => {
      if (el.dataset.id) { const s = d.students.find((x) => x.id === el.dataset.id); s.fullName = f.full; s.name = givenName(f.full); s.age = f.age; s.classIds = [f.cls].concat(s.classIds.slice(1).filter((c) => c !== f.cls)); s.guardian = f.guard || s.guardian; s.phone = f.phone; }
      else d.students.push({ id: ICME.uid('s'), centerId: V.cid(), name: givenName(f.full), fullName: f.full, age: f.age, classIds: [f.cls], guardian: f.guard || f.full.slice(0, 1) + '○○ 보호자', phone: f.phone, status: '재원', joined: today(), kisel: { st: 'none', answered: 0, areas: [3, 3, 3, 3, 3], prev: [3, 3, 3, 3, 3] }, consent: { video: 'none', reco: true, analyze: false, agreedAt: null }, video: { before: false, after: false }, risk: null, survey: { child: { done: false, items: null, fresh: false, helped: false, mins: null, date: null }, parent: { done: false, items: null, date: null }, prev: null } });
    });
    V.closeSheet(); ui.toast(el.dataset.id ? '저장했어요' : f.full + ' 아이를 등록했어요. 보호자께 설문 링크를 보냈어요 (시안)'); V.go('/a/classes/' + gotoClass); V.render();
  };
})();

</script>
<script>/* js/v2/hq.js */
/* v2/hq.js — 본사: 가맹점 관리 · 교사·교육 · 가맹 문의.
   (문항 은행과 주제·키트는 bank.js) 본사는 개인 정보 없이 "가맹점 단위"로만 봐요. */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui;
  const db = () => ICME.store.db; const today = () => ICME.ymd(ICME.today());
  const val = (id) => (document.getElementById(id) || {}).value || '';
  const pct = (n) => Math.round((n || 0) * 100) + '%';
  const tagOf = (tone) => (tone === 'green' ? 'ok' : tone === 'red' || tone === 'amber' ? 'watch' : '');

  /* 가맹점 목록 · 상세(개요·아이·교사·반)는 hqdata.js에 있어요. 아래는 그 화면들이 쓰는 동작이에요. */
  ICME.actions['h.check'] = (el) => { ICME.store.mutate((d) => { const c = d.centers.find((x) => x.id === el.dataset.id); c.checklist[el.dataset.i].done = !c.checklist[el.dataset.i].done; }); V.render(); };
  ICME.actions['h.centerStatus'] = (el) => {
    const c = db().centers.find((x) => x.id === el.dataset.id); const opt = [['운영', '정상 운영 중이에요'], ['주의', '본사가 집중해서 살펴봐요 (설문·녹음이 낮을 때)'], ['개설준비', '개설 전 준비 단계예요'], ['폐점', '계약이 끝났어요. 아이 정보는 보관 기간이 지나면 지워져요']];
    V.sheet(h`<h2 class="v-h2">${c.name} · 상태 변경</h2><div class="v-choice">${opt.map((o) => h`<button class="${c.status === o[0] ? 'on' : ''}" data-act="h.centerStatusGo" data-id="${c.id}" data-v="${o[0]}">${o[0]}<small>${o[1]}</small></button>`)}</div><div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button></div>`);
  };
  ICME.actions['h.centerStatusGo'] = (el) => { ICME.store.mutate((d) => { d.centers.find((x) => x.id === el.dataset.id).status = el.dataset.v; }); V.closeSheet(); ui.toast('상태를 ' + ICME.josa(el.dataset.v, '으로/로') + ' 바꿨어요'); V.render(); };
  ICME.actions['h.visit'] = (el) => V.sheet(h`<h2 class="v-h2">방문 기록</h2><label class="v-field"><span>날짜</span><input id="v-d" type="date" class="v-input" value="${today()}"></label><label class="v-field"><span>내용</span><textarea id="v-t" rows="4" class="v-input" style="padding:12px;min-height:96px" placeholder="수업 참관, 교구 점검, 전달한 내용 등"></textarea></label><div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="h.visitGo" data-id="${el.dataset.id}">저장</button></div>`);
  ICME.actions['h.visitGo'] = (el) => { const t = val('v-t').trim(); if (!t) { ui.toast('내용을 입력해 주세요', 'warn'); return; } if (t.length > 500) { ui.toast('내용은 500자 이하로 적어 주세요', 'warn'); return; } ICME.store.mutate((d) => { d.visits = d.visits || {}; d.visits[el.dataset.id] = d.visits[el.dataset.id] || []; d.visits[el.dataset.id].unshift({ d: val('v-d') || today(), by: '본사 운영팀', text: t }); }); V.closeSheet(); ui.toast('방문 기록을 저장했어요'); V.render(); };
  ICME.actions['h.centerNew'] = () => V.sheet(h`<h2 class="v-h2">가맹점 등록</h2><p class="v-sub">등록하면 "개설 준비" 상태로 시작하고 개설 체크리스트가 만들어져요.</p>
    <label class="v-field"><span>가맹점 이름</span><input id="c-name" class="v-input" placeholder="예) 해뜰센터"></label>
    <label class="v-field"><span>지역</span><input id="c-branch" class="v-input" placeholder="예) 서울 강서"></label>
    <label class="v-field"><span>유형</span><select id="c-type" class="v-input"><option>센터형(학원)</option><option>교습소</option><option>프로그램 도입형</option></select></label>
    <label class="v-field"><span>센터장 이름</span><input id="c-owner" class="v-input"></label>
    <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="h.centerGo">등록</button></div>`);
  ICME.actions['h.centerGo'] = () => {
    const name = val('c-name').trim(); if (!name) { ui.toast('이름을 입력해 주세요', 'warn'); return; } if (name.length > 20) { ui.toast('가맹점 이름은 20자 이하로 적어 주세요', 'warn'); return; }
    const id = ICME.uid('c'); const branch = val('c-branch').trim() || '지역 미정';
    ICME.store.mutate((d) => d.centers.push({ id, name, branch, type: val('c-type'), region: branch.split(' ')[0], owner: val('c-owner').trim() || '미정', opened: null, opening: ICME.ymd(ICME.addDays(ICME.today(), 45)), status: '개설준비', programs: ['ART'], heart: false, stats: { students: 0, kisel: 0, video: 0, docs: 0, training: 0, log: 0 }, checklist: ['가맹 계약 체결', '학원·교습소 등록 신청', '시스템 계정 설정', '인테리어·교구 설치', '교사 채용', '교사 필수 교육 이수', '교재·키트 입고', '오픈 설명회 준비'].map((label) => ({ label, done: false })) }));
    V.closeSheet(); ui.toast(name + ' — 등록했어요'); V.go('/h/centers/' + id);
  };

  /* ======================================================== 교사 · 교육 */
  V.add('/h/teachers', {
    title: '교사·교육', wide: true,
    render() {
      const cs = db().centers.filter((c) => !['개설준비', '폐점'].includes(c.status)); const T = ICME.training;
      const allT = cs.reduce((a, c) => a.concat(q.teachersOf(c.id).filter((t) => t.status !== '퇴사').map((t) => ({ t, c, al: q.teacherAlerts(t) }))), []);
      const hot = (x) => x.al.some((a) => a.level !== 'low');
      allT.sort((a, b) => Number(hot(b)) - Number(hot(a)) || a.c.name.localeCompare(b.c.name, 'ko') || a.t.name.localeCompare(b.t.name, 'ko'));
      const done = (cid) => allT.length ? Math.round(100 * allT.filter((x) => q.courseState(x.t, cid) === 'done').length / allT.length) : 0;
      const trow = (x) => { const top = x.al.find((a) => a.level !== 'low') || x.al[0]; const n = q.classesOfTeacher(x.t.id).length;
        return h`<a class="v-kid" href="#/h/teacher/${x.t.id}">${V.av(x.t.name, 44)}<div class="main"><div class="nm">${x.t.name}<small>${x.t.role} · ${x.c.name}</small></div><div class="ds">담당 반 ${n}개 · 필수 교육 ${Math.round(q.trainingRate(x.t) * 100)}% · 서류 ${q.docSummary(x.t).ok}/${q.docSummary(x.t).total}</div></div>${top ? h`<span class="v-tag watch">${top.text}</span>` : h`<span class="v-tag ok">확인할 것 없음</span>`}${x.t.status !== '재직' ? h`<span class="v-tag">${x.t.status}</span>` : ''}${icon('chevron-right', 18, 'chev')}</a>`; };
      const rate = (v) => h`<div style="display:flex;align-items:center;gap:8px;min-width:150px"><div class="v-bar" style="margin:0;flex:1;height:6px"><i style="width:${Math.round(v * 100)}%"></i></div><span class="v-small" style="width:42px">${Math.round(v * 100)}%</span></div>`;
      return h`<div class="v-head"><div class="v-eyebrow">본사</div><h1 class="v-h1">교사 · 교육</h1><p class="v-sub">가맹점 교사의 필수 교육과 서류 확인 현황을 보고, 교육 일정을 안내해요.</p></div>${V.hTabs('teachers')}
        <section class="v-card"><h2 class="v-h2">가맹점별 현황</h2><div class="v-scroll"><table class="v-tbl" style="margin-top:6px"><thead><tr><th>가맹점</th><th>필수 교육 이수</th><th>서류 확인</th><th></th></tr></thead><tbody>${cs.map((c) => { const s = q.stats(c); return h`<tr><td><b>${c.name}</b></td><td>${rate(s.training)}</td><td>${rate(s.docs)}</td><td style="text-align:right">${s.training < 0.7 || s.docs < 0.7 ? h`<button class="v-btn sm" data-act="h.nudgeCenter" data-id="${c.id}">안내 보내기</button>` : h`<span class="v-xs v-faint">양호</span>`}</td></tr>`; })}</tbody></table></div></section>
        <section class="v-card"><h2 class="v-h2">전체 교사 <span class="v-faint v-small" style="font-weight:600">${allT.length}명 · 확인할 교사가 위로 올라와요</span></h2><div class="v-list" style="margin-top:10px">${allT.map(trow)}</div></section>
        <div class="v-grid2"><section class="v-card" style="margin-top:14px"><h2 class="v-h2">교육 과정</h2><div style="margin-top:6px">${T.courses.map((c) => h`<div class="v-doc"><div class="tx">${c.title}<small>${c.kind} · ${c.min}분</small></div><span class="v-tag ${c.req === '필수' ? 'watch' : ''}">${c.req}</span>${['T01', 'T02', 'T04', 'T09'].includes(c.id) ? h`<span class="v-xs v-faint" style="width:70px;text-align:right">전체 ${done(c.id)}%</span>` : ''}</div>`)}</div><p class="v-note">과정 추가·수정 화면은 필요해지면 만들어요.</p></section>
          <section class="v-card" style="margin-top:14px"><h2 class="v-h2">다가오는 집합 교육</h2><div style="margin-top:6px">${T.sessions.map((s) => h`<div class="v-doc"><div class="tx">${s.title}<small>${ICME.dateKo(ICME.addDays(ICME.today(), s.offset))} · ${s.time} · ${s.place}</small></div><span class="v-tag ${s.applied >= s.cap * 0.85 ? 'watch' : ''}">${s.applied}/${s.cap}</span></div>`)}</div><button class="v-btn sm" style="margin-top:12px" data-act="h.nudgeAll">${icon('send', 16)}전 가맹점에 일정 안내</button></section></div>`;
    }
  });
  /* "안내 보내기"(h.nudgeCenter · h.nudgeAll)와 "메시지 보내기"(h.msg)는 hqops.js에서 공지 보내기 창으로 이어져요 */

  /* ======================================================== 가맹 문의 */
  const STAGES = [['new', '신규 문의'], ['talk', '상담 중'], ['visit', '방문·설명회'], ['contract', '계약 진행'], ['setup', '개설 준비']];
  V.add('/h/leads', {
    title: '가맹 문의', wide: true,
    render() {
      const L = db().leads || []; const late = L.filter((l) => l.stage === 'new' && l.hours >= 24).length;
      const row = (l) => h`<div class="v-slot"><div class="tx"><div><b>${l.name}</b> <span class="v-faint v-xs">${l.region} · ${l.type} · 운영 경험 ${l.exp}</span></div><div class="v-xs v-muted" style="margin-top:3px">다음 · ${l.next} &nbsp;|&nbsp; 담당 ${l.owner} · 유입 ${l.src}</div></div>${l.stage === 'new' && l.hours >= 24 ? h`<span class="v-tag watch">${l.hours}시간 지남</span>` : ''}<select class="v-select" data-change="h.lead" data-id="${l.id}" aria-label="${l.name} 단계">${STAGES.map((s) => h`<option value="${s[0]}" ${l.stage === s[0] ? raw('selected') : ''}>${s[1]}</option>`)}<option value="open" ${l.stage === 'open' ? raw('selected') : ''}>운영 중</option></select></div>`;
      return h`<div class="v-head"><div class="v-eyebrow">본사</div><h1 class="v-h1">가맹 문의</h1><p class="v-sub">홈페이지로 들어온 문의를 단계별로 따라가요. 24시간 안에 첫 연락이 가도록 지난 문의는 표시돼요.</p></div>${V.hTabs('leads')}
        ${(() => { const open = L.filter((l) => l.stage === 'open').length; const beyond = L.filter((l) => ['contract', 'setup', 'open'].includes(l.stage)).length; const src = {}; L.forEach((l) => { src[l.src] = (src[l.src] || 0) + 1; });
          return h`<section class="v-card" style="margin-top:14px"><h2 class="v-h2">문의 흐름 <span class="v-faint v-small" style="font-weight:600">전체 ${L.length}건 중 계약 이상 ${beyond}건 (${L.length ? Math.round(100 * beyond / L.length) : 0}%)</span></h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">${STAGES.map((st, i) => h`${i ? h`<span class="v-faint">›</span>` : ''}<span class="v-tag ${st[0] === 'new' && late ? 'watch' : ''}">${st[1]} ${L.filter((l) => l.stage === st[0]).length}</span>`)}<span class="v-faint">›</span><span class="v-tag ok">운영 중 ${open}</span></div><div class="v-xs v-muted" style="margin-top:10px">유입 경로 · ${Object.keys(src).sort((a, b) => src[b] - src[a]).map((k) => k + ' ' + src[k]).join(' · ')}</div></section>`; })()}
        <div class="v-bar-top"><span class="v-small v-muted">진행 중 ${L.filter((l) => l.stage !== 'open').length}건${late ? ' · 24시간 지난 문의 ' + late + '건' : ''}</span><button class="v-btn primary" data-act="h.leadNew">${icon('plus', 18)}문의 등록</button></div>
        ${STAGES.map((st) => { const rows = L.filter((l) => l.stage === st[0]); return h`<div class="v-sec"><h2>${st[1]}</h2><span>${rows.length}건</span></div><div class="v-list">${rows.length ? rows.map(row) : h`<div class="v-slot empty"><span class="tx v-faint">없어요</span></div>`}</div>`; })}`;
    }
  });
  ICME.actions['h.lead'] = (el) => { ICME.store.mutate((d) => { const l = d.leads.find((x) => x.id === el.dataset.id); l.stage = el.value; l.hours = 0; l.last = today(); }); ui.toast('단계를 옮겼어요'); V.render(); };
  ICME.actions['h.leadNew'] = () => V.sheet(h`<h2 class="v-h2">가맹 문의 등록</h2>
    <label class="v-field"><span>성함</span><input id="l-name" class="v-input"></label><label class="v-field"><span>연락처</span><input id="l-phone" class="v-input" value="010-"></label>
    <label class="v-field"><span>지역</span><input id="l-region" class="v-input" placeholder="예) 서울 강서"></label>
    <label class="v-field"><span>희망 유형</span><select id="l-type" class="v-input"><option>센터형(학원)</option><option>교습소</option><option>프로그램 도입형</option></select></label>
    <label class="v-field"><span>운영 경험</span><select id="l-exp" class="v-input"><option>없음</option><option>있음</option></select></label>
    <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="h.leadGo">등록</button></div>`);
  ICME.actions['h.leadGo'] = () => {
    const name = val('l-name').trim(); if (!name) { ui.toast('성함을 입력해 주세요', 'warn'); return; } if (name.length > 12) { ui.toast('성함은 12자 이하로 적어 주세요', 'warn'); return; }
    ICME.store.mutate((d) => d.leads.unshift({ id: ICME.uid('l'), name, region: val('l-region').trim() || '지역 미정', type: val('l-type'), exp: val('l-exp'), src: '직접 등록', stage: 'new', last: today(), owner: '가맹개발팀 A', next: '24시간 내 첫 연락', hours: 0 }));
    V.closeSheet(); ui.toast('문의를 등록했어요. 담당자가 자동 배정됐어요'); V.render();
  };
})();

</script>
<script>/* js/v2/hqdata.js */
/* v2/hqdata.js — 본사: 가맹점별 아이 수와 데이터를 전부 볼 수 있는 화면.
   가맹점 목록(전체 숫자 · 비교표 · 아이 이름 찾기) → 가맹점 하나(개요 · 아이 · 교사 · 반) → 아이 한 장 · 교사 상세(읽기 전용).
   · 본사는 보기만 해요. 점수·녹음·설문을 고치거나 보호자에게 알림을 보내는 버튼은 없어요.
   · 본사가 아이 정보를 열면 열람 기록이 남고, 그 가맹점 센터장이 아이 정보 창에서 볼 수 있어요.
   · 보호자 동의 화면에도 "본사가 볼 수 있다"고 적혀 있어요(처음 동의할 때 알려 드려요). */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const SC = ICME.scoring;
  const db = () => ICME.store.db; const AREAS = ICME.kisel.areas; const DOW = ICME.DOW;
  const pct = (n) => Math.round((n || 0) * 100) + '%';
  const rate = (a, b) => (b ? a / b : 0);
  const tagOf = (tone) => (tone === 'green' ? 'ok' : tone === 'red' || tone === 'amber' ? 'watch' : '');
  const parentDone = (s) => !!(s.survey && s.survey.parent && s.survey.parent.done);
  const active = (c) => q.teachersOf(c.id).filter((t) => t.status !== '퇴사');
  const PROG_NAME = (k) => ICME.programs.byKey[k].short;

  /* ---------------------------------------------------------------- 숫자 계산 */
  /* 가맹점 하나의 숫자와 데이터. 아이·교사·반 데이터에서 그대로 계산해요(따로 입력한 값이 아니에요). */
  function dataOf(c) {
    const kids = q.studentsOf(c.id); const classes = q.classesOf(c.id); const teachers = active(c);
    const rows = kids.map((s) => {
      const p = SC.profile(s); const scored = p.areas.some((a) => a.combined != null); const f = p.lowest[0] || null; const ps = V.pronState(s);
      return { s, p, scored, f, look: !!f && f.combined < 2.7, parent: parentDone(s), pr: ps.st === 'both' && V.consent.analyzeOK(s) ? SC.pron(ps.pair) : null, pst: ps.st };
    });
    const sc = rows.filter((x) => x.scored);
    const age = {}; kids.forEach((s) => { age[s.age] = (age[s.age] || 0) + 1; });
    const prog = {}; classes.forEach((k) => { prog[k.program] = (prog[k.program] || 0) + q.studentsOfClass(k.id).length; });
    const levels = AREAS.map((_, i) => { const n = { grow: 0, mid: 0, high: 0 }; sc.forEach((x) => { const a = x.p.areas[i]; if (a.combined != null) n[a.level.key]++; }); return n; });
    const elig = kids.filter((s) => s.consent.video !== 'none'); const after = elig.filter((s) => s.video && s.video.after).length;
    const prs = rows.filter((x) => x.pr); const okPr = prs.filter((x) => x.pr.change.key !== 'unclear');
    const dist = { up2: 0, up1: 0, same: 0, down: 0, unclear: 0 }; prs.forEach((x) => { dist[x.pr.change.key] = (dist[x.pr.change.key] || 0) + 1; });
    return {
      kids, classes, teachers, rows, scored: sc.length, age, prog, levels, means: q.areaMeans(kids),
      done: kids.filter((s) => s.kisel.st === 'done').length, parent: rows.filter((x) => x.parent).length, confirmed: rows.filter((x) => x.scored && !x.p.provisional).length,
      elig: elig.length, after, prs: prs.length, gain: okPr.length ? ICME.round1(ICME.avg(okPr, (x) => x.pr.delta)) : null, dist,
      look: rows.filter((x) => x.look).length, lowConf: rows.filter((x) => x.p.conf.level === '낮음').length, risk: kids.filter((s) => s.risk).length
    };
  }
  V.centerData = dataOf;

  /* ---------------------------------------------------------------- 작은 부품 */
  const LVL = [['grow', '함께 키워요'], ['mid', '자라는 중'], ['high', '잘하고 있어요']];
  const stack = (n) => { const t = n.grow + n.mid + n.high || 1; return h`<div class="v-stack" role="img" aria-label="함께 키워요 ${n.grow}명, 자라는 중 ${n.mid}명, 잘하고 있어요 ${n.high}명">${LVL.map((l) => (n[l[0]] ? h`<i class="${l[0]}" style="width:${(n[l[0]] / t) * 100}%"><b>${n[l[0]]}</b></i>` : ''))}</div>`; };
  const stat = (lb, vl, sub, bar) => h`<div class="v-stat"><div class="lb">${lb}</div><div class="vl">${vl}</div>${bar != null ? h`<div class="v-bar"><i style="width:${Math.round(bar * 100)}%"></i></div>` : ''}${sub ? h`<div class="v-xs v-muted" style="margin-top:8px">${sub}</div>` : ''}</div>`;
  const hbars = (obj, total, label) => Object.keys(obj).sort().map((k) => h`<div class="v-hbar"><span class="lb">${label(k)}</span><div class="v-bar"><i style="width:${Math.round(rate(obj[k], total) * 100)}%"></i></div><b>${obj[k]}명</b></div>`);
  const prow = (label, n, d, note) => h`<div class="v-prow"><div class="top"><span>${label}</span><b>${n} / ${d}명 · ${pct(rate(n, d))}</b></div><div class="v-bar"><i style="width:${Math.round(rate(n, d) * 100)}%"></i></div>${note ? h`<div class="v-xs v-muted" style="margin-top:6px">${note}</div>` : ''}</div>`;
  const notFound = (back, label, what) => h`${V.back(back, label)}<div class="v-empty"><b>${what}을(를) 찾을 수 없어요</b></div>`;
  const kidTag = (x) => (!x.scored ? h`<span class="v-tag">설문 전</span>` : x.look ? h`<span class="v-tag watch">살펴봐요</span>` : !x.parent ? h`<span class="v-tag">부모 설문 대기</span>` : x.pr ? h`<span class="v-tag ${x.pr.delta > 0 ? 'up' : ''}">발음 ${x.pr.delta > 0 ? '+' : ''}${x.pr.delta}</span>` : '');

  /* 가맹점 하나의 위쪽(제목 · 상태 · 탭) */
  const cHead = (c, tab) => {
    const closed = c.status === '폐점'; const prep = c.status === '개설준비'; const s = q.stats(c); const hl = q.health(c);
    const kidsN = q.studentsOf(c.id).length; const thN = active(c).length; const clN = q.classesOf(c.id).length;
    const plain = closed || (s.students === 0 && !prep);
    return h`${V.back('/h/centers', '가맹점')}
      <div class="v-head" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:min(220px,100%)"><div class="v-eyebrow">${c.type}</div><h1 class="v-h1">${c.name}</h1><p class="v-sub">${c.branch} · 센터장 ${c.owner}${c.opened ? ' · 개설 ' + ICME.dateFull(c.opened) : c.opening ? ' · 개설 예정 ' + ICME.dateFull(c.opening) : ''}</p>${V.demoNote ? V.demoNote() : ''}</div><span class="v-tag ${plain ? '' : tagOf(q.healthTone(hl))}" style="height:32px;font-size:14px">${closed ? '폐점' : plain ? '시작 전' : q.healthLabel(hl)}</span><button class="v-btn sm" data-act="h.centerStatus" data-id="${c.id}">상태 변경</button></div>
      <nav class="v-seg v-tabs">${[['overview', '개요', ''], ['kids', '아이 ' + kidsN, '/kids'], ['teachers', '교사 ' + thN, '/teachers'], ['classes', '반 ' + clN, '/classes']].map((x) => h`<a class="${x[0] === tab ? 'on' : ''}" href="#/h/centers/${c.id}${x[2]}">${x[1]}</a>`)}</nav>`;
  };
  const closedNote = h`<div class="v-card warm"><b>계약이 끝난 가맹점이에요</b><p class="v-small" style="margin-top:6px;line-height:1.6">아이·교사 정보는 보관 기간이 지나면 지워져요. 그 전에도 이 화면에서는 보여 드리지 않아요.</p></div>`;

  /* ======================================================== 가맹점 목록 (전체 숫자 · 비교표 · 아이 이름 찾기) */
  const searchHtml = (text) => {
    const t = String(text || '').trim(); if (!t) return '';
    const all = db().students.filter((s) => { const c = q.center(s.centerId); return !!c && c.status !== '폐점' && s.fullName.indexOf(t) >= 0; }); const list = all.slice(0, 20);
    if (!all.length) return h`<p class="v-small v-muted" style="margin:10px 4px 0">"${t}" 이름의 아이를 찾을 수 없어요.</p>`;
    return h`<div class="v-small v-muted" style="margin:10px 4px 6px">${all.length}명을 찾았어요${all.length > list.length ? ' (20명만 보여요 · 이름을 더 적어 주세요)' : ''}</div><div class="v-list">${list.map((s) => { const c = q.center(s.centerId); const k = q.klass(s.classIds[0]); return h`<a class="v-kid" href="#/h/kid/${s.id}">${V.av(s.name, 44)}<div class="main"><div class="nm">${s.fullName}<small>${s.age}세</small></div><div class="ds">${c ? c.name : ''} · ${k ? k.name : ''}</div></div>${icon('chevron-right', 18, 'chev')}</a>`; })}</div>`;
  };
  V.add('/h/centers', {
    title: '가맹점', wide: true,
    render() {
      const cs = db().centers; const watch = cs.filter((c) => c.status === '주의').length;
      const info = cs.map((c) => { const closed = c.status === '폐점'; const kids = closed ? [] : q.studentsOf(c.id); const elig = kids.filter((s) => s.consent.video !== 'none'); return { c, s: q.stats(c), kids, cl: closed ? [] : q.classesOf(c.id), th: closed ? [] : active(c), done: kids.filter((s) => s.kisel.st === 'done').length, parent: kids.filter(parentDone).length, elig: elig.length, after: elig.filter((s) => s.video && s.video.after).length, means: kids.length ? q.areaMeans(kids) : null }; });
      const sum = (f) => info.reduce((a, x) => a + f(x), 0);
      const N = { kids: sum((x) => x.kids.length), th: sum((x) => x.th.length), cl: sum((x) => x.cl.length), done: sum((x) => x.done), parent: sum((x) => x.parent), elig: sum((x) => x.elig), after: sum((x) => x.after) };
      const live = cs.filter((c) => !['개설준비', '폐점'].includes(c.status)).length;
      const row = (x) => { const c = x.c; const prep = c.status === '개설준비'; const closed = c.status === '폐점'; const ck = c.checklist || []; const cdone = ck.filter((y) => y.done).length; const hl = q.health(c);
        return h`<a class="v-kid" href="#/h/centers/${c.id}"><span class="v-av" style="width:46px;height:46px;background:#e4f5f4;color:#09706b;font-size:15px">${c.name.slice(0, 2)}</span><div class="main"><div class="nm">${c.name}<small>${c.branch} · ${c.type}</small></div><div class="ds">${closed ? '계약 종료 · 아이 정보는 보관 기간이 지나면 지워져요' : prep ? '개설 준비 중 · 체크리스트 ' + cdone + '/' + ck.length : '아이 ' + x.kids.length + '명 · 교사 ' + x.th.length + '명 · 반 ' + x.cl.length + '개 · 설문 ' + pct(rate(x.done, x.kids.length)) + ' · 발음 ' + pct(rate(x.after, x.elig))}</div>${!closed && !prep && x.kids.length && q.healthTone(hl) !== 'green' && V.reasonLine ? h`<div class="ds" style="color:#a15c00;font-weight:600">살펴볼 것 · ${V.reasonLine(c, 2)}</div>` : ''}${closed ? '' : V.monLine ? V.monLine(c) : ''}</div>${closed ? h`<span class="v-tag">폐점</span>` : x.kids.length === 0 && !prep ? h`<span class="v-tag">시작 전</span>` : h`<span class="v-tag ${tagOf(q.healthTone(hl))}">${q.healthLabel(hl)}</span>`}${icon('chevron-right', 18, 'chev')}</a>`; };
      const mcell = (v) => (v == null ? h`<td class="v-faint">-</td>` : h`<td class="${v < 3 ? 'low' : v >= 4 ? 'high' : ''}">${v.toFixed(1)}</td>`);
