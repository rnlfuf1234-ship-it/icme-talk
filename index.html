        <div class="v-head" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${V.av(m.name, 64)}<div style="flex:1;min-width:min(200px,100%)"><h1 class="v-h1">${m.name}</h1><div class="v-sub" style="margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>${sRole(m)} · ${c ? c.name : '센터 확인 필요'}</span>${stTag(m)}${m.sample ? h`<span class="v-demo">예시</span>` : ''}${m.pwReq ? h`<span class="v-tag watch">비밀번호 요청 ${ICME.dateShort(m.pwReq)}</span>` : ''}</div></div></div>
        <div class="v-grid2"><div>
          <section class="v-card" style="margin-top:0"><h2 class="v-h2">신청 내용</h2><div class="v-kv">
            ${kv('가입 종류', sRole(m))}${kv('센터', c ? c.name : (m.centerText ? '잘 모르겠어요 · "' + m.centerText + '"' : '잘 모르겠어요'))}${kv('이름', m.name)}${kv('휴대전화', m.phone)}
            ${m.role === 'p' && m.child ? kv('아이', m.child.name + ' · ' + m.child.age + '세' + (m.child.note ? ' · ' + m.child.note : '')) : ''}${m.role === 't' && m.work ? kv('하는 일', m.work.role + ' · ' + m.work.emp) : ''}
            ${kv('아이디', m.login)}${kv('신청한 때', ICME.dateFull(m.date) + ' ' + m.time)}${kv('동의', '이용약관 · 개인정보' + (m.consent && m.consent.child ? ' · 아이 정보(보호자)' : '') + (m.consent && m.consent.mkt ? ' · 소식 알림' : ''))}${m.last ? kv('마지막 로그인', ICME.dateFull(m.last)) : ''}</div></section>
          <section class="v-card"><h2 class="v-h2">센터장 확인</h2><p class="v-small" style="margin-top:8px;line-height:1.6">${ck}</p><p class="v-note">센터장은 우리 센터에 다니는 사람인지 표시만 해요. 최종 승인은 본사가 해요.</p></section>
          ${m.status === 'pending' ? approveBox(m) : ''}
          ${m.status === 'approved' || m.status === 'suspended' ? h`<section class="v-card"><h2 class="v-h2">연결된 정보</h2><div class="v-kv">${m.role === 'p' ? kv('연결된 아이', ref ? h`<a href="#/h/kid/${ref.id}">${ref.fullName} (${ref.age}세)</a>` : '연결이 끊겼어요') : m.role === 't' ? kv('연결된 선생님', ref ? h`<a href="#/h/teacher/${ref.id}">${ref.name} (${ref.role})</a>` : '연결이 끊겼어요') : kv('센터', c ? h`<a href="#/h/centers/${c.id}">${c.name}</a>` : '-')}${kv('승인한 때', m.decided ? ICME.dateFull(m.decided.d) + ' · ' + m.decided.by : '-')}</div>
            <div class="v-btns" style="margin-top:14px;flex-wrap:wrap">${m.status === 'approved' ? h`<button class="v-btn" data-act="acc.suspend">이용 중지</button>` : h`<button class="v-btn primary" data-act="acc.resume">다시 쓰게 하기</button>`}<button class="v-btn" data-act="acc.temp">${icon('lock', 18)}임시 비밀번호</button></div>${m.must ? h`<p class="v-note">임시 비밀번호를 만든 뒤 아직 비밀번호를 바꾸지 않았어요.</p>` : ''}</section>` : ''}
          ${m.status === 'rejected' ? h`<section class="v-card"><h2 class="v-h2">반려했어요</h2><p class="v-small" style="margin-top:8px;line-height:1.6">이유: ${m.reason || '-'}<br>${m.decided ? ICME.dateFull(m.decided.d) + ' · ' + m.decided.by : ''}</p><div class="v-btns" style="margin-top:14px"><button class="v-btn" data-act="acc.reopen">다시 확인하기</button><button class="v-btn danger" data-act="acc.delete">기록 지우기</button></div></section>` : ''}
          ${m.status === 'pending' ? h`<button class="v-btn ghost su-del" style="margin-top:8px" data-act="acc.delete">${icon('trash', 16)}신청 지우기</button>` : ''}
        </div><div>
          <section class="v-card" style="margin-top:0"><h2 class="v-h2">본사 메모 <span class="v-faint v-small" style="font-weight:600">가입한 분에게는 보이지 않아요</span></h2><label class="v-field"><span class="v-sr">메모</span><textarea id="ac-memo" class="v-input v-ta" rows="3" maxlength="300" placeholder="전화로 확인한 내용 등을 적어 두세요">${m.memo || ''}</textarea></label><button class="v-btn sm" style="margin-top:10px" data-act="acc.memo">메모 저장</button></section>
          <section class="v-card"><h2 class="v-h2">처리 기록</h2><div style="margin-top:6px">${hist.map((x) => h`<div class="v-doc"><div class="tx">${x.text}<small>${x.who} · ${ICME.dateShort(x.d)} ${x.t}</small></div></div>`)}</div></section>
        </div></div>`;
    }
  });
  const cur = () => { const mm = /^\/h\/accounts\/([^/]+)$/.exec(V.parse().path); return mm ? M.get(decodeURIComponent(mm[1])) : null; };
  ICME.actions['acc.mode'] = (b) => { const m = cur(); if (!m) return; const ap = readAp(m); ap.mode = b.dataset.v; V.render(); };
  ICME.actions['acc.apChange'] = () => { const m = cur(); if (!m) return; const ap = readAp(m); ap.kid = ''; ap.tid = ''; ap.kclass = ''; V.render(); };
  ICME.actions['acc.memo'] = () => { const m = cur(); if (!m) return; const t = val('ac-memo').trim(); write((l) => { const r = l.find((x) => x.id === m.id); r.memo = t; note(r, '본사', t ? '메모를 남겼어요' : '메모를 지웠어요'); }); ui.toast('메모를 저장했어요'); V.render(); };
  ICME.actions['acc.approve'] = () => {
    const m = cur(); if (!m || m.status !== 'pending') return; const ap = readAp(m); const warn = (t) => ui.toast(t, 'warn');
    const c = ap.cid && q.center(ap.cid); if (!c) { warn('센터를 골라 주세요'); return; }
    let who = '';
    if (m.role === 'p') {
      if (ap.mode === 'link') { const s = q.student(ap.kid); if (!s || s.centerId !== c.id) { warn('연결할 아이를 골라 주세요'); return; } who = c.name + ' 센터 ' + s.fullName + ' 아이의 학부모 화면(점수 · 리포트 · 발음 녹음)'; }
      else { if (!NAME_RE.test(ap.kname)) { warn('아이 이름을 2~12글자로 써 주세요'); return; } if (!q.klass(ap.kclass)) { warn('반을 골라 주세요'); return; } who = c.name + ' 센터에 새로 등록되는 ' + ap.kname + ' 아이의 학부모 화면'; }
    } else if (m.role === 't') {
      if (ap.mode === 'link') { const t = q.teacher(ap.tid); if (!t || t.centerId !== c.id) { warn('연결할 선생님을 골라 주세요'); return; } who = c.name + ' 센터 ' + t.name + ' 선생님 화면(담당 반 · 수업 · 녹음)'; }
      else who = c.name + ' 센터의 새 선생님 화면(서류 · 필수 교육이 자동으로 배정돼요)';
    } else who = c.name + ' 센터장 화면(교사 · 반·아이 · 점검 현황)';
    V.ask({ title: m.name + '님을 승인할까요?', text: '승인하면 바로 ' + who + '을 볼 수 있어요. 가입한 분이 맞는지 확인하셨나요?', ok: '승인할게요', cancel: '아직이요', onOk: () => doApprove(m.id, ap) });
  };
  function newKid(full, age, cls, cid, m, d) {
    const s = { id: ICME.uid('s'), centerId: cid, name: givenName(full), fullName: full, age, classIds: [cls], guardian: maskName(m.name) + ' 보호자', phone: m.phone, status: '재원', joined: today(), kisel: { st: 'none', answered: 0, areas: [3, 3, 3, 3, 3], prev: [3, 3, 3, 3, 3] }, consent: { video: 'none', reco: true, analyze: false, agreedAt: null }, video: { before: false, after: false }, risk: null, survey: { child: { done: false, items: null, fresh: false, helped: false, mins: null, date: null }, parent: { done: false, items: null, date: null }, prev: null } };
    d.students.push(s); return s;
  }
  function doApprove(id, ap) {
    const m = M.get(id); if (!m || m.status !== 'pending') return; let ref = ''; let what = '';
    if (m.role === 't' && ap.mode !== 'link') { const t = ICME.teachersUI.create({ name: m.name, phone: m.phone, role: (m.work || {}).role || '강사', emp: (m.work || {}).emp || '시간제', programs: [], centerId: ap.cid }); ref = t.id; what = '새 선생님으로 등록하고 연결'; }
    write((l, d) => {
      const r = l.find((x) => x.id === id); r.centerId = ap.cid;
      if (r.role === 'p') { if (ap.mode === 'link') { ref = ap.kid; what = '기존 아이(' + q.student(ref).fullName + ')와 연결'; } else { const s = newKid(ap.kname, ap.kage, ap.kclass, ap.cid, r, d); ref = s.id; what = '새 아이(' + s.fullName + ')를 등록하고 연결'; } }
      else if (r.role === 't' && ap.mode === 'link') { ref = ap.tid; what = '기존 선생님(' + q.teacher(ref).name + ')과 연결'; }
      else if (r.role === 'a') { const c = d.centers.find((x) => x.id === ap.cid); what = c.name + ' 센터장으로 승인'; if (c && (!c.owner || c.owner === '미정')) { c.owner = r.name; what += ' (센터 대표로 등록)'; } }
      r.ref = ref; r.status = 'approved'; r.reason = ''; r.decided = { d: today(), by: '본사' }; r.must = false; note(r, '본사', '승인했어요 · ' + what);
    });
    ui.toast('승인했어요. ' + m.login + ' 아이디로 로그인할 수 있어요'); V.vs.ap = null; V.render();
  }
  const REASONS = ['센터에 등록된 아이·선생님이 아니에요', '입력한 정보가 맞지 않아요', '이미 가입한 사람이에요 (중복)', '가입 대상이 아니에요'];
  ICME.actions['acc.reject'] = () => {
    const m = cur(); if (!m) return;
    V.sheet(h`<h2 class="v-h2">반려할까요?</h2><p class="v-sub" style="margin-top:2px;line-height:1.6">${m.name}님은 로그인할 수 없고, 로그인 화면에서 반려 이유를 보게 돼요.</p>
      <div class="v-choice" role="radiogroup" aria-label="반려 이유">${REASONS.map((r, i) => h`<button type="button" role="radio" aria-checked="${i === 0 ? 'true' : 'false'}" class="${i === 0 ? 'on' : ''}" data-act="acc.why" data-v="${r}">${r}</button>`)}</div>
      <label class="v-field"><span>덧붙일 말 (선택)</span><input id="rj-more" class="v-input" maxlength="60" placeholder="예) 센터에 전화해 보세요"></label>
      <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>아니요</button><button class="v-btn danger" data-act="acc.rejectGo">반려할게요</button></div>`);
    V.vs.why = REASONS[0];
  };
  ICME.actions['acc.why'] = (b) => { V.vs.why = b.dataset.v; document.querySelectorAll('#v-sheet .v-choice button').forEach((x) => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); }); };
  ICME.actions['acc.rejectGo'] = () => {
    const m = cur(); if (!m) return; const why = (V.vs.why || REASONS[0]) + (val('rj-more').trim() ? ' · ' + val('rj-more').trim() : '');
    write((l) => { const r = l.find((x) => x.id === m.id); r.status = 'rejected'; r.reason = why; r.decided = { d: today(), by: '본사' }; note(r, '본사', '반려했어요 · ' + why); });
    V.closeSheet(); ui.toast('반려했어요'); V.render();
  };
  ICME.actions['acc.suspend'] = () => { const m = cur(); if (!m) return; V.ask({ title: m.name + '님의 이용을 멈출까요?', text: '바로 로그인할 수 없게 돼요. 언제든 "다시 쓰게 하기"로 풀 수 있어요.', ok: '멈출게요', danger: true, onOk: () => { write((l) => { const r = l.find((x) => x.id === m.id); r.status = 'suspended'; r.reason = '본사가 이용을 잠시 멈췄어요'; note(r, '본사', '이용을 멈췄어요'); }); ui.toast('이용을 멈췄어요'); V.render(); } }); };
  ICME.actions['acc.resume'] = () => { const m = cur(); if (!m) return; write((l) => { const r = l.find((x) => x.id === m.id); r.status = 'approved'; r.reason = ''; note(r, '본사', '다시 쓸 수 있게 했어요'); }); ui.toast('다시 쓸 수 있게 했어요'); V.render(); };
  ICME.actions['acc.reopen'] = () => { const m = cur(); if (!m) return; write((l) => { const r = l.find((x) => x.id === m.id); r.status = 'pending'; r.reason = ''; r.decided = null; note(r, '본사', '반려를 풀고 다시 확인해요'); }); ui.toast('다시 승인 기다림으로 옮겼어요'); V.vs.ap = null; V.render(); };
  ICME.actions['acc.delete'] = () => { const m = cur(); if (!m || m.status === 'approved' || m.status === 'suspended') return; V.ask({ title: '이 신청을 지울까요?', text: m.name + '님의 신청 기록이 완전히 지워져요. 지운 뒤에는 되돌릴 수 없고, 이 아이디는 다시 쓸 수 있게 돼요.', ok: '지울게요', danger: true, onOk: () => { write((l) => { const i = l.findIndex((x) => x.id === m.id); if (i >= 0) l.splice(i, 1); }); ui.toast('지웠어요'); V.go('/h/accounts'); } }); };
  ICME.actions['acc.temp'] = () => { const m = cur(); if (!m) return; V.ask({ title: '임시 비밀번호를 만들까요?', text: '지금 비밀번호는 쓸 수 없게 돼요. 새로 만든 비밀번호는 이 화면에서 한 번만 보여 드려요.', ok: '만들게요', onOk: () => tempGo(m.id) }); };
  async function tempGo(id) {
    const pw = tempPw(); const salt = newSalt(); const hash = await A.hash(pw, salt, ITER());
    write((l) => { const r = l.find((x) => x.id === id); r.salt = salt; r.hash = hash; r.iter = ITER(); r.must = true; r.pwReq = ''; note(r, '본사', '임시 비밀번호를 만들었어요'); });
    const m = M.get(id);
    V.sheet(h`<h2 class="v-h2">임시 비밀번호예요</h2><p class="v-sub" style="margin-top:2px;line-height:1.6">${m.name}님께 안전한 방법으로 알려 주세요. <b>이 창을 닫으면 다시 볼 수 없어요.</b> 로그인하면 새 비밀번호로 바꾸도록 안내해요.</p>
      <div class="su-temp" id="tmp-pw" aria-label="임시 비밀번호">${pw}</div>
      <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>닫기</button><button class="v-btn primary" data-act="acc.copyTemp" data-pw="${pw}">${icon('copy', 18)}복사하기</button></div>`);
    V.render();
  }
  ICME.actions['acc.copyTemp'] = async (b) => { try { await navigator.clipboard.writeText(b.dataset.pw); ui.toast('복사했어요'); } catch (e) { ui.toast('복사하지 못했어요. 화면의 글자를 직접 적어 주세요', 'warn'); } };

  /* ======================================================== 센터장: 우리 센터 신청 보기 · 표시 */
  V.ownerSignups = (cid) => {
    const L = list().filter((m) => m.centerId === cid && m.status === 'pending'); if (!L.length) return '';
    const one = (m) => h`<div class="v-doc su-own"><div class="tx"><b>${m.name}</b> <span class="v-faint v-xs">${sRole(m)}</span><small>${lineOf(m)} · ${m.phone} · ${ICME.dateShort(m.date)} 신청</small>${m.check ? h`<small>${m.check.v === 'ok' ? '아는 분이라고 표시했어요' : '모르는 분이라고 표시했어요'} · 본사에 전해졌어요</small>` : ''}</div>
      <div class="su-ck"><button type="button" class="v-btn sm ${m.check && m.check.v === 'ok' ? 'primary' : ''}" aria-pressed="${m.check && m.check.v === 'ok' ? 'true' : 'false'}" data-act="a.mcheck" data-id="${m.id}" data-v="ok">아는 분이에요</button><button type="button" class="v-btn sm ${m.check && m.check.v === 'no' ? 'danger' : ''}" aria-pressed="${m.check && m.check.v === 'no' ? 'true' : 'false'}" data-act="a.mcheck" data-id="${m.id}" data-v="no">모르는 분이에요</button></div></div>`;
    return h`<section class="v-card warm" id="o-signup" style="margin-top:0;margin-bottom:14px"><h2 class="v-h2">가입 신청 ${L.length}건 ${L.some((m) => !m.check) ? h`<span class="v-tag watch">확인해 주세요</span>` : ''}</h2><p class="v-small v-muted" style="margin-top:4px;line-height:1.6">우리 센터에 가입을 신청한 분이에요. 아는 분인지 표시해 주시면 본사가 승인할 때 참고해요. <b>승인은 본사가 해요.</b></p><div style="margin-top:6px">${L.map(one)}</div></section>`;
  };
  V.ownerSignupN = (cid) => list().filter((m) => m.centerId === cid && m.status === 'pending' && !m.check).length;
  ICME.actions['a.mcheck'] = (b) => {
    const m = M.get(b.dataset.id); if (!m || m.centerId !== V.cid() || m.status !== 'pending') return; const v = b.dataset.v;
    write((l) => { const r = l.find((x) => x.id === m.id); if (r.check && r.check.v === v) { r.check = null; note(r, '센터장', '표시를 풀었어요'); } else { r.check = { v, d: today(), by: '센터장' }; note(r, '센터장', v === 'ok' ? '"아는 분이에요"로 표시했어요' : '"모르는 분이에요"로 표시했어요'); } });
    ui.toast(v === 'ok' ? '아는 분이라고 본사에 알렸어요' : '모르는 분이라고 본사에 알렸어요'); V.render();
  };

  /* ======================================================== 본사 홈 카드 */
  V.hqSignupCard = () => {
    const all = list(); const P = all.filter((m) => m.status === 'pending').sort(ORDER); const ok = all.filter((m) => m.status === 'approved').length;
    return h`<section class="v-card"><div class="v-bar-top" style="margin:0"><h2 class="v-h2">가입 승인</h2><a class="v-btn sm ${P.length ? 'primary' : ''}" href="#/h/accounts${P.length ? '?f=pending' : ''}">${P.length ? '승인하러 가기' : '회원 보기'}</a></div>
      ${P.length ? h`<p class="v-small" style="margin-top:8px"><b>${P.length}명</b>이 승인을 기다려요</p><div style="margin-top:4px">${P.slice(0, 3).map((m) => h`<a class="v-doc" href="#/h/accounts/${m.id}" style="text-decoration:none;color:inherit"><div class="tx"><b>${m.name}</b> <span class="v-faint v-xs">${sRole(m)} · ${cName(m)}</span><small>${ICME.dateShort(m.date)} 신청${m.check ? ' · ' + (m.check.v === 'ok' ? '센터장 확인' : '센터장: 모르는 분') : ''}</small></div>${icon('chevron-right', 18, 'chev')}</a>`)}</div>` : h`<p class="v-small v-muted" style="margin-top:8px">승인을 기다리는 사람이 없어요.</p>`}
      <div class="v-xs v-muted" style="margin-top:8px">승인된 회원 ${ok}명 · 전체 ${all.length}명</div></section>`;
  };
  M.badge = () => { const n = M.pendingN(); return n ? h`<b class="mb-badge" aria-label="승인 기다리는 신청 ${n}건">${n}</b>` : ''; };
})();

</script>
<script>/* js/v2/record.js */
/* v2/record.js — 발음 녹음 (Before · After).
   마이크를 쓸 수 있으면 진짜로 녹음하고, 안 되면 "시연 모드"로 흐름만 보여 줍니다.
   ※ 점수 분석 엔진은 아직 연결 전이라, 점수는 시안(가상) 값입니다. 녹음 파일은 이 화면을 닫기 전까지만 기억해요. */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const q = ICME.q; const ui = ICME.ui; const S = ICME.shared; const I = ICME.insight;
  const db = () => ICME.store.db;
  const R = (V.rec = { sid: null, stage: null, st: 'idle', t0: 0, sec: 0, mr: null, chunks: [], url: null, sim: false, timer: null });

  /* 아이의 녹음 상태: both(전후 모두) · before · empty · none(동의 없음) */
  V.pronState = function (s) {
    if (s.consent.video === 'none') return { st: 'none' };
    const real = db().videos.filter((p) => p.studentId === s.id);
    const done = real.filter((p) => p.after).pop(); if (done) return { st: 'both', pair: done };
    const syn = I.pairOf(s); if (syn) return { st: 'both', pair: syn };
    return { st: real.some((p) => p.before) || (s.video && s.video.before) ? 'before' : 'empty' };
  };
  /* 녹음할 대본: 반의 이달 주제 권에 들어 있는 3문장 (전·후가 같아야 비교할 수 있어요) */
  V.scriptFor = function (s) {
    const pending = db().videos.find((p) => p.studentId === s.id && p.before && !p.after);
    const vol = pending ? q.volOf(pending.vol) : q.volOf(q.themeFor(q.klass(s.classIds[0])).vol);
    return { vol, lines: vol.video.lines };
  };

  V.recReset = function (sid, stage) { clearInterval(R.timer); if (R.mr && R.mr.state !== 'inactive') { try { R.mr.onstop = null; R.mr.stop(); } catch (e) { /* noop */ } } if (R.stream) R.stream.getTracks().forEach((t) => t.stop()); Object.assign(R, { sid, stage, st: 'idle', sec: 0, mr: null, chunks: [], url: null, sim: false, stream: null }); };

  V.recStart = async function () {
    R.chunks = []; R.url = null; R.sim = false;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') throw new Error('mic');
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      R.stream = stream; R.mr = new MediaRecorder(stream);
      R.mr.ondataavailable = (e) => { if (e.data && e.data.size) R.chunks.push(e.data); };
      R.mr.onstop = () => { stream.getTracks().forEach((t) => t.stop()); R.url = URL.createObjectURL(new Blob(R.chunks, { type: R.mr.mimeType || 'audio/webm' })); R.st = 'done'; V.render(); };
      R.mr.start();
    } catch (e) { R.sim = true; }
    R.st = 'rec'; R.t0 = Date.now(); R.sec = 0;
    clearInterval(R.timer);
    R.timer = setInterval(() => { R.sec = Math.floor((Date.now() - R.t0) / 1000); const el = document.getElementById('v-timer'); if (el) el.textContent = V.fmt(R.sec); if (R.sec >= 45) V.recStop(); }, 250);
    V.render();
  };
  V.recStop = function () {
    clearInterval(R.timer); R.sec = Math.max(1, Math.round((Date.now() - R.t0) / 1000));
    if (R.mr && R.mr.state !== 'inactive') R.mr.stop(); else { R.st = 'done'; V.render(); }
  };
  V.recSave = function () {
    const sid = R.sid; const stage = R.stage; const sec = R.sec; if (R.url) V.audio[sid + ':' + stage] = R.url;
    ICME.store.mutate((d) => {
      const s = d.students.find((x) => x.id === sid); const rec = { date: ICME.ymd(ICME.today()), sec };
      const pending = d.videos.find((p) => p.studentId === sid && p.before && !p.after);
      if (stage === 'after' && pending) pending.after = rec; else { s.video = s.video || {}; s.video[stage] = true; }
    });
    const ps = V.pronState(q.student(sid));
    V.recReset(null, null);
    if (ps.st === 'both') { ui.toast('Before와 After를 비교할 수 있어요'); V.go('/t/compare/' + sid); }
    else { ui.toast('Before를 저장했어요. After는 단원 마지막 주에 같은 대본으로 녹음해요'); V.go('/t/kid/' + sid); }
  };

  ICME.actions['v.rec.start'] = () => V.recStart();
  ICME.actions['v.rec.stop'] = () => V.recStop();
  ICME.actions['v.rec.again'] = () => { V.recReset(R.sid, R.stage); V.render(); };
  ICME.actions['v.rec.save'] = () => V.recSave();
  ICME.actions['v.rec.model'] = (el) => S.speak(el.dataset.t, 'en-US');
  /* 재생: 진짜 녹음이면 그 소리를, 시안 데이터면 샘플 음성으로 */
  ICME.actions['v.play'] = (el) => {
    const url = V.audio[el.dataset.sid + ':' + el.dataset.stage];
    if (url) { try { new Audio(url).play(); } catch (e) { ui.toast('재생할 수 없어요', 'warn'); } } else { S.speak(el.dataset.t, 'en-US'); ui.toast('시안 데이터라 샘플 음성으로 들려줘요'); }
  };
})();

</script>
<script>/* js/v2/bank.js */
/* v2/bank.js — 본사: K-ISEL 문항 은행 (5단계 × 20문항 = 100문항).
   발표자료에는 구조와 단계별 대표 질문 1개씩만 있어서, 나머지 문항 원문은 여기서 올려야 합니다.
   엑셀(CSV)로 올리거나 한 문항씩 입력하면 → 학부모 앱의 아이 설문이 이 문항으로 나갑니다. */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui;
  const db = () => ICME.store.db; const AREAS = ICME.kisel.areas; const PER = ICME.kisel.itemsPerStage;

  /* ---------- 저장소: db.bank = { version, confirmed, items[] } (처음엔 시안 20문항으로 채워 둠) ---------- */
  V.bank = function () {
    if (!db().bank) ICME.store.mutate((d) => { d.bank = { version: '시안 초안', confirmed: false, items: ICME.kisel.items.map((x) => Object.assign({}, x, { src: x.src === 'deck' ? 'deck' : 'sample' })) }; });
    return db().bank;
  };
  V.bankItems = (stage) => V.bank().items.filter((x) => x.stage === stage).sort((a, b) => a.no - b.no);
  const SRC = { deck: ['발표자료 대표', 'ok'], sample: ['가상 문항', ''], import: ['올린 문항', 'ok'], edit: ['직접 입력', 'ok'] };
  const TYPE = { scale: '4점 척도', scenario: '상황 선택' };
  const count = () => { const it = V.bank().items; return { all: it.length, deck: it.filter((x) => x.src === 'deck').length, sample: it.filter((x) => x.src === 'sample').length, real: it.filter((x) => x.src === 'import' || x.src === 'edit').length }; };

  /* ---------- CSV 읽기 · 쓰기 (엑셀에서 복사해 붙여넣은 탭 구분도 읽어요) ---------- */
  const COLS = ['stage', 'no', 'type', 'text_ko', 'text_en', 'options', 'reverse', 'scores'];
  V.scoresOf = (x) => (x.scores && x.scores.length === (x.opts || []).length ? x.scores : (x.opts || []).map((_, i, a) => (a.length === 3 ? [4, 2, 1][i] : Math.round(4 - (3 * i) / Math.max(1, a.length - 1)))));   // 선택지별 점수(1~4). 정하지 않으면 3개는 4·2·1, 그 밖에는 4에서 1까지 고르게
  V.csvTemplate = function () {
    const q2 = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const rows = V.bank().items.slice().sort((a, b) => a.stage - b.stage || a.no - b.no).map((x) => [x.stage, x.no, x.type, q2(x.text), q2(x.en || ''), q2((x.opts || []).join('|')), x.reverse ? 'Y' : 'N', x.type === 'scenario' ? q2(V.scoresOf(x).join('|')) : ''].join(','));
    return '﻿' + COLS.join(',') + '\r\n' + rows.join('\r\n') + '\r\n';
  };
  V.csvParse = function (text) {
    const t = String(text || '').replace(/^﻿/, ''); const first = t.split(/\r?\n/)[0] || ''; const sep = first.indexOf('\t') >= 0 && first.indexOf(',') < 0 ? '\t' : ',';
    const rows = []; let cur = []; let f = ''; let inq = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (inq) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else inq = false; } else f += c; }
      else if (c === '"') inq = true;
      else if (c === sep) { cur.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; cur.push(f); f = ''; if (cur.some((x) => x.trim() !== '')) rows.push(cur); cur = []; }
      else f += c;
    }
    cur.push(f); if (cur.some((x) => x.trim() !== '')) rows.push(cur);
    if (!rows.length) return { items: [], errors: ['내용이 비어 있어요'], warnings: [] };
    const head = rows[0].map((x) => x.trim().toLowerCase()); const hasHead = head.indexOf('stage') >= 0 || head.indexOf('text_ko') >= 0;
    const idx = (k, d) => (hasHead && head.indexOf(k) >= 0 ? head.indexOf(k) : d);
    const ix = { stage: idx('stage', 0), no: idx('no', 1), type: idx('type', 2), ko: idx('text_ko', 3), en: idx('text_en', 4), opt: idx('options', 5), rev: idx('reverse', 6), sc: idx('scores', 7) };
    const items = []; const errors = []; const warnings = []; const seen = {};
    const TYPES = { scale: 'scale', '척도': 'scale', '4점 척도': 'scale', scenario: 'scenario', '상황': 'scenario', '상황 선택': 'scenario' };
    rows.slice(hasHead ? 1 : 0).forEach((r, n) => {
      const line = n + (hasHead ? 2 : 1); const g = (k) => (r[ix[k]] == null ? '' : String(r[ix[k]]).trim());
      const stage = Number(g('stage')); const no = Number(g('no')); const type = TYPES[g('type').toLowerCase()] || (g('type') === '' ? 'scale' : null);
      const text = g('ko'); const opts = g('opt') ? g('opt').split('|').map((x) => x.trim()).filter(Boolean) : [];
      if (!(stage >= 1 && stage <= 5) || !(no >= 1 && no <= PER) || !Number.isInteger(stage) || !Number.isInteger(no)) { errors.push(line + '번째 줄: stage는 1~5, no는 1~' + PER + '이어야 해요'); return; }
      if (!type) { errors.push(line + '번째 줄: type은 scale(4점 척도) 또는 scenario(상황 선택)로 적어 주세요'); return; }
      if (!text) { errors.push(line + '번째 줄: 문항(text_ko)이 비어 있어요'); return; }
      if (text.length > 200) { errors.push(line + '번째 줄: 문항이 너무 길어요 (200자 이하)'); return; }
      if (type === 'scenario' && (opts.length < 2 || opts.length > 4)) { errors.push(line + '번째 줄: 상황 선택 문항은 선택지가 2~4개 필요해요 (A|B|C 처럼 | 로 나눠요)'); return; }
      let scores;
      if (type === 'scenario' && g('sc')) { scores = g('sc').split('|').map((x) => Number(x.trim())); if (scores.length !== opts.length || scores.some((x) => !(x >= 1 && x <= 4))) { errors.push(line + '번째 줄: scores는 선택지 수만큼 1~4 점수를 | 로 적어 주세요 (예: 4|2|1)'); return; } }
      const key = stage + '-' + no; if (seen[key]) warnings.push(stage + '단계 ' + no + '번이 여러 줄에 있어요. 마지막 줄이 적용돼요'); seen[key] = true;
      items.push({ stage, no, type, text, en: g('en'), opts: type === 'scenario' ? opts : undefined, scores, reverse: type === 'scale' && /^(y|yes|1|true|o)$/i.test(g('rev')), src: 'import' });
    });
    return { items, errors, warnings };
  };

  /* ---------- 본사 화면 틀 ---------- */
  const hqTabs = (on) => V.hTabs(on);
  const locked = () => V.bank().confirmed;

  /* ======================================================== 문항 은행 */
  V.add('/h', {
    title: '문항 은행', wide: true,
    mount() { if (/[?&]sheet=import/.test(location.search) && !V._sheetOpened) { V._sheetOpened = true; ICME.actions['h.import'](); } },   // 캡처용: ?sheet=import
    render() {
      const B = V.bank(); const c = count(); const total = AREAS.length * PER;
      const stageRow = (a) => { const it = V.bankItems(a.no); const n = it.length; return h`<a class="v-kid" href="#/h/s/${a.no}"><span class="v-av" style="width:44px;height:44px;background:${a.color}22;color:${V.darken(a.color)};font-size:18px">${a.no}</span><div class="main"><div class="nm">${a.name}<small>${a.sub}</small></div><div class="ds">대표 질문 · “${a.q}”</div><div class="v-bar" style="margin-top:8px;height:6px;max-width:320px"><i style="width:${ICME.pct(n, PER)}%"></i></div></div><span class="v-tag ${n >= PER ? 'ok' : n ? '' : 'watch'}">${n} / ${PER}</span>${icon('chevron-right', 18, 'chev')}</a>`; };
      return h`<div class="v-head"><div class="v-eyebrow">본사</div><h1 class="v-h1">K-ISEL 문항 은행</h1><p class="v-sub">5단계 × 20문항 = 100문항. 학부모 앱의 아이 설문은 여기 등록된 문항으로 나가요.</p></div>
        ${hqTabs('kisel')}
        <div class="v-card"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:min(240px,100%)"><div class="v-stat" style="border:0;padding:0"><div class="lb">등록된 문항</div><div class="vl">${c.all}<small>/ ${total}문항</small></div></div><div class="v-bar"><i style="width:${ICME.pct(c.all, total)}%"></i></div>
            <div class="v-xs v-muted" style="margin-top:8px">발표자료 대표 질문 ${c.deck}개 · 가상(시연용) ${c.sample}개 · 올린 문항 ${c.real}개 — <b>진짜 문항 원문은 아직 ${total - c.deck - c.real}개가 없어요</b></div></div>
          <div style="min-width:min(300px,100%);display:flex;flex-direction:column;gap:10px"><span class="v-tag ${B.confirmed ? 'ok' : ''}" style="align-self:flex-start">${B.version}</span>
            ${locked() ? h`<button class="v-btn" data-act="h.newver">${icon('edit', 18)}새 버전 만들기</button>` : h`<button class="v-btn primary" data-act="h.import">${icon('upload', 18)}문항 올리기 (엑셀/CSV)</button><div style="display:flex;gap:8px"><button class="v-btn sm" style="flex:1" data-act="h.template">${icon('download', 16)}엑셀 양식 받기</button><button class="v-btn sm" style="flex:1" data-act="h.confirm">버전 확정</button></div>`}</div></div></div>
        <div class="v-sec"><h2>단계별 문항</h2><span>눌러서 보고 고쳐요</span></div><div class="v-list">${AREAS.map(stageRow)}</div>
        <p class="v-note" style="margin-top:14px">${locked() ? '확정된 버전은 가맹점 간·시점 간 비교를 위해 고칠 수 없어요. 고치려면 새 버전을 만들어요.' : '문항을 확정하면 버전이 고정돼요(가맹점은 수정 불가). 그 전까지는 자유롭게 올리고 고칠 수 있어요.'} 가상 문항은 흐름을 확인하기 위한 것이라, 실제 아이에게 쓰기 전에 꼭 진짜 문항으로 바꿔 주세요.</p>`;
    }
  });

  /* ======================================================== 단계 하나 */
  V.add('/h/s/:n', {
    title: '단계 문항', wide: true,
    render(ctx) {
      const n = Number(ctx.params.n); const a = AREAS[n - 1]; if (!a) return h`<div class="v-empty"><b>단계를 찾을 수 없어요</b></div>`;
      const items = V.bankItems(n); const by = {}; items.forEach((x) => { by[x.no] = x; });
      const slot = (no) => {
        const x = by[no];
        if (!x) return h`<div class="v-slot empty"><span class="no">${no}</span><span class="tx v-faint">비어 있어요</span>${locked() ? '' : h`<button class="v-btn sm" data-act="h.edit" data-stage="${n}" data-no="${no}">${icon('plus', 14)}입력</button>`}</div>`;
        const src = SRC[x.src] || SRC.sample;
        return h`<div class="v-slot"><span class="no">${no}</span><div class="tx"><div>${x.text}</div>${x.en ? h`<div class="v-xs v-faint">${x.en}</div>` : ''}${x.opts ? h`<div class="v-xs v-muted" style="margin-top:4px">${x.opts.map((o, i) => (i + 1) + '. ' + o + ' (' + V.scoresOf(x)[i] + '점)').join('  ·  ')}</div>` : ''}<div class="v-xs" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="v-tag">${TYPE[x.type]}</span><span class="v-tag ${src[1]}">${src[0]}</span>${x.reverse ? h`<span class="v-tag">점수 뒤집기</span>` : ''}</div></div>${locked() ? '' : h`<div style="display:flex;gap:6px"><button class="v-btn sm" data-act="h.edit" data-stage="${n}" data-no="${no}">수정</button><button class="v-btn sm ghost" data-act="h.del" data-stage="${n}" data-no="${no}" aria-label="삭제">${icon('trash', 16)}</button></div>`}</div>`;
      };
      return h`${V.back('/h', '문항 은행')}<div class="v-head"><div class="v-eyebrow">${n}단계 · ${a.sub}</div><h1 class="v-h1">${a.name}</h1><p class="v-sub">대표 질문 “${a.q}” · ${items.length} / ${PER}문항 등록</p></div>
        <div class="v-list">${Array.from({ length: PER }, (_, i) => slot(i + 1))}</div>`;
    }
  });

  /* ======================================================== 동작: 올리기 · 양식 · 수정 · 삭제 · 확정 */
  ICME.actions['h.template'] = () => {
    if (window.ICME_SHARED) { ui.toast('이 공유 화면에서는 파일 내려받기가 막혀 있어요. 엑셀 표를 복사해서 붙여 넣어 보세요', 'warn'); return; }
    try { const blob = new Blob([V.csvTemplate()], { type: 'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'K-ISEL_문항_양식.csv'; document.body.appendChild(a); a.click(); a.remove(); ui.toast('엑셀 양식을 내려받았어요. 현재 등록된 문항이 들어 있어요'); } catch (e) { ui.toast('내려받을 수 없는 환경이에요', 'warn'); }
  };
  ICME.actions['h.import'] = () => {
    V.sheet(h`<h2 class="v-h2">문항 올리기</h2><p class="v-sub" style="margin-bottom:10px">엑셀 양식을 채워 CSV로 저장해서 올리거나, 엑셀 표를 그대로 복사해 아래에 붙여 넣어요. 같은 단계·번호의 문항은 올린 것으로 바뀌어요.</p>
      <input id="h-file" aria-label="CSV 파일 고르기" type="file" accept=".csv,.tsv,.txt,text/csv" style="display:block;margin-bottom:10px;font-size:14px" data-change="h.file">
      <textarea id="h-text" aria-label="엑셀 표를 복사해 붙여 넣기" rows="7" placeholder="stage,no,type,text_ko,text_en,options,reverse,scores&#10;1,5,scale,&quot;속상할 때 …&quot;,,,N,&#10;1,6,scenario,&quot;상황 …&quot;,,&quot;A|B|C&quot;,N,&quot;4|2|1&quot;" style="width:100%;border:1px solid var(--v-line);border-radius:14px;padding:12px;font:inherit;font-size:14px;resize:vertical" data-input="h.preview"></textarea>
      <div id="h-preview" class="v-small v-muted" style="margin-top:10px">내용을 올리거나 붙여 넣으면 여기에 미리 보여 드려요.</div>
      <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>닫기</button><button class="v-btn primary" id="h-apply" data-act="h.apply" disabled>반영하기</button></div>`);
  };
  const preview = () => {
    const t = (document.getElementById('h-text') || {}).value || ''; const box = document.getElementById('h-preview'); const btn = document.getElementById('h-apply'); if (!box) return;
    if (!t.trim()) { box.textContent = '내용을 올리거나 붙여 넣으면 여기에 미리 보여 드려요.'; if (btn) btn.disabled = true; return; }
    const r = V.csvParse(t); V._parsed = r;
    box.innerHTML = String(h`<b style="color:var(--v-ink)">${r.items.length}개 문항을 읽었어요</b>${r.errors.length ? h` · <span style="color:var(--v-red)">확인 필요 ${r.errors.length}건 (이 줄은 빼고 반영돼요)</span>` : ''}${r.errors.slice(0, 5).map((e) => h`<div class="v-xs" style="color:var(--v-red)">· ${e}</div>`)}${(r.warnings || []).slice(0, 3).map((e) => h`<div class="v-xs" style="color:var(--v-orange-ink)">· ${e}</div>`)}${r.items.slice(0, 3).map((x) => h`<div class="v-xs">· ${x.stage}단계 ${x.no}번 — ${x.text}</div>`)}`);
    if (btn) btn.disabled = !r.items.length;
  };
  ICME.actions['h.preview'] = () => preview();
  /* 엑셀이 "CSV(쉼표로 분리)"로 저장하면 한글이 UTF-8이 아닌 옛 한글 인코딩(CP949)이에요. 먼저 UTF-8로 읽어 보고, 안 되면 CP949로 읽어요 */
  ICME.actions['h.file'] = (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    if (/\.xlsx?$/i.test(f.name)) { ui.toast('엑셀 파일은 바로 올릴 수 없어요. "다른 이름으로 저장 › CSV"로 저장하거나, 표를 복사해서 아래에 붙여 넣어 주세요', 'warn'); el.value = ''; return; }
    if (f.size > 2 * 1024 * 1024) { ui.toast('파일이 너무 커요 (2MB 이하)', 'warn'); el.value = ''; return; }
    const rd = new FileReader();
    rd.onload = () => {
      const buf = rd.result; let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { try { text = new TextDecoder('euc-kr').decode(buf); } catch (e2) { text = new TextDecoder('utf-8').decode(buf); } }
      const ta = document.getElementById('h-text'); if (ta) { ta.value = text; preview(); }
    };
    rd.readAsArrayBuffer(f);
  };
  ICME.actions['h.apply'] = () => {
    const r = V._parsed; if (!r || !r.items.length) return;
    ICME.store.mutate((d) => { V.bank(); r.items.forEach((x) => { const i = d.bank.items.findIndex((y) => y.stage === x.stage && y.no === x.no); if (i >= 0) d.bank.items[i] = x; else d.bank.items.push(x); }); d.bank.version = '초안 · ' + ICME.dateShort(ICME.today()) + ' 수정'; });
    V.closeSheet(); ui.toast(r.items.length + '개 문항을 반영했어요'); V.render();
  };
  ICME.actions['h.edit'] = (el) => {
    const stage = Number(el.dataset.stage); const no = Number(el.dataset.no); const x = V.bankItems(stage).find((y) => y.no === no) || { type: 'scale', text: '', opts: [] };
    V.sheet(h`<h2 class="v-h2">${stage}단계 · ${no}번 문항</h2>
      <label class="v-small" for="h-ko" style="font-weight:700;display:block;margin:12px 0 4px">문항 (한국어)</label><textarea id="h-ko" rows="3" style="width:100%;border:1px solid var(--v-line);border-radius:14px;padding:12px;font:inherit;font-size:15px">${x.text}</textarea>
      <label class="v-small" for="h-en" style="font-weight:700;display:block;margin:12px 0 4px">영어 (선택)</label><input id="h-en" value="${x.en || ''}" style="width:100%;border:1px solid var(--v-line);border-radius:14px;padding:12px;font:inherit;font-size:15px">
      <label class="v-small" for="h-type" style="font-weight:700;display:block;margin:12px 0 4px">유형</label><select id="h-type" style="width:100%;border:1px solid var(--v-line);border-radius:14px;padding:12px;font:inherit;font-size:15px" data-change="h.type"><option value="scale" ${x.type === 'scale' ? raw('selected') : ''}>4점 척도 (아주 맞아요 ~ 아니에요)</option><option value="scenario" ${x.type === 'scenario' ? raw('selected') : ''}>상황 선택 (그림을 보고 고르기)</option></select>
      <div id="h-opts" style="${x.type === 'scenario' ? '' : 'display:none'}"><label class="v-small" for="h-opt" style="font-weight:700;display:block;margin:12px 0 4px">선택지 (한 줄에 하나, 2~4개)</label><textarea id="h-opt" rows="3" style="width:100%;border:1px solid var(--v-line);border-radius:14px;padding:12px;font:inherit;font-size:15px">${(x.opts || []).join('\n')}</textarea>
        <label class="v-small" for="h-sc" style="font-weight:700;display:block;margin:12px 0 4px">선택지별 점수 <span class="v-faint" style="font-weight:500">· 1~4점, 선택지 순서대로 | 로 나눠요 (예: 4|2|1). 비워 두면 기본값을 써요</span></label><input id="h-sc" value="${x.opts && x.opts.length ? (x.scores && x.scores.length === x.opts.length ? x.scores.join('|') : '') : ''}" placeholder="4|2|1" style="width:100%;border:1px solid var(--v-line);border-radius:14px;padding:12px;font:inherit;font-size:15px"></div>
      <label class="v-small" style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="h-rev" ${x.reverse ? raw('checked') : ''}>"아니에요"가 더 좋은 답인 문항이에요 (점수를 뒤집어요)</label>
      <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="h.save" data-stage="${stage}" data-no="${no}">저장</button></div>`);
  };
  ICME.actions['h.type'] = (el) => { const b = document.getElementById('h-opts'); if (b) b.style.display = el.value === 'scenario' ? '' : 'none'; };
  ICME.actions['h.save'] = (el) => {
    const stage = Number(el.dataset.stage); const no = Number(el.dataset.no); const val = (id) => (document.getElementById(id) || {}).value || '';
    const text = val('h-ko').trim(); const type = val('h-type'); const opts = val('h-opt').split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    if (!text) { ui.toast('문항을 입력해 주세요', 'warn'); return; } if (text.length > 200) { ui.toast('문항이 너무 길어요 (200자 이하)', 'warn'); return; }
    if (type === 'scenario' && (opts.length < 2 || opts.length > 4)) { ui.toast('선택지를 2~4개 적어 주세요', 'warn'); return; }
    let scores; const rawSc = val('h-sc').trim();
    if (type === 'scenario' && rawSc) { scores = rawSc.split('|').map((x) => Number(x.trim())); if (scores.length !== opts.length || scores.some((x) => !(x >= 1 && x <= 4))) { ui.toast('선택지별 점수는 선택지 수만큼 1~4점을 | 로 적어 주세요 (예: 4|2|1)', 'warn'); return; } }
    const item = { stage, no, type, text, en: val('h-en').trim(), opts: type === 'scenario' ? opts : undefined, scores, reverse: type === 'scale' && !!(document.getElementById('h-rev') || {}).checked, src: 'edit' };
    ICME.store.mutate((d) => { V.bank(); const i = d.bank.items.findIndex((y) => y.stage === stage && y.no === no); if (i >= 0) d.bank.items[i] = item; else d.bank.items.push(item); d.bank.version = '초안 · ' + ICME.dateShort(ICME.today()) + ' 수정'; });
    V.closeSheet(); ui.toast('저장했어요'); V.render();
  };
  ICME.actions['h.del'] = (el) => {
    const stage = Number(el.dataset.stage); const no = Number(el.dataset.no);
    V.ask({ title: '이 문항을 지울까요?', text: stage + '단계 ' + no + '번 문항이 목록에서 없어져요. 지운 뒤에는 되돌릴 수 없어요.', ok: '지울게요', danger: true, onOk: () => { ICME.store.mutate((d) => { V.bank(); d.bank.items = d.bank.items.filter((y) => !(y.stage === stage && y.no === no)); }); ui.toast('삭제했어요'); V.render(); } });
  };
  ICME.actions['h.confirm'] = () => {
    const c = count(); V.sheet(h`<h2 class="v-h2">버전을 확정할까요?</h2><p class="v-sub" style="margin-top:6px">확정하면 문항이 고정돼요. 가맹점 간·시점 간 점수를 비교하려면 문항이 바뀌지 않아야 하거든요. 고치고 싶으면 새 버전을 만들어요.</p>
      ${c.sample || c.deck < 5 ? h`<div class="v-card warm" style="margin-top:14px"><b>가상(시연용) 문항 ${c.sample}개가 남아 있어요</b><div class="v-small" style="margin-top:4px">진짜 문항으로 바꾼 뒤에 확정하는 게 좋아요. 시안에서는 그대로 확정할 수 있어요.</div></div>` : ''}
      <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>취소</button><button class="v-btn primary" data-act="h.confirmGo">확정하기</button></div>`);
  };
  ICME.actions['h.confirmGo'] = () => { ICME.store.mutate((d) => { V.bank(); d.bank.confirmed = true; d.bank.version = 'v1.0 확정 · ' + ICME.dateShort(ICME.today()); }); V.closeSheet(); ui.toast('문항 버전을 확정했어요'); V.render(); };
  ICME.actions['h.newver'] = () => { ICME.store.mutate((d) => { V.bank(); d.bank.confirmed = false; d.bank.version = '새 버전 초안 · ' + ICME.dateShort(ICME.today()); }); ui.toast('새 버전을 만들었어요. 이제 고칠 수 있어요'); V.render(); };
})();

</script>
<script>/* js/v2/teacher.js */
/* v2/teacher.js — 선생님: 우리반 → 아이 한 장 → (녹음 · 비교) · 수업안.
   선생님이 하는 일은 셋뿐: ① 수업 준비 ② 발음 녹음 ③ 부모님께 알리기. 화면도 그 순서대로 이어집니다. */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const SC = ICME.scoring; const S = ICME.shared;
  const db = () => ICME.store.db; const DOW = ICME.DOW;
  const me = () => q.teacher(V.tid());
  const focusOf = (s) => SC.profile(s).lowest[0] || null;
  const needsLook = (s) => { const f = focusOf(s); return !!f && f.combined < 2.7; };
  const parentDone = (s) => !!(s.survey && s.survey.parent && s.survey.parent.done);
  const tipLine = (t) => { const m = /\s*\(L(\d)\)\s*$/.exec(t); return m ? h`${t.replace(m[0], '')}<span class="v-wk">${m[1]}주차</span>` : t; };

  /* ======================================================== 우리반 */
  const todayKey = () => ICME.ymd(ICME.today());
  const logOf = (cid) => (db().v2logs || {})[cid + ':' + todayKey()];
  V.add('/t', {
    title: '우리반', bnav: true,
    render() {
      const t = me(); const classes = q.classesOfTeacher(t.id).slice().sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
      if (!classes.length) return h`<div class="v-empty"><b>담당 반이 없어요</b>센터장이 반을 배정하면 여기에 보여요.</div>`;
      const sel = classes.find((k) => k.id === V.vs.cls) || classes.find((k) => k.day === q.dow()) || classes[0]; const kids = q.studentsOfClass(sel.id).slice();
      kids.sort((a, b) => Number(needsLook(b)) - Number(needsLook(a)) || a.name.localeCompare(b.name, 'ko'));
      const month = sel.program !== 'ART'
        ? h`<div class="v-card soft"><div class="v-h2" style="font-size:17px">${ICME.programs.byKey[sel.program].ko}</div><p class="v-small v-muted" style="margin-top:6px">정규 커리큘럼 수업이에요. 아이별 가이드는 아래에서 열어 보세요.</p></div>`
        : (() => {
          const vol = q.volOf(q.themeFor(sel).vol); const n = kids.filter((s) => { const f = focusOf(s); return f && f.area.no === vol.area; }).length;
          return h`<div class="v-card"><div class="v-month"><div class="v-cover">${S.cover(vol)}</div><div><div class="v-eyebrow">이번 달 수업</div><div class="t">${vol.no}권 · ${vol.titleKo}</div><div class="d">${kids.length}명 중 ${n}명이 ${ICME.josa(ICME.kisel.areas[vol.area - 1].short, '을/를')} 먼저 키워요</div></div></div><a class="v-btn" style="margin-top:14px" href="#/t/lesson/${sel.id}">${icon('book-open', 18)}수업 이렇게 가르쳐요</a></div>`;
        })();
      const row = (s) => {
        const f = focusOf(s); const ps = V.pronState(s); const d = ps.st === 'both' ? SC.pron(ps.pair).delta : null;
        const pn = (db().parentNotes || []).some((n) => n.sid === s.id && !n.read);
        const tag = pn ? h`<span class="v-tag up">부모님 메시지</span>` : needsLook(s) ? h`<span class="v-tag watch">살펴봐요</span>` : !parentDone(s) ? h`<span class="v-tag">부모 설문 대기</span>` : d != null ? h`<span class="v-tag up">발음 ${d > 0 ? '+' : ''}${d}점</span>` : '';
        const why = needsLook(s) && f ? ICME.josa(f.area.short, '을/를') + ' 더 키워 줘요' : f ? '이번 달 중점 · ' + f.area.short : '설문 전이에요';   // 살펴보는 이유를 말로 알려 줘요
        return h`<a class="v-kid" href="#/t/kid/${s.id}">${V.av(s.name, 46)}<div class="main"><div class="nm">${s.name}<small>${s.age}세</small></div><div class="ds">${why}</div></div>${tag}${icon('chevron-right', 18, 'chev')}</a>`;
      };
      /* 오늘 할 일: 오늘 수업 일지 → 부모님 메시지 → 살펴볼 아이 순서로, 맨 위에 하나씩 */
      const dow = q.dow(); const todays = classes.filter((k) => k.day === dow); const logDone = (k) => !!(logOf(k.id) && logOf(k.id).done);
      const seenK = {}; const allKids = classes.reduce((a, k) => a.concat(q.studentsOfClass(k.id)), []).filter((s) => !seenK[s.id] && (seenK[s.id] = 1));
      const todo = [];
      todays.filter((k) => !logDone(k)).slice(0, 2).forEach((k) => todo.push({ t: k.name + ' · ' + DOW[k.day] + ' ' + k.start + ' 수업', d: '수업이 끝나면 출석과 한 줄 메모를 남겨요. 1분이면 돼요', label: '일지 쓰기', href: '/t/log/' + k.id }));
      const msgs = (db().parentNotes || []).filter((n) => !n.read && seenK[n.sid]);
      if (msgs.length) { const s0 = q.student(msgs[0].sid); todo.push({ t: '부모님 메시지 ' + msgs.length + '개가 왔어요', d: s0.name + ' 보호자님이 보냈어요. 읽고 "확인했어요"를 눌러요', label: '읽어 보기', href: '/t/kid/' + s0.id }); }
      const looks = allKids.filter(needsLook);
      if (looks.length) todo.push({ t: '살펴볼 아이 ' + looks.length + '명이 있어요', d: '이유를 보고 이번 달 가르치는 법을 확인해요', label: looks[0].name + ' 보기', href: '/t/kid/' + looks[0].id });
      const nxt = (() => { for (let i = 1; i <= 7; i++) { const L = classes.filter((k) => k.day === (dow + i) % 7); if (L.length) return L[0]; } return null; })();
      const hero = V.today({ k: '오늘 ' + ICME.dateKo(ICME.today()), items: todo, max: 3, doneTitle: todays.length ? '오늘 할 일을 모두 마쳤어요' : '오늘은 수업이 없어요', doneText: todays.length ? '수고하셨어요. 아이들 모습은 아래에서 볼 수 있어요.' : nxt ? '다음 수업은 ' + DOW[nxt.day] + '요일 ' + nxt.start + ' ' + nxt.name + '이에요.' : '' });
      return h`<div class="v-head"><div class="v-eyebrow">${t.name} 선생님</div><h1 class="v-h1">우리반</h1></div>${hero}
        <div class="v-chips">${classes.map((k) => h`<a class="v-chip ${k.id === sel.id ? 'on' : ''}" href="#/t" data-act="v.cls" data-id="${k.id}">${k.name}<small>${DOW[k.day]} ${k.start}</small></a>`)}</div>
        ${month}
        <a class="v-card" href="#/t/log/${sel.id}" style="display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit"><span class="v-av" style="width:44px;height:44px;background:var(--v-primary-bg);color:var(--v-primary-d)">${icon('clipboard-check', 22)}</span><div style="flex:1"><b style="font-size:17px">오늘 수업 일지</b><div class="v-small v-muted">${logOf(sel.id) && logOf(sel.id).done ? '제출했어요' : '출석 · 수업 분위기 · 한 줄 메모'}</div></div>${logOf(sel.id) && logOf(sel.id).done ? h`<span class="v-tag ok">제출 완료</span>` : h`<span class="v-tag watch">아직이에요</span>`}${icon('chevron-right', 18, 'chev')}</a>
        <div class="v-sec"><h2>아이들 ${kids.length}명</h2></div>
        <div class="v-list">${kids.map(row)}</div>`;
    }
  });
  ICME.actions['v.cls'] = (el) => { V.vs.cls = el.dataset.id; V.render(); };

  /* ======================================================== 아이 한 장 */
  const message = (s, t, g) => {
    const sc = g.script; const strong = sc[1].t.replace(/ 지난번보다 "([^"]+)" 영역이 [0-9.]+점 자랐어요\./, ' 지난번보다 "$1" 영역도 자랐어요.');
    return [sc[0].t, strong, sc[2].t, '집에서는 ' + sc[3].t, '궁금하신 점은 편하게 말씀해 주세요.'];
  };
  /* 열람 기록: 담당 교사(teacher)·본사(hq)가 아이 정보를 열면 사람·아이·날짜당 한 번 남겨요 (센터장이 아이 정보에서 볼 수 있어요) */
  V.logView = function (sid, by, role, why) {
    const d0 = db(); const date = ICME.ymd(ICME.today());
    if (!q.student(sid) || !d0.access || d0.access.some((x) => x.sid === sid && x.by === by && x.date === date)) return;
    ICME.store.mutate((d) => d.access.push(why ? { sid, by, role: role || 'teacher', date, why } : { sid, by, role: role || 'teacher', date }));   // why: 본사가 연 사유(설정에서 사유를 받을 때)
  };
  /* 학부모가 리포트를 보고 "선생님께 알리기"로 보낸 메시지 (선생님 화면 아이 한 장 맨 위) */
  V.parentNoteCard = (s) => {
    const n = (db().parentNotes || []).filter((x) => x.sid === s.id).slice(-1)[0]; if (!n) return '';
    return h`<div class="v-card ${n.read ? '' : 'warm'}" style="margin-top:12px"><div class="v-eyebrow">부모님이 보냈어요 · ${n.month}월 리포트</div><p style="margin-top:6px;line-height:1.65;white-space:pre-wrap">${n.text}</p><div style="display:flex;align-items:center;gap:10px;margin-top:10px"><span class="v-xs v-muted">${ICME.dateShort(n.date)}</span>${n.read ? h`<span class="v-tag ok">확인함</span>` : h`<button class="v-btn sm primary" data-act="t.noteRead" data-id="${n.id}">확인했어요</button>`}</div></div>`;
  };
  ICME.actions['t.noteRead'] = (el) => { ICME.store.mutate((d) => { const n = (d.parentNotes || []).find((x) => x.id === el.dataset.id); if (n) n.read = true; }); ui.toast('확인했어요. 부모님께도 전해져요'); V.render(); };
  /* 아이 한 장 — 선생님(할 일 버튼 있음) · 센터장(보기 + 알림) · 본사(보기만)가 같이 써요.
     opt = { t: 담당 교사, canAct: 선생님 버튼(녹음·관찰·보내기), canNudge: 보호자 알림 버튼, showMsg: 부모님께 알릴 말 카드, guideLink: 본사용 지도 가이드 링크,
             back: [주소, 이름], compare: 전후 비교 주소 } */
  V.kidPage = function (s, opt) {
    const t = opt.t; const canAct = !!opt.canAct; const canNudge = opt.canNudge === undefined ? canAct : !!opt.canNudge; const cls = q.klass(s.classIds[0]); const prof = SC.profile(s);
    const nudgeBtn = (cls2) => (canNudge ? h`<button class="v-btn sm" style="margin-top:12px" data-act="v.nudge" data-sid="${s.id}">${icon('bell', 16)}${cls2}</button>` : '');
    const head = h`${V.back(opt.back[0], opt.back[1])}<div class="v-head" style="display:flex;gap:14px;align-items:center">${V.av(s.name, 64)}<div><h1 class="v-h1">${s.name}</h1><div class="v-sub" style="margin-top:2px">${cls.name} · ${s.age}세</div></div></div>`;
    if (!prof.areas.some((a) => a.combined != null)) {   // 아직 설문 전인 아이(방금 등록한 아이 등)
      return h`${head}${opt.banner || ''}<div class="v-card warm"><div class="v-h2" style="font-size:17px">아직 설문 전이에요</div><p class="v-small" style="margin-top:6px">보호자가 아이와 함께 설문을 마치면 지금 모습과 지도 가이드가 만들어져요.</p>${nudgeBtn('보호자께 설문 알림 보내기')}</div>`;
    }
    const g = ICME.coaching.build(s, t.name); const b = g.blocks[0]; const ps = V.pronState(s); const sent = (db().sent || {})[s.id];
    const msg = message(s, t, g);
    /* 다음에 할 일: 상태를 보고 지금 눌러야 할 것 하나만 위에 올려 줘요 (선생님에게만) */
    let nextCard = '';
    if (canAct) {
      const next = ps.st === 'empty' ? { ic: 'mic', k: '다음에 할 일', t: 'Before 녹음하기', d: '수업 첫 주에 한 명 30초', href: '#/t/rec/' + s.id + '?stage=before' }
        : ps.st === 'before' ? { ic: 'mic', k: '다음에 할 일', t: 'After 녹음하기', d: '단원 마지막 주에 같은 대본으로', href: '#/t/rec/' + s.id + '?stage=after' }
          : !sent ? { ic: 'send', k: '다음에 할 일', t: '부모님께 알리기', d: '이번 달 이야기를 카톡으로 보내요', act: 'v.tomsg' } : null;
      const nextInner = next ? h`<span class="ic">${icon(next.ic, 22)}</span><span class="tx"><small>${next.k}</small><b>${next.t}</b><span>${next.d}</span></span>${icon('chevron-right', 20)}` : '';
      nextCard = !next ? h`<div class="v-next done"><span class="ic">${icon('check-circle', 24)}</span><span class="tx"><b>이번 달 할 일을 모두 마쳤어요</b><span>${ICME.dateShort(sent)}에 부모님께 보냈어요</span></span></div>`
        : next.href ? h`<a class="v-next" href="${next.href}">${nextInner}</a>` : h`<button class="v-next" data-act="${next.act}">${nextInner}</button>`;
    }
    const pending = !parentDone(s) ? h`<div class="v-card warm"><div class="v-h2" style="font-size:17px">부모 설문을 기다리고 있어요</div><p class="v-small" style="margin-top:6px">지금 모습은 아이 응답만으로 만든 임시예요. 부모님이 답하면 더 정확해져요.</p>${nudgeBtn('부모님께 알림 보내기')}</div>` : '';
    const areaRow = (a) => { const focus = b && a.i === b.area.no - 1; return h`<button class="v-area ${focus ? 'focus' : ''}" data-act="v.why" data-sid="${s.id}" data-i="${a.i}"><span class="dot" style="background:${ICME.kisel.areas[a.i].color}"></span><span class="nm">${a.area.short}${focus ? h`<small>이번 달 중점</small>` : ''}</span>${a.combined != null ? V.state(a.combined) : h`<span class="v-st">설문 전</span>`}${icon('chevron-right', 16, 'chev')}</button>`; };
    let pron;
    if (ps.st === 'none') pron = h`<p class="v-small v-muted">${s.consent.agreedAt === null ? '보호자 동의 전이라 녹음하지 않아요.' : '영상·녹음 동의가 없는 아이예요. 녹음하지 않아요.'}</p>`;
    else if (ps.st === 'both') { const p = SC.pron(ps.pair); pron = h`${V.consent.analyzeOK(s) ? h`<div class="v-score"><div class="n b"><small>Before</small>${p.before.overall}</div><div class="arrow">${icon('arrow-right', 22)}</div><div class="n"><small>After</small>${p.after.overall}</div><div class="gain">${p.delta > 0 ? '+' : ''}${p.delta}<small>${p.change.label}</small></div></div>` : h`<p class="v-small v-muted">점수 계산에 동의하지 않은 아이예요. 점수 없이 소리만 비교해요.</p>`}<a class="v-btn" style="margin-top:16px" href="#${opt.compare}">${icon('volume', 18)}듣고 비교하기</a>`; }
    else if (ps.st === 'before') pron = h`<p class="v-small v-muted">Before 녹음을 마쳤어요. After는 단원 마지막 주에 같은 대본으로 녹음해요.</p>${canAct ? h`<a class="v-btn primary" style="margin-top:14px" href="#/t/rec/${s.id}?stage=after">${icon('mic', 18)}After 녹음하기</a>` : ''}`;
    else pron = h`<p class="v-small v-muted">같은 대본을 단원 첫 주(Before)와 마지막 주(After)에 녹음해서 비교해요. 한 명에 30초면 돼요.</p>${canAct ? h`<a class="v-btn primary" style="margin-top:14px" href="#/t/rec/${s.id}?stage=before">${icon('mic', 18)}Before 녹음하기</a>` : ''}`;
    /* 알아 두세요: 점수 근거에서 나온 주의 신호(집·센터 차이, 응답 품질 등)와 센터장과 상의할 신호. 접어 두고 개수만 보여 줘요 */
    const notes = g.flags.map((f) => ({ title: f.title, text: f.text })).concat(g.signals.map((x) => ({ title: '센터장과 함께 살펴봐요', text: x })));
    return h`${head}
      ${opt.banner || ''}${canAct ? V.parentNoteCard(s) : ''}
      ${nextCard}
      ${pending}
      <section class="v-card"><h2 class="v-h2">지금 모습</h2><div>${prof.areas.map(areaRow)}</div><p class="v-note">영역을 누르면 이유를 볼 수 있어요. 아이를 평가하는 점수가 아니에요.</p></section>
      ${notes.length ? h`<details class="v-card v-notes"><summary>알아 두세요 · ${notes.length}가지 ›</summary><ul>${notes.map((n) => h`<li><b>${n.title}</b><div>${n.text}</div></li>`)}</ul>${g.signals.length ? h`<p class="v-note">선생님은 진단하지 않아요. 걱정되는 모습이 이어지면 센터장과 상의해요.</p>` : ''}</details>` : ''}
      ${b ? h`<section class="v-card"><div class="v-eyebrow">${b.vol.no}권 · ${b.vol.titleKo}</div><h2 class="v-h2">이번 달 이렇게 가르쳐요</h2>
        <ol class="v-steps" style="margin-top:14px">${b.tips.map((x) => h`<li>${tipLine(x)}</li>`)}</ol>
        <div class="v-sub-h">아이에게 이렇게 말해요</div>
        ${b.child.slice(0, 2).map((c) => h`<div class="v-say"><div class="t"><b>${c[0]}</b><span>${c[1]}</span></div><button class="v-icon-btn" data-act="v.say" data-t="${c[1]}" aria-label="영어 듣기">${icon('volume', 18)}</button></div>`)}
        <details class="v-fold"><summary>이런 말은 피해요 ›</summary><ul>${b.avoid.map((x) => h`<li>· ${x}</li>`)}</ul></details>
        ${canAct ? h`<div class="v-sub-h">수업 중 이것만 기록해요 <span class="v-faint" style="font-weight:600">· 눌러서 기록</span></div>
        <div class="v-ochips">${b.chips.map((c) => { const n = db().obs.filter((o) => o.sid === s.id && o.chip === c).length; return h`<button class="v-ochip ${n ? 'on' : ''}" data-act="v.obs" data-sid="${s.id}" data-chip="${c}">${c}${n ? h` <b>${n}</b>` : ''}</button>`; })}</div>` : ''}
        ${opt.guideLink ? h`<a class="v-btn" style="margin-top:16px" href="#/h/guide/${b.area.no}">${icon('book-open', 18)}이 영역의 지도 가이드 보기</a>` : h`<a class="v-btn" style="margin-top:16px" href="#/t/lesson/vol:${b.vol.id}">${icon('book-open', 18)}${b.vol.no}권 수업안 보기</a>`}</section>` : ''}
      <section class="v-card"><h2 class="v-h2">발음 Before · After</h2>${pron}</section>
      ${opt.showMsg === false ? '' : h`<section class="v-card" id="v-msg"><h2 class="v-h2">부모님께 이렇게 알려요</h2>
        <div class="v-who">${s.guardian}${sent ? ' · ' + ICME.dateShort(sent) + ' 보냄' : ''}</div>
        <div class="v-bubble">${msg.map((x) => h`<p>${x}</p>`)}</div>
        <div class="v-btns">${canAct ? h`<button class="v-btn primary" data-act="v.send" data-sid="${s.id}">${icon('send', 18)}${sent ? '다시 보내기' : '카톡으로 보내기'}</button>` : ''}<button class="v-btn" ${canAct ? raw('style="flex:none;width:auto"') : ''} data-act="v.copy" data-t="${msg.join('\n')}">${icon('copy', 18)}복사</button></div>
        <p class="v-note">${canAct ? '보내기 전에 읽어 보고 고칠 수 있어요. ' : ''}점수 숫자는 보내지 않고 말로만 알려요.</p></section>`}`;
  };
  V.add('/t/kid/:id', {
    title: '아이',
    mount(ctx) {
      if (V.auth && V.auth.on() && V.auth.actor() !== 't') return;   // 본사·센터장이 선생님 화면으로 볼 때는 선생님 이름으로 기록하지 않아요(본사는 auth.js가 "본사"로 남겨요)
      const s = q.student(ctx.params.id); if (s && q.classesOfTeacher(V.tid()).some((k) => s.classIds.includes(k.id))) V.logView(s.id, V.tid());
    },
    render(ctx) {
      const s = q.student(ctx.params.id); const t = me();
      if (!s) return h`${V.back('/t', '우리반')}<div class="v-empty"><b>아이를 찾을 수 없어요</b></div>`;
      if (!q.classesOfTeacher(t.id).some((k) => s.classIds.includes(k.id))) return h`${V.back('/t', '우리반')}<div class="v-empty"><b>담당 반 아이만 볼 수 있어요</b>다른 반 아이는 센터장에게 요청해 주세요.</div>`;
      return V.kidPage(s, { t, canAct: true, back: ['/t', '우리반'], compare: '/t/compare/' + s.id });
    }
  });
  ICME.actions['v.obs'] = (el) => { ICME.store.mutate((d) => d.obs.push({ sid: el.dataset.sid, date: ICME.ymd(ICME.today()), chip: el.dataset.chip, by: V.tid() })); ui.toast('관찰을 기록했어요'); V.render(); };
  ICME.actions['v.tomsg'] = () => { const el = document.getElementById('v-msg'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  ICME.actions['v.say'] = (el) => S.speak(el.dataset.t, 'en-US');
  ICME.actions['v.copy'] = (el) => ICME.copyText(el.dataset.t).then((ok) => (ok ? ui.toast('복사했어요') : ui.toast('복사가 막힌 환경이에요. 문구를 직접 선택해 복사해 주세요', 'warn')));
  ICME.actions['v.send'] = (el) => {
    const sid = el.dataset.sid; const s = q.student(sid); const again = !!(db().sent || {})[sid];
    V.ask({ title: (s ? s.guardian : '학부모님') + '께 ' + (again ? '다시 ' : '') + '보낼까요?', text: '보낸 뒤에는 되돌릴 수 없어요. 점수 숫자는 들어가지 않고 말로만 가요.', ok: '보낼게요', onOk: () => { ICME.store.mutate((d) => { d.sent = d.sent || {}; d.sent[sid] = ICME.ymd(ICME.today()); }); ui.toast('학부모님께 보냈어요 (시안: 실제로는 카카오 알림톡)'); V.render(); } });
  };
  ICME.actions['v.nudge'] = () => ui.toast('부모 설문 알림을 보냈어요 (시안)');
  ICME.actions['v.why'] = (el) => {
    const s = q.student(el.dataset.sid); const a = SC.area(s, Number(el.dataset.i));
    const line = (who, score) => (score == null ? h`<div class="v-why"><span class="who">${who}</span><span class="v-faint v-small">아직 없어요</span></div>` : h`<div class="v-why"><span class="who">${who}</span><span class="meter">${V.state(score)}</span></div>`);
    const note = a.gapFlag === 'parentHigh' ? '집에서는 더 잘하는 모습이 보여요. 센터에서도 같은 상황을 만들어 보면 좋아요.' : a.gapFlag === 'childHigh' ? '아이는 잘한다고 느끼는데 집에서는 조금 어려워 보여요. 언제 그런지 부모님께 여쭤봐 주세요.' : a.provisional ? '부모 설문이 오면 더 정확해져요.' : '아이와 부모님의 답이 비슷해요.';
    V.sheet(h`<h2 class="v-h2">${a.area.name}</h2><p class="v-sub" style="margin-bottom:8px">${a.area.sub}</p>
      ${line('아이 응답', a.child && a.child.score)}${line('부모님 응답', a.parent && a.parent.score)}${line('함께 보면', a.combined)}
      <p class="v-small v-muted" style="margin-top:6px">${note}</p><p class="v-note">참고용이에요. 아이를 평가하는 점수가 아니에요.</p>
      <div class="v-btns"><button class="v-btn primary" data-act="v.sheet.close" data-close>닫기</button></div>`);
  };

  /* ======================================================== 녹음 */
  V.add('/t/rec/:id', {
    title: '녹음',
    render(ctx) {
      const s = q.student(ctx.params.id); if (!s) return h`<div class="v-empty"><b>아이를 찾을 수 없어요</b></div>`;
      if (!mine(s)) return lockedPage('/t', '우리반');
      const stage = ctx.query.stage === 'after' ? 'after' : 'before'; const R = V.rec;
      if (stage === 'after' && V.pronState(s).st === 'empty') return h`${V.back('/t/kid/' + s.id, s.name)}<div class="v-empty"><b>Before 녹음이 먼저예요</b>같은 대본을 수업 전에 한 번 녹음해야 After와 비교할 수 있어요.<a class="v-btn primary" style="margin-top:16px" href="#/t/rec/${s.id}?stage=before">Before 녹음하기</a></div>`;
      if (R.sid !== s.id || R.stage !== stage) V.recReset(s.id, stage);
      if (s.consent.video === 'none') return h`${V.back('/t/kid/' + s.id, s.name)}<div class="v-empty"><b>녹음할 수 없어요</b>영상·녹음 동의가 없는 아이예요.</div>`;
      if (!q.canFilm(me())) {   // 아이 목소리는 민감한 정보라서: 필수 교육 이수 + 범죄경력 조회 서류 확인이 끝나야 녹음할 수 있어요
        const tt = me(); const eduOk = q.courseState(tt, 'T04') === 'done'; const dc = q.docState(tt, 'criminal'); const docOk = !['expired', 'missing'].includes(dc.state);
        return h`${V.back('/t/kid/' + s.id, s.name)}<div class="v-head"><h1 class="v-h1">녹음 전에 확인할 게 남았어요</h1><p class="v-sub">아이 목소리는 민감한 정보라서, 아래 두 가지가 끝나야 녹음할 수 있어요.</p></div>
          <div class="v-card" style="margin-top:0"><div class="v-doc"><div class="tx">필수 교육<small>영상 촬영과 개인정보 수칙</small></div><span class="v-tag ${eduOk ? 'ok' : 'watch'}">${eduOk ? '이수' : '미이수'}</span>${eduOk ? '' : h`<a class="v-btn sm primary" href="#/t/learn">교육 보기</a>`}</div>
            <div class="v-doc"><div class="tx">서류 확인<small>성범죄·아동학대 범죄경력 조회 — 센터장이 확인해요</small></div><span class="v-tag ${docOk ? 'ok' : 'watch'}">${docOk ? '확인됨' : '센터장 확인 필요'}</span></div></div>`;
      }
      const sc = V.scriptFor(s); const label = stage === 'before' ? 'Before' : 'After';
      const ctl = R.st === 'idle' ? h`<button class="v-recbtn" data-act="v.rec.start" aria-label="녹음 시작">${icon('mic', 38)}</button><div class="v-hint">버튼을 누르고 큰 소리로 읽어 주세요</div>`
        : R.st === 'rec' ? h`<button class="v-recbtn on" data-act="v.rec.stop" aria-label="녹음 끝내기">${raw('<svg width="30" height="30" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>')}</button><div class="v-timer" id="v-timer">${V.fmt(R.sec)}</div><div class="v-hint">${R.sim ? '마이크를 쓸 수 없어서 시연 모드로 진행해요' : '녹음 중이에요. 다 읽으면 버튼을 눌러요'}</div>`
          : h`<div class="v-timer">${V.fmt(R.sec)}</div><div class="v-hint">${R.sim ? '시연 모드라 소리는 저장되지 않아요' : '잘 녹음됐는지 들어 보세요'}</div>
            ${R.url ? h`<div class="v-player" style="text-align:left"><button class="pb" data-act="v.play" data-sid="${s.id}" data-stage="${stage}" data-t="${sc.lines.map((l) => l.en).join(' ')}" aria-label="들어 보기">${icon('play', 20)}</button><div class="info"><div class="lbl">${label}<em>방금 녹음</em></div>${V.wave('now' + s.id, '#0f9d96')}</div></div>` : ''}
            <div class="v-btns"><button class="v-btn" data-act="v.rec.again">다시 녹음</button><button class="v-btn primary" data-act="v.rec.save">저장하기</button></div>`;
      return h`${V.back('/t/kid/' + s.id, s.name)}
        <div class="v-head"><div class="v-eyebrow">${label} 녹음 · ${sc.vol.no}권 ${sc.vol.titleKo}</div><h1 class="v-h1">${ICME.josa(s.name, '과/와')} 함께 읽어요</h1><p class="v-sub">${stage === 'before' ? '수업 전에 한 번, 단원이 끝나면 같은 대본으로 한 번 더 녹음해요.' : 'Before와 똑같은 대본이에요.'}</p></div>
        <div class="v-rec-script">${sc.lines.map((l) => h`<div class="ln">${l.en}<span class="ko">${l.ko}</span></div>`)}
          <button class="v-btn sm" style="margin-top:16px" data-act="v.rec.model" data-t="${sc.lines.map((l) => l.en.replace(/_+/g, 'blank')).join(' ')}">${icon('volume', 16)}먼저 들려주기</button></div>
        <div class="v-rec-box">${ctl}</div>`;
    }
  });

  /* ======================================================== 전·후 비교 */
  /* 전·후 비교 카드들 — 선생님과 학부모 화면이 같이 씁니다 */
  const mine = (s) => !!s && q.classesOfTeacher(V.tid()).some((k) => s.classIds.includes(k.id));   // 담당 반 아이인가
  const lockedPage = (back, label) => h`${V.back(back, label)}<div class="v-empty"><b>담당 반 아이만 볼 수 있어요</b>다른 반 아이는 센터장에게 요청해 주세요.</div>`;
  V.compareBlocks = function (s, pair) {
    const p = SC.pron(pair); const vol = q.volOf(pair.vol); const lines = vol.video.lines.map((l) => l.en).join(' ');
    if (!V.consent.analyzeOK(s)) {   // 점수 계산(외부 분석)에 동의하지 않은 아이: 점수는 만들지 않고 소리만 비교해요
      const pl = (stage, label, date, sec) => h`<div class="v-player ${stage}"><button class="pb" data-act="v.play" data-sid="${s.id}" data-stage="${stage}" data-t="${lines}" aria-label="${label} 듣기">${icon('play', 20)}</button><div class="info"><div class="lbl">${label}<em>${date}</em></div>${V.wave(s.id + stage, stage === 'before' ? '#8b99a1' : '#0f9d96')}</div><span class="v-xs v-faint">${sec}초</span></div>`;
      const dd = (x) => (x && x.date ? ICME.dateShort(x.date) : '');
      return h`<section class="v-card" style="margin-top:0"><div class="v-eyebrow">${vol.no}권 · ${vol.title}</div><p class="v-small v-muted" style="margin-top:6px">점수 계산에 동의하지 않아서 점수 없이 소리만 비교해요.</p>${pl('before', 'Before', dd(pair.before), p.before.sec)}${pl('after', 'After', dd(pair.after), p.after.sec)}</section>`;
    }
    const best = p.sounds.slice().sort((a, b) => (b.a - b.b) - (a.a - a.b)).slice(0, 2);
    const words = {}; p.after.words.forEach((ln) => ln.forEach((x) => { if (x.s < 72 && (!words[x.w] || words[x.w] > x.s)) words[x.w] = x.s; }));
    const practice = Object.keys(words).sort((a, b) => words[a] - words[b]).slice(0, 4);
    const player = (stage, label, date, sec) => h`<div class="v-player ${stage}"><button class="pb" data-act="v.play" data-sid="${s.id}" data-stage="${stage}" data-t="${lines}" aria-label="${label} 듣기">${icon('play', 20)}</button><div class="info"><div class="lbl">${label}<em>${date}</em></div>${V.wave(s.id + stage, stage === 'before' ? '#8b99a1' : '#0f9d96')}</div><span class="v-xs v-faint">${sec}초</span></div>`;
    const d = (x) => (x && x.date ? ICME.dateShort(x.date) : '');
    return h`<section class="v-card" style="margin-top:0"><div class="v-eyebrow">${vol.no}권 · ${vol.title}</div><div class="v-score" style="margin-top:6px"><div class="n b"><small>Before</small>${p.before.overall}</div><div class="arrow">${icon('arrow-right', 22)}</div><div class="n"><small>After</small>${p.after.overall}</div><div class="gain">${p.delta > 0 ? '+' : ''}${p.delta}<small>${p.change.label}</small></div></div>
        ${player('before', 'Before', d(pair.before), p.before.sec)}${player('after', 'After', d(pair.after), p.after.sec)}</section>
      ${best.length ? h`<section class="v-card"><h2 class="v-h2">특히 좋아진 소리</h2><div class="v-wd">${best.map((x) => h`<span class="g">${x.ex} · ${x.p} +${x.a - x.b}</span>`)}</div></section>` : ''}
      ${practice.length ? h`<section class="v-card"><h2 class="v-h2">다음에 같이 연습할 말</h2><div class="v-wd">${practice.map((w) => h`<span class="r">${w}</span>`)}</div></section>` : ''}`;
  };
  V.add('/t/compare/:id', {
    title: '발음 비교',
    render(ctx) {
      const s = q.student(ctx.params.id); const ps = s ? V.pronState(s) : { st: 'none' };
      if (s && !mine(s)) return lockedPage('/t', '우리반');
      if (ps.st !== 'both') return h`${V.back(s ? '/t/kid/' + s.id : '/t', s ? s.name : '우리반')}<div class="v-empty"><b>아직 비교할 수 없어요</b>Before와 After 녹음이 모두 있어야 해요.</div>`;
      return h`${V.back('/t/kid/' + s.id, s.name)}<div class="v-head"><h1 class="v-h1">${s.name}의 발음 전·후</h1></div>${V.compareBlocks(s, ps.pair)}
        <a class="v-btn primary" style="margin-top:16px" href="#/t/kid/${s.id}">부모님께 알리러 가기</a>
        <p class="v-note" style="text-align:center">같은 아이의 전·후 변화만 봐요. 점수는 참고용이고 지금은 시안 값이에요.</p>`;
    }
  });

  /* ======================================================== 수업안 */
  V.add('/t/lesson/:id', {
    title: '수업안',
    render(ctx) {
      const id = ctx.params.id; let k = null; let vol;
      if (id.indexOf('vol:') === 0) vol = q.volOf(id.slice(4)); else { k = q.klass(id); vol = k ? q.volOf(q.themeFor(k).vol) : null; }
      if (!vol) return h`${V.back('/t', '우리반')}<div class="v-empty"><b>수업안을 찾을 수 없어요</b></div>`;
      const w = ICME.clamp(Number(ctx.query.w || 1), 1, 4); const L = vol.lessons[w - 1]; const key = vol.id + w; const prep = V.vs.prep && V.vs.prep[key] || {};
      const base = '/t/lesson/' + id;
      return h`${V.back('/t', '우리반')}
        <div class="v-card" style="margin-top:0"><div class="v-month"><div class="v-cover">${S.cover(vol)}</div><div><div class="v-eyebrow">${k ? k.name + ' · ' : ''}이번 달 수업</div><h1 class="t">${vol.no}권 · ${vol.titleKo}</h1><div class="d">${vol.title}</div></div></div></div>
        <div class="v-chips">${[1, 2, 3, 4].map((n) => h`<a class="v-chip ${n === w ? 'on' : ''}" href="#${base}?w=${n}">${n}주차</a>`)}</div>
        <section class="v-card"><div class="v-eyebrow">이번 주 목표</div><h2 class="v-h2">${L.titleKo}</h2><p class="v-small v-muted" style="margin-top:6px">${L.goal}</p></section>
        <section class="v-card"><h2 class="v-h2">수업 흐름 · 45분</h2><ol class="v-steps" style="margin-top:14px">${L.flow.map((f) => h`<li><b>${f.step}</b> <span class="v-wk">${f.min}분</span><div class="v-small v-muted">${f.desc}</div></li>`)}</ol></section>
        <section class="v-card"><h2 class="v-h2">준비물</h2><div style="margin-top:8px">${L.prep.map((p, i) => h`<div class="v-todo" style="padding:7px 0;cursor:pointer" data-act="v.prep" data-key="${key}" data-i="${i}"><span class="v-check ${prep[i] ? 'on' : ''}">${prep[i] ? icon('check', 16) : ''}</span><span class="${prep[i] ? 'v-faint' : ''}" style="padding-top:2px">${p}</span></div>`)}</div></section>
        <section class="v-card soft"><h2 class="v-h2">수업 중 이것만 봐요</h2><ul class="v-small" style="margin-top:8px;display:flex;flex-direction:column;gap:6px">${L.observe.slice(0, 2).map((o) => h`<li>· ${o}</li>`)}</ul></section>
        ${w === 1 || w === 4 ? h`<div class="v-card warm"><b>${w === 1 ? 'Before' : 'After'} 발음 녹음 주간이에요</b><p class="v-small" style="margin-top:4px">만드는 시간에 한 명씩 30초만 녹음해요. 우리반에서 아이를 눌러 시작해요.</p></div>` : ''}
        <button class="v-btn" style="margin-top:14px" data-act="g.books" data-v="${vol.id}">${icon('printer', 18)}교재 인쇄본 열기 (지도서 · 활동북)</button>`;
    }
  });
  /* ======================================================== 수업안 목록 (아래 메뉴) */
  V.add('/t/lessons', {
    title: '수업안', bnav: true,
    render() {
      const t = me(); const arts = q.classesOfTeacher(t.id).filter((k) => k.program === 'ART').sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
      return h`<div class="v-head"><div class="v-eyebrow">${t.name} 선생님</div><h1 class="v-h1">수업안</h1></div>
        ${arts.length ? h`<div class="v-sec" style="margin-top:6px"><h2>이번 달 우리 반</h2></div><div class="v-list">${arts.map((k) => { const v = q.volOf(q.themeFor(k).vol); return h`<a class="v-kid" href="#/t/lesson/${k.id}"><div class="v-cover" style="width:64px">${S.cover(v)}</div><div class="main"><div class="nm">${k.name}<small>${DOW[k.day]} ${k.start}</small></div><div class="ds">${v.no}권 · ${v.titleKo}</div></div>${icon('chevron-right', 18, 'chev')}</a>`; })}</div>` : h`<div class="v-card soft" style="margin-top:0"><p class="v-small">담당 ART 반이 없어서 이번 달 수업안이 없어요. 아래에서 교재를 둘러볼 수 있어요.</p></div>`}
        <div class="v-sec"><h2>전체 교재 · 하트 시리즈</h2></div><div class="v-list">${ICME.materials.volumes.map((v) => h`<a class="v-kid" href="#/t/lesson/vol:${v.id}"><div class="v-cover" style="width:64px">${S.cover(v)}</div><div class="main"><div class="nm">${v.no}권 ${v.titleKo}</div><div class="ds">${v.title}</div></div>${icon('chevron-right', 18, 'chev')}</a>`)}</div>`;
    }
  });

  /* ======================================================== 수업 일지: 출석(예외만 누르기) · 분위기 · 한 줄 메모 */
  V.add('/t/log/:id', {
    title: '수업 일지',
    render(ctx) {
      const k = q.klass(ctx.params.id); const t = me();
      if (!k || k.teacherId !== t.id) return h`${V.back('/t', '우리반')}<div class="v-empty"><b>담당 반만 쓸 수 있어요</b></div>`;
      const kids = q.studentsOfClass(k.id).slice().sort((a, b) => a.name.localeCompare(b.name, 'ko')); const L = logOf(k.id) || { att: {}, mood: null, note: '', done: false };
      const st = (s) => L.att[s.id] || 'ok'; const cnt = (v) => kids.filter((s) => st(s) === v).length;
      const moods = [['good', '좋았어요', '아이들이 잘 따라왔어요'], ['soso', '보통이에요', '무난하게 진행했어요'], ['hard', '어려웠어요', '집중이 어려웠어요']];
      return h`${V.back('/t', '우리반')}<div class="v-head"><div class="v-eyebrow">${k.name} · ${ICME.dateKo(ICME.today())}</div><h1 class="v-h1">수업 일지</h1><p class="v-sub">출석은 기본이 "출석"이에요. 늦었거나 못 온 아이만 눌러 주세요.</p></div>
        <section class="v-card" style="margin-top:0"><h2 class="v-h2">출석 <span class="v-faint v-small" style="font-weight:600">출석 ${cnt('ok')} · 지각 ${cnt('late')} · 결석 ${cnt('abs')}</span></h2>
          <div style="margin-top:6px">${kids.map((s) => h`<div class="v-doc">${V.av(s.name, 38)}<div class="tx" style="font-weight:700">${s.name}</div><div class="v-att"><button class="${st(s) === 'ok' ? 'on' : ''}" data-act="v.att" data-sid="${s.id}" data-cid="${k.id}" data-v="ok">출석</button><button class="late ${st(s) === 'late' ? 'on' : ''}" data-act="v.att" data-sid="${s.id}" data-cid="${k.id}" data-v="late">지각</button><button class="abs ${st(s) === 'abs' ? 'on' : ''}" data-act="v.att" data-sid="${s.id}" data-cid="${k.id}" data-v="abs">결석</button></div></div>`)}</div></section>
        <section class="v-card"><h2 class="v-h2">오늘 수업 분위기</h2><div class="v-choice">${moods.map((m) => h`<button class="${L.mood === m[0] ? 'on' : ''}" data-act="v.mood" data-cid="${k.id}" data-v="${m[0]}">${m[1]}<small>${m[2]}</small></button>`)}</div></section>
        <section class="v-card"><h2 class="v-h2">한 줄 메모 <span class="v-faint v-small" style="font-weight:600">선택</span></h2><textarea class="v-input" rows="3" maxlength="300" aria-label="한 줄 메모" style="padding:12px;min-height:84px;margin-top:10px" placeholder="예) 서윤이가 처음으로 손을 들고 발표했어요" data-input="v.note" data-cid="${k.id}">${L.note || ''}</textarea></section>
        <div class="v-bar-bottom"><button class="v-btn primary" data-act="v.logSubmit" data-cid="${k.id}">${L.done ? '다시 제출' : '일지 제출'}</button></div>`;
    }
  });
  const logSet = (cid, fn) => ICME.store.mutate((d) => { d.v2logs = d.v2logs || {}; const key = cid + ':' + todayKey(); const l = d.v2logs[key] = d.v2logs[key] || { att: {}, mood: null, note: '', done: false }; fn(l); });
  ICME.actions['v.att'] = (el) => { logSet(el.dataset.cid, (l) => { if (el.dataset.v === 'ok') delete l.att[el.dataset.sid]; else l.att[el.dataset.sid] = el.dataset.v; l.done = false; }); V.render(); };
  ICME.actions['v.mood'] = (el) => { logSet(el.dataset.cid, (l) => { l.mood = el.dataset.v; l.done = false; }); V.render(); };
  ICME.actions['v.note'] = (el) => { logSet(el.dataset.cid, (l) => { l.note = el.value; }); };
  ICME.actions['v.logSubmit'] = (el) => { logSet(el.dataset.cid, (l) => { l.done = true; l.at = todayKey(); }); ui.toast('일지를 제출했어요. 수고하셨어요'); V.go('/t'); };

  /* ======================================================== 내 교육 */
  const CTAG = { done: ['이수', 'ok'], prog: ['진행 중', ''], todo: ['미이수', 'watch'], late: ['만료', 'watch'], opt: ['권장', ''], na: ['해당 없음', ''] };
  V.add('/t/learn', {
    title: '내 교육', bnav: true,
    render() {
      const t = me(); const T = ICME.training; const ids = q.requiredCourses(t).concat(['T03']); const left = q.requiredCourses(t).filter((c) => q.courseState(t, c) !== 'done').length;
      const row = (id) => { const c = T.byId[id]; const st = CTAG[q.courseState(t, id)] || CTAG.todo; return h`<button class="v-kid" data-act="v.crs" data-id="${id}"><div class="main"><div class="nm" style="font-size:16px">${c.title}</div><div class="ds">${c.kind} · ${c.min}분${c.gate ? ' · ' + c.gate : ''}</div></div><span class="v-tag ${st[1]}">${st[0]}</span>${icon('chevron-right', 18, 'chev')}</button>`; };
      const certs = ICME.programs.keys.map((k) => { const c = q.certState(t, k); return h`<span class="v-tag ${c.state === 'ok' ? 'ok' : c.state === 'expiring' || c.state === 'expired' ? 'watch' : ''}">${ICME.programs.byKey[k].short} ${c.label}</span>`; });
      return h`<div class="v-head"><div class="v-eyebrow">${t.name} 선생님</div><h1 class="v-h1">내 교육</h1><p class="v-sub">필수 교육을 마치면 발음 녹음과 수업 배정이 열려요.</p></div>
        ${left ? h`<div class="v-card warm" style="margin-top:0"><b>필수 교육 ${left}개가 남았어요</b><p class="v-small" style="margin-top:4px">${q.canFilm(t) ? '' : '"영상 촬영과 개인정보 수칙"을 마치기 전에는 아이 발음 녹음을 할 수 없어요.'}</p></div>` : h`<div class="v-card soft" style="margin-top:0"><b>필수 교육을 모두 마쳤어요</b></div>`}
        <div class="v-sec"><h2>교육 과정</h2></div><div class="v-list">${ids.map(row)}</div>
        <div class="v-sec"><h2>프로그램 인증</h2></div><div class="v-card" style="margin-top:0"><div style="display:flex;gap:6px;flex-wrap:wrap">${certs}</div><p class="v-note">인증 교육은 본사 집합 교육으로 진행돼요. 신청은 센터장에게 말씀해 주세요.</p></div>`;
    }
  });
  ICME.actions['v.crs'] = (el) => {
    const c = ICME.training.byId[el.dataset.id]; const t = me(); const st = q.courseState(t, c.id);
    V.sheet(h`<div class="v-eyebrow">${c.kind} · ${c.min}분 · ${c.req}</div><h2 class="v-h2">${c.title}</h2><p class="v-small v-muted" style="margin-top:8px;line-height:1.7">${c.desc}</p>${c.gate ? h`<div class="v-card warm"><b>${c.gate}</b></div>` : ''}
      <div class="v-btns"><button class="v-btn" data-act="v.sheet.close" data-close>닫기</button>${st === 'done' ? '' : h`<button class="v-btn primary" data-act="v.crsDone" data-id="${c.id}">다 봤어요 (이수)</button>`}</div><p class="v-note">시안에서는 내용을 보지 않고도 이수 처리할 수 있어요. 실제로는 영상 시청과 퀴즈가 필요해요.</p>`);
  };
  ICME.actions['v.crsDone'] = (el) => { ICME.store.mutate((d) => { const t = d.teachers.find((x) => x.id === V.tid()); t.courses = t.courses || {}; t.courses[el.dataset.id] = { s: 'done', d: ICME.ymd(ICME.today()) }; }); V.closeSheet(); ui.toast('이수했어요. 수고하셨어요'); V.render(); };
  ICME.actions['v.prep'] = (el) => { V.vs.prep = V.vs.prep || {}; const k = el.dataset.key; V.vs.prep[k] = V.vs.prep[k] || {}; V.vs.prep[k][el.dataset.i] = !V.vs.prep[k][el.dataset.i]; V.render(); };
})();

</script>
<script>/* js/v2/parent.js */
/* v2/parent.js — 학부모(카카오 알림톡 링크로 접속, 로그인 없음).
   하는 일은 둘: ① 아이와 함께 마음 이야기(5분) ② 부모 설문(1분, 10문항). 끝나면 리포트 한 장. */
(function () {
  'use strict';
  const ICME = window.ICME; const V = ICME.v2; const h = ICME.h; const raw = ICME.raw; const icon = ICME.icon; const q = ICME.q; const ui = ICME.ui; const SC = ICME.scoring; const S = ICME.shared; const A = ICME.art;
  const db = () => ICME.store.db;
  const parentDone = (s) => !!(s.survey && s.survey.parent && s.survey.parent.done);
  const month = () => ICME.today().getMonth() + 1;
  const nick = (s) => ICME.nick(s.name);
  const teacherOf = (s) => { const k = q.klass(s.classIds[0]); return (k && q.teacher(k.teacherId)) || q.teacher('t2'); };

  /* ======================================================== 동의 (처음 시작 전 · 언제든 바꾸기) */
  const VIDEO = [['none', '녹음·영상은 하지 않아요', '발음 Before/After를 쓸 수 없어요'], ['record', '선생님만 수업에 써요', '발음을 비교해 지도하는 데만 쓰고, 가족에게는 공유되지 않아요'], ['share', '우리 가족에게도 보여 주세요', '리포트에서 Before/After를 듣고 볼 수 있어요'], ['promo', '센터 홍보에도 써도 좋아요', '이름을 가린 홍보 자료에 쓰일 수 있어요. 언제든 철회할 수 있어요']];
  const checkRow = (on, act, k, title, desc) => h`<div class="v-todo" style="margin-top:12px;cursor:pointer" data-act="${act}" data-k="${k}"><span class="v-check ${on ? 'on' : ''}">${on ? icon('check', 16) : ''}</span><span style="padding-top:2px;line-height:1.5"><b>${title}</b>${desc ? h`<span class="v-small v-muted" style="display:block;margin-top:2px">${desc}</span>` : ''}</span></div>`;
  function agreeGate(s) {
    const A = V.vs.agree = V.vs.agree && V.vs.agree.sid === s.id ? V.vs.agree : { sid: s.id, ok: false, video: 'record', analyze: false };

  /* 월 버튼이 옆으로 길어서, 고른 달이 화면 안에 오게 가운데로 맞춰요 */
