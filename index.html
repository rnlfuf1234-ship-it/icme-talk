<title>아이크미톡 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* css/app.css */
/* ==========================================================================
   i.C.ME Platform prototype — design system
   브랜드: 청록(primary) + 주황(accent). 프로그램 색은 icmeng.co.kr 기준.
   ========================================================================== */
:root {
  --teal-50: #eaf7f6; --teal-100: #d2efec; --teal-200: #a5e0db; --teal-300: #6fcbc4;
  --teal-400: #3bb8b0; --teal-500: #19a9a4; --teal-600: #128f8b; --teal-700: #0e7470;
  --teal-800: #0b5c59; --teal-900: #084644;
  --orange-50: #fff6e5; --orange-100: #ffe8bf; --orange-300: #ffc76a; --orange-400: #ffb02e;
  --orange-500: #f59e0b; --orange-600: #d98200;
  --ink-900: #1b2a2e; --ink-800: #27373b; --ink-700: #3b4a4f; --ink-600: #52626a;
  --ink-500: #6b7b82; --ink-400: #94a3a9; --ink-300: #b9c4c9; --ink-200: #dde5e8;
  --ink-100: #edf2f3; --ink-50: #f6f9fa;
  --bg: #f2f7f7; --surface: #ffffff; --line: #e1eaeb;

  --ok: #1e9e5a; --ok-bg: #e4f6ec; --warn: #c98200; --warn-bg: #fff3d6;
  --bad: #d93f45; --bad-bg: #fde8e8; --info: #2f7de1; --info-bg: #e5f0fd;
  --purple: #7a5af8; --purple-bg: #eeeaff;

  --gabe: #ff8a00; --gabe-bg: #fff0dc;
  --sci: #00a6d6; --sci-bg: #dff5fc;
  --art: #ee3a8c; --art-bg: #ffe6f1;
  --crepop: #12a84a; --crepop-bg: #e0f6e8;
  --heart: #7a5af8; --heart-bg: #eeeaff;
  --logico: #5a6dd6; --logico-bg: #e8ebfc;

  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px;
  --sh-1: 0 1px 2px rgba(16, 48, 50, .06), 0 2px 8px rgba(16, 48, 50, .04);
  --sh-2: 0 2px 4px rgba(16, 48, 50, .06), 0 10px 28px rgba(16, 48, 50, .09);
  --sh-3: 0 12px 40px rgba(10, 40, 42, .22);
  --font: "Pretendard Variable", Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-kid: "Jua", "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
  --demobar-h: 44px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.55; color: var(--ink-900);
  background: var(--bg); letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 26px; line-height: 1.25; letter-spacing: -0.02em; }
h2 { font-size: 19px; line-height: 1.3; letter-spacing: -0.015em; }
h3 { font-size: 16px; line-height: 1.35; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
svg { display: block; }
.ico { display: inline-block; flex: none; vertical-align: middle; }

/* ---------- utilities ---------- */
.muted { color: var(--ink-500); } .faint { color: var(--ink-400); }
.small { font-size: 13px; } .xs { font-size: 12px; } .lg { font-size: 17px; }
.bold { font-weight: 700; } .semi { font-weight: 600; } .center { text-align: center; } .right { text-align: right; }
.nowrap { white-space: nowrap; } .tnum { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; } .row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; } .row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; } .spacer { flex: 1; }
.g4 { gap: 4px; } .g6 { gap: 6px; } .g8 { gap: 8px; } .g12 { gap: 12px; } .g16 { gap: 16px; } .g20 { gap: 20px; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; } .mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; }
.grid { display: grid; gap: 16px; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.grid.c-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.grid.c-3-2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.grid.c-1-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--ink-300); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--orange-500); } .dot.bad { background: var(--bad); } .dot.info { background: var(--info); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- demo bar ---------- */
.demobar {
  position: fixed; inset: 0 0 auto 0; height: var(--demobar-h); z-index: 60; display: flex; align-items: center;
  gap: 14px; padding: 0 16px; background: var(--teal-900); color: #fff; font-size: 13px;
}
.demobar .db-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.demobar .db-brand small { font-weight: 500; color: var(--teal-200); }
.demobar .db-tag { background: var(--orange-500); color: #3a2600; font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
.seg { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; gap: 2px; }
.seg a, .seg button { border: 0; background: transparent; color: #cdeceb; padding: 5px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.seg a.on, .seg button.on { background: #fff; color: var(--teal-800); }
.seg a:hover:not(.on), .seg button:hover:not(.on) { background: rgba(255,255,255,.14); }
.demobar .db-link { color: var(--teal-100); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 8px; background: transparent; border: 0; }
.demobar .db-link:hover { background: rgba(255,255,255,.12); }
#stage { padding-top: var(--demobar-h); min-height: 100vh; }

/* ---------- brand wordmark ---------- */
.wordmark { font-weight: 900; font-size: 22px; letter-spacing: -0.04em; line-height: 1; display: inline-flex; align-items: baseline; gap: 1px; color: var(--teal-500); }
.wordmark .ex { color: var(--orange-500); } .wordmark .mid { color: var(--ink-400); font-weight: 700; }
.wordmark.sm { font-size: 18px; } .wordmark.lg { font-size: 34px; }
.wordmark.white { color: #fff; } .wordmark.white .mid { color: rgba(255,255,255,.6); }

/* ---------- admin shell (HQ / center) ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: calc(100vh - var(--demobar-h)); }
.sidebar {
  position: sticky; top: var(--demobar-h); align-self: start; height: calc(100vh - var(--demobar-h)); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 24px; display: flex; flex-direction: column; gap: 4px;
}
.sb-brand { padding: 4px 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.sb-ctx { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--teal-50); border-radius: var(--r-md); margin-bottom: 8px; }
.sb-ctx b { display: block; font-size: 14px; line-height: 1.25; } .sb-ctx span { font-size: 12px; color: var(--ink-500); }
.sb-group { font-size: 12px; font-weight: 700; color: var(--ink-400); padding: 14px 10px 6px; letter-spacing: .02em; }
.sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-weight: 600; color: var(--ink-700); font-size: 14.5px; }
.sb-item .ico { color: var(--ink-400); }
.sb-item:hover { background: var(--ink-50); }
.sb-item.on { background: var(--teal-100); color: var(--teal-800); }
.sb-item.on .ico { color: var(--teal-600); }
.sb-item .cnt { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--orange-100); color: var(--orange-600); border-radius: 999px; padding: 1px 8px; }
.sb-foot { margin-top: auto; padding: 14px 10px 0; font-size: 12px; color: var(--ink-400); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 28px; background: rgba(242,247,247,.9); backdrop-filter: blur(6px); position: sticky; top: var(--demobar-h); z-index: 20; border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--ink-500); font-size: 13.5px; font-weight: 500; }
.crumbs b { color: var(--ink-900); font-weight: 700; }
.search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; width: 260px; color: var(--ink-400); font-size: 14px; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-600); position: relative; }
.icon-btn:hover { background: var(--ink-50); }
.icon-btn .pip { position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; background: var(--orange-500); border-radius: 50%; border: 2px solid #fff; }
.page { padding: 26px 28px 64px; max-width: 1380px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.page-head .ph-t { flex: 1; min-width: 0; }
.page-head .eyebrow { font-size: 12.5px; font-weight: 700; color: var(--teal-600); letter-spacing: .02em; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.page-head p { margin-top: 6px; color: var(--ink-500); max-width: 760px; }
.page-head .ph-a { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.backlink { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-500); font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
.backlink:hover { color: var(--teal-700); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); min-width: 0; }
.card.pad, .card .cb { padding: 18px 20px; }
.card .ch { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
.card .ch h2, .card .ch h3 { flex: 1; min-width: 0; }
.card .ch .sub { font-size: 13px; color: var(--ink-500); font-weight: 500; }
.card.tint { background: var(--teal-50); border-color: var(--teal-100); box-shadow: none; }
.card.warm { background: var(--orange-50); border-color: var(--orange-100); box-shadow: none; }
.card.flat { box-shadow: none; }
.card.hover:hover { box-shadow: var(--sh-2); border-color: var(--teal-200); transition: .15s; }
.card.click { cursor: pointer; }
.card .cb.flush { padding: 0; }
.stat { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.stat .lbl { font-size: 13px; color: var(--ink-500); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .val { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
.stat .val small { font-size: 14px; font-weight: 600; color: var(--ink-500); margin-left: 3px; letter-spacing: 0; }
.stat .sub { font-size: 12.5px; color: var(--ink-500); }
.stat .sub.up { color: var(--ok); font-weight: 700; } .stat .sub.down { color: var(--bad); font-weight: 700; }
.stat .ic { width: 28px; height: 28px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: var(--teal-50); color: var(--teal-600); }
.stat .ic.orange { background: var(--orange-50); color: var(--orange-600); } .stat .ic.purple { background: var(--purple-bg); color: var(--purple); }
.stat .ic.red { background: var(--bad-bg); color: var(--bad); } .stat .ic.blue { background: var(--info-bg); color: var(--info); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--ink-200); background: #fff; font-weight: 700; font-size: 14px; color: var(--ink-800); white-space: nowrap; transition: .12s; }
.btn:hover { background: var(--ink-50); border-color: var(--ink-300); }
.btn.primary { background: var(--teal-500); border-color: var(--teal-500); color: #fff; }
.btn.primary:hover { background: var(--teal-600); border-color: var(--teal-600); }
.btn.accent { background: var(--orange-500); border-color: var(--orange-500); color: #2f1d00; }
.btn.accent:hover { background: var(--orange-600); border-color: var(--orange-600); color: #fff; }
.btn.soft { background: var(--teal-50); border-color: var(--teal-100); color: var(--teal-700); }
.btn.soft:hover { background: var(--teal-100); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-600); }
.btn.ghost:hover { background: var(--ink-100); }
.btn.danger { background: #fff; border-color: #f2c4c6; color: var(--bad); } .btn.danger:hover { background: var(--bad-bg); }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn.xs { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn.lg { height: 48px; padding: 0 22px; font-size: 16px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn[disabled], .btn.disabled { opacity: .45; pointer-events: none; }
.btn .ico { margin-left: -2px; }

/* ---------- badges / tags ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--ink-100); color: var(--ink-600); white-space: nowrap; }
.badge.sm { height: 19px; font-size: 11px; padding: 0 7px; }
.b-teal { background: var(--teal-100); color: var(--teal-800); } .b-green { background: var(--ok-bg); color: #137a43; }
.b-amber { background: var(--warn-bg); color: #8a5a00; } .b-red { background: var(--bad-bg); color: #b02a30; }
.b-blue { background: var(--info-bg); color: #1d5fb8; } .b-purple { background: var(--purple-bg); color: #5a3ed6; }
.b-orange { background: var(--orange-100); color: #9a5a00; } .b-gray { background: var(--ink-100); color: var(--ink-600); }
.b-solid-red { background: var(--bad); color: #fff; } .b-solid-teal { background: var(--teal-500); color: #fff; }
.ptag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.ptag.gabe { background: var(--gabe-bg); color: #b35f00; } .ptag.sci { background: var(--sci-bg); color: #00789c; }
.ptag.art { background: var(--art-bg); color: #b81e68; } .ptag.crepop { background: var(--crepop-bg); color: #0b7a34; }
.ptag.heart { background: var(--heart-bg); color: #5a3ed6; } .ptag.logico { background: var(--logico-bg); color: #3a4bb0; }
.ptag.off { background: transparent; border: 1px dashed var(--ink-300); color: var(--ink-400); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--ink-200); background: #fff; font-weight: 600; font-size: 13.5px; color: var(--ink-700); }
.chip.on { background: var(--teal-500); border-color: var(--teal-500); color: #fff; }
.chip:hover:not(.on) { background: var(--ink-50); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- avatar ---------- */
.avatar { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13.5px; flex: none; letter-spacing: -0.02em; }
.avatar.sm { width: 28px; height: 28px; font-size: 11px; } .avatar.lg { width: 56px; height: 56px; font-size: 18px; }
.avatar.xl { width: 84px; height: 84px; font-size: 26px; }
.av-stack { display: flex; } .av-stack .avatar { border: 2px solid #fff; margin-left: -8px; } .av-stack .avatar:first-child { margin-left: 0; }

/* ---------- progress ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--ink-100); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--teal-500); }
.bar.orange > i { background: var(--orange-500); } .bar.red > i { background: var(--bad); } .bar.green > i { background: var(--ok); }
.bar.purple > i { background: var(--purple); } .bar.blue > i { background: var(--info); } .bar.thick { height: 12px; }
.meter { display: flex; align-items: center; gap: 10px; } .meter .bar { flex: 1; } .meter b { font-size: 13px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- table ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; color: var(--ink-500); font-weight: 700; padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--ink-50); white-space: nowrap; }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--ink-100); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.link { cursor: pointer; } .tbl tbody tr.link:hover td { background: var(--teal-50); }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; } .tbl th:last-child, .tbl td:last-child { padding-right: 20px; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.card > .tbl-wrap:first-child .tbl th:first-child { border-top-left-radius: var(--r-lg); } .card > .tbl-wrap:first-child .tbl th:last-child { border-top-right-radius: var(--r-lg); }

/* ---------- tabs / toolbar ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs a { padding: 11px 15px; font-weight: 700; color: var(--ink-500); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; font-size: 14.5px; display: inline-flex; align-items: center; gap: 6px; }
.tabs a:hover { color: var(--ink-800); } .tabs a.on { color: var(--teal-700); border-bottom-color: var(--teal-500); }
.tabs a .n { font-size: 11.5px; background: var(--ink-100); color: var(--ink-600); border-radius: 999px; padding: 0 7px; font-weight: 700; }
.tabs a.on .n { background: var(--teal-100); color: var(--teal-800); }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .sp { flex: 1; }
.input, .select, .textarea { width: 100%; height: 40px; padding: 0 12px; background: #fff; border: 1px solid var(--ink-200); border-radius: 10px; outline: none; font-size: 14.5px; }
.textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px rgba(25,169,164,.16); }
.input.sm, .select.sm { height: 34px; font-size: 13.5px; border-radius: 8px; }
.input.auto, .select.auto { width: auto; }
.searchbox { position: relative; } .searchbox .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-400); }
.searchbox .input { padding-left: 34px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label, .field .lab { font-size: 13px; font-weight: 700; color: var(--ink-700); }
.field .hint { font-size: 12.5px; color: var(--ink-500); } .field .req { color: var(--bad); }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.check { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--teal-500); }
.toggle { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle i { position: absolute; inset: 0; background: var(--ink-300); border-radius: 999px; transition: .15s; cursor: pointer; }
.toggle i::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle input:checked + i { background: var(--teal-500); } .toggle input:checked + i::after { left: 21px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--ink-100); }
.li:last-child { border-bottom: 0; } .li.link { cursor: pointer; } .li.link:hover { background: var(--teal-50); }
.li .t { font-weight: 700; } .li .s { font-size: 13px; color: var(--ink-500); }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 14px; font-size: 14px; }
.kv dt { color: var(--ink-500); font-weight: 600; } .kv dd { margin: 0; font-weight: 600; }
.alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); font-size: 13.5px; align-items: flex-start; }
.alert.info { background: var(--info-bg); color: #1d4f98; } .alert.warn { background: var(--warn-bg); color: #7a5000; }
.alert.bad { background: var(--bad-bg); color: #962a2f; } .alert.ok { background: var(--ok-bg); color: #116a3a; }
.alert.tint { background: var(--teal-50); color: var(--teal-800); } .alert .ico { margin-top: 2px; }
.empty { text-align: center; padding: 40px 20px; color: var(--ink-500); } .empty .ei { width: 54px; height: 54px; border-radius: 50%; background: var(--teal-50); color: var(--teal-500); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.auto-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; color: var(--teal-700); background: var(--teal-50); border: 1px solid var(--teal-100); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.step-no { width: 24px; height: 24px; border-radius: 50%; background: var(--teal-500); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; flex: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-500); } .legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- modal / drawer / toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 36, 38, .5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .15s; }
.modal { background: #fff; border-radius: 20px; box-shadow: var(--sh-3); width: min(520px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; animation: pop .18s; }
.modal.wide { width: min(760px, 100%); } .modal.xwide { width: min(980px, 100%); }
.modal .mh { display: flex; align-items: center; gap: 10px; padding: 18px 22px 12px; } .modal .mh h2 { flex: 1; }
.modal .mb { padding: 4px 22px 18px; overflow-y: auto; } .modal .mf { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: var(--ink-50); border-radius: 0 0 20px 20px; }
.drawer-wrap { justify-content: flex-end; padding: 0; }
.drawer { background: #fff; width: min(520px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--sh-3); animation: slide .2s; }
.drawer .mh { padding: 18px 22px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); } .drawer .mh h2 { flex: 1; }
.drawer .mb { padding: 18px 22px; overflow-y: auto; flex: 1; } .drawer .mf { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
#toast-root { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink-900); color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--sh-3); display: flex; gap: 8px; align-items: center; animation: pop .2s; }
.toast.ok .ico { color: #6be0a2; } .toast.warn .ico { color: #ffc76a; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- fatal error overlay (dev) ---------- */
.fatal { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 999; background: #2a0f12; color: #ffd6d8; font: 12px/1.5 Consolas, monospace; padding: 12px 14px; border-radius: 10px; white-space: pre-wrap; max-height: 40vh; overflow: auto; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .grid.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid.c-2-1, .grid.c-3-2, .grid.c-1-2 { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .sb-brand, .sb-ctx, .sb-group, .sb-foot { display: none; } .sb-item { white-space: nowrap; }
  .topbar { padding: 0 16px; top: var(--demobar-h); } .page { padding: 20px 16px 56px; }
  .grid.c3, .grid.c2 { grid-template-columns: 1fr; } .search { display: none; }
  .demobar .db-brand small, .demobar .db-note { display: none; }
}

/* ---------- 카드 머리글 간격 보정 ---------- */
.card .ch + .cb { padding-top: 14px; }
.card .ch + .cb.flush { padding-top: 0; margin-top: 14px; }

.mb16 { margin-bottom: 16px; } .mb20 { margin-bottom: 20px; }

/* css/views.css */
/* ==========================================================================
   views.css — 화면별 스타일 (랜딩 · 폰 셸 · 칸반 · 시간표 · 교재 뷰어 · 아이 모드 …)
   ========================================================================== */

/* ---------- landing ---------- */
.landing { max-width: 1160px; margin: 0 auto; padding: 36px 24px 72px; }
.landing-hero { text-align: center; padding: 18px 0 34px; }
.landing-hero h1 { font-size: 40px; margin-top: 18px; letter-spacing: -0.035em; }
.landing-hero p { max-width: 720px; margin: 14px auto 0; color: var(--ink-600); font-size: 17px; line-height: 1.65; }
.role-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.role-card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 24px 22px 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--sh-1); transition: .15s; }
.role-card:hover { transform: translateY(-3px); box-shadow: var(--sh-2); border-color: var(--teal-200); }
.role-card .rc-ic { width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: var(--teal-50); color: var(--teal-600); }
.role-card.r-center .rc-ic { background: var(--orange-50); color: var(--orange-600); }
.role-card.r-teacher .rc-ic { background: var(--art-bg); color: var(--art); }
.role-card.r-parent .rc-ic { background: var(--heart-bg); color: var(--heart); }
.role-card h2 { font-size: 20px; margin-top: 4px; } .role-card p { color: var(--ink-500); font-size: 14px; }
.role-card ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: var(--ink-700); }
.role-card li { display: flex; gap: 7px; align-items: flex-start; } .role-card li .ico { color: var(--teal-500); margin-top: 3px; }
.rc-cta { margin-top: auto; padding-top: 14px; font-weight: 800; color: var(--teal-700); display: flex; align-items: center; gap: 6px; }
.landing-foot { margin-top: 24px; } .ic-circle { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: var(--teal-600); display: inline-flex; align-items: center; justify-content: center; flex: none; }

/* ---------- phone shell ---------- */
.phone-stage { display: flex; gap: 48px; justify-content: center; align-items: flex-start; padding: 28px 20px 48px; min-height: calc(100vh - var(--demobar-h)); }
.phone-side { width: 300px; padding-top: 28px; position: sticky; top: 72px; flex: none; }
.phone-side .eyebrow-s { font-size: 13px; font-weight: 800; color: var(--teal-600); letter-spacing: .04em; }
.phone-side h2 { margin: 8px 0 18px; font-size: 22px; line-height: 1.4; letter-spacing: -0.02em; }
.phone-side ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 11px; }
.phone-side li { display: flex; gap: 8px; color: var(--ink-700); font-size: 14px; line-height: 1.5; }
.phone-side li .ico { color: var(--teal-500); margin-top: 3px; }
.phone { width: 390px; height: 800px; background: #fff; border-radius: 46px; border: 10px solid #1b2a2e; box-shadow: var(--sh-3); position: relative; overflow: hidden; display: flex; flex-direction: column; flex: none; }
.phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 112px; height: 26px; background: #1b2a2e; border-radius: 0 0 16px 16px; z-index: 5; }
.phone-status { height: 40px; padding: 11px 26px 0; display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--ink-900); flex: none; background: var(--bg); }
.phone-body { flex: 1; overflow-y: auto; background: var(--bg); scrollbar-width: none; position: relative; }
.phone-body::-webkit-scrollbar { display: none; }
.phone.kid .phone-notch { z-index: 6; }
.phone-body.kid { background: #fff8e6; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: #fff; padding: 6px 4px 12px; }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink-400); padding: 6px 0; }
.tabbar a.on { color: var(--teal-600); }
@media (max-width: 860px) {
  .phone-side { display: none; } .phone-stage { padding: 0; } .phone { width: 100%; height: calc(100vh - var(--demobar-h)); border: 0; border-radius: 0; box-shadow: none; } .phone-notch { display: none; } .phone-status { display: none; }
  .role-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) { .role-grid { grid-template-columns: 1fr; } .landing-hero h1 { font-size: 30px; } }

/* ---------- mobile content blocks (teacher / parent) ---------- */
.m-pad { padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 14px; }
.m-hello { padding: 6px 4px 0; } .m-hello .d { font-size: 13px; color: var(--ink-500); font-weight: 600; } .m-hello h1 { font-size: 23px; margin-top: 2px; }
.m-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--sh-1); }
.m-card.tint { background: var(--teal-50); border-color: var(--teal-100); box-shadow: none; } .m-card.warm { background: var(--orange-50); border-color: var(--orange-100); box-shadow: none; }
.m-card.heart { background: var(--heart-bg); border-color: #ded6ff; box-shadow: none; }
.m-sec { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; } .m-sec h2 { font-size: 16px; } .m-sec a { font-size: 13px; color: var(--teal-700); font-weight: 700; }
.m-row { display: flex; align-items: center; gap: 12px; }
.m-btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; border: 0; background: var(--teal-500); color: #fff; font-weight: 800; font-size: 15.5px; }
.m-btn.soft { background: var(--teal-50); color: var(--teal-700); } .m-btn.line { background: #fff; border: 1px solid var(--ink-200); color: var(--ink-800); } .m-btn.sm { height: 38px; font-size: 14px; border-radius: 11px; width: auto; padding: 0 14px; }
.m-btn.accent { background: var(--orange-500); color: #2f1d00; } .m-btn.heart { background: var(--heart); }
.m-btn[disabled] { opacity: .45; pointer-events: none; }
.time-pill { min-width: 56px; text-align: center; border-radius: 12px; background: var(--teal-50); color: var(--teal-800); padding: 7px 4px; font-weight: 800; font-size: 14.5px; line-height: 1.2; } .time-pill small { display: block; font-size: 11px; font-weight: 600; color: var(--teal-600); }
.progress-ring { position: relative; width: 64px; height: 64px; flex: none; }
.m-list .it { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--ink-100); } .m-list .it:last-child { border-bottom: 0; padding-bottom: 0; } .m-list .it:first-child { padding-top: 0; }
.m-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink-300); display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; background: #fff; }
.m-check.on { background: var(--teal-500); border-color: var(--teal-500); }
.m-tabs { display: flex; gap: 6px; background: var(--ink-100); border-radius: 12px; padding: 4px; }
.m-tabs a, .m-tabs button { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; font-weight: 700; font-size: 13.5px; color: var(--ink-600); border: 0; background: transparent; } .m-tabs .on { background: #fff; color: var(--teal-700); box-shadow: var(--sh-1); }
.child-switch { display: flex; gap: 8px; } .child-switch button { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--ink-200); background: #fff; font-weight: 700; } .child-switch button.on { border-color: var(--teal-500); background: var(--teal-50); color: var(--teal-800); }

/* ---------- kanban ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kcol { background: #e9f0f1; border-radius: 16px; padding: 10px; min-height: 240px; transition: background .1s; }
.kcol.drop-on { background: var(--teal-100); outline: 2px dashed var(--teal-400); }
.kcol-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-weight: 800; font-size: 14px; } .kcol-h .n { background: #fff; border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--ink-600); }
.kcard { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: var(--sh-1); cursor: grab; }
.kcard:hover { border-color: var(--teal-300); box-shadow: var(--sh-2); } .kcard.dragging { opacity: .45; }
.kcard .nm { font-weight: 800; } .kcard .meta { font-size: 12.5px; color: var(--ink-500); margin-top: 2px; }

/* ---------- 시간표 ---------- */
.wk { display: grid; grid-template-columns: 54px repeat(6, minmax(0, 1fr)); background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.wk-h { padding: 11px 6px; text-align: center; font-weight: 800; font-size: 13.5px; background: var(--ink-50); border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
.wk-h.today { background: var(--teal-500); color: #fff; } .wk-h:first-child { border-left: 0; }
.wk-time { position: relative; border-right: 1px solid var(--line); background: var(--ink-50); }
.wk-time span { position: absolute; right: 8px; font-size: 11.5px; color: var(--ink-400); font-weight: 600; transform: translateY(-50%); }
.wk-col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--ink-100) 1px, transparent 1px); background-size: 100% 60px; }
.wk-col.today { background-color: #f4fbfa; }
.wk-block { position: absolute; left: 4px; right: 4px; border-radius: 9px; padding: 5px 7px; font-size: 12px; line-height: 1.3; overflow: hidden; cursor: pointer; border: 1px solid transparent; transition: transform .1s; }
.wk-block:hover { transform: scale(1.02); z-index: 3; box-shadow: var(--sh-2); } .wk-block b { display: block; font-size: 12.5px; }
.wk-block.art { background: var(--art-bg); color: #8a1650; border-color: #f6b9d5; } .wk-block.gabe { background: var(--gabe-bg); color: #8f4b00; border-color: #ffd29a; }
.wk-block.sci { background: var(--sci-bg); color: #006280; border-color: #9edcf0; } .wk-block.crepop { background: var(--crepop-bg); color: #09652a; border-color: #a6e0b8; }
.wk-block.unassigned { background: repeating-linear-gradient(135deg, #fff 0 8px, #fff7e8 8px 16px); color: #8a5400; border: 1.5px dashed var(--orange-400); }
.wk-block.dim { opacity: .28; } .wk-block.warn { outline: 2px solid var(--bad); }

/* ---------- 매트릭스 (교육/인증) ---------- */
.matrix th, .matrix td { text-align: center; } .matrix th:first-child, .matrix td:first-child { text-align: left; }
.cell-st { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 9px; font-weight: 800; font-size: 12px; }
.cell-st.done { background: var(--ok-bg); color: #137a43; } .cell-st.prog { background: var(--info-bg); color: #1d5fb8; } .cell-st.todo { background: var(--ink-100); color: var(--ink-400); }
.cell-st.late { background: var(--bad-bg); color: #b02a30; } .cell-st.na { background: transparent; color: var(--ink-300); } .cell-st.opt { background: transparent; color: var(--ink-300); border: 1px dashed var(--ink-200); }
.cell-st.expiring { background: var(--warn-bg); color: #8a5a00; }

/* ---------- 레이더 + 비교 레이아웃 ---------- */
.radar-wrap { padding: 4px 8px 0; }
.lv { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.lv.grow { background: var(--orange-100); color: #9a5a00; } .lv.mid { background: var(--teal-100); color: var(--teal-800); } .lv.high { background: var(--ok-bg); color: #137a43; }

/* ---------- 교재 라이브러리 ---------- */
.book-card { overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: .15s; }
.book-card:hover { transform: translateY(-3px); box-shadow: var(--sh-2); }
.book-cover { aspect-ratio: 4 / 3; position: relative; overflow: hidden; background: var(--teal-50); }
.book-cover svg { width: 100%; height: 100%; display: block; }
.book-cover .vol-no { position: absolute; left: 12px; top: 12px; background: #fff; border-radius: 999px; font-weight: 900; font-size: 12px; padding: 3px 10px; letter-spacing: .04em; }
.prog-card { display: flex; gap: 14px; align-items: center; padding: 16px 18px; }
.prog-ic { min-width: 58px; height: 46px; padding: 0 6px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; letter-spacing: 0; flex: none; }

.lesson-flow { display: flex; flex-direction: column; gap: 0; }
.lf-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--ink-200); } .lf-row:last-child { border-bottom: 0; }
.lf-min { font-weight: 900; font-size: 20px; color: var(--teal-600); line-height: 1.1; } .lf-min small { display: block; font-size: 11.5px; color: var(--ink-400); font-weight: 700; }
.script { display: flex; flex-direction: column; gap: 8px; }
.script .ln { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.script .who { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; background: var(--teal-100); color: var(--teal-800); } .script .who.c { background: var(--orange-100); color: #8a5400; }
.script .en { font-weight: 800; } .script .ko { color: var(--ink-500); font-size: 13.5px; }
.word-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.word-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 12px; text-align: center; }
.word-card svg { width: 100%; max-width: 92px; height: 92px; margin: 0 auto; } .word-card b { display: block; font-size: 17px; margin-top: 4px; } .word-card span { color: var(--ink-500); font-size: 13px; }
.kv-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; } .kv-list li { display: flex; gap: 8px; align-items: flex-start; } .kv-list li .ico { color: var(--teal-500); margin-top: 3px; }

/* 스토리 뷰어 */
.story-view { background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--sh-1); }
.story-art { aspect-ratio: 4 / 3; background: var(--teal-50); } .story-art svg { width: 100%; height: 100%; display: block; }
.story-txt { padding: 18px 22px 8px; text-align: center; } .story-txt .en { font-size: 22px; font-weight: 800; line-height: 1.4; letter-spacing: -0.02em; } .story-txt .ko { margin-top: 6px; color: var(--ink-500); font-size: 15px; }
.story-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 18px; gap: 10px; }
.dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-200); } .dots i.on { background: var(--teal-500); width: 22px; border-radius: 999px; }

/* ---------- 영상 비교 ---------- */
.vid { position: relative; border-radius: 16px; overflow: hidden; background: #243438; aspect-ratio: 4 / 5; }
.vid.wide { aspect-ratio: 4 / 3; }
.vid svg.poster { width: 100%; height: 100%; display: block; }
.vid .tagv { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.vid .tagv.after { background: var(--teal-500); }
.vid .cap { position: absolute; left: 8px; right: 8px; bottom: 34px; text-align: center; color: #fff; font-weight: 800; font-size: 13.5px; text-shadow: 0 1px 4px rgba(0,0,0,.6); min-height: 36px; }
.vid .ctrl { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(transparent, rgba(0,0,0,.55)); display: flex; align-items: flex-end; padding: 0 10px 8px; }
.vid .tl { height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); width: 100%; position: relative; } .vid .tl i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; border-radius: 4px; width: 0; }
.vid .big-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.vid .big-play span { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--teal-700); display: flex; align-items: center; justify-content: center; }
.vid-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rub { display: grid; grid-template-columns: 78px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13.5px; padding: 6px 0; } .rub .bf { display: flex; gap: 3px; } .rub .bf i { width: 14px; height: 14px; border-radius: 4px; background: var(--ink-100); } .rub .bf i.on { background: var(--ink-400); } .rub .bf.af i.on { background: var(--teal-500); }
.rub .delta { font-weight: 800; color: var(--ok); text-align: right; font-size: 13px; }

/* ---------- 아이 모드 ---------- */
.kid-wrap { min-height: 100%; display: flex; flex-direction: column; padding: 14px 16px 20px; font-family: var(--font-kid); color: #4a3a1c; }
.kid-top { display: flex; align-items: center; gap: 10px; } .kid-prog { flex: 1; display: flex; gap: 5px; } .kid-prog i { flex: 1; height: 10px; border-radius: 999px; background: #f0dfb4; } .kid-prog i.on { background: #ffb02e; }
.kid-btn-ic { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 0 #f0dfb4; display: flex; align-items: center; justify-content: center; color: #a86d00; }
.kid-scene { border-radius: 24px; overflow: hidden; background: #e8f6f5; border: 3px solid #fff; box-shadow: 0 4px 0 #f0dfb4; margin-top: 12px; } .kid-scene svg { display: block; width: 100%; }
.kid-q { font-size: 23px; line-height: 1.4; text-align: center; margin: 16px 6px 4px; font-weight: 400; } .kid-q small { display: block; font-size: 14px; color: #9a7a30; font-family: var(--font); margin-top: 4px; }
.kid-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.kid-opt { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 20px; background: #fff; border: 3px solid #fff; box-shadow: 0 4px 0 #f0dfb4; font-family: var(--font-kid); font-size: 19px; color: #4a3a1c; text-align: left; min-height: 66px; }
.kid-opt:active, .kid-opt.on { transform: translateY(2px); box-shadow: 0 2px 0 #f0dfb4; border-color: #ffb02e; background: #fff3d1; }
.kid-opt svg { flex: none; }
.kid-scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.kid-scale button { background: #fff; border: 3px solid #fff; border-radius: 20px; box-shadow: 0 4px 0 #f0dfb4; padding: 10px 2px 8px; font-family: var(--font-kid); font-size: 13.5px; color: #4a3a1c; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.kid-scale button.on { border-color: #ffb02e; background: #fff3d1; transform: translateY(2px); box-shadow: 0 2px 0 #f0dfb4; }
.kid-big { font-family: var(--font-kid); font-size: 22px; padding: 16px; border-radius: 22px; border: 0; background: #ffb02e; color: #4a2a00; box-shadow: 0 5px 0 #d98a00; width: 100%; }
.kid-big:active { transform: translateY(3px); box-shadow: 0 2px 0 #d98a00; } .kid-big.green { background: #4cc9a0; box-shadow: 0 5px 0 #2ea07a; color: #063b2a; }
.kid-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.kid-center h1 { font-size: 30px; font-weight: 400; line-height: 1.3; } .kid-center p { font-size: 17px; color: #7a6130; line-height: 1.5; }
.pop-star { animation: popstar .7s ease-out both; } @keyframes popstar { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.15) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
.wiggle { animation: wiggle 1.6s ease-in-out infinite; transform-origin: 50% 90%; } @keyframes wiggle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }

/* ---------- misc ---------- */
.score-bar { display: grid; grid-template-columns: 82px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13.5px; padding: 5px 0; } .score-bar b { text-align: right; font-variant-numeric: tabular-nums; }
.hero-banner { border-radius: 20px; padding: 22px 24px; background: linear-gradient(135deg, var(--teal-500), var(--teal-700)); color: #fff; display: flex; gap: 20px; align-items: center; }
.hero-banner h2 { font-size: 21px; } .hero-banner p { opacity: .92; margin-top: 4px; }
.timeline { display: flex; flex-direction: column; gap: 0; } .timeline .tl-it { display: grid; grid-template-columns: 74px 14px minmax(0, 1fr); gap: 10px; padding: 8px 0; align-items: start; font-size: 14px; } .timeline .tl-d { color: var(--ink-500); font-size: 12.5px; padding-top: 2px; font-weight: 600; text-align: right; }
.timeline .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal-400); margin-top: 6px; box-shadow: 0 0 0 3px var(--teal-100); }
.pill-nav { display: flex; gap: 6px; flex-wrap: wrap; } .tag-x { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; font-size: 12px; font-weight: 700; background: var(--ink-100); border-radius: 7px; color: var(--ink-600); }
.sel-card { border: 2px solid var(--ink-200); border-radius: 14px; padding: 12px 14px; cursor: pointer; background: #fff; display: flex; gap: 12px; align-items: center; } .sel-card:hover { border-color: var(--teal-300); } .sel-card.on { border-color: var(--teal-500); background: var(--teal-50); }
.sel-card.dis { opacity: .5; cursor: not-allowed; background: var(--ink-50); }
.step-line { display: flex; gap: 6px; align-items: center; } .step-line .st { flex: 1; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink-400); padding: 8px 4px; border-radius: 10px; background: var(--ink-100); } .step-line .st.on { background: var(--teal-500); color: #fff; } .step-line .st.done { background: var(--teal-100); color: var(--teal-800); }
.stars-row { display: inline-flex; gap: 2px; color: var(--orange-500); } .stars-row .off { color: var(--ink-200); }
.mini-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; } .mini-grid .d { border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11.5px; background: var(--ink-50); } .mini-grid .d b { display: block; font-size: 12.5px; } .mini-grid .d.has { background: var(--teal-50); color: var(--teal-800); }
@media print { .demobar, .sidebar, .topbar, .tabbar { display: none !important; } }

/* ---------- details 아코디언 (수업안) ---------- */
.lesson-d summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; gap: 14px; align-items: center; }
.lesson-d summary::-webkit-details-marker { display: none; }
.lesson-d summary .ico { color: var(--ink-400); transition: transform .15s; }
.lesson-d[open] summary .ico { transform: rotate(180deg); }
.lesson-d[open] summary { border-bottom: 1px solid var(--line); }
.lesson-d .cb { padding: 18px 20px 22px; }
.lesson-d .step-no { width: 30px; height: 30px; font-size: 14px; }

/* ---------- 보정: 교육 현황표 · 칸반 폭 · 단계 칩 ---------- */
.matrix th, .matrix td { padding: 10px 6px; } .matrix td:first-child, .matrix th:first-child { white-space: nowrap; min-width: 120px; padding-left: 20px; }
.kanban { grid-auto-columns: minmax(200px, 1fr); }
.step-line .st.done { background: #fff; color: var(--teal-800); border: 1px solid var(--teal-100); }
.wk-block { padding: 4px 6px; line-height: 1.25; }

/* ---------- 캡처용: ?tall=1 이면 폰 화면을 내용 길이만큼 늘립니다 ---------- */
.phone.tall { height: auto; min-height: 800px; }
.phone.tall .phone-body { overflow: visible; }

/* =========================================================================
   근거 있는 점수 · 지도 가이드 · 발음 전후 비교
   ========================================================================= */
.ev-row { cursor: pointer; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; transition: .12s; }
.ev-row:hover { border-color: var(--teal-300); box-shadow: var(--sh-1); }
.ev-bars { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.ev-b { position: relative; height: 22px; border-radius: 7px; background: var(--ink-100); overflow: hidden; }
.ev-b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; }
.ev-b i.c { background: #ffb089; } .ev-b i.p { background: #8fd9d3; } .ev-b i.t { background: #b9a8ff; }
.ev-b span { position: relative; z-index: 1; font-size: 12px; font-weight: 700; line-height: 22px; padding-left: 9px; color: var(--ink-800); }
.ev-b.tot { height: 24px; } .ev-b.tot span { line-height: 24px; color: #3a2a9a; }
.phone-body .ev-row { padding: 9px 10px; }
.ev-head { flex-wrap: wrap; row-gap: 4px; } .ev-head .badge { white-space: nowrap; flex: none; } .ev-head .grow { flex: 1 1 auto; }
/* 폰 화면: 제목이 긴 보조 문구에 눌려 세로로 접히지 않게, 줄이 모자라면 보조 문구를 아래로 보냅니다 */
.phone-body .card .ch { flex-wrap: wrap; row-gap: 3px; } .phone-body .card .ch h2, .phone-body .card .ch h3 { flex: 1 1 auto; } .phone-body .card .ch .btn { margin-left: auto; }

.guide-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; line-height: 1.55; }
.say { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; background: var(--teal-50); border-radius: 12px; padding: 8px 10px; }
.say .ko { font-weight: 700; font-size: 14px; } .say .en { grid-column: 1; font-size: 12.5px; color: var(--teal-800); font-weight: 600; } .say .icon-btn { grid-row: 1 / span 2; grid-column: 2; width: 32px; height: 32px; }

.flow-diagram { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.flow-diagram .fd { flex: 1 1 130px; background: var(--teal-50); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.flow-diagram .fd-ar { align-self: center; color: var(--ink-300); }

/* 발음 전후 */
.pron { display: flex; flex-direction: column; gap: 14px; }
.pron-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pron-ov { text-align: center; min-width: 64px; } .pron-ov .big { font-size: 40px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; } .pron-ov .big.muted { color: var(--ink-400); }
.pron-arrow { color: var(--ink-300); }
.pron-delta { margin-left: auto; text-align: right; } .pron-delta .d { font-size: 24px; font-weight: 900; color: var(--ink-500); } .pron-delta .d.up { color: var(--ok); } .pron-delta .d.down { color: var(--bad); }
.phone-body .pron-delta { margin-left: 0; text-align: left; width: 100%; display: flex; align-items: center; gap: 10px; }
.pron-dim { display: grid; grid-template-columns: 118px minmax(0, 1fr) 70px 38px; gap: 10px; align-items: center; padding: 5px 0; }
.phone-body .pron-dim { grid-template-columns: 92px minmax(0, 1fr) 62px 32px; gap: 6px; }
.pd-bars { display: flex; flex-direction: column; gap: 3px; } .pd-b { height: 6px; border-radius: 4px; background: var(--ink-100); overflow: hidden; } .pd-b i { display: block; height: 100%; border-radius: 4px; }
.pd-n { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; } .pd-d { font-weight: 800; font-size: 13px; text-align: right; color: var(--ink-500); } .pd-d.up { color: var(--ok); } .pd-d.down { color: var(--bad); }
.pron-take { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: start; margin: 6px 0; } .pron-lab { font-size: 11.5px; font-weight: 800; color: var(--ink-500); padding-top: 4px; }
.wd-line { display: flex; flex-wrap: wrap; gap: 5px; } .wd { padding: 2px 9px; border-radius: 8px; font-weight: 700; font-size: 14px; }
.wd-g { background: var(--ok-bg); color: #137a43; } .wd-y { background: var(--warn-bg); color: #8a5a00; } .wd-r { background: var(--bad-bg); color: #b02a30; }
.pron-wave { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .pron-wave .pw { background: var(--ink-50); border-radius: 12px; padding: 8px 10px; }
.phone-body .pron-wave { grid-template-columns: 1fr; }

/* 부모 설문 · 홈 할 일 */
.scale5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale5 button { border: 1.5px solid var(--ink-200); background: #fff; border-radius: 12px; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-600); }
.scale5 button b { font-size: 16px; } .scale5 button span { font-size: 11px; font-weight: 600; }
.scale5 button.on { border-color: var(--heart); background: var(--heart-bg); color: #4a30c0; }
.task-list { display: flex; flex-direction: column; gap: 10px; } .task { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 10px 12px; }
.kid-detail .card { box-shadow: none; }

/* css/v2.css */
/* v2.css — 간단판: 선생님 · 학부모 · 점주가 "다음에 뭘 눌러야 하는지" 바로 아는 화면.
   원칙: 한 화면에 한 가지 일 · 숫자보다 말 · 자세한 근거는 눌러야 보임 · 큰 글씨와 큰 버튼 */
:root {
  --v-bg: #f5f7f8; --v-card: #fff; --v-line: #e5eaed; --v-page: #e9eef0;
  --v-ink: #16232a; --v-ink2: #55646c; --v-ink3: #5f6d75;
  --v-primary: #0f9d96; --v-primary-d: #0b7f79; --v-primary-bg: #e4f5f4;
  --v-orange: #f59a0b; --v-orange-bg: #fff3dc; --v-orange-ink: #8f5600;
  --v-green: #1e9e5a; --v-green-bg: #e4f6ec; --v-green-ink: #12794a;
  --v-red: #e5484d; --v-purple: #7a5af8;
  --v-font: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
}
body.v2 { margin: 0; background: var(--v-page); color: var(--v-ink); font-family: var(--v-font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.v2 * { box-sizing: border-box; }
body.v2 #stage { padding-top: 0; min-height: 0; }   /* 기존 시안의 위쪽 여백 제거 */
.v-app h1, .v-app h2, .v-app h3, .v-app p, .v-app ul, .v-app ol { margin: 0; padding: 0; }
.v-app ul, .v-app ol { list-style: none; }
.v-app a { color: inherit; }
.v-app button { font-family: inherit; }

/* ---------- 시안 보기용 위쪽 바 (실제 앱에는 없음) ---------- */
.v-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; background: #0d3b3d; color: #fff; }
.v-top .brand { font-weight: 800; font-size: 15px; white-space: nowrap; }
.v-top .brand small { font-weight: 600; opacity: .7; margin-left: 6px; }
.v-seg { display: inline-flex; background: rgba(255, 255, 255, .13); border-radius: 12px; padding: 3px; margin: 0 auto; }
.v-seg a { padding: 6px 14px; border-radius: 9px; color: rgba(255, 255, 255, .8); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.v-seg a.on { background: #fff; color: #0d3b3d; }
.v-top .links { display: flex; align-items: center; gap: 14px; font-size: 13px; }
.v-top .links a, .v-top .links button { color: rgba(255, 255, 255, .82); background: none; border: 0; padding: 0; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.v-subtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.v-subtabs a { padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--v-ink2); text-decoration: none; border: 1px solid var(--v-line); background: #fff; }
.v-subtabs a.on { background: var(--v-primary-d); border-color: var(--v-primary-d); color: #fff; }
.v-tag.hot { background: #fde8e8; color: #b3261e; }
.v-gauge { position: relative; height: 8px; border-radius: 99px; background: #e4eaed; margin-top: 6px; }
.v-gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--v-primary); }
.v-gauge.low i { background: #e08a00; }
.v-gauge u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #16232a; opacity: .5; text-decoration: none; }
.v-kv { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.v-kv > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 36px; }
.v-kv > div > span:first-child { width: 112px; flex: none; color: var(--v-ink2); font-size: 14px; }
.v-checks { display: flex; flex-direction: column; margin-top: 4px; }
.v-check-row { display: flex; align-items: center; gap: 10px; min-height: 42px; font-size: 15px; font-weight: 600; cursor: pointer; }
.v-check-row input { width: 20px; height: 20px; flex: none; accent-color: var(--v-primary-d); }
.v-check-row small { font-weight: 500; color: var(--v-ink3); font-size: 14px; }
.v-toggle { display: inline-flex; background: #e3eaed; border-radius: 12px; padding: 3px; margin: 14px 0 0; }
.v-toggle button { border: 0; background: none; padding: 8px 18px; border-radius: 9px; font-size: 15px; font-weight: 700; color: var(--v-ink2); cursor: pointer; font-family: inherit; }
.v-toggle button.on { background: #fff; color: var(--v-ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.v-spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 24px; }
.v-spark i { display: block; width: 5px; border-radius: 2px; opacity: .85; }
.ptag.tangram { background: #e3f2fd; color: #0d5ea6; } .ptag.therapy { background: #f3e5f5; color: #7b1fa2; }
.v-top .brand { display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
.v-top .brand .brand-logo { width: 32px; height: 32px; border-radius: 50%; background: #fff; flex: none; }
.v-gate { max-width: 680px; margin: 0 auto; text-align: center; padding: 14px 0 8px; }
.v-gate .gate-logo { width: 140px; height: 140px; border-radius: 50%; box-shadow: 0 8px 26px rgba(27, 133, 149, .22); }
.v-gate .gate-name { font-family: 'Jua', var(--v-font); font-size: 46px; line-height: 1.15; color: #1b8595; margin: 14px 0 6px; font-weight: 400; letter-spacing: 0; }
.v-gate .gate-tag { color: var(--v-ink2); font-size: 17px; line-height: 1.65; }
.v-gate .gate-tag b { color: #e07b00; }
.v-gate .gate-ask { font-size: 20px; margin-top: 26px; }
.v-gate .gate-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; text-align: left; }
.v-gate .gate-role { display: flex; align-items: center; gap: 14px; padding: 16px 14px; background: #fff; border: 1px solid var(--v-line); border-radius: 18px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(16, 48, 50, .05); }
.v-gate .gate-role:hover { border-color: #5cc1cf; box-shadow: 0 4px 14px rgba(27, 133, 149, .15); }

/* ---------- 앱 틀 ---------- */

@media (max-width: 480px) { .v-app { box-shadow: none; } }

/* ---------- 글자 ---------- */

.v-h1 { font-size: 28px; line-height: 1.25; font-weight: 800; letter-spacing: -.025em; }
.v-h2 { font-size: 19px; line-height: 1.35; font-weight: 800; letter-spacing: -.02em; }
.v-sub { margin-top: 6px; color: var(--v-ink2); font-size: 15px; }

.v-small { font-size: 14px; } .v-xs { font-size: 14px; }

/* ---------- 카드 · 버튼 ---------- */

.v-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 20px; border-radius: 16px; border: 1px solid var(--v-line); background: #fff; color: var(--v-ink); font-weight: 700; font-size: 16px; line-height: 1.2; cursor: pointer; text-decoration: none; }
.v-btn:active { transform: scale(.985); }

.v-btn.primary:hover { background: var(--v-primary-d); }

/* ---------- 칩 · 태그 ---------- */

.v-chip { flex: none; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; min-height: 48px; padding: 7px 14px; border-radius: 16px; border: 1px solid var(--v-line); background: #fff; color: var(--v-ink); text-decoration: none; font-weight: 700; font-size: 15px; line-height: 1.25; cursor: pointer; }
.v-chip small { font-size: 13px; font-weight: 600; color: var(--v-ink3); }
.v-chip.on { background: var(--v-ink); border-color: var(--v-ink); color: #fff; } .v-chip.on small { color: rgba(255, 255, 255, .7); }
.v-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #eef1f3; color: var(--v-ink2); }
.v-tag.watch { background: var(--v-orange-bg); color: var(--v-orange-ink); } .v-tag.up { background: var(--v-green-bg); color: var(--v-green-ink); } .v-tag.ok { background: var(--v-primary-bg); color: var(--v-primary-d); }
.v-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px; border-radius: 999px; font-size: 14px; font-weight: 700; background: #fff; border: 1px solid var(--v-line); }

/* ---------- 아바타 ---------- */
.v-av { flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 800; letter-spacing: -.02em; }

/* ---------- 이번 달 카드 ---------- */

.v-month .d { margin-top: 3px; font-size: 14px; color: var(--v-ink2); }

/* ---------- 아이 목록 ---------- */
.v-sec { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 8px; }
.v-sec h2 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; } .v-sec span { font-size: 14px; color: var(--v-ink2); }
.v-list { background: #fff; border: 1px solid var(--v-line); border-radius: 20px; overflow: hidden; }

.v-kid .ds { font-size: 14px; color: var(--v-ink2); margin-top: 1px; }
.v-kid .chev { color: var(--v-ink3); flex: none; }

/* ---------- 3단계 신호 ---------- */
.v-meter { display: inline-flex; gap: 4px; align-items: center; }
.v-meter i { width: 11px; height: 11px; border-radius: 50%; background: #dbe3e7; display: block; }

.v-meter.l2 i:nth-child(-n+2) { background: var(--v-primary); }
.v-meter.l3 i { background: var(--v-green); }
.v-st { font-size: 14px; font-weight: 700; white-space: nowrap; } .v-st.l1 { color: var(--v-orange-ink); } .v-st.l2 { color: var(--v-primary-d); } .v-st.l3 { color: var(--v-green-ink); }
.v-area { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 10px; margin: 0; border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer; font-size: 16px; color: inherit; }
.v-area:hover { background: #f4f7f8; }
.v-area .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.v-area .nm { flex: 1; font-weight: 700; line-height: 1.3; } .v-area .nm small { display: block; font-size: 13px; font-weight: 700; color: var(--v-orange-ink); }
.v-area.focus { background: var(--v-orange-bg); }
.v-area .chev { color: var(--v-ink3); flex: none; margin-left: -4px; }
.v-note { margin-top: 10px; font-size: 14px; color: var(--v-ink3); }

/* ---------- 가르치는 법 ---------- */
.v-steps { counter-reset: s; display: flex; flex-direction: column; gap: 12px; }

.v-steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: var(--v-primary-bg); color: var(--v-primary-d); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.v-wk { display: inline-block; margin-left: 6px; padding: 0 8px; height: 22px; line-height: 22px; border-radius: 10px; background: #eef1f3; color: var(--v-ink2); font-size: 13px; font-weight: 700; vertical-align: 2px; }
.v-say { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--v-primary-bg); margin-top: 8px; }
.v-say .t { flex: 1; } .v-say b { display: block; font-size: 15px; } .v-say span { font-size: 14px; color: var(--v-primary-d); font-weight: 600; }
.v-icon-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; color: var(--v-primary-d); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.v-sub-h { font-size: 14px; font-weight: 800; color: var(--v-ink2); margin: 18px 0 2px; }

/* ---------- 부모님께 보내는 말 ---------- */
.v-bubble { background: #fff6c9; border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 15px; line-height: 1.7; color: #3a3320; }
.v-bubble p + p { margin-top: 8px; }
.v-who { font-size: 14px; color: var(--v-ink3); margin: 0 0 6px 4px; }

/* ---------- 발음 ---------- */
.v-score { display: flex; align-items: flex-end; gap: 14px; }
.v-score .n { font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -.04em; } .v-score .n.b { color: var(--v-ink3); }
.v-score .n small { display: block; font-size: 14px; font-weight: 700; letter-spacing: 0; color: var(--v-ink3); margin-bottom: 4px; }
.v-score .arrow { color: var(--v-ink3); padding-bottom: 8px; }
.v-score .gain { margin-left: auto; text-align: right; font-size: 30px; font-weight: 800; color: var(--v-green-ink); line-height: 1.1; } .v-score .gain small { display: block; font-size: 14px; font-weight: 700; color: var(--v-green-ink); }
.v-player { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--v-line); border-radius: 16px; background: #fff; margin-top: 10px; }
.v-player .pb { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--v-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.v-player.before .pb { background: #8b99a1; }
.v-player .info { flex: 1; min-width: 0; } .v-player .lbl { font-size: 14px; font-weight: 800; color: var(--v-ink2); } .v-player .lbl em { font-style: normal; color: var(--v-ink3); font-weight: 600; margin-left: 4px; }
.v-player svg { display: block; width: 100%; height: 30px; margin-top: 2px; }
.v-wd { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.v-wd span { padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; background: #eef1f3; } .v-wd span.g { background: var(--v-green-bg); color: var(--v-green-ink); } .v-wd span.r { background: var(--v-orange-bg); color: var(--v-orange-ink); }

/* ---------- 녹음 ---------- */
.v-rec-script { background: #fff; border: 1px solid var(--v-line); border-radius: 20px; padding: 20px; margin-top: 14px; }
.v-rec-script .ln { font-size: 24px; line-height: 1.4; font-weight: 800; letter-spacing: -.02em; } .v-rec-script .ln + .ln { margin-top: 12px; }
.v-rec-script .ko { font-size: 14px; font-weight: 500; color: var(--v-ink2); letter-spacing: 0; display: block; margin-top: 2px; }
.v-rec-box { text-align: center; padding: 26px 0 8px; }
.v-recbtn { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--v-red); color: #fff; box-shadow: 0 0 0 10px rgba(229, 72, 77, .15); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }
.v-recbtn:active { transform: scale(.96); }
.v-recbtn.on { background: #fff; color: var(--v-red); border: 6px solid var(--v-red); animation: v-pulse 1.2s infinite; }
@keyframes v-pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 72, 77, .35); } 100% { box-shadow: 0 0 0 22px rgba(229, 72, 77, 0); } }
.v-timer { margin-top: 14px; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.v-hint { margin-top: 4px; font-size: 14px; color: var(--v-ink2); }

/* ---------- 시트(아래에서 올라오는 창) ---------- */
.v-sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(10, 22, 27, .5); display: flex; align-items: flex-end; justify-content: center; }
.v-sheet { width: 100%; max-width: 480px; max-height: 86vh; overflow: auto; background: #fff; border-radius: 26px 26px 0 0; padding: 12px 20px 28px; animation: v-up .22s ease-out; }
.v-sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #d6dde1; margin: 0 auto 14px; }
.v-sheet .v-h2 { margin-bottom: 4px; }
@keyframes v-up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.v-why { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--v-line); } .v-why:first-of-type { border-top: 0; }
.v-why .who { width: 74px; font-weight: 800; font-size: 15px; } .v-why .meter { flex: 1; display: flex; align-items: center; gap: 10px; }

/* ---------- 설문 ---------- */
.v-prog { display: flex; gap: 6px; margin: 4px 0 18px; } .v-prog i { flex: 1; height: 6px; border-radius: 3px; background: #dbe3e7; } .v-prog i.on { background: var(--v-primary); }
.v-q { background: #fff; border: 1px solid var(--v-line); border-radius: 20px; padding: 18px; margin-top: 12px; }
.v-q .tx { font-weight: 700; font-size: 17px; line-height: 1.5; }
.v-scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.v-scale button { min-height: 62px; border: 1.5px solid var(--v-line); background: #fff; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--v-ink2); cursor: pointer; }
.v-scale button b { font-size: 18px; color: var(--v-ink); } .v-scale button span { font-size: 13px; font-weight: 700; }
.v-scale button.on { background: var(--v-primary-bg); border-color: var(--v-primary); color: var(--v-primary-d); } .v-scale button.on b { color: var(--v-primary-d); }
.v-bar-bottom { position: sticky; bottom: 0; padding: 14px 0 4px; background: linear-gradient(to top, var(--v-bg) 70%, rgba(245, 247, 248, 0)); margin-top: 8px; }
.v-steps-card { display: flex; flex-direction: column; }
.v-task { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-top: 1px solid var(--v-line); } .v-task:first-child { border-top: 0; padding-top: 4px; }
.v-task .num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; background: var(--v-primary-bg); color: var(--v-primary-d); }
.v-task.done .num { background: var(--v-green); color: #fff; }
.v-task .tx { flex: 1; } .v-task .tx b { display: block; font-size: 17px; } .v-task .tx span { font-size: 14px; color: var(--v-ink2); }

/* ---------- 학부모 리포트 ---------- */
.v-hero { padding: 22px 20px; border-radius: 24px; background: linear-gradient(160deg, #e4f5f4, #f4fbfa); border: 1px solid #cfeceb; margin-top: 8px; }
.v-hero .big { font-size: 24px; line-height: 1.4; font-weight: 800; letter-spacing: -.03em; }
.v-hero .big em { font-style: normal; color: var(--v-primary-d); }
.v-todo { display: flex; gap: 12px; align-items: flex-start; padding: 4px 0; }
.v-check { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid #c6d1d6; background: #fff; display: inline-flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; margin-top: 1px; }
.v-check.on { background: var(--v-green); border-color: var(--v-green); }
.v-quote { font-size: 15px; line-height: 1.7; color: var(--v-ink); }
.v-kit { display: flex; gap: 12px; align-items: center; }
.v-kit .tt { font-weight: 800; } .v-kit .ds { font-size: 14px; color: var(--v-ink2); }

/* ---------- 점주 ---------- */
.v-grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 860px) { .v-grid2 { grid-template-columns: 1fr; } }
.v-stat { background: #fff; border: 1px solid var(--v-line); border-radius: 20px; padding: 18px 20px; }
.v-stat .lb { font-size: 14px; font-weight: 700; color: var(--v-ink2); } .v-stat .vl { margin-top: 4px; font-size: 38px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; } .v-stat .vl small { font-size: 18px; font-weight: 700; color: var(--v-ink2); margin-left: 2px; }
.v-bar { height: 8px; border-radius: 4px; background: #e3eaed; overflow: hidden; margin-top: 12px; } .v-bar i { display: block; height: 100%; border-radius: 4px; background: var(--v-primary); }
.v-tbl { width: 100%; border-collapse: collapse; }
.v-tbl th { text-align: left; font-size: 14px; color: var(--v-ink3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--v-line); }
.v-tbl td { padding: 14px 12px; border-bottom: 1px solid var(--v-line); font-size: 15px; vertical-align: middle; }
.v-tbl tr:last-child td { border-bottom: 0; }
.v-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-radius: 20px; background: var(--v-primary); color: #fff; margin-top: 16px; }
.v-cta b { font-size: 19px; display: block; } .v-cta span { opacity: .85; font-size: 14px; }
.v-cta .v-btn { width: auto; background: #fff; color: var(--v-primary-d); border-color: #fff; }
.v-cta.sent { background: var(--v-green-bg); color: var(--v-green-ink); }

/* 아이 모드(학부모 앱 안) — 기존 kid 화면을 그대로 쓰되 틀만 맞춥니다 */
.v-kidhost { margin: -22px -16px -64px; background: #fff8e6; } .v-kidhost .kid-wrap { min-height: calc(100vh - 52px); border-radius: 0; }
body.bare .v-kidhost .kid-wrap { min-height: 100vh; }
/* 다음에 할 일 (아이 화면 맨 위) */
.v-next { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 18px; border: 0; border-radius: 20px; background: var(--v-primary); color: #fff; text-align: left; text-decoration: none; cursor: pointer; margin-top: 4px; font-size: inherit; }
.v-next:active { transform: scale(.99); }
.v-next .ic { flex: none; width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: inline-flex; align-items: center; justify-content: center; }
.v-next .tx { flex: 1; } .v-next .tx small { display: block; font-size: 13px; font-weight: 700; opacity: .85; } .v-next .tx b { display: block; font-size: 18px; line-height: 1.3; } .v-next .tx span { font-size: 14px; opacity: .9; }
.v-next.done { background: var(--v-green-bg); color: var(--v-green-ink); cursor: default; } .v-next.done .ic { background: #fff; }
/* 본사·점주 화면: 화면 안 탭, 문항 한 줄, 선택 상자 */
